svg.i.sm{width:16px;height:16px}svg.i.lg{width:26px;height:26px}svg.i.xl{width:34px;height:34px}
.t-mint{--c:var(--mint);--c-ink:var(--mint-ink);--c-soft:var(--mint-soft);--c-mid:var(--mint-mid)}
.t-sky{--c:var(--sky);--c-ink:var(--sky-ink);--c-soft:var(--sky-soft);--c-mid:var(--sky-mid)}
.t-sun{--c:var(--sun);--c-ink:var(--sun-ink);--c-soft:var(--sun-soft);--c-mid:var(--sun-mid)}
.t-peach{--c:var(--peach);--c-ink:var(--peach-ink);--c-soft:var(--peach-soft);--c-mid:var(--peach-mid)}
.t-lilac{--c:var(--lilac);--c-ink:var(--lilac-ink);--c-soft:var(--lilac-soft);--c-mid:var(--lilac-mid)}
.t-pink{--c:var(--pink);--c-ink:var(--pink-ink);--c-soft:var(--pink-soft);--c-mid:var(--pink-mid)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 18px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-family:"Bricolage";font-size:19px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1}
.brand small{font-size:11px;color:var(--ink-3);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;color:var(--ink-2);font-weight:800;font-size:14.5px;text-align:left;width:100%;transition:background .15s,color .15s}
.nav:hover{background:var(--surface);color:var(--ink)}
.nav.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav.on svg{color:var(--brand)}
.nav .badge{margin-left:auto;background:var(--peach);color:var(--peach-ink);font-size:11.5px;padding:1px 8px;border-radius:20px}
.side .grow{flex:1}
.side .mini-card{margin:8px 4px 0;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
main{padding:26px 30px 60px;min-width:0;max-width:1320px}
.demo-bar{position:sticky;top:0;z-index:25;margin:-26px -30px 20px;padding:10px 30px;background:var(--ink);color:var(--surface);display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px}
.demo-bar .grow{flex:1}
.demo-bar a{background:#F6CB5C;color:#2a1e00;padding:6px 14px;border-radius:10px;font-weight:800;text-decoration:none;white-space:nowrap}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:32px}
.top .sub{color:var(--ink-2);font-weight:700;margin-top:6px}
.top .grow{flex:1}
.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.muted{color:var(--ink-3)}
.mt{margin-top:18px}

/* ---------- atoms ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);position:relative}
.card.tint{background:var(--c-soft);border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.card h3{font-size:17px}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card .hd .ic{width:38px;height:38px;border-radius:12px;background:var(--c);color:var(--c-ink);display:grid;place-items:center;flex:none}
.card .hd p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 17px;border-radius:13px;font-weight:800;font-size:14.5px;
 border:1.5px solid var(--line-2);background:var(--surface);white-space:nowrap;transition:transform .1s,background .15s,box-shadow .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
[data-theme=dark] .btn.brand{color:#08231c}
.btn.tone{background:var(--c);border-color:transparent;color:var(--c-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.lg{height:52px;padding:0 24px;font-size:16px;border-radius:16px}
.btn.icon{width:38px;padding:0}
.btn.sm.icon{width:34px}
.btn.block{width:100%}
.btn.danger{color:#C2413A}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:30px;background:var(--c,var(--surface-2));color:var(--c-ink,var(--ink-2));font-size:12.5px;font-weight:800;white-space:nowrap}
.chip.soft{background:var(--c-soft,var(--surface-2))}
.chip svg.i{width:14px;height:14px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 13px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--c);color:var(--c-ink);flex:none}
.avatar.lg{width:46px;height:46px;font-size:19px}
.bar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c-mid,var(--brand));transition:width .6s cubic-bezier(.3,0,.2,1)}
.ring{position:relative;display:grid;place-items:center;flex:none}
.card[style*="text-align:center"]>.ring{margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .tr{stroke:var(--surface-2)}
.ring .pr{transition:stroke-dashoffset .9s cubic-bezier(.3,0,.2,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:"Bricolage";font-weight:800}
.empty{text-align:center;padding:34px 20px;color:var(--ink-2)}
.empty .ic{width:60px;height:60px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;background:var(--c);color:var(--c-ink)}
.empty h3{color:var(--ink);margin-bottom:6px}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.label{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- today ---------- */
.today{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.today .col{display:grid;gap:20px;min-width:0}
.hello{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:30px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:13.5px;box-shadow:var(--shadow)}
.pill svg{color:var(--c-ink)}
.fresh{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.fresh .big-l{font-size:34px;letter-spacing:-.03em}
.fresh .big-l small{display:block;font-size:12px;font-family:"Nunito";font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.rooms-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.rchip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 9px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--ink-2);transition:transform .15s,background .15s}
.rchip:hover{transform:translateY(-2px);background:var(--surface)}
.rchip span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.en{border-radius:16px;padding:13px 12px;border:1.5px solid var(--line);background:var(--surface-2);text-align:left;display:flex;gap:10px;align-items:center;transition:all .15s}
.en:hover{border-color:var(--line-2)}
.en .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:var(--c-ink);flex:none}
.en b{display:block;font-size:14.5px}
.en small{display:block;font-size:12px;color:var(--ink-3);font-weight:700}
.en.on{border-color:var(--c-ink);background:var(--c-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 70%,transparent)}
.times{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.times .label{margin-right:4px}
.tchip{height:34px;min-width:56px;padding:0 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:900;font-size:13.5px;color:var(--ink-2)}
.tchip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.plan-h{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.plan-h h2{font-size:22px}
.plan-meta{font-size:13.5px;color:var(--ink-2);font-weight:800}
.tasks{display:grid;gap:9px;margin-top:14px}
.task{display:flex;align-items:center;gap:13px;padding:12px 12px 12px 13px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);transition:opacity .3s,background .2s,transform .2s}
.task:hover{background:var(--surface)}
.task .chk{width:30px;height:30px;border-radius:50%;border:2.2px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent;transition:all .18s;background:var(--surface)}
.task .chk:hover{border-color:var(--brand);color:var(--brand)}
.task .chk svg{width:16px;height:16px;stroke-width:3}
.task.done .chk{background:var(--brand);border-color:var(--brand);color:#fff;animation:pop .35s}
.task.done .nm{text-decoration:line-through;color:var(--ink-3)}
.task.done{opacity:.72}
.task .body{flex:1;min-width:0}
.task .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .meta{display:flex;gap:7px;align-items:center;margin-top:4px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);font-weight:800}
.task .meta .chip{height:22px;font-size:11.5px;padding:0 8px}
.task .acts{display:flex;gap:2px;opacity:.55;transition:opacity .15s}
.task:hover .acts{opacity:1}
.task .acts button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.task .acts button:hover{background:var(--line);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c-mid);flex:none;display:inline-block}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.celebrate{text-align:center;padding:22px 10px 8px}
.celebrate .ic{width:64px;height:64px;border-radius:22px;margin:0 auto 12px;display:grid;place-items:center;background:var(--mint);color:var(--mint-ink);animation:pop .5s}
.celebrate h3{font-size:21px;margin-bottom:6px}
.celebrate p{color:var(--ink-2);margin:0 0 14px}
.action-card{border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .15s}
.action-card:hover{transform:translateY(-2px)}
.action-card .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--c);color:var(--c-ink);flex:none}
.action-card b{display:block;font-family:"Bricolage";font-size:16.5px;letter-spacing:-.01em}
.action-card small{display:block;color:var(--ink-2);font-size:13px;font-weight:700;margin-top:2px}
.sos-card{background:linear-gradient(135deg,#FF8E6E,#F2577A);color:#fff;border:0}
.sos-card .ic{background:rgba(255,255,255,.22);color:#fff}
.sos-card small{color:rgba(255,255,255,.88)}
.sos-btns{display:flex;gap:7px;margin-top:12px}
.sos-btns button{flex:1;height:36px;border-radius:11px;background:rgba(255,255,255,.2);color:#fff;font-weight:900;font-size:13.5px;transition:background .15s}
.sos-btns button:hover{background:rgba(255,255,255,.34)}
.zone .list{display:grid;gap:6px;margin-top:10px}
.zone .li{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--ink-2);text-align:left}
.zone .li .box{width:19px;height:19px;border-radius:6px;border:2px solid var(--c-mid);display:grid;place-items:center;flex:none;color:transparent}
.zone .li.done{color:var(--ink-3);text-decoration:line-through}
.zone .li.done .box{background:var(--c-ink);border-color:var(--c-ink);color:var(--surface)}
.zone .li .box svg{width:12px;height:12px;stroke-width:3.4}

/* ---------- rooms ---------- */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.room{display:flex;flex-direction:column;gap:14px;text-align:left;transition:transform .15s,box-shadow .15s;cursor:pointer}
.room:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.room .rt{display:flex;align-items:center;gap:12px}
.room .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:var(--c-ink)}
.room h3{font-size:17px}
.room .rs{font-size:12.5px;color:var(--ink-3);font-weight:800;margin-top:2px}
.room .rb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.add-tile{border:2px dashed var(--line-2);border-radius:var(--r);display:grid;place-items:center;color:var(--ink-3);font-weight:800;min-height:150px;gap:6px;align-content:center;transition:all .15s}
.add-tile:hover{border-color:var(--brand);color:var(--brand)}
.room-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.room-head .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--c);color:var(--c-ink)}
.trow{display:grid;grid-template-columns:30px minmax(0,1fr) 150px 120px auto;gap:14px;align-items:center;padding:12px 14px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line)}
.trow .chk{width:30px;height:30px;border-radius:50%;border:2.2px solid var(--line-2);display:grid;place-items:center;color:transparent;background:var(--surface);transition:all .15s}
.trow .chk:hover{border-color:var(--brand);color:var(--brand)}
.trow .chk svg{width:16px;height:16px;stroke-width:3}
.trow.today .chk{background:var(--brand);border-color:var(--brand);color:#fff}
.trow .nm{font-weight:800}
.trow .sm{font-size:12.5px;color:var(--ink-3);font-weight:800}
.fbar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:9px}
.lvl-good{--f:var(--mint-mid);color:var(--mint-ink)}.lvl-ok{--f:var(--sun-mid);color:var(--sun-ink)}.lvl-low{--f:var(--peach-mid);color:var(--peach-ink)}
.fbar i{background:var(--f)}
.tabs{display:flex;gap:6px;margin:20px 0 14px;flex-wrap:wrap}
.check-list{display:grid;gap:7px}
.ci{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;text-align:left;width:100%}
.ci .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface);transition:all .15s}
.ci .box svg{width:13px;height:13px;stroke-width:3.4}
.ci.done{color:var(--ink-3)}
.ci.done span{text-decoration:line-through}
.ci.done .box{background:var(--c-ink,var(--brand));border-color:var(--c-ink,var(--brand));color:var(--surface)}
.ci .x{margin-left:auto;opacity:0;color:var(--ink-3);width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.ci:hover .x{opacity:1}
.ci .x:hover{background:var(--line)}

/* ---------- week ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);min-height:260px;display:flex;flex-direction:column;gap:7px}
.day.is-today{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent),var(--shadow)}
.day .dh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.day .dh b{font-family:"Bricolage";font-size:16px}
.day .dh small{font-size:11.5px;color:var(--ink-3);font-weight:900}
.wt{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;padding:7px 8px;border-radius:10px;background:var(--c-soft);color:var(--ink);text-align:left;line-height:1.2}
.wt .dot{background:var(--c-mid)}
.wt span{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wt{align-items:flex-start}.wt .dot{margin-top:4px}
.wt em{font-style:normal;color:var(--ink-3);font-size:11px}
.wt.done{opacity:.55;text-decoration:line-through}
.day .more{font-size:12px;color:var(--ink-3);font-weight:800;padding:2px 4px}

/* ---------- family ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.person .pt{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.person .stat{display:flex;gap:16px;margin-bottom:12px}
.person .stat div b{display:block;font-family:"Bricolage";font-size:22px}
.person .stat div small{font-size:11.5px;color:var(--ink-3);font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.chart{width:100%;border-collapse:separate;border-spacing:0 6px}
.chart th{font-size:12px;color:var(--ink-3);font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;text-align:center}
.chart th:first-child{text-align:left}
.chart td{padding:9px 6px;text-align:center;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chart td:first-child{text-align:left;border-left:1px solid var(--line);border-radius:13px 0 0 13px}
.chart td:last-child{border-right:1px solid var(--line);border-radius:0 13px 13px 0}
.chart .cnt{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:var(--c);color:var(--c-ink);font-weight:900;font-size:13px}
.chart .zero{color:var(--line-2)}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi .v{font-family:"Bricolage";font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.kpi .v small{font-size:15px;color:var(--ink-3);font-family:"Nunito";font-weight:800;margin-left:4px}
.kpi .k{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:900;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.kpi .k .ic{width:30px;height:30px;border-radius:10px;background:var(--c);color:var(--c-ink);display:grid;place-items:center}
.bars{display:flex;align-items:flex-end;gap:7px;height:170px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--mint-mid);min-height:3px;transition:height .7s cubic-bezier(.3,0,.2,1)}
.bars .b.t i{background:var(--brand)}
.bars .b small{font-size:11px;color:var(--ink-3);font-weight:800}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:5px;justify-content:start}
.heat i{width:20px;height:20px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line)}
.heat i.l1{background:var(--mint);border-color:transparent}.heat i.l2{background:var(--mint-mid);border-color:transparent}.heat i.l3{background:var(--brand);border-color:transparent}
.hbar{display:grid;grid-template-columns:130px 1fr 44px;gap:12px;align-items:center;font-weight:800;font-size:13.5px;margin:9px 0}
.hbar .bar{height:12px}

/* ---------- declutter ---------- */
.dgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.dtile{aspect-ratio:1/1;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;padding:10px;text-align:left;font-size:11.5px;font-weight:800;color:var(--ink-2);line-height:1.25;transition:all .15s;overflow:hidden}
.dtile b{font-family:"Bricolage";font-size:19px;color:var(--ink)}
.dtile:hover{border-color:var(--brand)}
.dtile.done{background:var(--mint);border-color:transparent;color:var(--mint-ink)}
.dtile.done b{color:var(--mint-ink)}
.dtile.next{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}

/* ---------- supplies ---------- */
.sup{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.sitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;text-align:left;width:100%}
.sitem .st{margin-left:auto;font-size:11.5px;font-weight:900;padding:3px 9px;border-radius:20px;background:var(--mint);color:var(--mint-ink)}
.sitem.low .st{background:var(--peach);color:var(--peach-ink)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,25,22,.42);backdrop-filter:blur(6px);z-index:50;display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:26px;box-shadow:var(--shadow-lg);width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:26px;animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(720px,100%)}
@keyframes rise{from{transform:translateY(16px) scale(.98);opacity:0}}
.modal h2{font-size:23px;margin-bottom:4px}
.modal .lead{color:var(--ink-2);margin:0 0 18px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font-size:12.5px;font-weight:900;color:var(--ink-2);letter-spacing:.02em}
.inp{height:44px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface-2);padding:0 13px;font-weight:700;width:100%;outline:none;transition:border .15s}
textarea.inp{height:80px;padding:10px 13px;resize:vertical}
.inp:focus{border-color:var(--brand);background:var(--surface)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mfoot{display:flex;gap:10px;margin-top:20px;align-items:center}
.picker{display:flex;flex-wrap:wrap;gap:7px}
.picker button{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink-2)}
.picker button.on{border-color:var(--ink);background:var(--c,var(--surface));color:var(--c-ink,var(--ink))}
.picker.tones button{background:var(--c);border-color:transparent}
.picker.tones button.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c-ink)}
.full{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;padding:30px;text-align:center;animation:fade .25s;background:var(--bg);background-image:var(--grad)}
.full .x-close{position:absolute;top:18px;right:18px}
.full h1{font-size:clamp(28px,4vw,46px)}
.sosfull{background:linear-gradient(150deg,#FF9B72 0%,#F2577A 100%);color:#fff}
.sosfull .btn{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.sosfull .btn.pri{background:#fff;color:#C23A57}
.sos-step{font-family:"Bricolage";font-weight:800;font-size:clamp(26px,3.6vw,44px);max-width:820px;line-height:1.15;margin:16px 0 26px;letter-spacing:-.02em}
.sos-dots{display:flex;gap:6px;margin-top:22px}
.sos-dots i{width:34px;height:6px;border-radius:6px;background:rgba(255,255,255,.3)}
.sos-dots i.on{background:#fff}
.tbig{font-family:"Bricolage";font-weight:800;font-size:clamp(54px,9vw,96px);letter-spacing:-.04em;line-height:1}
.presets{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap;justify-content:center}
.sounds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.reel{height:120px;overflow:hidden;position:relative;width:min(560px,90vw);margin:22px 0;border-radius:24px;background:var(--surface);box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.reel .strip{position:absolute;left:0;right:0;top:0}
.reel .it{height:120px;display:flex;align-items:center;justify-content:center;gap:14px;font-family:"Bricolage";font-weight:800;font-size:26px;padding:0 20px}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:30px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(var(--surface),transparent)}
.reel::after{bottom:0;background:linear-gradient(transparent,var(--surface))}
.timer-pill{position:fixed;right:22px;bottom:22px;z-index:40;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 14px;border-radius:30px;background:var(--ink);color:var(--surface);font-weight:900;box-shadow:var(--shadow-lg);animation:rise .3s}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--surface);padding:12px 14px 12px 18px;border-radius:16px;display:flex;align-items:center;gap:14px;font-weight:800;box-shadow:var(--shadow-lg);animation:toast .3s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 30px)}
.toast button{color:var(--sun-mid);font-weight:900;padding:4px 8px;border-radius:8px}
@keyframes toast{from{transform:translate(-50%,20px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.onb{max-width:640px;width:100%;text-align:left}
.onb .steps{display:flex;gap:6px;margin-bottom:22px}
.onb .steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.onb .steps i.on{background:var(--brand)}
.onb h1{font-size:34px;margin-bottom:8px}
.onb p.lead{color:var(--ink-2);font-size:16px;margin:0 0 22px}
.rpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rp{display:flex;align-items:center;gap:10px;padding:11px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;text-align:left}
.rp .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:var(--c-ink);flex:none}
.rp.on{border-color:var(--c-ink);background:var(--c-soft)}
.rp .cnt{margin-left:auto;display:flex;align-items:center;gap:4px}
.rp .cnt button{width:22px;height:22px;border-radius:7px;background:var(--surface);border:1px solid var(--line);font-weight:900;line-height:1}
.hidden{display:none!important}
#print{display:none}

/* ---------- mobile ---------- */
.split{grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.split2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.tabbar{display:none}
@media (max-width:1100px){.today{grid-template-columns:1fr}.week{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.dgrid{grid-template-columns:repeat(5,1fr)}}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 .side{display:none}
 main{padding:18px 16px 110px}
 .demo-bar{margin:-18px -16px 16px;padding:10px 16px;font-size:13px}
 .top h1{font-size:26px}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--ink-3);padding:6px 0;border-radius:12px}
 .tabbar button.on{color:var(--brand)}
 .fresh{grid-template-columns:1fr;justify-items:center;text-align:center}
 .fresh .row{justify-content:center}
 .energy{grid-template-columns:1fr}
 .g2,.g3,.g4,.split,.split2{grid-template-columns:1fr}
 .week{grid-template-columns:1fr}
 .day{min-height:0}
 .trow{grid-template-columns:30px 1fr auto;row-gap:6px}
 .trow .fcol{grid-column:2/4;grid-row:2}
 .trow>.btn{grid-column:3;grid-row:1}
 .demo-bar .long{display:none}
 .trow .lcol{display:none}
 .dgrid{grid-template-columns:repeat(3,1fr)}
 .rpick{grid-template-columns:1fr 1fr}
 .hbar{grid-template-columns:96px 1fr 38px}
 .timer-pill{bottom:86px;right:14px}
 .toast{bottom:90px}
 .task .acts{opacity:1}
 .chart th:not(:first-child):not(:last-child),.chart td:not(:first-child):not(:last-child){padding:9px 2px}
}
@media (max-width:480px){.kpis{grid-template-columns:1fr 1fr}.rpick{grid-template-columns:1fr}.f2{grid-template-columns:1fr}}

@media print{
 @page{size:letter;margin:14mm}

 .ps:last-child{page-break-after:auto}

 .ps .sub{color:#667;font-weight:700;margin-bottom:18px}

 .ps li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #dde4e1;font-weight:700}
}

const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`

function idb() { return new Promise((res, rej) => { try { const r = indexedDB.open('the-reset', 1); r.onupgradeneeded = () => r.result.createObjectStore('b'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) } catch (e) { rej(e) } }) }
let idbT
function idbPut(s) { clearTimeout(idbT); idbT = setTimeout(() => idb().then(db => { const tx = db.transaction('b', 'readwrite'); tx.objectStore('b').put(JSON.stringify(s), KEY) }).catch(() => { }), 400) }
function idbGet() { return idb().then(db => new Promise(res => { const r = db.transaction('b').objectStore('b').get(KEY); r.onsuccess = () => res(r.result ? JSON.parse(r.result) : null); r.onerror = () => res(null) })).catch(() => null) }

// ---------- model ----------
const roomById = id => S.rooms.find(r => r.id === id)
const taskById = id => S.tasks.find(t => t.id === id)
const personById = id => S.people.find(p => p.id === id)
function makeRoom(type, name, opt = {}) {
  const T = ROOM_TYPES[type] || { n: name, icon: 'sparkle', tone: 'mint', tasks: [], deep: [] }
  const r = { id: uid(), type, n: name || T.n, icon: T.icon, tone: T.tone, deep: (T.deep || []).map(n => ({ id: uid(), n, d: false })) }
  S.rooms.push(r)
  if (opt.tasks !== false) T.tasks.forEach(([n, f, m, e]) => S.tasks.push({ id: uid(), room: r.id, n, f, m, e, last: null, snooze: null, who: null }))
  return r
}
function since(t) { return t.last ? diffD(t.last, today()) : null }
function ratio(t) { if (!t.f) return t.last ? 0 : 1; const s = since(t); return s === null ? 1 : s / t.f }
function dueDate(t) { let d = t.last ? (t.f ? addDays(t.last, t.f) : '9999-12-31') : today(); if (t.snooze && t.snooze > d) d = t.snooze; return d }
const isDue = t => dueDate(t) <= today()
const freshOf = t => Math.max(0, Math.min(1, 1 - 0.6 * ratio(t)))
function roomFresh(r) { const ts = S.tasks.filter(t => t.room === r.id && t.f); return ts.length ? Math.round(100 * sum(ts, freshOf) / ts.length) : 100 }
function homeFresh() { const rs = S.rooms.filter(r => S.tasks.some(t => t.room === r.id && t.f)); return rs.length ? Math.round(sum(rs, roomFresh) / rs.length) : 100 }
const lvl = p => p >= 70 ? 'good' : p >= 40 ? 'ok' : 'low'
const lvlName = p => p >= 70 ? 'Fresh' : p >= 40 ? 'Doing okay' : 'Needs some love'
const lvlColor = p => p >= 70 ? 'var(--brand)' : p >= 40 ? 'var(--sun-mid)' : 'var(--peach-mid)'
function freqLabel(f) {
  if (!f) return 'Just once'
  const M = { 1: 'Daily', 7: 'Weekly', 14: 'Every 2 weeks', 30: 'Monthly', 365: 'Yearly' }
  if (M[f]) return M[f]
  if (f % 30 === 0) return `Every ${f / 30} months`
  if (f % 7 === 0) return `Every ${f / 7} weeks`
  return `Every ${f} days`
}
function lastLabel(t) { const s = since(t); if (s === null) return 'Not yet'; if (s === 0) return 'Today'; if (s === 1) return 'Yesterday'; if (s < 14) return `${s} days ago`; if (s < 60) return `${Math.round(s / 7)} weeks ago`; return `${Math.round(s / 30)} months ago` }
function dueLabel(t) { const d = diffD(today(), dueDate(t)); if (d <= 0) return t.last && t.last === today() ? 'Done today' : 'Ready now'; if (d === 1) return 'Tomorrow'; if (d < 14) return `In ${d} days`; if (d < 60) return `In ${Math.round(d / 7)} weeks`; return `In ${Math.round(d / 30)} months` }
function fitsEnergy(t, en) { if (en === 'l') return t.e === 'l' && t.m <= 10; if (en === 'm') return t.e !== 'h' && t.m <= 20; return true }
function zoneRoom() { const rs = S.rooms.filter(r => r.type !== 'homecare' && r.deep && r.deep.length); if (!rs.length) return null; const w = Math.floor(diffD('2024-01-01', weekStart()) / 7); return rs[((w % rs.length) + rs.length) % rs.length] }
function daySet() { return new Set(S.log.map(l => l.d)) }
function streak() { const set = daySet(); let d = today(); if (!set.has(d)) d = addDays(d, -1); let n = 0; while (set.has(d)) { n++; d = addDays(d, -1) } return n }
function bestStreak() { const ds = [...daySet()].sort(); let best = 0, cur = 0, prev = null; for (const d of ds) { cur = prev && diffD(prev, d) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d } return best }
const logSince = k => S.log.filter(l => l.d >= k)
const tasksDone = ls => ls.filter(l => !l.k)

// ---------- plan ----------
function ensurePlan() { if (S.plan.date !== today()) { S.plan.date = today(); S.plan.done = []; S.plan.ids = []; genPlan(); save() } }
function planPool(mode, exclude = []) {
  const P = S.plan, z = zoneRoom()
  return S.tasks.filter(t => roomById(t.room) && fitsEnergy(t, P.en) && (P.who === 'all' || !t.who || t.who === P.who) && !exclude.includes(t.id) && t.last !== today())
    .filter(t => mode === 'ahead' ? !isDue(t) && ratio(t) >= 0.5 && (!t.snooze || t.snooze <= today()) : isDue(t))
    .map(t => ({ t, s: ratio(t) + (z && t.room === z.id ? 0.35 : 0) + (mode === 'shuffle' ? Math.random() * 1.4 : Math.random() * 0.05) }))
    .sort((a, b) => b.s - a.s)
}
function fill(cands, budget, ids) {
  let used = sum(ids, id => (taskById(id) || { m: 0 }).m)
  for (const c of cands) { if (used >= budget) break; if (used + c.t.m <= budget || (!ids.length && c.t.m <= budget * 1.5)) { ids.push(c.t.id); used += c.t.m } }
  return used
}
function genPlan(mode) {
  const P = S.plan
  P.done = P.done.filter(id => taskById(id))
  const ids = []
  const budget = P.mins
  let used = fill(planPool(mode === 'ahead' ? 'ahead' : mode, P.done), budget, ids)
  P.ahead = mode === 'ahead'
  if (mode !== 'ahead' && used < budget * 0.5 && ids.length < 2) fill(planPool('ahead', P.done.concat(ids)), budget, ids)
  P.ids = P.done.concat(ids)
}
function planTasks() { return S.plan.ids.map(taskById).filter(Boolean) }

function completeTask(id, ev, who) {

  t.last = today(); t.snooze = null
  if (!t.f) { entry.o = { ...t, last: entry.p }; S.tasks = S.tasks.filter(x => x !== t) }

  const pt = planTasks(), allDone = pt.length && pt.every(x => S.plan.done.includes(x.id)) && S.plan.ids.includes(id)

function undoComplete(id, entry) {
  const i = S.log.lastIndexOf(entry); if (i < 0) return
  S.log.splice(i, 1)
  if (entry.o) S.tasks.push(entry.o)
  const t = taskById(id); if (t) { t.last = entry.p; t.snooze = entry.ps }
  S.plan.done = S.plan.done.filter(x => x !== id)
  save(); render()
}
function uncompleteToday(id) {
  for (let i = S.log.length - 1; i >= 0; i--) { const l = S.log[i]; if (l.t === id && l.d === today()) return undoComplete(id, l) }
  S.plan.done = S.plan.done.filter(x => x !== id); save(); render()
}
function snooze(id) {
  const t = taskById(id); if (!t) return
  const prev = t.snooze; t.snooze = addDays(today(), 1)
  const pIds = S.plan.ids.slice()
  S.plan.ids = S.plan.ids.filter(x => x !== id)
  save(); render()
  toast('Moved to tomorrow. No guilt.', 'Undo', () => { t.snooze = prev; S.plan.ids = pIds; save(); render() })
}
function swapTask(id) {
  const P = S.plan, i = P.ids.indexOf(id); if (i < 0) return
  const used = P.ids.filter(x => x !== id)
  let c = planPool('shuffle', used.concat(id))[0] || planPool('ahead', used.concat(id))[0]
  if (!c) return toast('Nothing else fits right now — this one\'s your best bet!')
  P.ids[i] = c.t.id; save(); render()
}

function weekProjection(days = 7) {
  const start = today(), end = addDays(start, days - 1), out = {}
  for (let i = 0; i < days; i++) out[addDays(start, i)] = []
  S.log.filter(l => l.d === start && !l.k).forEach(l => { const r = roomById(l.r); out[start].push({ n: l.n, m: l.m, r, done: true, id: l.t }) })
  S.tasks.forEach(t => {
    const r = roomById(t.room); if (!r) return
    let d = dueDate(t); if (d < start) d = start
    if (t.last === today() && d === start) d = t.f ? addDays(start, t.f) : '9999'
    while (d <= end) { out[d].push({ n: t.n, m: t.m, r, id: t.id, t }); if (!t.f) break; d = addDays(d, t.f) }
  })
  return out
}

function vStats() {
  const t0 = today(), wk = logSince(weekStart()), all = S.log
  const days = [...Array(14)].map((_, i) => addDays(t0, i - 13)), per = days.map(k => sum(all.filter(l => l.d === k), l => l.m)), mx = Math.max(30, ...per)
  const m30 = logSince(addDays(t0, -29)).filter(l => !l.k), byRoom = S.rooms.map(r => ({ r, m: sum(m30.filter(l => l.r === r.id), l => l.m) })).sort((a, b) => b.m - a.m), mxR = Math.max(1, ...byRoom.map(x => x.m))
  const hs = addDays(weekStart(), -77), heat = [...Array(84)].map((_, i) => { const k = addDays(hs, i), m = sum(all.filter(l => l.d === k), l => l.m); return `<i class="${k > t0 ? '' : m >= 30 ? 'l3' : m >= 15 ? 'l2' : m > 0 ? 'l1' : ''}" title="${k}: ${m} min" style="${k > t0 ? 'opacity:.3' : ''}"></i>` }).join('')
  const goalNow = sum(wk, l => l.m), best = byRoom[0] && byRoom[0].m ? byRoom[0] : null
  const kpi = (tone, ic, k, v, s = '') => `<div class="card kpi t-${tone}"><div class="k"><span class="ic">${ico(ic, 'sm')}</span>${k}</div><div class="v">${v}<small>${s}</small></div></div>`
  return `<div class="top"><div><h1>Your progress</h1><div class="sub">Proof that small resets add up.</div></div></div>
  <div class="kpis">${kpi('peach', 'flame', 'Streak', streak(), `days · best ${bestStreak()}`)}${kpi('mint', 'clock', 'This week', sum(wk, l => l.m), `/ ${S.settings.goal} min`)}${kpi('sky', 'check', 'Tasks this week', tasksDone(wk).length)}${kpi('lilac', 'sparkle', 'All time', tasksDone(all).length, 'tasks')}</div>
  <div class="grid g2 mt">
    <div class="card"><h3>Last 14 days</h3><p class="muted" style="margin:3px 0 0;font-size:13px;font-weight:700">Minutes of resetting per day</p>
      <div class="bars">${per.map((m, i) => `<div class="b ${i === 13 ? 't' : ''}" title="${m} min"><i style="height:${Math.max(2, 100 * m / mx)}%"></i><small>${DOW[parseD(days[i]).getDay()][0]}</small></div>`).join('')}</div></div>
    <div class="card"><h3>Where your time went</h3><p class="muted" style="margin:3px 0 8px;font-size:13px;font-weight:700">Last 30 days, by room</p>
      ${byRoom.slice(0, 7).map(({ r, m }) => `<div class="hbar t-${r.tone}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.n)}</span><div class="bar"><i style="width:${100 * m / mxR}%"></i></div><span class="muted">${m}m</span></div>`).join('')}</div>
  </div>
  <div class="grid mt split2">
  <div class="card"><h3>Consistency</h3><p class="muted" style="margin:3px 0 14px;font-size:13px;font-weight:700">Last 12 weeks — every square is a day you showed up.</p><div style="overflow-x:auto"><div class="heat">${heat}</div></div>
    <div class="row" style="margin-top:12px;font-size:12px;color:var(--ink-3);font-weight:800">Less <span class="heat" style="display:flex;gap:4px"><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i></span> More</div></div>
  <div class="card" style="display:flex;gap:20px;align-items:center">${ring(Math.min(100, 100 * goalNow / S.settings.goal), 130, 14, 'var(--brand)', `<div><div style="font-size:26px">${Math.round(Math.min(999, 100 * goalNow / S.settings.goal))}%</div><div class="label">of goal</div></div>`)}
    <div><div class="label">Weekly goal</div><h3 style="margin:4px 0 6px">${goalNow >= S.settings.goal ? 'Goal reached! 🎉' : `${S.settings.goal - goalNow} min to go`}</h3><p class="muted" style="margin:0;font-size:13.5px;font-weight:700">${goalNow} of ${S.settings.goal} minutes this week. Change your goal in Settings.</p>
    ${best ? `<p style="margin:12px 0 0;font-size:13.5px;font-weight:800">Most-loved room: <span class="chip soft t-${best.r.tone}">${ico(best.r.icon)}${esc(best.r.n)}</span></p>` : ''}</div></div></div>`
}

// ---------- modals ----------
function modal(html, cls = '') { closeModal(); const d = document.createElement('div'); d.className = 'scrim'; d.id = 'modal'; d.innerHTML = `<div class="modal ${cls}" role="dialog">${html}</div>`; d.addEventListener('mousedown', e => { if (e.target === d) closeModal() }); document.body.appendChild(d); const f = d.querySelector('input:not([type=hidden])'); if (f && matchMedia('(min-width:821px)').matches) setTimeout(() => f.focus(), 50) }
function closeModal() { const m = $('#modal'); if (m) m.remove() }
function taskForm(t, roomId) {
  const isNew = !t; t = t || { n: '', room: roomId || (S.rooms[0] || {}).id, f: 7, m: 10, e: 'l', who: null }
  const unit = !t.f ? 'once' : t.f % 30 === 0 ? 'm' : t.f % 7 === 0 ? 'w' : 'd', num = !t.f ? 1 : unit === 'm' ? t.f / 30 : unit === 'w' ? t.f / 7 : t.f
  modal(`<h2>${isNew ? 'New task' : 'Edit task'}</h2><p class="lead">Keep it small and specific — "Wipe the stovetop" beats "Clean kitchen".</p>
  <form data-form="task" data-id="${isNew ? '' : t.id}">
    <label class="field"><span>Task</span><input class="inp" name="n" required value="${esc(t.n)}" placeholder="e.g. Wipe the stovetop"></label>
    <label class="field"><span>Room</span><select class="inp" name="room">${S.rooms.map(r => `<option value="${r.id}" ${r.id === t.room ? 'selected' : ''}>${esc(r.n)}</option>`).join('')}</select></label>
    <div class="field"><span>How often</span><div class="f2"><input class="inp" type="number" min="1" name="num" value="${num}"><select class="inp" name="unit"><option value="d" ${unit === 'd' ? 'selected' : ''}>days</option><option value="w" ${unit === 'w' ? 'selected' : ''}>weeks</option><option value="m" ${unit === 'm' ? 'selected' : ''}>months</option><option value="once" ${unit === 'once' ? 'selected' : ''}>Just once</option></select></div></div>
    <div class="f2"><label class="field"><span>Takes about</span><select class="inp" name="m">${[1, 2, 3, 5, 10, 15, 20, 30, 45, 60, 90].map(m => `<option value="${m}" ${m === t.m ? 'selected' : ''}>${m} min</option>`).join('')}</select></label>
    <label class="field"><span>Energy needed</span><select class="inp" name="e">${['l', 'm', 'h'].map(k => `<option value="${k}" ${t.e === k ? 'selected' : ''}>${EN[k].n}</option>`).join('')}</select></label></div>
    ${S.people.length ? `<label class="field"><span>Who usually does it</span><select class="inp" name="who"><option value="">Anyone</option>${S.people.map(p => `<option value="${p.id}" ${t.who === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>` : ''}
    <div class="mfoot">${isNew ? '' : `<button type="button" class="btn danger" data-act="del-task" data-id="${t.id}">${ico('trash')} Delete</button>`}<span class="grow"></span><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn pri">${isNew ? 'Add task' : 'Save'}</button></div>
  </form>`)
}

function confirmBox(title, text, okLabel, fn, danger) {

let AC

function chime(big) {
  if (!S.settings.sounds) return; const a = ac(); if (!a) return
  const notes = big ? [523.25, 659.25, 783.99, 1046.5] : [659.25, 987.77]
  notes.forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i * 0.09; o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.12, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.65) })
}
function tick() { if (!S.settings.sounds) return; const a = ac(); if (!a) return; for (let i = 0; i < 16; i++) { const t = a.currentTime + 2.1 * (1 - Math.pow(1 - i / 16, 2.2)), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 1400; g.gain.setValueAtTime(0.03, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03); o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.04) } }
let NZ = null
function startNoise(kind) {

  const len = a.sampleRate * 4, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0); let last = 0
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; if (kind === 'rain') d[i] = w * 0.5; else { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5 } }

  if (kind === 'ocean') { const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = 0.09; lg.gain.value = 0.35; l.connect(lg).connect(g.gain); l.start(); NZ = { l } }

function stopNoise() { if (NZ) { try { NZ.src.stop(); NZ.l && NZ.l.stop() } catch (e) { } NZ = null } }

function confettiInit() { if (cv) return; cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv); cx = cv.getContext('2d'); const rs = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio }; rs(); addEventListener('resize', rs) }
const CC = ['#5ED6AE', '#F6CB5C', '#F5A981', '#B9A3EE', '#9DC3F3', '#EE9ABA']
function burst(ev, n = 24) {
  confettiInit(); const x = ev && ev.clientX != null ? ev.clientX : innerWidth / 2, y = ev && ev.clientY != null ? ev.clientY : innerHeight / 2
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, s: 4 + Math.random() * 5, c: pick(CC), r: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 60 + Math.random() * 30 }) }

}
function bigConfetti() { confettiInit(); for (let i = 0; i < 160; i++) parts.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .4, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, s: 5 + Math.random() * 6, c: pick(CC), r: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 140 + Math.random() * 60 }); loop() }
function loop() {
  if (raf) return
  const step = () => {
    const dpr = devicePixelRatio; cx.clearRect(0, 0, cv.width, cv.height)
    parts = parts.filter(p => p.life-- > 0 && p.y < innerHeight + 30)
    parts.forEach(p => { p.vy += 0.12; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x * dpr, p.y * dpr); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.min(1, p.life / 30); cx.fillRect(-p.s * dpr / 2, -p.s * dpr / 4, p.s * dpr, p.s * dpr / 2); cx.restore() })

}
let toastT

  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<span>${html}</span>${btn ? `<button>${btn}</button>` : ''}`

  'room-add-type': el => { const k = el.dataset.v; const cnt = S.rooms.filter(r => r.type === k).length; const r = makeRoom(k === 'custom' ? 'custom' : k, k === 'custom' ? 'New room' : ROOM_TYPES[k].n + (cnt ? ' ' + (cnt + 1) : ''), {}); stagger(S.tasks.filter(t => t.room === r.id)); save(); closeModal(); go('room', { room: r.id, roomTab: 'tasks' }); if (k === 'custom') roomForm(r) },
  'edit-room': el => roomForm(roomById(el.dataset.id)),
  'del-room': el => { const r = roomById(el.dataset.id); confirmBox('Delete this room?', `"${esc(r.n)}" and its tasks will be removed. Your progress history stays.`, 'Delete', () => { S.tasks = S.tasks.filter(t => t.room !== r.id); S.rooms = S.rooms.filter(x => x !== r); S.plan.ids = S.plan.ids.filter(taskById); save(); go('rooms') }, true) },
  'pick-ic': el => { el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on')); el.classList.add('on'); el.closest('form').icon.value = el.dataset.v },
  'pick-tn': el => { el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on')); el.classList.add('on'); el.closest('form').tone.value = el.dataset.v },
  'new-task': el => { if (!S.rooms.length) return toast('Add a room first.'); taskForm(null, el.dataset.room || (UI.view === 'room' ? UI.room : null)) },
  'edit-task': el => taskForm(taskById(el.dataset.id)),
  'del-task': el => { S.tasks = S.tasks.filter(t => t.id !== el.dataset.id); S.plan.ids = S.plan.ids.filter(x => x !== el.dataset.id); save(); closeModal(); render() },
  deep: (el, e) => { const r = roomById(el.dataset.room), i = r.deep.find(x => x.id === el.dataset.id); i.d = !i.d; if (i.d) { chime(); burst(e, 14) } save(); render() },
  'deep-del': el => { const r = roomById(el.dataset.room); r.deep = r.deep.filter(x => x.id !== el.dataset.id); save(); render() },
  'deep-reset': el => { roomById(el.dataset.room).deep.forEach(i => i.d = false); save(); render() },
  list: el => go('list', { list: el.dataset.id }),
  li: (el, e) => { const L = S.lists.find(l => l.id === el.dataset.list), i = L.items.find(x => x.id === el.dataset.id); i.d = !i.d; if (i.d) { chime(); burst(e, 14); if (L.items.every(x => x.d)) setTimeout(bigConfetti, 200) } save(); render() },
  'li-del': el => { const L = S.lists.find(l => l.id === el.dataset.list); L.items = L.items.filter(x => x.id !== el.dataset.id); save(); render() },
  'list-reset': el => { S.lists.find(l => l.id === el.dataset.id).items.forEach(i => i.d = false); save(); render() },
  'list-del': el => confirmBox('Delete this checklist?', 'This can\'t be undone.', 'Delete', () => { S.lists = S.lists.filter(l => l.id !== el.dataset.id); save(); go('lists') }, true),
  'new-list': () => modal(`<h2>New checklist</h2><form data-form="list"><label class="field"><span>Name</span><input class="inp" name="n" required placeholder="e.g. Before vacation"></label><div class="mfoot"><span class="grow"></span><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn pri">Create</button></div></form>`),
  declutter: (el, e) => { const k = el.dataset.v; S.declutter[k] = !S.declutter[k]; if (S.declutter[k]) { S.log.push({ d: today(), t: null, n: 'Declutter: ' + DECLUTTER[k - 1], m: 5, r: null, k: 'declutter', w: null }); chime(); burst(e, 22); if (Object.values(S.declutter).filter(Boolean).length === 30) setTimeout(bigConfetti, 200) } save(); render() },
  'declutter-reset': () => confirmBox('Start the 30 days over?', 'All tiles will be cleared.', 'Start over', () => { S.declutter = {}; save(); render() }),
  sup: el => { const s = S.supplies.find(x => x.id === el.dataset.id); s.low = !s.low; save(); render() },
  'add-person': () => personForm(),
  'edit-person': el => personForm(personById(el.dataset.id)),
  'del-person': el => { const id = el.dataset.id; S.people = S.people.filter(p => p.id !== id); S.tasks.forEach(t => { if (t.who === id) t.who = null }); if (S.plan.who === id) S.plan.who = 'all'; save(); closeModal(); render() },
  sos: el => startSos(+el.dataset.v),
  'sos-next': sosNext,
  'sos-skip': () => { OV.i++; OV.beeped = false; if (OV.i < OV.L.steps.length) OV.end = Date.now() + OV.L.steps[OV.i][1] * 1000; drawSos() },
  'ov-close': () => { closeOverlay(); render() },
  surprise,
  'sp-done': (el, e) => { closeOverlay(); completeTask(el.dataset.id, e) },
  timer: () => openTimer(),
  'timer-task': el => { const t = taskById(el.dataset.id); TM.run = false; clearInterval(tmT); stopNoise(); TM.total = TM.left = t.m * 60; TM.label = t.n; TM.task = t.id; openTimer() },
  'timer-plan': () => { const pt = planTasks().filter(t => !S.plan.done.includes(t.id)); TM.run = false; clearInterval(tmT); TM.total = TM.left = Math.max(1, sum(pt, t => t.m)) * 60; TM.label = 'Your reset plan'; TM.task = null; openTimer() },
  'tm-set': el => { TM.total = TM.left = +el.dataset.v * 60; TM.label = ''; TM.task = null; drawTimer() },
  'tm-toggle': () => { TM.run = !TM.run; if (TM.run) { ac(); TM.end = Date.now() + TM.left * 1000; tmTick(); if (TM.sound !== 'off') startNoise(TM.sound) } else { stopNoise() } drawTimer() },
  'tm-reset': () => { TM.run = false; clearInterval(tmT); stopNoise(); TM.left = TM.total; drawTimer() },
  'tm-sound': el => { TM.sound = el.dataset.v; if (TM.run) startNoise(TM.sound); else stopNoise(); drawTimer() },
  'tm-done-task': (el, e) => { const id = TM.task; TM.run = false; clearInterval(tmT); stopNoise(); TM.task = null; TM.label = ''; TM.left = TM.total; closeOverlay(); completeTask(id, e) },
  amnesty: () => confirmBox('Fresh start?', 'Everything that\'s ready now gets spread over the next few days, so today feels doable. Nothing is deleted.', 'Spread it out', amnesty),
  theme: el => { S.settings.theme = el.dataset.v; save(); applyTheme(); render() },
  sounds: el => { S.settings.sounds = el.dataset.v === '1'; save(); render() },
  export: () => { const b = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `the-reset-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('Backup downloaded.') },
  import: () => { const f = $('#importFile'); f.onchange = () => { const file = f.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d.rooms || !d.tasks) throw 0; S = migrate(d); save(); applyTheme(); render(); toast('Backup restored.') } catch (e) { toast('That file isn\'t a The Reset backup.') } }; rd.readAsText(file) }; f.click() },
  wipe: () => confirmBox('Erase everything?', 'All rooms, tasks and history on this device will be deleted. Download a backup first if you might want it.', 'Erase', () => { S = blank(); if (DEMO) S.settings.onboarded = true; save(); render(); if (!DEMO) { Object.assign(ONB, { step: 0 }); drawOnb() } }, true),
  'print-room': el => printPages([printRoom(roomById(el.dataset.id))]),
  'print-list': el => { const L = S.lists.find(l => l.id === el.dataset.id); printPages([printList(L.n, L.items.map(i => i.n))]) },
  'print-declutter': () => printPages([printList('30-day declutter', DECLUTTER.map((t, i) => `Day ${i + 1} — ${t}`), 'One tiny mission at a time. Skip days freely.')]),
  'print-shop': () => printPages([printList('Shopping list', S.supplies.filter(s => s.low).map(s => s.n), 'Cleaning supplies to pick up')]),
  'print-week': () => { const W = weekProjection(7); printPages([`<div class="ps">${pHead('The week ahead', 'Your cleaning plan for the next 7 days')}<table><tr><th style="width:110px">Day</th><th>Tasks</th></tr>${Object.entries(W).map(([k, it]) => { const d = parseD(k); return `<tr><td><b>${DOWL[d.getDay()]}</b><br>${MON[d.getMonth()]} ${d.getDate()}</td><td>${it.map(x => `<div style="display:flex;gap:8px;align-items:center;padding:3px 0">${bx}${esc(x.n)} <span style="color:#889">· ${esc(x.r.n)} · ${x.m}m</span></div>`).join('') || '<i style="color:#889">Free day</i>'}</td></tr>` }).join('')}</table></div>`]) },
  'print-chores': () => printPages(S.people.map(p => { const ts = S.tasks.filter(t => t.who === p.id); return `<div class="ps">${pHead(p.name + "'s chores", 'Week of ______________ · color a box each time')}<table><tr><th>Chore</th><th>How often</th>${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<th class="center">${d}</th>`).join('')}</tr>${(ts.length ? ts : [...Array(8)].map(() => ({ n: '', f: null }))).map(t => `<tr><td style="height:30px"><b>${esc(t.n)}</b></td><td>${t.f == null ? '' : freqLabel(t.f)}</td>${[...Array(7)].map(() => `<td class="center">${bx}</td>`).join('')}</tr>`).join('')}</table></div>` })),
  'onb-next': () => { if (ONB.step === 1 && !Object.values(ONB.rooms).some(Boolean)) return toast('Pick at least one room.'); if (ONB.step === 3) return finishOnb(); ONB.step++; drawOnb() },
  'onb-back': () => { ONB.step--; drawOnb() },
  'onb-room': el => { const k = el.dataset.v; ONB.rooms[k] = ONB.rooms[k] ? 0 : 1; drawOnb() },
  'onb-cnt': (el, e) => { e.stopPropagation(); const k = el.dataset.v; ONB.rooms[k] = Math.max(1, Math.min(6, (ONB.rooms[k] || 1) + +el.dataset.d)); drawOnb() },
  'onb-unperson': el => { ONB.people.splice(+el.dataset.v, 1); drawOnb() },
  'onb-mins': el => { ONB.mins = +el.dataset.v; drawOnb() }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return
  const a = ACT[el.dataset.act]; if (!a) return
  if (el.closest('form') && el.type !== 'submit') e.preventDefault()
  e.stopPropagation(); a(el, e)
})
document.addEventListener('submit', e => {
  const f = e.target, k = f.dataset.form; if (!k) return; e.preventDefault()
  const v = n => (f.elements[n] ? f.elements[n].value : '').trim()
  if (k === 'task') {
    const unit = v('unit'), num = Math.max(1, +v('num') || 1), freq = unit === 'once' ? 0 : num * (unit === 'm' ? 30 : unit === 'w' ? 7 : 1)
    const data = { n: v('n'), room: v('room'), f: freq, m: +v('m'), e: v('e'), who: v('who') || null }
    if (!data.n) return
    if (f.dataset.id) Object.assign(taskById(f.dataset.id), data)
    else { const t = { id: uid(), last: null, snooze: null, ...data }; S.tasks.push(t); if (freq) t.last = null }
    save(); closeModal(); render(); toast(f.dataset.id ? 'Saved.' : 'Task added — it\'s ready whenever you are.')
  }
  if (k === 'room') { Object.assign(roomById(f.dataset.id), { n: v('n') || 'Room', icon: v('icon'), tone: v('tone') }); save(); closeModal(); render() }
  if (k === 'person') { const d = { name: v('name'), tone: v('tone') }; if (!d.name) return; if (f.dataset.id) Object.assign(personById(f.dataset.id), d); else S.people.push({ id: uid(), ...d }); save(); closeModal(); render() }
  if (k === 'list') { const L = { id: uid(), n: v('n'), icon: 'list', tone: pick(TONES), items: [] }; if (!L.n) return; S.lists.push(L); save(); closeModal(); go('list', { list: L.id }) }
  if (k === 'deep-add') { const n = v('n'); if (!n) return; roomById(f.dataset.room).deep.push({ id: uid(), n, d: false }); save(); render(); setTimeout(() => { const i = document.querySelector('[data-form=deep-add] input'); i && i.focus() }, 0) }
  if (k === 'li-add') { const n = v('n'); if (!n) return; S.lists.find(l => l.id === f.dataset.list).items.push({ id: uid(), n, d: false }); save(); render(); setTimeout(() => { const i = document.querySelector('[data-form=li-add] input'); i && i.focus() }, 0) }
  if (k === 'sup-add') { const n = v('n'); if (!n) return; S.supplies.push({ id: uid(), n, low: true }); save(); render() }
  if (k === 'onb-person') { const n = v('n'); if (n) ONB.people.push(n); drawOnb(); setTimeout(() => { const i = document.querySelector('[data-form=onb-person] input'); i && i.focus() }, 0) }
})
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.set; if (!k) return; S.settings[k] = k === 'goal' ? Math.max(10, +e.target.value || 120) : e.target.value.trim(); save(); render() })
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal')) closeModal(); else if (OV && OV.kind !== 'onb') { closeOverlay(); render() } } })
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S && applyTheme())
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && S.plan.date !== today()) render() })

// ---------- demo data ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
function sampleData() {
  S = blank(); const R = mulberry(7)
  S.settings.name = 'Sam'; S.settings.onboarded = true
  ;['kitchen', 'bathroom', 'bedroom', 'living', 'laundry', 'entry', 'kids', 'homecare'].forEach(k => makeRoom(k, k === 'kids' ? "Mia's room" : ROOM_TYPES[k].n))
  const ppl = [['Sam', 'lilac'], ['Alex', 'sky'], ['Mia', 'pink']].map(([name, tone]) => ({ id: uid(), name, tone })); S.people = ppl
  const [sam, alex, mia] = ppl
  S.tasks.forEach(t => { const r = roomById(t.room); if (r.type === 'kids') t.who = mia.id; else if (r.type === 'laundry' || /trash|bin|Vacuum/.test(t.n)) t.who = alex.id; else if (r.type === 'kitchen' && R() < .4) t.who = sam.id })
  S.tasks.forEach(t => { if (t.f) t.last = addDays(today(), -Math.floor(R() * t.f * 0.8)) })
  // a few ready ones for a lively Today
  S.tasks.filter(t => ['Wipe counters', 'Do the dishes', 'Wipe sink & counter', 'Make the bed', 'Toy reset', 'Fold & put away', 'Shoes & bags away', 'Clear out the fridge', 'Shine the mirror', 'Change the sheets', 'Test smoke alarms'].includes(t.n)).forEach(t => t.last = addDays(today(), -t.f))
  // history
  for (let i = 34; i >= 1; i--) {
    if (i === 17 || i === 26) continue
    const d = addDays(today(), -i), n = 2 + Math.floor(R() * 4)
    for (let j = 0; j < n; j++) { const t = S.tasks[Math.floor(R() * S.tasks.length)]; const w = t.who || (R() < .5 ? sam.id : R() < .5 ? alex.id : null); S.log.push({ d, t: t.id, n: t.n, m: t.m, r: t.room, w }) }
  }
  for (let i = 1; i <= 8; i++) S.declutter[i] = true
  S.supplies.forEach((s, i) => { if ([2, 9, 15].includes(i)) s.low = true })
  S.lists[0].items.slice(0, 4).forEach(i => i.d = true)
  S.lists[2].items.slice(0, 7).forEach(i => i.d = true)
  S.rooms.forEach(r => r.deep.forEach(i => { if (R() < .35) i.d = true }))
  S.plan = { date: '', en: 'm', mins: 30, who: 'all', ids: [], done: [] }
}

// ---------- boot ----------
async function boot() {
  let d = null
  try { d = JSON.parse(localStorage.getItem(KEY) || 'null') } catch (e) { }
  if (!d) d = await idbGet()
  if (d) S = migrate(d)
  else if (DEMO) { sampleData(); save() }
  else S = blank()
  applyTheme(); render()
  if (!DEMO && !S.settings.onboarded) drawOnb()
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { })
}
boot()

</script>
