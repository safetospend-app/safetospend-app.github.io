<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#127A62">
<meta name="robots" content="noindex">
<title>Safe to Spend — Vollversion</title>
<link rel="icon" href="../icon-192.png">
<style>
:root{
  --bg:#F6F2EA;--surface:#fff;--ink:#1A2A30;--ink2:#3D5158;--muted:#77878D;
  --line:#E8E1D4;--green:#127A62;--green-s:#DCEFE7;--green-b:#A9D9C7;
  --shadow:0 1px 2px rgba(26,42,48,.04),0 8px 24px -12px rgba(26,42,48,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1418;--surface:#161E23;--ink:#EDF3F2;--ink2:#C3D0D3;--muted:#8DA0A8;
  --line:#25333A;--green:#4CCCA1;--green-s:#122F29;--green-b:#1F5449;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
.card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);
  border-radius:24px;box-shadow:var(--shadow);padding:34px 30px}
.top{display:flex;align-items:center;gap:11px;margin-bottom:24px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,var(--green),#2AA98B);
  display:grid;place-items:center;flex:0 0 40px}
.bn{font-size:15px;font-weight:700;line-height:1.1}
.bt{font-size:11px;color:var(--muted)}
h1{font-size:26px;font-weight:700;letter-spacing:-.8px;line-height:1.15;margin-bottom:8px}
.lead{font-size:14px;color:var(--ink2);margin-bottom:22px}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;
  padding:13px 15px;margin-bottom:10px;text-decoration:none;color:inherit;background:var(--surface)}
.row:hover{border-color:var(--green-b);background:var(--green-s)}
.flag{font-size:22px;flex:0 0 auto;line-height:1}
.rn{font-weight:500;font-size:14.5px}
.rs{font-size:11.5px;color:var(--muted)}
.go{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--green);white-space:nowrap}
.soon{opacity:.55}
.soon .go{color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);margin-top:18px;text-align:center}
.hint a{color:var(--green)}
.redir{display:none;text-align:center;padding:10px 0 4px}
.dots{display:inline-block;width:22px;height:22px;border:3px solid var(--green-b);
  border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="logo"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6.5v5c0 4.6 3.2 8.4 8 9.5 4.8-1.1 8-4.9 8-9.5v-5L12 3Z"/>
      <path d="m9 12 2 2 4-4"/></svg></div>
    <div><div class="bn" id="bn">Safe to Spend</div><div class="bt" id="bt">Budget-Planer</div></div>
  </div>

  <div class="redir" id="redir"><div class="dots"></div><div id="rtxt"></div></div>

  <div id="main">
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <div id="rows"></div>
    <p class="hint" id="hint"></p>
  </div>
</div>

<script src="links.js"></script>
<script>
var T = {
  de:{bt:'Budget-Planer', h1:'Vollversion holen',
      lead:'Die Demo kennst du schon. Die Vollversion kaufst du auf Etsy — einmal zahlen, für immer behalten.',
      name:'Deutsch', go:'Auf Etsy öffnen', soon:'Bald verfügbar',
      sub:'Sicher Ausgeben — Budget-Planer für ADHS',
      hint:'Sofort-Download · kein Abo · <a href="../demo/">zurück zur Demo</a>',
      rtxt:'Du wirst zu Etsy weitergeleitet …'},
  fr:{bt:'Planificateur', h1:'Obtenir la version complète',
      lead:'Tu connais déjà la démo. La version complète s’achète sur Etsy — un seul paiement, à toi pour toujours.',
      name:'Français', go:'Ouvrir sur Etsy', soon:'Bientôt disponible',
      sub:'Reste à dépenser — planificateur TDAH',
      hint:'Téléchargement immédiat · sans abonnement · <a href="../demo/">retour à la démo</a>',
      rtxt:'Redirection vers Etsy …'},
  en:{bt:'Budget Planner', h1:'Get the full version',
      lead:'You already know the demo. The full version is on Etsy — pay once, keep it forever.',
      name:'English', go:'Open on Etsy', soon:'Coming soon',
      sub:'Safe to Spend — ADHD budget planner',
      hint:'Instant download · no subscription · <a href="../demo/">back to the demo</a>',
      rtxt:'Taking you to Etsy …'}
};
var FLAG = {de:'🇩🇪', fr:'🇫🇷', en:'🇬🇧'};
var LINKS = window.LINKS || {}, SHOP = window.SHOP || '';

function pick(){
  var q = (location.search.match(/[?&]l=([a-z]{2})/i)||[])[1];
  if(q && T[q.toLowerCase()]) return q.toLowerCase();
  var n = (navigator.language||'de').slice(0,2).toLowerCase();
  return T[n] ? n : 'de';
}
var L = pick(), t = T[L];
document.documentElement.lang = L;
document.getElementById('bt').textContent = t.bt;
document.getElementById('h1').textContent = t.h1;
document.getElementById('lead').textContent = t.lead;
document.getElementById('hint').innerHTML = t.hint;
document.title = 'Safe to Spend — ' + t.h1;

var rows = document.getElementById('rows');
['de','fr','en'].forEach(function(k){
  var url = (LINKS[k]||'').trim(), on = !!url;
  var a = document.createElement('a');
  a.className = 'row' + (on ? '' : ' soon');
  a.href = on ? url : (SHOP || '#');
  if(on || SHOP){ a.target = '_blank'; a.rel = 'noopener'; }
  a.innerHTML = '<span class="flag">'+FLAG[k]+'</span>'
    + '<span><span class="rn">'+T[k].name+'</span><br><span class="rs">'+T[k].sub+'</span></span>'
    + '<span class="go">'+(on ? t.go : t.soon)+' →</span>';
  rows.appendChild(a);
});

/* direct hit from the app: send them straight to their listing */
var direct = (location.search.match(/[?&]l=([a-z]{2})/i)||[])[1];
if(direct && (LINKS[direct.toLowerCase()]||'').trim()){
  document.getElementById('main').style.display = 'none';
  document.getElementById('redir').style.display = 'block';
  document.getElementById('rtxt').innerHTML = t.rtxt
    + '<br><a href="'+LINKS[direct.toLowerCase()]+'" style="color:var(--green)">'+t.go+'</a>';
  setTimeout(function(){ location.replace(LINKS[direct.toLowerCase()]); }, 900);
}
</script>
</body>
</html>
