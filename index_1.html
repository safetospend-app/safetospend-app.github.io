:root{
  --bg:#F6F2EA;--surface:#fff;--surface2:#FCFAF5;--inset:#F3EFE6;--ink:#1A2A30;--ink2:#3D5158;--muted:#77878D;
  --line:#E8E1D4;--green:#127A62;--green-s:#DCEFE7;--green-b:#A9D9C7;--amber:#B57813;--amber-s:#FAEEDA;
  --rose:#BE4F3B;--rose-s:#FAE3DD;--lilac:#6155A8;--lilac-s:#E9E6F7;
  --shadow:0 1px 2px rgba(26,42,48,.04),0 8px 24px -12px rgba(26,42,48,.14);
  --shadow-lg:0 2px 4px rgba(26,42,48,.05),0 30px 60px -28px rgba(26,42,48,.34);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1418;--surface:#161E23;--surface2:#1B252B;--inset:#111A1F;--ink:#EDF3F2;--ink2:#C3D0D3;--muted:#8DA0A8;
  --line:#25333A;--green:#4CCCA1;--green-s:#122F29;--green-b:#1F5449;--amber:#E8B75F;--amber-s:#302614;
  --rose:#F08A6E;--rose-s:#331E19;--lilac:#A79EF0;--lilac-s:#221F3A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.45),0 30px 60px -28px rgba(0,0,0,.85);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
header{padding:22px 0;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--green),#2AA98B);display:grid;place-items:center;box-shadow:0 6px 14px -6px var(--green)}
.bn{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.1}
.bt{font-size:11px;color:var(--muted)}
.langsel{margin-left:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:var(--shadow)}
.langsel button{border:0;background:none;padding:5px 11px;border-radius:8px;font:inherit;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer}
.langsel button.on{background:var(--green);color:#fff}
html[data-theme] .langsel button.on{color:#fff}

.hero{padding:44px 0 30px;text-align:center}
.tagpill{display:inline-flex;align-items:center;gap:7px;background:var(--green-s);color:var(--green);border:1px solid var(--green-b);
  padding:5px 13px;border-radius:20px;font-size:11.5px;font-weight:500;margin-bottom:20px}
h1{font-size:clamp(28px,5.2vw,50px);font-weight:700;letter-spacing:-1.6px;line-height:1.08;max-width:17ch;margin:0 auto 16px}
h1 em{font-style:normal;color:var(--green)}
.lead{font-size:clamp(14px,2vw,17px);color:var(--ink2);max-width:56ch;margin:0 auto 26px}
.cta{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:14px;padding:14px 24px;font:inherit;font-size:14px;
  font-weight:500;cursor:pointer;text-decoration:none;background:var(--green);color:#fff;box-shadow:0 14px 26px -14px var(--green)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.note{font-size:11.5px;color:var(--muted)}

.shotwrap{margin:34px 0 10px;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--line);background:var(--surface)}
.shotwrap img{display:block;width:100%;height:auto}
.shots{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.shots figure{border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.shots img{display:block;width:100%;height:auto}

section{padding:44px 0}
h2{font-size:clamp(21px,3.2vw,30px);font-weight:700;letter-spacing:-.9px;margin-bottom:10px}
.sub{color:var(--muted);margin-bottom:26px;max-width:60ch}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.feat .fi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;font-size:18px}
.feat h3{font-size:14.5px;font-weight:700;margin-bottom:6px;letter-spacing:-.2px}
.feat p{font-size:13px;color:var(--ink2)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.step{background:var(--surface2);border:1px dashed var(--line);border-radius:18px;padding:20px}
.step b{display:grid;place-items:center;width:26px;height:26px;border-radius:9px;background:var(--green);color:#fff;font-size:12px;margin-bottom:10px}
.step h3{font-size:13.5px;font-weight:700;margin-bottom:5px}
.step p{font-size:12.5px;color:var(--ink2)}
.faq{display:grid;gap:10px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 19px;box-shadow:var(--shadow)}
.qa h3{font-size:13.5px;font-weight:700;margin-bottom:5px}
.qa p{font-size:13px;color:var(--ink2)}
.final{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:38px 28px;text-align:center;box-shadow:var(--shadow-lg)}
footer{padding:28px 0 44px;text-align:center;color:var(--muted);font-size:11.5px}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.badge{background:var(--inset);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11.5px;color:var(--ink2)}
@media(max-width:720px){ .shots{grid-template-columns:1fr} }
</style>
</head>
