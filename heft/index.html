:root{
  --bg:#EAE3D8;--surface:#FBF9F5;--surface2:#F6F2EA;--inset:#F1EBE1;
  --ink:#2E2924;--ink2:#5A5149;--muted:#95897B;--line:#E2D9CB;
  --accent:#8A6A4B;
  --green:#6E7F63;--green-s:#E8EBE2;--green-b:#C3CCB8;--amber:#A87F3E;--amber-s:#F5ECDB;
  --rose:#9A5C4C;--rose-s:#F3E4DF;--lilac:#7B6E82;--lilac-s:#EDE8EE;
  --shadow:none;
  --shadow-lg:0 22px 54px -30px rgba(60,48,36,.5);
  --script:Sacramento,"Segoe Script",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1815;--surface:#262320;--surface2:#2C2925;--inset:#211E1B;
  --ink:#EFE9E0;--ink2:#CFC6B9;--muted:#9A9086;--line:#3A342E;
  --accent:#C8A57C;
  --green:#8FA07F;--green-s:#242A21;--green-b:#3E4A38;--amber:#C79A55;--amber-s:#2E2519;
  --rose:#C08272;--rose-s:#2E211D;--lilac:#A99BB0;--lilac-s:#272330;
  --shadow:none;
  --shadow-lg:0 22px 54px -30px rgba(0,0,0,.85);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Jost,"Futura","Century Gothic","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.6;font-weight:300;-webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:1020px;margin:0 auto;padding:0 22px}
header{padding:26px 0;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:0;background:var(--accent);display:grid;place-items:center;box-shadow:none;color:var(--surface)}
.bn{font-size:12px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;line-height:1.2}
.bt{font-family:var(--script);font-size:16px;color:var(--muted);line-height:1.1;margin-top:1px}
.langsel{margin-left:auto;display:flex;background:none;border:1px solid var(--line);border-radius:0;padding:0;box-shadow:none}
.langsel button{border:0;background:none;padding:7px 11px;border-radius:0;font:inherit;font-size:9.5px;font-weight:400;
  letter-spacing:.16em;color:var(--muted);cursor:pointer}
.langsel button.on{background:var(--ink);color:var(--surface)}
html[data-theme] .langsel button.on{color:var(--surface)}

.hero{padding:56px 0 30px;text-align:center}
.tagpill{display:inline-flex;align-items:center;gap:7px;background:none;color:var(--muted);border:1px solid var(--line);
  padding:5px 14px;border-radius:0;font-size:9.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;margin-bottom:26px}
h1{font-size:clamp(26px,4.6vw,44px);font-weight:200;letter-spacing:.02em;line-height:1.18;max-width:19ch;margin:0 auto 18px;text-wrap:balance}
h1 em{font-style:normal;font-family:var(--script);font-size:1.15em;font-weight:400;color:var(--accent);letter-spacing:0}
.lead{font-size:clamp(14px,2vw,16px);color:var(--muted);max-width:58ch;margin:0 auto 30px;line-height:1.75}
.cta{display:flex;gap:0;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--ink);border-radius:0;padding:15px 26px;font:inherit;
  font-size:10px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;text-decoration:none;
  background:var(--ink);color:var(--bg);box-shadow:none;margin-left:-1px}
.btn:first-child{margin-left:0}
.btn:hover{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:none;color:var(--ink);border-color:var(--ink)}
.note{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.shotwrap{margin:40px 0 12px;border-radius:0;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--line);background:var(--surface)}
.shotwrap img{display:block;width:100%;height:auto}
.shots{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:12px}
.shots figure{border-radius:0;overflow:hidden;border:1px solid var(--line);box-shadow:none;background:var(--surface)}
.shots img{display:block;width:100%;height:auto}

section{padding:52px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(15px,2.4vw,20px);font-weight:400;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;line-height:1.5}
.sub{color:var(--muted);margin-bottom:30px;max-width:60ch;font-size:14px;line-height:1.75}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:0}
.feat{background:none;border:1px solid var(--line);border-radius:0;padding:24px;box-shadow:none;margin:0 -1px -1px 0}
.feat .fi{width:34px;height:34px;border-radius:0;border:1px solid var(--line);display:grid;place-items:center;margin-bottom:16px;font-size:16px;background:none!important}
.feat h3{font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;color:var(--muted)}
.feat p{font-size:13.5px;color:var(--ink2);line-height:1.75}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0}
.step{background:none;border:1px solid var(--line);border-radius:0;padding:24px;margin:0 -1px -1px 0}
.step b{display:grid;place-items:center;width:24px;height:24px;border-radius:0;background:none;border:1px solid var(--accent);
  color:var(--accent);font-size:11px;margin-bottom:14px;font-weight:400}
.step h3{font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;color:var(--muted)}
.step p{font-size:13px;color:var(--ink2);line-height:1.75}
.faq{display:grid;gap:0}
.qa{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:20px 0;box-shadow:none}
.qa:last-child{border-bottom:1px solid var(--line)}
.qa h3{font-size:13.5px;font-weight:400;margin-bottom:7px}

le?", "Sicherung speichern, auf dem neuen Gerät laden. Eine Datei, fertig."]], "ch": "Probier es aus, bevor du zahlst.", "cs": "Die Demo ist das komplette Heft mit Beispieldaten. Nichts gesperrt.", "badges": ["Deutsch · Français · English", "13 Währungen", "Offline", "Kein Abo"], "foot": "Deine Zahlen bleiben bei dir."}, "fr": {"brand": "Le Carnet", "brandsub": "Carnet de budget", "pill": "Le planner papier, en numérique", "h1": "Douze mois, <em>un carnet</em>.", "lead": "Chaque mois a son onglet sur le bord de la page. Tu appuies, tu tournes la page. En dessous, le carnet calcule ce que tu peux dépenser sans risque aujourd’hui — loyer, factures et objectifs déjà mis de côté.", "ctaDemo": "Ouvrir la démo — gratuit", "ctaBuy": "Obtenir la version complète", "notes": "Sans compte · sans abonnement · hors ligne · Deutsch, Français, English", "fh": "Pourquoi un carnet et pas un tableur", "fs": "Un planner qu’on feuillette, pas un logiciel de comptabilité.", "feats": [["📑", "Onglets des mois", "Douze onglets sur le bord de la page. Le mois ouvert avance et se fond dans la page — comme dans un planner papier."], ["🤎", "Un seul chiffre", "En haut : ce qui reste aujourd’hui. Pas vingt chiffres. Un."], ["⚡", "« Maintenant »", "Une seule prochaine action, au lieu d’une liste qui paralyse."], ["⏱", "Saisie en 3 secondes", "Un montant, une catégorie, c’est fait. Aucun formulaire, aucun champ obligatoire."], ["🧠", "Vide-tête", "Tout ce qui coûte et tourne en boucle dans ta tête — écris-le. Sans chiffres, sans pression."], ["🌙", "Mode focus et mode sombre", "Trop de choses à l’écran ? Un clic, et il n’en reste qu’une."]], "sh": "Prêt en trois minutes", "ss": "Pas de marathon de configuration.", "steps": [["Ouvrir", "Un clic sur le lien. Un navigateur suffit — Windows, Mac, iPhone, Android."], ["Quatre questions", "Langue, prénom, solde, jour de paie. L’installation est finie."], ["Installer", "« Installer comme app » — fenêtre dédiée, icône, hors ligne."]], "qh": "Questions fréquentes", "faq": [["Faut-il un compte ?", "Non. Aucune inscription, aucun mot de passe, aucun abonnement. Tes chiffres restent sur ton appareil."], ["Ça marche sur mon appareil ?", "Partout où il y a un navigateur. Installable comme app sur ordinateur et téléphone."], ["Mes données sont-elles en sécurité ?", "Elles ne quittent jamais ton appareil. Il n’y a aucun serveur. Sauvegarde en un fichier quand tu veux."], ["Et si je change d’appareil ?", "Tu enregistres la sauvegarde et tu la charges ailleurs. Un fichier, c’est tout."]], "ch": "Essaie avant de payer.", "cs": "La démo, c’est le carnet complet avec des données d’exemple. Rien n’est bloqué.", "badges": ["Deutsch · Français · English", "13 devises", "Hors ligne", "Sans abonnement"], "foot": "Tes chiffres restent chez toi."}, "en": {"brand": "The Monthly", "brandsub": "Budget Notebook", "pill": "A paper planner, made digital", "h1": "Twelve months, <em>one notebook</em>.", "lead": "Every month has its own tab on the edge of the page. Tap it, turn the page. Underneath, the notebook works out what is safe to spend today — rent, bills and goals already set aside.", "ctaDemo": "Open the demo — free", "ctaBuy": "Get the full version", "notes": "No account · no subscription · offline · Deutsch, Français, English", "fh": "Why a notebook and not a spreadsheet", "fs": "A planner you leaf through, not accounting software.", "feats": [["📑", "Month tabs", "Twelve tabs down the edge of the page. The open month steps forward and joins the page — the way a paper planner does."], ["🤎", "One single number", "At the top: what is left today. Not twenty numbers. One."], ["⚡", "“Right now”", "Only ever one next step, instead of a list that freezes you."], ["⏱", "Log it in 3 seconds", "Type an amount, tap a category, done. No form, no required fields."], ["🧠", "Brain dump", "Everything money-ish looping in your head — drop it here. No numbers, no pressure."], ["🌙", "Focus mode and dark mode", "Too much on screen? One click and only one thing is left."]], "sh": "Running in three minutes", "ss": "No setup marathon.", "steps": [["Open it", "Click the link. A browser is all you need — Windows, Mac, iPhone, Android."], ["Four questions", "Language, name, balance, payday. That was the setup."], ["Install it", "“Install as an app” — own window, own icon, works offline."]], "qh": "Common questions", "faq": [["Do I need an account?", "No. No sign-up, no password, no subscription. Your numbers stay on your device."], ["Will it run on my device?", "Anywhere with a browser. Installable as an app on desktop and phone."], ["Is my data safe?", "It never leaves your device. There is no server. Save a backup file whenever you want."], ["What if I switch devices?", "Save the backup, load it on the new device. One file, done."]], "ch": "Try it before you pay.", "cs": "The demo is the complete notebook with sample data. Nothing is locked.", "badges": ["Deutsch · Français · English", "13 currencies", "Offline", "No subscription"], "foot": "Your numbers stay with you."}};
function paint(l){
  const d = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll('[data-k]').forEach(el=>{
    const k = el.getAttribute('data-k').replace(/2$/,'');
    if(d[k]!=null) el.innerHTML = d[k];
  });
  document.getElementById('feats').innerHTML = d.feats.map(([i,h,p])=>
    '<div class="feat"><div class="fi">'+i+'</div><h3>'+h+'</h3><p>'+p+'</p></div>').join('');
  document.getElementById('steps').innerHTML = d.steps.map(([h,p],n)=>
    '<div class="step"><b>'+(n+1)+'</b><h3>'+h+'</h3><p>'+p+'</p></div>').join('');
  document.getElementById('faq').innerHTML = d.faq.map(([q,a])=>
    '<div class="qa"><h3>'+q+'</h3><p>'+a+'</p></div>').join('');
  document.getElementById('badges').innerHTML = d.badges.map(b=>'<span class="badge">'+b+'</span>').join('');
  document.querySelectorAll('.langsel button').forEach(b=> b.classList.toggle('on', b.dataset.l===l));
  try{ localStorage.setItem('heft.lang', l); }catch(e){}
}
document.querySelectorAll('.langsel button').forEach(b=> b.onclick = ()=> paint(b.dataset.l));
let start = 'de';
try{ start = localStorage.getItem('heft.lang') || ((navigator.language||'de').slice(0,2)); }catch(e){}
paint(['de','fr','en'].includes(start)? start : 'en');
</script>
