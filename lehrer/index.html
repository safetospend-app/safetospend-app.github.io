/* Layout: paper-planner app — left index rail (desktop) / bottom tabs (phone), work surface on a cool paper ground.
   Concept: fountain-pen ink blue for actions, correction-pen red for warnings, highlighter colours for categories. */
:root {
  --bg: #F3F4F8;
  --surface: #FFFFFF;
  --surface-2: #F8F9FC;
  --ink: #1D2232;
  --muted: #646B82;
  --line: #E1E4EE;
  --line-2: #EDEFF5;
  --accent: #2648D8;        /* royal blue ink */
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EBFF;
  --red: #D93B41;           /* correction pen */
  --red-soft: #FDE8E8;
  --green: #1F9D63;
  --green-soft: #E2F6EC;
  --amber: #C27A06;
  --amber-soft: #FFF3D6;
  --hl: #FFE45C;            /* highlighter */
  --hol: #FFF1C9;           /* holiday tint */
  --hol-ink: #8A5A00;
  --pub: #FFE1E1;
  --pub-ink: #A3262C;
  --weekend: #F1F2F7;
  --shadow: 0 1px 2px rgba(20, 26, 50, .06), 0 4px 16px rgba(20, 26, 50, .06);
  --shadow-lg: 0 10px 40px rgba(20, 26, 50, .18);
  --paper: #FFFFFF;
  --paper-line: #C9D3EE;
  --paper-red: #F2A6A6;
  --f-display: 'Bricolage Grotesque', 'Nunito Sans', system-ui, sans-serif;
  --f-body: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-hand: 'Caveat', 'Patrick Hand', 'Comic Sans MS', cursive;
  --r: 12px;
  --r-sm: 8px;
  --side: 252px;
  --fs: 15px;
  /* planner index tabs: muted paper colours */
  --tab-ink: #3B3530;
  --tab1: #D9A79B; --tab2: #EFD9CF; --tab3: #AAA67B; --tab4: #CACEA4; --tab5: #D9D6CF; --tab6: #F2B63A; --tab7: #F4C28F; --tab8: #F0CFC9; --tab9: #E8E0DB;
  --rh: #9DB3AE; --rt1: #BCD7DF; --rt2: #EBA79E; --rt3: #C9C2E3;
  --rm8: #F2B8A8; --rm9: #F3D2C4; --rm10: #CF8166; --rm11: #DDB08E; --rm12: #EAE0D6; --rm1: #A9A77E; --rm2: #C8CCA0; --rm3: #D2D1CC; --rm4: #F2B42B; --rm5: #F6C77E; --rm6: #F0C3BE; --rm7: #EEDFDA;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141B; --surface: #1B1E28; --surface-2: #20242F; --ink: #ECEEF6; --muted: #9CA2B8; --line: #2E3342; --line-2: #262A37;
    --accent: #8098FF; --accent-ink: #0E1330; --accent-soft: #232B52; --red: #FF7378; --red-soft: #3A1F24; --green: #4FD394; --green-soft: #183326;
    --amber: #F3B54A; --amber-soft: #3A2E15; --hl: #8F7B12; --hol: #3A3218; --hol-ink: #F3D27A; --pub: #3D2024; --pub-ink: #FFA3A7; --weekend: #171A23;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5);
    --paper: #1F2330; --paper-line: #39415A; --paper-red: #6B3438; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141B; --surface: #1B1E28; --surface-2: #20242F; --ink: #ECEEF6; --muted: #9CA2B8; --line: #2E3342; --line-2: #262A37;
  --accent: #8098FF; --accent-ink: #0E1330; --accent-soft: #232B52; --red: #FF7378; --red-soft: #3A1F24; --green: #4FD394; --green-soft: #183326;
  --amber: #F3B54A; --amber-soft: #3A2E15; --hl: #8F7B12; --hol: #3A3218; --hol-ink: #F3D27A; --pub: #3D2024; --pub-ink: #FFA3A7; --weekend: #171A23;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5);
  --paper: #1F2330; --paper-line: #39415A; --paper-red: #6B3438; color-scheme: dark;
}
html, body { height: 100%; }
svg[aria-hidden] { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--fs); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 800; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: .85em; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Shell ---------- */
#app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); }
.brand { position: relative; padding: 18px 18px 14px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line-2); }
.brand-mark { width: 40px; height: 40px; border-radius: 10px; background-size: cover; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.brand b { font-family: var(--f-display); font-size: 1.05rem; display: block; line-height: 1.15; }
.brand span { font-size: .78rem; color: var(--muted); }
.nav { padding: 8px 10px 20px; display: flex; flex-direction: column; gap: 1px; }
.nav-h { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; padding: 14px 10px 4px; }
.nav-i { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; cursor: pointer; text-align: left; font-weight: 600; font-size: .93rem; color: var(--ink); position: relative; }
.nav-i svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.nav-i:hover { background: var(--surface-2); }
.nav-i.on { background: var(--accent-soft); color: var(--accent); }
.nav-i.on svg { color: var(--accent); }
.nav-i .tab { position: absolute; right: -10px; top: 6px; bottom: 6px; width: 5px; border-radius: 4px 0 0 4px; }
.nav-i .badge { margin-left: auto; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top-in { display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); min-height: 64px; }
.top h1 { font-size: 1.45rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .acts { display: flex; gap: 8px; flex-wrap: nowrap; }
.content { padding-block: 18px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); flex: 1; min-width: 0; }
.mob-only { display: none !important; }
.bnav { display: none; }
@media (max-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mob-only { display: inline-flex !important; }
  .desk-only { display: none !important; }
  .top-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; min-height: 56px; }
  .top h1 { font-size: 1.22rem; }
  .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .bnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .bnav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; font-weight: 700; color: var(--muted); padding: 4px 0; cursor: pointer; min-width: 0; }
  .bnav button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bnav svg { width: 22px; height: 22px; }
  .bnav button.on { color: var(--accent); }
}

/* ---------- Planner tabs ---------- */
.ptabs { display: flex; align-items: flex-end; gap: 0; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.ptabs::-webkit-scrollbar, .rail::-webkit-scrollbar { display: none; }
.pt { position: relative; flex: none; border: 0; cursor: pointer; background: var(--tc); color: var(--tab-ink); font-family: var(--f-body); font-weight: 800; font-size: .64rem; letter-spacing: .16em; text-transform: uppercase; height: 30px; padding: 0 18px; margin-right: -5px; border-radius: 10px 10px 0 0; box-shadow: inset 0 -6px 8px -6px rgba(60, 40, 20, .18), -1px 0 0 rgba(60, 40, 20, .08); transition: height .15s, transform .15s; white-space: nowrap; }
.pt:hover { height: 33px; }
.pt.ico { padding: 0 14px; }
.pt.ico svg { width: 15px; height: 15px; vertical-align: -3px; }
.pt.on { height: 36px; z-index: 2; box-shadow: 0 -2px 6px rgba(60, 40, 20, .12); }
.pt:first-child { margin-left: -4px; }
.rail { position: fixed; z-index: 25; right: env(safe-area-inset-right, 0px); top: calc(env(safe-area-inset-top, 0px) + 14px); bottom: 14px; width: 34px; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; }
.rt { flex: 1 1 0; min-height: 30px; border: 0; cursor: pointer; background: var(--tc); color: var(--tab-ink); border-radius: 0 9px 9px 0; margin-bottom: -3px; display: grid; place-items: center; box-shadow: inset 6px 0 8px -6px rgba(60, 40, 20, .2), 0 1px 0 rgba(60, 40, 20, .08); transition: transform .15s, width .15s; width: 30px; padding: 0; }
.rt span { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 800; font-size: .6rem; letter-spacing: .16em; white-space: nowrap; }
.rt svg { width: 14px; height: 14px; }
.rt:hover { width: 33px; }
.rt.on { width: 34px; z-index: 2; box-shadow: 2px 0 6px rgba(60, 40, 20, .18); }
.rt:first-child { border-radius: 9px 9px 9px 0; }
.rt:last-child { margin-bottom: 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pt, :root:not([data-theme="light"]) .rt { filter: brightness(.86) saturate(.9); } }
:root[data-theme="dark"] .pt, :root[data-theme="dark"] .rt { filter: brightness(.86) saturate(.9); }
@media (min-width: 721px) { .main { padding-right: 36px; } }
@media (max-width: 720px) { .rail { display: none; } .ptabs { padding-left: max(12px, env(safe-area-inset-left, 0px)); } .pt { padding: 0 13px; } }
@media print { .ptabs, .rail { display: none !important; } .main { padding-right: 0 !important; } }

.demobar { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; background: var(--accent); color: var(--accent-ink); font-size: .8rem; font-weight: 700; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.demobar a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: .9rem; cursor: pointer; white-space: nowrap; color: var(--ink); text-decoration: none; min-height: 38px; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--red); }
.btn.danger.solid { background: var(--red); color: #fff; border-color: var(--red); }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: .84rem; }
.ibtn { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); flex: none; }
.ibtn.ghost { border-color: transparent; background: none; }
.ibtn:hover { background: var(--surface-2); }
.ibtn svg { width: 18px; height: 18px; }
.ibtn.sm { width: 30px; height: 30px; border-radius: 8px; }
.ibtn.sm svg { width: 15px; height: 15px; }
input[type=text], input[type=search], input[type=date], input[type=time], input[type=number], input[type=password], input[type=url], input[type=email], input[type=tel], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 11px; min-height: 40px; font-size: max(16px, .95rem); }
textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex: none; }
input[type=color] { width: 44px; height: 38px; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.fgrid .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .fgrid { grid-template-columns: minmax(0, 1fr); } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: .86rem; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.c { --c: var(--accent); background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: color-mix(in srgb, var(--c) 72%, var(--ink)); border-color: color-mix(in srgb, var(--c) 30%, var(--surface)); }
.chip.ok { background: var(--green-soft); color: var(--green); border-color: transparent; }
.chip.warn { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.chip.bad { background: var(--red-soft); color: var(--red); border-color: transparent; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: #fff; font-size: .7rem; font-weight: 800; display: inline-grid; place-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; background: var(--c, var(--accent)); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.swatch.on { box-shadow: 0 0 0 2.5px var(--ink); }

/* ---------- Cards / sections ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.card-h h2, .card-h h3 { flex: 1; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.dash > .w4 { grid-column: span 4; } .dash > .w5 { grid-column: span 5; } .dash > .w7 { grid-column: span 7; } .dash > .w8 { grid-column: span 8; } .dash > .w6 { grid-column: span 6; } .dash > .w12 { grid-column: span 12; }
@media (max-width: 1100px) { .dash > .w4, .dash > .w5, .dash > .w7, .dash > .w8, .dash > .w6 { grid-column: span 6; } }
@media (max-width: 720px) { .dash > * { grid-column: 1 / -1 !important; } }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--surface); }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 1.05rem; margin-bottom: 4px; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line-2); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .grow > * { overflow: hidden; text-overflow: ellipsis; }
.li.click { cursor: pointer; border-radius: 8px; padding-inline: 8px; margin-inline: -8px; }
.li.click:hover { background: var(--surface-2); }
.li .t { font-weight: 700; }
.li.done .t { text-decoration: line-through; color: var(--muted); }
.kpi { font-family: var(--f-display); font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.hero { position: relative; border-radius: 16px; overflow: hidden; min-height: 150px; display: flex; align-items: flex-end; background-size: cover; background-position: center; border: 1px solid var(--line); }
.hero-in { position: relative; margin: 14px; background: var(--surface); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); max-width: calc(100% - 28px); }
.hero-in .hand { font-family: var(--f-hand); font-size: 1.5rem; line-height: 1; color: var(--accent); }
.countdown { display: flex; align-items: baseline; gap: 8px; }
.lesson { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); border-left: 5px solid var(--c, var(--line)); background: var(--surface); cursor: pointer; }
.lesson:hover { background: var(--surface-2); }
.lesson .p { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; line-height: 1; }
.lesson .p small { display: block; font-family: var(--f-body); font-size: .7rem; color: var(--muted); font-weight: 600; margin-top: 3px; }
.lesson .ttl { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lesson .sub { color: var(--muted); font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Tables ---------- */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .92rem; }
.tbl th, .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: middle; }
.tbl th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover td { background: var(--surface-2); }
.tbl td.wrap { white-space: normal; min-width: 160px; }
.tbl .r { text-align: right; }
.tbl tr.done td { color: var(--muted); }
.tbl tr.done td.t { text-decoration: line-through; }
.mobcards { display: none; }
@media (max-width: 720px) {
  .tw.resp { display: none; }
  .mobcards { display: flex; flex-direction: column; gap: 10px; }
}
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.mcard .grow > .t { font-weight: 800; }
.mcard dl { margin: 4px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-size: .86rem; }
.mcard dt { color: var(--muted); }
.mcard dd { margin: 0; overflow-wrap: anywhere; }
.mcard.done .t { text-decoration: line-through; color: var(--muted); }

/* ---------- Modal ---------- */
.ov { position: fixed; inset: 0; z-index: 100; background: rgba(12, 16, 32, .45); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(14px); opacity: 0; } }
.modal { background: var(--surface); border-radius: 16px; width: min(640px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: up .18s; min-width: 0; }
.modal.wide { width: min(920px, 100%); }
.modal.narrow { width: min(420px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.modal-h h2 { flex: 1; min-width: 0; }
.modal-b { padding: 6px 18px 16px; overflow-y: auto; min-height: 0; }
.modal-f { display: flex; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
.modal-f .sp { flex: 1; }
@media (max-width: 600px) {
  .ov { align-items: flex-end; padding: 0; padding-top: max(24px, env(safe-area-inset-top, 0px)); }
  .modal, .modal.wide, .modal.narrow { width: 100%; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
.toast-w { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
@media (max-width: 860px) { .toast-w { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }
.toast { background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: .9rem; box-shadow: var(--shadow-lg); animation: up .2s; pointer-events: auto; display: flex; gap: 10px; align-items: center; }
.toast button { background: none; border: 0; color: var(--hl); font-weight: 800; cursor: pointer; }

/* ---------- Calendar ---------- */
.calbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.calbar .ttl { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; min-width: 0; }
.yr { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 10px 8px; cursor: pointer; }
.mini:hover { border-color: var(--accent); }
.mini h3 { font-size: .95rem; margin-bottom: 6px; padding-left: 4px; }
.mini-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: .72rem; text-align: center; font-variant-numeric: tabular-nums; }
.mini-g .wd { color: var(--muted); font-weight: 800; font-size: .62rem; }
.mini-g .d { padding: 3px 0; border-radius: 5px; position: relative; }
.mini-g .d.we { color: var(--muted); }
.mini-g .d.hol { background: var(--hol); color: var(--hol-ink); }
.mini-g .d.pub { background: var(--pub); color: var(--pub-ink); font-weight: 800; }
.mini-g .d.today { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 800; }
.mini-g .d.ev::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 12px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line-2); gap: 1px; }
.month .wd { background: var(--surface-2); padding: 8px; font-size: .74rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: center; }
.month .c { background: var(--surface); min-height: 108px; padding: 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; position: relative; }
.month .c:hover { background: var(--surface-2); }
.month .c.out { opacity: .4; }
.month .c.we { background: var(--weekend); }
.month .c.hol { background: var(--hol); }
.month .c.pub { background: var(--pub); }
.month .n { font-family: var(--f-display); font-weight: 800; font-size: .95rem; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
.month .c.today .n span { background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 0 6px; }
.month .hn { font-size: .68rem; font-weight: 700; color: var(--hol-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.month .c.pub .hn { color: var(--pub-ink); }
.evc { font-size: .72rem; font-weight: 700; padding: 1px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; --c: var(--accent); background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: color-mix(in srgb, var(--c) 70%, var(--ink)); border-left: 3px solid var(--c); }
.stks { display: flex; gap: 2px; flex-wrap: wrap; margin-top: auto; }
.stks .stk { height: 22px; }
@media (max-width: 720px) {
  .month .c { min-height: 64px; padding: 4px; }
  .month .evc { font-size: 0; height: 6px; padding: 0; border-left-width: 0; border-radius: 3px; background: var(--c); }
  .month .hn { display: none; }
  .month .stks .stk { height: 16px; }
  .month .wd { padding: 6px 2px; font-size: .64rem; }
}

.tbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; position: sticky; top: calc(100px + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--bg); padding: 6px 0; }

  ['#EAF4FF', '#3B82F6', '#F2C230', '#F0544F', '#34B67A'],

function coverSVG(i, w, h) {

  const col = () => pal[1 + Math.floor(R() * 4)];
  const n = Math.round(w * h / 9000);
  if (motif === 'flowers' || motif === 'blooms') {
    for (let k = 0; k < n; k++) {
      const x = R() * w, y = R() * h, r = 10 + R() * (motif === 'blooms' ? 34 : 20), c = col(), pet = motif === 'blooms' ? 8 : 5, rot = R() * 360;
      s += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})">`;
      for (let p = 0; p < pet; p++) s += `<ellipse cx="0" cy="${(-r * .55).toFixed(1)}" rx="${(r * .32).toFixed(1)}" ry="${(r * .55).toFixed(1)}" fill="${c}" opacity=".9" transform="rotate(${(360 / pet * p).toFixed(0)})"/>`;
      s += `<circle r="${(r * .24).toFixed(1)}" fill="${pal[0] === '#1E2240' ? '#FFE07A' : '#fff'}"/></g>`;
    }
  } else if (motif === 'dots') {
    for (let k = 0; k < n * 2; k++) s += `<circle cx="${(R() * w).toFixed(0)}" cy="${(R() * h).toFixed(0)}" r="${(4 + R() * 22).toFixed(0)}" fill="${col()}" opacity="${(.55 + R() * .45).toFixed(2)}"/>`;
  } else if (motif === 'arcs') {
    for (let k = 0; k < n / 2; k++) { const x = R() * w, y = R() * h, r = 24 + R() * 40; for (let j = 0; j < 4; j++) s += `<path d="M${(x - r + j * 9).toFixed(0)} ${y.toFixed(0)} a${(r - j * 9).toFixed(0)} ${(r - j * 9).toFixed(0)} 0 0 1 ${(2 * (r - j * 9)).toFixed(0)} 0" fill="none" stroke="${pal[1 + j]}" stroke-width="7" stroke-linecap="round"/>`; }

    for (let k = 0; k < n * 1.4; k++) { const x = R() * w, y = R() * h, l = 18 + R() * 30; s += `<path transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${(R() * 360).toFixed(0)})" d="M0 0 C ${l * .5} ${-l * .4} ${l} ${-l * .1} ${l} 0 C ${l} ${l * .1} ${l * .5} ${l * .4} 0 0Z" fill="${col()}"/>`; }
  } else if (motif === 'terrazzo') {
    for (let k = 0; k < n * 2.5; k++) { const x = R() * w, y = R() * h, r = 3 + R() * 12; let d = ''; for (let p = 0; p < 5; p++) { const a = p / 5 * 6.283 + R() * .8, rr = r * (.6 + R() * .6); d += (p ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ' ' + (y + Math.sin(a) * rr).toFixed(1); } s += `<path d="${d}Z" fill="${col()}"/>`; }

    for (let y = 0, j = 0; y < h + 40; y += 26, j++) { let d = `M-20 ${y}`; for (let x = -20; x < w + 40; x += 40) d += ` q20 -14 40 0`; s += `<path d="${d}" fill="none" stroke="${pal[1 + j % 4]}" stroke-width="7" stroke-linecap="round" opacity=".85"/>`; }

/* ---------- Lessons from timetable ---------- */
function ttCell(termId, wd, p) { return ((S.tt[termId] || {})[wd + '-' + p]) || null; }
function lessonsOn(iso) {
  const tm = termOf(iso); if (!tm || !isSchoolDay(iso)) return [];
  const wd = dow(iso), out = [];
  S.settings.periods.forEach((per, p) => { const c = ttCell(tm.id, wd, p); if (c && (c.cls || c.label)) { const key = iso + '|' + p; out.push({ p, per, cell: c, key, plan: S.lessons[key], c: cls(c.cls) }); } });
  return out;
}
function lessonColor(c) { return (c && c.c && c.c.color) || '#94A3B8'; }
function lessonTitle(l) { return l.c ? l.c.name + (l.cell.subject || l.c.subject ? ' · ' + (l.cell.subject || l.c.subject) : '') : (l.cell.label || ''); }
const LSTATUS = { planned: ['Planned', ''], done: ['Done', 'ok'], cancelled: ['Cancelled', 'bad'], cover: ['Covered', 'warn'] };

/* ---------- Calendar items ---------- */
function bdaysOn(iso) {
  const md = iso.slice(5), out = [];
  S.classes.forEach(c => c.students.forEach(s => { if (s.bday && s.bday.slice(5) === md) out.push({ name: studentName(s), cls: c }); }));
  (S.lists.bdays || []).forEach(b => { if (b.date && b.date.slice(5) === md) out.push({ name: b.name }); });
  return out;
}
function itemsOn(iso) {
  const out = [];
  S.events.forEach(e => { if (e.date === iso || (e.end && e.date < iso && e.end >= iso)) out.push({ kind: 'ev', o: e, title: e.title, color: (EVT[e.type] || EVT.appt)[1], time: e.time }); });
  S.tests.forEach(x => { if (x.date === iso) out.push({ kind: 'test', o: x, title: (t(TESTKIND[x.kind] || 'Test')) + ': ' + clsName(x.cls) + (x.title ? ' – ' + x.title : ''), color: EVT.test[1] }); });
  S.confs.forEach(x => { if (x.date === iso) out.push({ kind: 'conf', o: x, title: x.title || t('Meeting'), color: EVT.meeting[1], time: x.time }); });
  bdaysOn(iso).forEach(b => out.push({ kind: 'bday', title: '🎂 ' + b.name, color: '#F59E2B' }));
  return out.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
}
function openItem(it) {
  if (it.kind === 'ev') editEvent(it.o); else if (it.kind === 'test') editTest(it.o); else if (it.kind === 'conf') editConf(it.o);
}

const CLS_COLORS = STK_COLORS;
const SCALES = {
  de16: { name: 'Germany 1–6 (with + and −)', low: true, min: .7, max: 6, bad: 4.5, step: 1, sign: .3, hint: '1+ 1 1- 2+ … 6' },
  de15: { name: 'Germany points 0–15', low: false, min: 0, max: 15, bad: 4.5, hint: '0–15' },
  at5: { name: 'Austria 1–5', low: true, min: 1, max: 5, bad: 4.5, sign: .25, hint: '1–5' },
  ch6: { name: 'Switzerland 1–6', low: false, min: 1, max: 6, bad: 4, hint: '6 5.5 5 … 1' },
  fr20: { name: 'France 0–20', low: false, min: 0, max: 20, bad: 10, hint: '0–20' },
  es10: { name: 'Spain 0–10', low: false, min: 0, max: 10, bad: 5, hint: '0–10' },
  it10: { name: 'Italy 1–10', low: false, min: 1, max: 10, bad: 6, sign: .25, hint: '6+ 6½ 7- …' },
  nl10: { name: 'Netherlands 1–10', low: false, min: 1, max: 10, bad: 5.5, hint: '1–10' },
  uk9: { name: 'UK GCSE 9–1', low: false, min: 1, max: 9, bad: 4, hint: '9–1' },
  pct: { name: 'Percent 0–100', low: false, min: 0, max: 100, bad: 50, hint: '0–100' },
  us: { name: 'US letters A–F', low: false, min: 0, max: 100, bad: 60, hint: 'A+ A A- B+ … F or %' }
};
const LETTERS = [['A+', 97], ['A', 94], ['A-', 90], ['B+', 87], ['B', 84], ['B-', 80], ['C+', 77], ['C', 74], ['C-', 70], ['D+', 67], ['D', 64], ['D-', 60], ['F', 50]];
function letterOf(p) { for (const [l, v] of LETTERS) if (p >= v - (v === 97 ? 0 : 0) - .0001 && p >= v) return l; return 'F'; }
function parseGrade(raw, sk) {
  let s = String(raw || '').trim().replace(',', '.').replace('−', '-').replace('½', '.5'); if (!s) return null;
  const sc = SCALES[sk] || SCALES.pct;
  if (sk === 'us') { const up = s.toUpperCase(); const L2 = LETTERS.find(x => x[0] === up); if (L2) return L2[1]; }
  const m = /^(\d+(?:\.\d+)?)\s*([+-])?$/.exec(s); if (!m) return NaN;
  let v = parseFloat(m[1]);
  if (m[2]) { const st = sc.sign || .25; v += (m[2] === '+' ? -1 : 1) * st * (sc.low ? 1 : -1); }

  return v;
}
function fmtGrade(v, sk) { if (v == null || isNaN(v)) return '–'; if (sk === 'us') return Math.round(v) + '% · ' + letterOf(v); const d = ['pct'].includes(sk) ? 0 : 2; return v.toLocaleString(locale(), { minimumFractionDigits: d === 0 ? 0 : 1, maximumFractionDigits: d }); }
function isBad(v, sk) { const sc = SCALES[sk] || SCALES.pct; if (v == null || isNaN(v)) return false; return sc.low ? v >= sc.bad : v < sc.bad; }
const CATS = { w: 'Written', o: 'Oral', x: 'Other' };
function gTerm(c, tid) { c.grades = c.grades || {}; const g = c.grades[tid] = c.grades[tid] || { cols: [], vals: {} }; g.cols.forEach(col => { g.vals[col.id] = g.vals[col.id] || {}; }); return g; }
function studentAvg(c, tid, sid) {
  const g = gTerm(c, tid), sk = c.scale || S.settings.scale; const cat = { w: [0, 0], o: [0, 0], x: [0, 0] };
  g.cols.forEach(col => { const v = parseGrade(g.vals[col.id][sid], sk); if (v != null && !isNaN(v)) { const w = +col.weight || 1; cat[col.cat || 'w'][0] += v * w; cat[col.cat || 'w'][1] += w; } });
  const r = {}; let tw = 0, ts = 0; const W = c.weights || { w: 50, o: 50, x: 0 };
  Object.keys(cat).forEach(k => { r[k] = cat[k][1] ? cat[k][0] / cat[k][1] : null; if (r[k] != null) { const ww = +W[k] || 0; tw += ww; ts += r[k] * ww; } });
  if (!tw) { const all = Object.keys(cat).reduce((a, k) => [a[0] + cat[k][0], a[1] + cat[k][1]], [0, 0]); r.t = all[1] ? all[0] / all[1] : null; } else r.t = ts / tw;
  return r;
}
function colAvg(c, tid, col) { const g = gTerm(c, tid), sk = c.scale || S.settings.scale; let s = 0, n = 0; c.students.forEach(st => { const v = parseGrade(g.vals[col.id][st.id], sk); if (v != null && !isNaN(v)) { s += v; n++; } }); return n ? s / n : null; }

function listArr(k) { return S.lists[k] = S.lists[k] || []; }
function cellVal(def, f, x) {
  const [k, type, , opt = {}] = f; const v = x[k];
  if (v === '' || v == null || v === false) return '';
  if (type === 'date') return `<span class="num" style="white-space:nowrap">${esc(fD(v))}</span>`;
  if (type === 'class') { const c = cls(v); return c ? `<span class="chip c" style="--c:${c.color}">${esc(c.name)}</span>` : ''; }
  if (type === 'select') { const o = opt.opts.find(z => z[0] === v); if (k === 'prio' && v === '1') return `<span class="chip bad">${esc(t('High'))}</span>`; return o ? esc(t(o[1])) : ''; }
  if (type === 'check') return ic('check');
  if (type === 'password') { const sh = UI.showPw[x.id]; return `<span class="row nowrap" style="gap:4px"><code>${sh ? esc(v) : '••••••'}</code><button class="ibtn sm ghost" data-a="pwShow" data-id="${x.id}" aria-label="${esc(t('Show'))}">${ic(sh ? 'eye-off' : 'eye')}</button><button class="ibtn sm ghost" data-a="pwCopy" data-l="${UI.list}" data-id="${x.id}" aria-label="${esc(t('Copy'))}">${ic('copy')}</button></span>`; }
  if (type === 'url') return `<a href="${esc(/^https?:/.test(v) ? v : 'https://' + v)}" target="_blank" rel="noopener" data-stop="1">${esc(cut(v.replace(/^https?:\/\//, ''), 30))}</a>`;
  if (type === 'number') return `<span class="num">${esc(String(v).replace('.', locale().startsWith('en') ? '.' : ','))}</span>`;

function sortList(def, arr) {
  const s = def.sort; if (!s) return arr.slice();
  const desc = s[0] === '-', k = desc ? s.slice(1) : s;
  return arr.slice().sort((a, b) => { const x = a[k] || (desc ? '' : '9999'), y = b[k] || (desc ? '' : '9999'); return desc ? String(y).localeCompare(String(x)) : String(x).localeCompare(String(y)); });
}
function overtimeSum() {
  const ot = listArr('overtime'), subs = listArr('subs'), lm = (S.settings.lessonMin || 45) / 60;
  const tot = ot.reduce((a, x) => a + (+x.hours || 0), 0) + subs.filter(x => x.paid).length * lm;
  const comp = ot.filter(x => x.comp).reduce((a, x) => a + (+x.hours || 0), 0);
  return { tot, comp, open: tot - comp, subsH: subs.filter(x => x.paid).length * lm };
}

function searchRes(q) {
  q = (q || '').trim().toLowerCase(); if (q.length < 2) return `<p class="muted">${esc(t('Type at least 2 letters.'))}</p>`;
  const has = s => String(s || '').toLowerCase().includes(q); const R = [];
  S.classes.forEach(c => { if (has(c.name) || has(c.subject)) R.push(['Classes', c.name + (c.subject ? ' · ' + c.subject : ''), '', `data-a="go" data-p="class" data-x='${JSON.stringify({ cls: c.id, tab: 'students' })}'`]);
    c.students.forEach(s => { if (has(studentName(s)) || has(s.notes) || (s.obs || []).some(o => has(o.text))) R.push(['Students', studentName(s), c.name, `data-a="srStudent" data-c="${c.id}" data-id="${s.id}"`]); }); });
  Object.entries(S.lessons).forEach(([k, l]) => { if (has(l.topic) || has(l.goals) || has(l.notes) || has(l.mat) || has(l.hw)) R.push(['Lessons', l.topic || '…', fDY(k.slice(0, 10)) + ' · ' + clsName(l.cls), `data-a="openLesson" data-k="${k}"`]); });
  S.events.forEach(e => { if (has(e.title) || has(e.note)) R.push(['Dates', e.title, fDY(e.date), `data-a="editEv" data-id="${e.id}"`]); });
  S.tests.forEach(x => { if (has(x.title) || has(x.topics)) R.push(['Tests & exams', x.title || '', clsName(x.cls) + ' · ' + fDY(x.date), `data-a="editTestId" data-id="${x.id}"`]); });
  S.confs.forEach(x => { if (has(x.title) || has(x.notes) || has(x.agenda) || has(x.decisions)) R.push(['Meetings', x.title, fDY(x.date), `data-a="editConf" data-id="${x.id}"`]); });
  S.books.forEach(b => b.pages.forEach((p, i) => { if (has(p.text) || has(b.title)) R.push(['Notebooks', b.title + ' · ' + (i + 1), cut(p.text, 60), `data-a="srPage" data-b="${b.id}" data-id="${p.id}"`]); }));
  S.pins.forEach(p => { if (has(p.title) || has(p.text)) R.push(['Pinboard', p.title || cut(p.text, 40), '', `data-a="editPin" data-id="${p.id}"`]); });
  Object.keys(LISTS).forEach(k => listArr(k).forEach(x => { if (LISTS[k].f.some(f => f[1] !== 'password' && f[1] !== 'photo' && has(x[f[0]]))) { const f0 = LISTS[k].f[0][0]; R.push([LISTS[k].t, x[f0], '', `data-a="listEdit" data-l="${k}" data-id="${x.id}"`]); } }));
  Object.entries(S.daynotes).forEach(([d, v]) => { if (has(v)) R.push(['Notes', cut(v, 60), fDY(d), `data-a="srDay" data-d="${d}"`]); });
  if (!R.length) return `<p class="muted">${esc(t('Nothing found.'))}</p>`;
  const groups = {}; R.forEach(r => (groups[r[0]] = groups[r[0]] || []).push(r));
  return Object.entries(groups).map(([g, rs]) => `<h3 style="margin:14px 0 6px">${esc(t(g))} <span class="muted small">${rs.length}</span></h3><div class="card" style="padding:4px 14px"><div class="list">${rs.slice(0, 30).map(r => `<div class="li click" ${r[3]}><div class="grow"><div class="t">${hl(r[1], q)}</div>${r[2] ? `<div class="small muted">${hl(r[2], q)}</div>` : ''}</div>${ic('chevron-right', 'muted')}</div>`).join('')}</div></div>`).join('');
}

function hashPin(p) { let h = 2166136261; for (const ch of 'tb:' + p) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function splitTerms(n) {
  const a = S.settings.yearStart, b = S.settings.yearEnd, len = diffD(a, b) + 1, out = [];
  let start = a;
  for (let i = 0; i < n; i++) {
    let end = b;
    if (i < n - 1) { let cut = addD(a, Math.round(len * (i + 1) / n)); const m1 = monthStart(cut), m2 = addM(cut, 1); cut = diffD(m1, cut) < diffD(cut, m2) ? m1 : m2; end = addD(cut, -1); }
    out.push({ id: 't' + (i + 1), start, end }); start = addD(end, 1);
  }
  S.settings.terms = out;
}

/* ---------- Migration & Init ---------- */
function migrate(d) {
  const base = newState(d.settings.lang || 'en', d.settings.country || 'US');
  Object.keys(base).forEach(k => { if (d[k] === undefined) d[k] = base[k]; });
  Object.keys(base.settings).forEach(k => { if (d.settings[k] === undefined) d.settings[k] = base.settings[k]; });
  return d;
}
