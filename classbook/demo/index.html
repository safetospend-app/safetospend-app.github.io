@font-face{font-family:'Fredoka';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/fredoka-500.woff2') format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/fredoka-600.woff2') format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/fredoka-700.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/figtree-400.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/figtree-500.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/figtree-600.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/figtree-700.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:800;font-display:swap;src:url('fonts/figtree-800.woff2') format('woff2')}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: clean white app shell, colorful icon chips per module, one bright "school-bus" hero on Today.
   Brand: navy + school-bus yellow by default; 4 switchable color themes (Settings). */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef1f7; --ink:#1d2433; --muted:#667085; --line:#e3e8f0;
  --p-accent:#2b3a67; --p-accent-d:#93a8f0; --p-hi:#ffc83d; --p-hi-soft:#fff4d1;
  --accent:var(--p-accent); --accent-ink:#ffffff; --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --hi:var(--p-hi); --hi-ink:#1d2433; --hi-soft:var(--p-hi-soft);
  --red:#e0483e; --red-soft:#fde6e3; --ok:#18a058; --ok-soft:#ddf5e7; --late:#d98a0b; --late-soft:#fdf0d5;
  --margin:#f3a7a1; --on-solid:#ffffff;
  --c-sky:#3b82f6; --c-mint:#16a34a; --c-peach:#f97316; --c-lemon:#eab308; --c-pink:#ec4899; --c-teal:#0d9488; --c-violet:#8b5cf6; --c-red:#ef4444; --c-slate:#64748b;
  --shadow:0 1px 2px rgba(29,36,51,.04),0 6px 20px rgba(29,36,51,.06);
  --f-display:"Fredoka","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
:root[data-palette="berry"]{--p-accent:#c2386e;--p-accent-d:#f28db3;--p-hi:#ffb4cc;--p-hi-soft:#ffe7ef}
:root[data-palette="ocean"]{--p-accent:#126b7d;--p-accent-d:#6fcbdc;--p-hi:#8fdbe6;--p-hi-soft:#dff6f9}
:root[data-palette="sage"]{--p-accent:#4f6f58;--p-accent-d:#a3c7aa;--p-hi:#e9cf86;--p-hi-soft:#f6efd8}
:root[data-palette="coral"]{--p-accent:#d4543c;--p-accent-d:#f59a86;--p-hi:#ffc2a8;--p-hi-soft:#ffe9df}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1f29; --surface-2:#232a36; --ink:#e8ecf4; --muted:#9aa3b5; --line:#2c3442;
  --accent:var(--p-accent-d); --accent-ink:#12151c;
  --hi-soft:color-mix(in srgb,var(--p-hi) 18%,var(--surface));
  --red:#f27a70; --red-soft:#3a2224; --ok:#4fcf8a; --ok-soft:#1b3328; --late:#f0b14a; --late-soft:#3a2f1a;
  --margin:#7e3c39; --on-solid:#12151c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1f29; --surface-2:#232a36; --ink:#e8ecf4; --muted:#9aa3b5; --line:#2c3442;
  --accent:var(--p-accent-d); --accent-ink:#12151c;
  --hi-soft:color-mix(in srgb,var(--p-hi) 18%,var(--surface));
  --red:#f27a70; --red-soft:#3a2224; --ok:#4fcf8a; --ok-soft:#1b3328; --late:#f0b14a; --late-soft:#3a2f1a;
  --margin:#7e3c39; --on-solid:#12151c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4.6vw,34px);line-height:1.15}
h2{font-size:19px}
h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.chipi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.chipi svg{width:19px;height:19px}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 4px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--hi);display:grid;place-items:center;flex:none}
.brand-mark svg{width:24px;height:24px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:19px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;font-weight:600}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .eyebrow{padding:0 8px 4px;font-size:11px}
.navbtn{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);padding:5px 8px;border-radius:12px;text-align:left;font-weight:600}
.navbtn .chipi{width:30px;height:30px;border-radius:9px}
.navbtn .chipi svg{width:17px;height:17px}
.navbtn:hover{background:var(--surface-2)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.side-foot b{color:var(--ink);font-weight:700;display:block}
.me{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}

.main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.pagehead p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.topbar,.tabbar{display:none}

/* hero (Today) */
.hero{position:relative;overflow:hidden;background:var(--hi);color:var(--hi-ink);border-radius:22px;padding:26px 28px;display:flex;flex-direction:column;align-items:flex-start;gap:18px;min-height:180px}
.hero .eyebrow{color:color-mix(in srgb,var(--hi-ink) 65%,transparent)}
.hero h1{color:var(--hi-ink)}
.hero p{margin:6px 0 0;font-weight:600;color:color-mix(in srgb,var(--hi-ink) 80%,transparent)}
.hero .art{position:absolute;right:24px;bottom:-10px;width:230px;height:170px;pointer-events:none}
.hero .actions{position:relative;z-index:1}
.hero .btn{background:rgba(255,255,255,.75);border-color:transparent;color:#1d2433}
.hero .btn.primary{background:#1d2433;color:#fff}
.hero-txt{position:relative;z-index:1;max-width:520px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.danger.armed{background:var(--red);color:var(--on-solid);border-color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn svg{width:16px;height:16px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
select,input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=tel],input[type=email],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
textarea{resize:vertical}
.sel{width:auto;padding:8px 30px 8px 12px;border-radius:12px;font-weight:700}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-h h2{display:flex;align-items:center;gap:10px}
.card-h h2 .chipi{width:30px;height:30px;border-radius:9px}
.card-h h2 .chipi svg{width:17px;height:17px}
.grid{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:1.3fr 1fr}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);font-weight:600}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.pen{background:var(--hi-soft);color:var(--ink)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.grade{display:inline-grid;place-items:center;min-width:30px;height:26px;border-radius:8px;font-weight:800;font-size:13px}
.grade.A{background:var(--ok-soft);color:var(--ok)}
.grade.B{background:color-mix(in srgb,var(--c-sky) 15%,var(--surface));color:var(--c-sky)}
.grade.C{background:var(--late-soft);color:var(--late)}
.grade.D{background:var(--red-soft);color:var(--red)}
.grade.none{background:var(--surface-2);color:var(--muted)}

/* today */
.sched .row{align-items:stretch}
.sched .row>.chip,.sched .row>.btn{align-self:center}
.time{width:64px;flex:none;font-size:13px;color:var(--muted);padding-top:2px}
.time b{display:block;color:var(--ink);font-size:14px}
.block-bar{width:5px;border-radius:5px;flex:none}
.now{box-shadow:inset 0 0 0 2px var(--hi);border-radius:12px;padding-inline:10px;margin-inline:-10px;background:var(--hi-soft)}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--on-solid)}
.check svg{width:14px;height:14px}
.done .t{text-decoration:line-through;color:var(--muted)}

/* planner */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.day.today{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 6px;border-bottom:1px solid var(--line)}
.day-h b{font-family:var(--f-display);font-weight:600;font-size:17px}
.slot{border-radius:12px;padding:9px 10px;background:color-mix(in srgb,var(--c,#64748b) 11%,var(--surface));display:flex;flex-direction:column;gap:3px;min-width:0;border-left:4px solid var(--c,#64748b)}
.slot .tm{font-size:12px;color:var(--muted);font-weight:600}
.slot .cn{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.slot .ls{font-size:13px;background:none;border:0;padding:0;text-align:left;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.slot .ls.add{color:var(--accent);font-weight:700}
.slot.plain{background:transparent;border:1.5px dashed var(--line)}
.slot .edit{border:0;background:none;color:var(--muted);padding:0 2px;font-size:16px;line-height:1}
.daypick{display:none}

/* attendance */
.att-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.att-row:first-child{border-top:0}
.marks{display:flex;gap:6px;flex:none}
.mark{width:44px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;color:var(--muted)}
.mark[data-m="P"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-solid)}
.mark[data-m="A"][aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-solid)}
.mark[data-m="T"][aria-pressed="true"]{background:var(--late);border-color:var(--late);color:var(--on-solid)}
.weekstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ws{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:var(--surface);cursor:pointer}
.ws.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ws b{display:block;font-size:12px;color:var(--muted);font-weight:700}
.ws .bar{height:6px;border-radius:6px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.ws .bar i{display:block;height:100%;background:var(--ok);border-radius:6px}

/* gradebook */
.register{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.register table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}
.register th,.register td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.register thead th{background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted);vertical-align:bottom}
.register th.as{cursor:pointer}
.register th.as b{display:block;color:var(--ink);font-size:13px;max-width:130px;overflow:hidden;text-overflow:ellipsis;margin:0 auto}
.register th.as:hover b{color:var(--accent)}
.register .name{position:sticky;left:0;background:var(--surface);text-align:left;border-right:2px solid var(--margin);z-index:1;min-width:170px;font-weight:600}
.register thead .name{background:var(--surface-2)}
.register td input{width:62px;text-align:center;padding:6px 4px;border-radius:8px;font-weight:600}
.register td input.miss{border-color:var(--red);background:var(--red-soft)}
.register tfoot td{font-weight:700;color:var(--muted);font-size:13px;background:var(--surface-2);border-bottom:0}
.register tfoot .name{background:var(--surface-2)}
.register tr.hide{display:none}

/* students / classes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%;box-shadow:var(--shadow)}
.scard:hover{border-color:var(--accent)}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ccard::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px}
.kv b{display:block;font-size:18px;font-family:var(--f-display);font-weight:600}
.kv span{font-size:12px;color:var(--muted);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search]{max-width:260px;border-radius:12px}

/* lessons */
.lesson{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.lesson:first-child{border-top:0}
.lesson .date{width:54px;flex:none;text-align:center;border-radius:12px;padding:5px 0;background:color-mix(in srgb,var(--c,#64748b) 13%,var(--surface))}
.lesson .date b{display:block;font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.1}
.lesson .date span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.lesson p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* toolkit */
.timer{font-family:var(--f-display);font-weight:600;font-size:clamp(54px,12vw,84px);line-height:1;text-align:center;padding:12px 0}
.timer.run{color:var(--accent)}
.timer.end{color:var(--red)}
.picked{font-family:var(--f-display);font-weight:600;font-size:30px;text-align:center;padding:18px 0;min-height:84px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.group{background:var(--surface-2);border-radius:12px;padding:10px;font-size:14px}
.group b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}

/* settings */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field span{font-size:13px;font-weight:700;color:var(--muted)}
.field.wide{grid-column:1/-1}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px 8px 8px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.swatch i{width:30px;height:30px;border-radius:9px;display:block;flex:none}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-f{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;box-shadow:var(--shadow)}

/* phone */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand-mark{width:32px;height:32px;border-radius:10px}
  .topbar .brand-mark svg{width:20px;height:20px}
  .topbar b{font-family:var(--f-display);font-weight:600;font-size:18px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .main{padding-block:16px 100px}
  .g2,.g3{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stats.four .stat{flex-direction:column;align-items:flex-start;gap:4px;padding:10px}
  .stats.four .stat .chipi{display:none}
  .stats.four .stat span{font-size:11px}
  .stat{padding:10px 12px;gap:10px}
  .stat .chipi{width:30px;height:30px}
  .stat b{font-size:22px}
  .hero{padding:20px;border-radius:18px}
  .hero .art{width:130px;height:96px;right:6px;bottom:-8px}
  .sched .row>.chip{display:none}
  .week{grid-template-columns:1fr}
  .week .day{display:none}
  .week .day.show{display:flex}
  .daypick{display:flex}
  .form{grid-template-columns:1fr}
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:20px 20px 0 0;max-height:88%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .mark{width:40px;height:40px}
}
@media (max-width:420px){
  .att-row .grow .small{display:none}
  .kv b{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(12px);opacity:.6}}
}

/* ---- v2 modules ---- */
.page{zoom:var(--z,1)}
.bell{position:relative;flex:none}
.bell i{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:var(--on-solid);font-size:11px;font-weight:800;font-style:normal;display:grid;place-items:center;border:2px solid var(--surface)}
.side .bell{width:38px;height:38px}
.topbar .iconbtn+.iconbtn{margin-left:0}
.welcome{position:relative;overflow:hidden;background:var(--hi);color:var(--hi-ink);border-radius:16px;padding:22px 22px 26px;min-height:150px}
.welcome .eyebrow{color:color-mix(in srgb,var(--hi-ink) 65%,transparent)}
.welcome h2,.welcome p{position:relative;z-index:1;max-width:68%;color:var(--hi-ink)}
.welcome .art{position:absolute;right:-6px;bottom:-12px;width:150px;height:110px;opacity:.9}
.bar2{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:8px;background:var(--accent)}
.bar2.ok i{background:var(--ok)}
.searchbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;color:var(--muted);font-weight:600;font-size:14px;width:100%}
.searchbtn svg{width:17px;height:17px}
.topbar .iconbtn{margin-left:auto}
.sresult{display:flex;gap:10px;align-items:center;padding:9px 6px;border-radius:10px;text-align:left;border:0;background:none;width:100%}
.sresult:hover,.sresult:focus-visible{background:var(--surface-2)}
.sresult .chipi{width:30px;height:30px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:12px;font-weight:800;color:var(--muted);text-align:center;padding:2px 0;text-transform:uppercase;letter-spacing:.06em}
.cd{min-height:104px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.cd.out{opacity:.4}
.cd.wknd{background:var(--surface-2)}
.cd.brk{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 6px,var(--hi-soft) 6px,var(--hi-soft) 12px)}
.cd .n{align-self:flex-start;padding:0 6px;font-weight:800;font-size:13px;min-width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
.cd.today .n{background:var(--accent);color:var(--accent-ink)}
.cd.sel{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.ev{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:color-mix(in srgb,var(--c) 75%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
/* seating */
.room{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);overflow-x:auto}
.front{text-align:center;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px;margin-bottom:14px;min-width:max-content}
.desks{display:grid;gap:10px;min-width:max-content;justify-content:center}
.desk{width:108px;height:66px;border-radius:12px;border:1.5px dashed var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;text-align:center;padding:4px;color:var(--muted);line-height:1.2}
.desk.full{border-style:solid;border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--ink);cursor:grab}
.desk.sel,.wchip.sel{box-shadow:0 0 0 3px var(--hi)}
.desk.over{border-color:var(--accent);background:var(--accent-soft)}
.desk small{font-size:10px;color:var(--muted);font-weight:700}
.wait{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;align-content:flex-start}
.wait.over{border-color:var(--accent);background:var(--accent-soft)}
.wchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:13px;cursor:grab}
.wchip .av{width:24px;height:24px;font-size:10px}
.stepper{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.stepper button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:800}
/* rewards */
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ptile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);text-align:center;min-width:0}
.ptile .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ptile .pts{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.ptile .pm{display:flex;gap:6px}
.ptile .pm button{width:40px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;display:grid;place-items:center}
.ptile .pm button svg{width:16px;height:16px}
.ptile .pm button.plus{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.ptile.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.05)}}
.jar{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.jarv{width:74px;height:96px;border:3px solid var(--line);border-top-width:9px;border-radius:10px 10px 20px 20px;position:relative;overflow:hidden;flex:none;background:var(--surface)}
.jarv i{position:absolute;left:0;right:0;bottom:0;background:var(--hi);transition:height .3s}
.medal{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--hi);color:var(--hi-ink);flex:none}
/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.note{background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:130px;min-width:0}
.note b{font-size:15px}
.note p{margin:0;font-size:14px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
/* curriculum map */
.cmap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.cmap table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
.cmap th,.cmap td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px;vertical-align:top;text-align:left;font-size:13px}
.cmap thead th{background:var(--surface-2);font-weight:800}
.cmap tbody th{background:var(--surface);position:sticky;left:0;z-index:1;width:110px;font-weight:800}
.cmap td.cell{cursor:pointer;min-width:150px;white-space:pre-wrap}
.cmap td.cell:hover{background:var(--accent-soft)}
.cmap td.cell.empty-c{color:var(--muted)}
.cmap tr.now th,.cmap tr.now td{background:var(--hi-soft)}
/* reports / messages */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:20px;min-width:0}
.report-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:3px solid var(--hi);padding-bottom:14px}
.report h3{margin-bottom:8px}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:800}
.tpl{display:flex;flex-direction:column;gap:6px}
.tpl button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-weight:700;display:flex;gap:10px;align-items:center}
.tpl button .chipi{width:28px;height:28px}
.tpl button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.compose textarea{min-height:240px;font-size:14px;line-height:1.55}
pre.out{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:14px;font:13px/1.55 var(--f-body);margin:0;max-height:380px;overflow:auto}
/* lists */
.checklist{display:flex;flex-direction:column}
.checklist label{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-weight:600}
.checklist label:first-child{border-top:0}
.checklist input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.toggles label{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;padding:7px 9px;border-radius:10px;background:var(--surface-2);cursor:pointer}
.toggles input{width:18px;height:18px;accent-color:var(--accent)}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer;min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.item .t{font-weight:700}
.tl{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tl:first-child{border-top:0}
.tl .chipi{width:28px;height:28px}
.tl .chipi svg{width:15px;height:15px}
.mini{font-size:12px;color:var(--muted);font-weight:600}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.qty button svg{width:14px;height:14px}
.qty b{min-width:28px;text-align:center}
.bmonths{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cardlink{cursor:pointer}
@media (max-width:900px){
  .cd{min-height:54px;padding:4px;align-items:center}
  .cd .ev,.cd .mini{display:none}
  .cd .n{align-self:center}
  .tpl{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .tpl button{white-space:nowrap;flex:none}
  .cd .dots{display:flex}
  .cal{gap:4px}
  .desk{width:78px;height:56px;font-size:11px}
  .ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .report{padding:16px}
  .paper{zoom:.62;padding:22px}
  .paper.wide{zoom:.4}
  .paper-wrap{padding:8px}
}

/* ---- demo bar ---- */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:10px 16px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--hi);color:var(--hi-ink);font-size:14px;font-weight:600;text-align:center;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demobar a{color:var(--hi-ink);background:rgba(255,255,255,.7);padding:5px 12px;border-radius:999px;font-weight:800;text-decoration:none;white-space:nowrap}
.demobar:not([hidden])~.app .side{top:40px;height:calc(100vh - 40px)}
@media (max-width:900px){.demobar{font-size:12.5px;position:relative;top:0}}
/* ---- printables, install ---- */
#printRoot{display:none}
.sheet.wide{width:min(1000px,100%)}
.paper-wrap{overflow:auto;border-radius:12px;background:var(--surface-2);padding:14px;max-height:62vh}
.paper{background:#fff;color:#1d2433;box-shadow:0 2px 12px rgba(0,0,0,.14);border-radius:4px;padding:28px;margin:0 auto;max-width:800px;min-width:560px}
.paper.wide{max-width:none;min-width:900px}
.paper .pdoc+.pdoc{border-top:2px dashed #cfd6e2;margin-top:28px;padding-top:28px}
.pdoc{font:12px/1.45 var(--f-body);color:#1d2433;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdoc p{margin:0 0 4px}
.pdoc h1{font:600 22px/1.15 var(--f-display);margin:2px 0;color:#1d2433}
.pdoc h2{font:600 14px/1.2 var(--f-display);margin:0 0 6px;color:#1d2433}
.pdoc .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid var(--p-hi);padding-bottom:8px;margin-bottom:14px}
.pdoc .pm{color:#5b6476;font-size:10.5px;font-weight:500}
.pdoc table{width:100%;border-collapse:collapse;font-size:11px}
.pdoc th,.pdoc td{border:1px solid #cfd6e2;padding:4px 6px;text-align:left;vertical-align:top}
.pdoc th{background:#eef1f7;font-weight:700}
.pdoc .c{text-align:center}
.pdoc td.nm{white-space:nowrap;font-weight:600}
.pdoc .abs{color:#c0392b;font-weight:700}
.pdoc .tar{color:#b7791f;font-weight:700}
.pdoc table.att th,.pdoc table.att td{padding:3px 2px;font-size:10px;min-width:18px}
.pdoc table.att td.nm,.pdoc table.att th:first-child{padding:3px 6px}
.pdoc table.chk td{height:24px}
.pdoc tr.tot td{background:#eef1f7;font-weight:700}
.pdoc table.week td{width:20%}
.pdoc .blk{border-left:3px solid #cfd6e2;padding:2px 0 2px 6px;margin-bottom:7px}
.pdoc .blk b{display:block}
.pdoc .ev{background:#eef1f7;border-radius:4px;padding:2px 6px;margin-bottom:6px;font-weight:700}
.pdoc .sect{margin-top:16px}
.pdoc .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pdoc .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pdoc .kpi{border:1px solid #cfd6e2;border-radius:8px;padding:8px}
.pdoc .kpi b{display:block;font:600 18px/1.2 var(--f-display)}
.pdoc .lines div{border-bottom:1px solid #9aa3b5;height:26px}
.pdoc .sigs{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:36px}
.pdoc .sigs div{border-top:1px solid #1d2433;padding-top:4px;font-size:10.5px;color:#5b6476}
.pdoc .front{text-align:center;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:10px;background:#eef1f7;padding:6px;border-radius:4px;margin-bottom:12px}
.pdoc .seats{display:grid;gap:8px}
.pdoc .seat{border:1.5px solid #1d2433;border-radius:6px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:12px;text-align:center;padding:2px}
.pdoc .seat span{font-weight:400;font-size:10px;color:#5b6476}
.pdoc .seat.empty{border-style:dashed;border-color:#9aa3b5}
.pcard{display:flex;flex-direction:column}
.pcard>.btn{align-self:flex-start;margin-top:auto}
.pform{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.inl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.inl input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
table.bands{width:100%;border-collapse:collapse}
table.bands td,table.bands th{padding:4px 4px;border-bottom:1px solid var(--line);text-align:left}
table.bands th{font-size:12px;color:var(--muted);font-weight:800}
table.bands input{padding:6px 8px}
.installbtn{margin-top:auto;display:flex;gap:10px;align-items:center;text-align:left;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:10px 12px;width:100%}
.installbtn svg{width:22px;height:22px;flex:none}
.installbtn b{display:block;font-size:14px}
.installbtn small{font-size:12px;font-weight:600;opacity:.85}
.installbtn+.side-foot{margin-top:0}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.step b{font-size:15px}
.step p b{font-size:inherit;color:var(--ink)}
@page{margin:12mm}
@page wide{size:landscape;margin:10mm}
@media print{
  :root{padding:0!important}
  html,body{background:#fff!important;height:auto!important}
  body::before{display:none!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot.wide .pdoc{page:wide}

/* ================= TODAY ================= */
function pageToday(){

  const nowHM=`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
  const brk=inBreak(T);
  const blocks=(wk||brk)?[]:state.schedule.filter(b=>b.day===d).sort((a,b)=>a.start.localeCompare(b.start));
  const teach=blocks.filter(b=>b.classId);
  const tc=[...new Set(teach.map(b=>b.classId))];
  const taken=tc.filter(c=>takenOn(c,T)).length;
  const due=state.tasks.filter(x=>!x.done&&x.due<=iso(addDays(t,2))).sort((a,b)=>a.due.localeCompare(b.due));
  const watch=watchList();
  const bdays=state.students.map(s=>({s,...bdayNext(s)})).filter(x=>x.n&&x.days<=14).sort((a,b)=>a.days-b.days);
  const wkEnd=iso(addDays(t,7));
  const coming=[...state.events.filter(e=>e.date>=T&&e.date<=wkEnd).map(e=>({date:e.date,t:e.title,c:EVT[e.type]?.c||"sky",k:EVT[e.type]?.l||"Event",go:"calendar"})),
    ...state.homework.filter(x=>x.due>=T&&x.due<=wkEnd).map(x=>({date:x.due,t:`${x.title} due`,c:"peach",k:cls(x.classId)?.name||"Homework",go:"homework"})),
    ...state.assessments.filter(a=>a.date>=T&&a.date<=wkEnd).map(a=>({date:a.date,t:a.title,c:"red",k:cls(a.classId)?.name||"Assessment",go:"grades"}))].sort((a,b)=>a.date.localeCompare(b.date));
  const nb=nextBreak();
  const lessonFor=(cid,date)=>state.lessons.find(l=>l.classId===cid&&l.date===date);
  return `
  <section class="hero">${HERO_ART}<div class="hero-txt"><div class="eyebrow">${fmtLong(t)}${nb&&!brk?` · ${plural(schoolDaysUntil(nb.start),"school day")} until ${esc(nb.name.toLowerCase())}`:""}</div><h1>${hi}, ${esc(state.profile.name)}</h1>
    <p>${brk?`Enjoy ${esc(brk.name.toLowerCase())}!`:wk?"No classes today. Here is what is coming up next week.":`${plural(teach.length,"class")} today. ${due.length?`${plural(due.length,"task")} due soon.`:"No urgent tasks."}`}</p></div>
    <div class="actions"><button class="btn" data-act="addTask">${ic("plus")}Task</button><button class="btn" data-act="addLesson">${ic("plus")}Lesson</button><button class="btn primary" data-go="attendance">${ic("attendance")}Take attendance</button></div></section>
  <div class="stats">
    ${stat("Classes today",teach.length,"classes","violet")}
    ${stat("Attendance taken",`${taken}/${tc.length}`,"attendance","teal")}
    ${stat("Tasks due soon",due.length,"tasks","mint")}
    ${stat("Students to check on",watch.length,"alert","red")}
  </div>
  <div class="grid g2">
    <div class="grid">
    <section class="card sched"><div class="card-h"><h2>${chip("planner","sky")}Today's schedule</h2><button class="btn sm ghost" data-go="planner">Week view ${ic("right")}</button></div>
      <div class="list">${blocks.length?blocks.map(b=>{const c=cls(b.classId);const l=c&&lessonFor(c.id,T);const isNow=nowHM>=b.start&&nowHM<b.end;const done=nowHM>=b.end;
        return `<div class="row ${isNow?"now":""}"><div class="time num"><b>${to12(b.start)}</b>${to12(b.end)}</div><span class="block-bar" style="background:${c?c.color:"var(--line)"}"></span>
          <div class="grow"><div class="t">${c?esc(c.name)+` <span class="muted small">· ${esc(c.grade)}</span>`:esc(b.label)}</div>
          <div class="small muted">${c?(l?esc(l.title):"No lesson planned"):(isNow?"Now":"")}</div></div>
          ${isNow?'<span class="chip pen">Now</span>':done?'<span class="chip">Done</span>':""}
          ${c?(takenOn(c.id,T)?'<span class="chip ok">Taken</span>':`<button class="btn sm" data-act="attFor" data-c="${c.id}">Attendance</button>`):""}</div>`}).join(""):empty(brk?"School break. Rest up.":wk?"Weekend. Rest up.":"Nothing scheduled. Add time blocks in the planner.")}</div></section>
    <section class="card"><div class="card-h"><h2>${chip("calendar","sky")}Next 7 days</h2><button class="btn sm ghost" data-go="calendar">Calendar ${ic("right")}</button></div>
      <div class="list">${coming.length?coming.map(x=>`<div class="row cardlink" data-go="${x.go}"><span class="chipi" style="--c:var(--c-${x.c});width:30px;height:30px">${ic(x.go==="calendar"?"calendar":x.go)}</span><div class="grow"><div class="t">${esc(x.t)}</div><div class="small muted">${esc(x.k)}</div></div><span class="chip">${x.date===T?"Today":fmtD(x.date)}</span></div>`).join(""):empty("Nothing coming up this week.")}</div></section>
    </div>
    <div class="grid">
      <section class="card"><div class="card-h"><h2>${chip("tasks","mint")}Due soon</h2><button class="btn sm ghost" data-go="tasks">All tasks ${ic("right")}</button></div>
        <div class="list">${due.length?due.map(taskRow).join(""):empty("You are all caught up.")}</div></section>
      <section class="card"><div class="card-h"><h2>${chip("alert","red")}Check on</h2><span class="chip">${watch.length}</span></div>
        <div class="list">${watch.slice(0,5).map(({s,why})=>`<div class="row cardlink" data-act="openStudent" data-s="${s.id}">${avatar(s)}<div class="grow"><div class="t">${esc(fullName(s))}</div><div class="actions" style="gap:4px;margin-top:3px">${why.map(w=>`<span class="chip ${w.c}">${esc(w.t)}</span>`).join("")}</div></div></div>`).join("")||empty("Everyone is on track.")}</div></section>
      ${bdays.length?`<section class="card"><div class="card-h"><h2>${chip("birthdays","pink")}Birthdays</h2><button class="btn sm ghost" data-go="birthdays">All ${ic("right")}</button></div><div class="list">${bdays.map(b=>`<div class="row">${avatar(b.s)}<div class="grow"><div class="t">${esc(fullName(b.s))}</div><div class="small muted">${fmtShort(b.n)}</div></div><span class="chip pen">${b.days===0?"Today 🎉":b.days===1?"Tomorrow":`in ${b.days} days`}</span></div>`).join("")}</div></section>`:""}
    </div>
  </div>`;
}
function taskRow(x){
  const t=TODAY();const late=!x.done&&x.due<t;

    ${x.priority==="high"&&!x.done?'<span class="chip red">High</span>':""}</div>`;

/* ================= CALENDAR ================= */
function itemsOn(k){
  const out=[];const md=k.slice(5);
  state.events.filter(e=>e.date===k).forEach(e=>out.push({t:e.title,c:EVT[e.type]?.c||"sky",kind:"event",id:e.id}));
  state.homework.filter(h=>h.due===k).forEach(h=>out.push({t:`${h.title} due`,c:"peach",kind:"homework",id:h.id}));
  state.assessments.filter(a=>a.date===k).forEach(a=>out.push({t:a.title,c:"red",kind:"assessment",id:a.id}));
  state.students.filter(s=>s.birthday&&s.birthday.slice(5)===md).forEach(s=>out.push({t:`🎂 ${s.first} ${s.last[0]}.`,c:"pink",kind:"birthday",id:s.id}));
  return out;
}
function pageCalendar(){
  const [y,m]=state.ui.calMonth.split("-").map(Number);const first=new Date(y,m-1,1);const start=monday(first);
  const T=TODAY();const sel=state.ui.calDay;
  const cells=[];for(let i=0;i<42;i++){const d=addDays(start,i);if(i>=35&&d.getMonth()!==m-1)break;cells.push(d)}
  const selItems=itemsOn(sel);const brk=inBreak(sel);
  const lessonsSel=state.lessons.filter(l=>l.date===sel);
  const monthEvents=state.events.filter(e=>e.date.slice(0,7)===state.ui.calMonth);
  return head("Calendar","Events, homework, tests, birthdays and school breaks in one month view.",`<button class="iconbtn" data-act="calNav" data-d="-1" aria-label="Previous month">${ic("left")}</button><button class="btn sm" data-act="calNav" data-d="0">Today</button><button class="iconbtn" data-act="calNav" data-d="1" aria-label="Next month">${ic("right")}</button>${addBtn("addEvent","Event")}`)+`
  <div class="stats">${stat("Events this month",monthEvents.length,"calendar","sky")}${stat("Homework due",state.homework.filter(h=>h.due.slice(0,7)===state.ui.calMonth).length,"homework","peach")}${stat("Assessments",state.assessments.filter(a=>a.date.slice(0,7)===state.ui.calMonth).length,"grades","red")}${stat("Field trips",monthEvents.filter(e=>e.type==="trip").length,"rewards","mint")}</div>
  <section class="card"><div class="card-h"><h2>${MONTHS[m-1]} ${y}</h2><div class="legend">${[["Event","sky"],["Meeting","violet"],["Trip","mint"],["Deadline / test","red"],["Homework","peach"],["Birthday","pink"]].map(([l,c])=>`<span style="--c:var(--c-${c})"><i></i>${l}</span>`).join("")}</div></div>
  <div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<div class="dh">${x}</div>`).join("")}
  ${cells.map(d=>{const k=iso(d);const it=itemsOn(k);const b=inBreak(k);
    return `<button class="cd ${d.getMonth()!==m-1?"out":""} ${isWeekend(d)?"wknd":""} ${b?"brk":""} ${k===T?"today":""} ${k===sel?"sel":""}" data-act="calDay" data-k="${k}" aria-label="${fmtLong(d)}${it.length?`, ${it.length} items`:""}"><span class="n num">${d.getDate()}</span>
      ${it.slice(0,3).map(x=>`<span class="ev" style="--c:var(--c-${x.c})">${esc(x.t)}</span>`).join("")}${it.length>3?`<span class="mini">+${it.length-3} more</span>`:""}
      <span class="dots">${it.slice(0,4).map(x=>`<i style="--c:var(--c-${x.c})"></i>`).join("")}</span></button>`}).join("")}</div></section>
  <section class="card"><div class="card-h"><h2>${fmtLong(parse(sel))}</h2>${addBtn("addEvent","Event",`data-date="${sel}"`)}</div>
    ${brk?`<p class="chip pen" style="margin:0 0 8px">${esc(brk.name)}</p>`:""}
    <div class="list">${selItems.length||lessonsSel.length?[...selItems.map(x=>`<div class="row cardlink" data-act="calItem" data-kind="${x.kind}" data-id="${x.id}"><span class="dot" style="background:var(--c-${x.c})"></span><div class="grow"><div class="t">${esc(x.t)}</div><div class="small muted">${x.kind==="event"?esc(EVT[state.events.find(e=>e.id===x.id)?.type]?.l||"Event")+(state.events.find(e=>e.id===x.id)?.notes?" · "+esc(state.events.find(e=>e.id===x.id).notes):""):x.kind==="homework"?"Homework":x.kind==="assessment"?"Assessment":"Birthday"}</div></div></div>`),
      ...lessonsSel.map(l=>`<div class="row cardlink" data-act="editLesson" data-id="${l.id}"><span class="dot" style="background:${cls(l.classId)?.color}"></span><div class="grow"><div class="t">${esc(l.title)}</div><div class="small muted">Lesson · ${esc(cls(l.classId)?.name)}</div></div></div>`)].join(""):empty("Nothing on this day.")}</div></section>`;
}

      ${b0?`<div class="small muted" style="padding:6px">${esc(b0.name)}</div>`:""}

/* ================= HOMEWORK ================= */
function pageHomework(){
  const f=state.ui.hwFilter,T=TODAY();const wkEnd=iso(addDays(todayD(),7));
  let list=[...state.homework].sort((a,b)=>a.due.localeCompare(b.due));

  <section class="card">${list.length?list.map(h=>{const c=cls(h.classId);const r=hwRate(h);const n=Object.keys(h.done||{}).length;

      <p>Due ${fmtD(h.due)}${h.details?" · "+esc(h.details):""}</p><div class="actions" style="margin-top:6px;flex-wrap:nowrap"><div style="flex:1">${bar(r,"ok")}</div><span class="mini num">${n}/${roster(h.classId).length} turned in</span></div></div></div>`}).join(""):empty("No homework here. Add the first assignment.")}</section>`;

/* ================= SEATING ================= */
let seatSel=null;
const seatOf=(cid,sid)=>{const s=state.seating[cid];if(!s)return null;const e=Object.entries(s.seats).find(([,v])=>v===sid);return e?Number(e[0]):null};
function getSeating(cid){if(!state.seating[cid])state.seating[cid]={rows:4,cols:5,seats:{}};const s=state.seating[cid];
  Object.keys(s.seats).forEach(k=>{if(Number(k)>=s.rows*s.cols||!stu(s.seats[k])||stu(s.seats[k]).classId!==cid)delete s.seats[k]});return s}
function placeStudent(cid,sid,idx){const s=getSeating(cid);const from=seatOf(cid,sid);const occ=s.seats[idx];
  if(from===idx)return;s.seats[idx]=sid;if(from!=null){if(occ)s.seats[from]=occ;else delete s.seats[from]}}
function unseat(cid,sid){const s=getSeating(cid);const f=seatOf(cid,sid);if(f!=null)delete s.seats[f]}
function pageSeating(){
  const cid=state.ui.classId;const s=getSeating(cid);const r=roster(cid);const seated=new Set(Object.values(s.seats));const waiting=r.filter(x=>!seated.has(x.id));

function reportData(s){

}
function reportText(s){

    if(!c){L.push(`${to12(b.start)}–${to12(b.end)}  ${b.label}`);return}
    const l=state.lessons.find(x=>x.classId===c.id&&x.date===k);
    L.push(`${to12(b.start)}–${to12(b.end)}  ${c.name} (${c.grade}, ${c.room})`);
    if(l){L.push(`   Lesson: ${l.title}`);if(l.objective)L.push(`   Goal: ${l.objective}`);if(l.materials)L.push(`   Materials: ${l.materials}`);if(l.homework)L.push(`   Homework: ${l.homework}`)}
    else L.push("   Lesson: [Add instructions here]")});
  const sup=state.students.filter(s=>s.support);
  if(sup.length){L.push("","STUDENTS WITH SUPPORT NEEDS");sup.forEach(s=>L.push(`• ${fullName(s)} (${cls(s.classId)?.name}): ${s.support}`))}
  const ev=state.events.filter(e=>e.date===k);if(ev.length){L.push("","TODAY'S EVENTS");ev.forEach(e=>L.push(`• ${e.title}${e.notes?" — "+e.notes:""}`))}
  L.push("","ROSTERS");state.classes.forEach(c=>{L.push(`${c.name} (${roster(c.id).length}): ${roster(c.id).map(fullName).join(", ")}`)});
  L.push("","Thank you for covering my class!");
  return L.join("\n");
}

function searchResults(q){
  q=q.trim().toLowerCase();if(!q)return '<p class="mini">Start typing to search.</p>';
  const R=[];const has=(...v)=>v.join(" ").toLowerCase().includes(q);
  state.students.forEach(s=>{if(has(fullName(s),s.guardian,s.sid||""))R.push({i:"students",t:fullName(s),m:`Student · ${cls(s.classId)?.name}`,act:`data-act="openStudent" data-s="${s.id}"`})});
  state.lessons.forEach(l=>{if(has(l.title,l.objective))R.push({i:"lessons",t:l.title,m:`Lesson · ${cls(l.classId)?.name} · ${fmtD(l.date)}`,act:`data-act="editLesson" data-id="${l.id}"`})});
  state.homework.forEach(h=>{if(has(h.title,h.details))R.push({i:"homework",t:h.title,m:`Homework · due ${fmtD(h.due)}`,act:`data-act="openHw" data-id="${h.id}"`})});
  state.events.forEach(e=>{if(has(e.title,e.notes))R.push({i:"calendar",t:e.title,m:`Event · ${fmtD(e.date)}`,act:`data-act="editEvent" data-id="${e.id}"`})});
  state.tasks.forEach(x=>{if(has(x.title))R.push({i:"tasks",t:x.title,m:`Task · ${fmtD(x.due)}`,act:`data-act="editTask" data-id="${x.id}"`})});
  state.notes.forEach(n=>{if(has(n.title,n.body))R.push({i:"notes",t:n.title,m:"Note",act:`data-act="editNote" data-id="${n.id}"`})});
  state.units.forEach(u=>{if(has(u.title,u.standards))R.push({i:"units",t:u.title,m:`Unit · ${cls(u.classId)?.name}`,act:`data-act="editUnit" data-id="${u.id}"`})});
  Object.keys(PAGES).filter(visible).forEach(p=>{if(has(PAGES[p]))R.push({i:p,t:PAGES[p],m:"Page",act:`data-go="${p}"`})});
  return R.length?R.slice(0,30).map(r=>`<button class="sresult" ${r.act}>${chip(r.i)}<div style="min-width:0"><div style="font-weight:700">${esc(r.t)}</div><div class="mini">${esc(r.m)}</div></div></button>`).join(""):'<p class="mini">No matches.</p>';
}

function download(name,content,type="text/plain",okMsg){
  const txt=typeof content==="string"?content.replace(/^\ufeff/,""):"";
  if(EMBED){copyText(txt,"Copied. File downloads work in your installed app.");return}
  try{const blob=new Blob([content],{type:type+";charset=utf-8"});const url=URL.createObjectURL(blob);const el=document.createElement("a");el.href=url;el.download=name;el.rel="noopener";document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast(okMsg||`Saved ${name}`)}
  catch(e){copyText(txt,"Copied")}
}

  <div class="kpis"><div class="kpi"><span class="pm">Average</span><b>${pct(d.avg)} ${d.avg==null?"":esc(letter(d.avg))}</b></div><div class="kpi"><span class="pm">Attendance</span><b>${pct(d.at.rate)}</b><span class="pm">${d.at.a} absent · ${d.at.t} tardy</span></div><div class="kpi"><span class="pm">Homework turned in</span><b>${d.hwDone}/${d.hw.length}</b></div><div class="kpi"><span class="pm">Class points</span><b>${state.points[s.id]||0}</b></div></div>
  <div class="sect"><h2>Scores</h2><table><thead><tr><th>Assessment</th><th>Date</th><th class="c">Score</th><th class="c">Percent</th><th class="c">Grade</th></tr></thead><tbody>${d.as.map(x=>{const v=state.scores[x.id]?.[s.id];const p=v==null||v===""?null:v/x.max*100;return `<tr><td>${esc(x.title)}</td><td>${fmtD(x.date)}</td><td class="c">${p==null?'<span class="abs">missing</span>':`${v}/${x.max}`}</td><td class="c">${pct(p)}</td><td class="c">${p==null?"":esc(letter(p))}</td></tr>`}).join("")||'<tr><td colspan="5">No assessments yet.</td></tr>'}</tbody></table></div>
  <div class="grid2 sect"><div><h2>Highlights</h2>${pos.map(b=>`<p>• ${esc(b.note)}</p>`).join("")||'<p class="pm">Nothing logged yet.</p>'}</div><div><h2>Reading & support</h2>${d.rd.map(x=>`<p>• ${esc(x.book)}: ${RS[x.status]?.[0].toLowerCase()}, ${x.pages}/${x.total} pages</p>`).join("")}${d.iv.map(x=>`<p>• ${esc(x.area)}: ${esc(x.goal)}</p>`).join("")}${!d.rd.length&&!d.iv.length?'<p class="pm">Nothing logged yet.</p>':""}</div></div>
  <div class="sect"><h2>Teacher comment</h2>${d.comment?`<p>${esc(d.comment).replace(/\n/g,"<br>")}</p>`:'<div class="lines"><div></div><div></div><div></div></div>'}</div>
  <div class="sigs"><div>Teacher signature</div><div>Parent / guardian signature</div></div></section>`}
function docWeek(off){const mon=addDays(monday(todayD()),off*7);const days=[0,1,2,3,4].map(i=>addDays(mon,i));
  return `<section class="pdoc">${paperHead("Weekly lesson plan",`Week of ${fmtLong(mon)}`)}<table class="week"><thead><tr>${days.map(d=>`<th>${DAYS[dow(d)]} ${d.getDate()} ${MON[d.getMonth()]}</th>`).join("")}</tr></thead><tbody><tr>${days.map((d,i)=>{const k=iso(d);const b0=inBreak(k);if(b0)return `<td><b>${esc(b0.name)}</b></td>`;
    return `<td>${state.events.filter(e=>e.date===k).map(e=>`<div class="ev">${esc(e.title)}</div>`).join("")}${state.schedule.filter(b=>b.day===i).sort((x,y)=>x.start.localeCompare(y.start)).map(b=>{const c=cls(b.classId);const l=c&&state.lessons.find(x=>x.classId===c.id&&x.date===k);
      return `<div class="blk" style="border-left-color:${c?c.color:"#cfd6e2"}"><span class="pm">${to12(b.start)}–${to12(b.end)}</span><b>${esc(c?c.name:b.label)}</b>${c?`<div>${l?esc(l.title):'<span class="pm">No lesson planned</span>'}</div>${l&&l.objective?`<div class="pm">${esc(l.objective)}</div>`:""}${l&&l.homework?`<div class="pm">Homework: ${esc(l.homework)}</div>`:""}`:""}</div>`}).join("")||'<span class="pm">Free day</span>'}</td>`}).join("")}</tr></tbody></table></section>`}
function docSeating(cid){const c=cls(cid);if(!c)return noDoc("Add a class first.");const s=getSeating(cid);const seated=new Set(Object.values(s.seats));const w=roster(cid).filter(x=>!seated.has(x.id));
  return `<section class="pdoc">${paperHead(`Seating chart · ${esc(c.name)}`,`${esc(c.grade)} · ${esc(c.room)}`)}<div class="front">Front of the room</div>
  <div class="seats" style="grid-template-columns:repeat(${s.cols},1fr)">${Array.from({length:s.rows*s.cols},(_,i)=>{const x=stu(s.seats[i]);return `<div class="seat ${x?"":"empty"}">${x?`${esc(x.first)}<span>${esc(x.last)}</span>`:""}</div>`}).join("")}</div>
  ${w.length?`<p class="pm" style="margin-top:10px">Not seated yet: ${w.map(x=>esc(fullName(x))).join(", ")}</p>`:""}</section>`}
function docSubPlan(k){const d=parse(k);const di=dow(d);const b0=inBreak(k);
  const blocks=di>4||b0?[]:state.schedule.filter(b=>b.day===di).sort((x,y)=>x.start.localeCompare(y.start));
  const sup=state.students.filter(s=>s.support);const ev=state.events.filter(e=>e.date===k);
  return `<section class="pdoc">${paperHead(`Sub plan · ${fmtLong(d)}`,"Thank you for covering my class!")}
  ${di>4?"<p>This is a weekend day. No classes are scheduled.</p>":b0?`<p>No school: ${esc(b0.name)}.</p>`:`
  <div class="sect"><h2>Schedule</h2><table><thead><tr><th style="width:120px">Time</th><th style="width:150px">Class</th><th>Plan</th></tr></thead><tbody>${blocks.map(b=>{const c=cls(b.classId);const l=c&&state.lessons.find(x=>x.classId===c.id&&x.date===k);
    return `<tr><td>${to12(b.start)}–${to12(b.end)}</td><td><b>${esc(c?c.name:b.label)}</b>${c?`<div class="pm">${esc(c.grade)} · ${esc(c.room)}</div>`:""}</td><td>${c?(l?`<b>${esc(l.title)}</b>${l.objective?`<div>${esc(l.objective)}</div>`:""}${l.materials?`<div class="pm">Materials: ${esc(l.materials)}</div>`:""}${l.homework?`<div class="pm">Homework: ${esc(l.homework)}</div>`:""}`:'<div class="lines"><div></div><div></div></div>'):""}</td></tr>`}).join("")||'<tr><td colspan="3">No periods set up for this day.</td></tr>'}</tbody></table></div>
  ${ev.length?`<div class="sect"><h2>Events today</h2>${ev.map(e=>`<p>• <b>${esc(e.title)}</b>${e.notes?": "+esc(e.notes):""}</p>`).join("")}</div>`:""}
  ${sup.length?`<div class="sect"><h2>Students with support needs</h2>${sup.map(s=>`<p>• <b>${esc(fullName(s))}</b> (${esc(cls(s.classId)?.name||"")}): ${esc(s.support)}</p>`).join("")}</div>`:""}
  <div class="sect"><h2>Class lists</h2><div class="grid2">${state.classes.map(c=>`<div><b>${esc(c.name)} · ${esc(c.grade)}</b><p class="pm">${roster(c.id).map(x=>esc(fullName(x))).join(", ")||"No students"}</p></div>`).join("")}</div></div>
  <div class="sect"><h2>Notes for ${esc(state.profile.name)}</h2><div class="lines"><div></div><div></div><div></div><div></div></div></div>`}</section>`}
function docChecklist(cid,title,n){const c=cls(cid);if(!c)return noDoc("Add a class first.");const r=roster(cid);

  ${card("planner","sky","Weekly lesson plan","Your timetable with each lesson, objective and homework.",`<select id="pr_week" aria-label="Week"><option value="-1">Last week</option><option value="0" selected>This week</option><option value="1">Next week</option><option value="2">In two weeks</option></select>`,"prWeek")}

function copyText(txt,done){
  const fb=()=>{textSheet("Copy this text",txt,"Your browser blocked automatic copying. Select the text below and copy it.");const el=$("#outText");if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}};
  try{navigator.clipboard.writeText(txt).then(()=>toast(done||"Copied"),fb)}catch(e){fb()}
}
const csvCell=v=>{v=String(v??"");return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
const csv=rows=>rows.map(r=>r.map(csvCell).join(",")).join("\n");
function attCsv(cids){const dates=Object.keys(state.attendance).sort();const rows=[["Student","Class",...dates,"Present","Absent","Tardy"]];
  state.classes.filter(c=>cids.includes(c.id)).forEach(c=>roster(c.id).forEach(s=>{const st=attStats(s);rows.push([fullName(s),c.name,...dates.map(d=>state.attendance[d][s.id]||""),st.p,st.a,st.t])}));return csv(rows)}
function gradesCsv(cids){const rows=[];state.classes.filter(c=>cids.includes(c.id)).forEach(c=>{const as=state.assessments.filter(a=>a.classId===c.id).sort((a,b)=>a.date.localeCompare(b.date));
  rows.push([`${c.name} ${c.grade}`,...as.map(a=>`${a.title} (/${a.max})`),"Average","Grade"]);roster(c.id).forEach(s=>{const av=studentAvg(s);rows.push([fullName(s),...as.map(a=>state.scores[a.id]?.[s.id]??""),av==null?"":Math.round(av),av==null?"":letter(av)])});rows.push([])});return csv(rows)}
let toastT;

    case "hwAll":case "hwNone":{const h=find("homework",D.id);h.done={};if(a==="hwAll")roster(h.classId).forEach(s=>h.done[s.id]=true);save();render();hwSheet(h.id);break}
    case "addUnit":unitForm();break;
    case "editUnit":unitForm(find("units",D.id));break;
    case "editCm":{const [cid,m]=D.k.split("|");const c=cls(cid);openForm({title:`${c?.name} · ${MONTHS[Number(m)]}`,values:{v:state.curriculum[D.k]||""},fields:[{key:"v",label:"Topics for this month",type:"textarea",rows:4,wide:true,placeholder:"e.g. Fractions, decimals"}],onSave:v=>{if(v.v)state.curriculum[D.k]=v.v;else delete state.curriculum[D.k];toast("Curriculum map updated")}});break}
    case "addGoal":goalForm();break;
    case "editGoal":goalForm(find("goals",D.id));break;
    case "goalStep":{const x=find("goals",D.id);x.progress=clamp((Number(x.progress)||0)+Number(D.d),0,100);rerender();if(x.progress===100)toast("Goal completed 🎉");break}
    case "addNote":noteForm();break;
    case "editNote":noteForm(find("notes",D.id));break;
    case "addClass":classForm();break;
    case "editClass":classForm(cls(D.id));break;
    case "gotoClass":state.ui.classId=D.c;if(D.p==="students")state.ui.studentClass=D.c;go(D.p);break;
    case "addStudent":studentForm();break;
    case "bulkAdd":bulkForm();break;
    case "bulkSave":{const cid=$("#bulkClass").value;const lines=$("#bulkNames").value.split(/\n/).map(x=>x.replace(/[\t,;]+/g," ").trim()).filter(Boolean);
      if(!lines.length){toast("Paste at least one name");break}
      lines.forEach(l=>{const p=l.split(/\s+/);state.students.push({id:uid(),first:p[0],last:p.slice(1).join(" ")||"",classId:cid,guardian:"",phone:"",email:"",birthday:"",support:"",notes:""})});
      save();closeModal();render();toast(`${plural(lines.length,"student")} added`);break}
    case "openStudent":studentProfile(D.s);break;
    case "editStudent":closeModal();studentForm(stu(D.s));break;
    case "quickBeh":closeModal();behForm(null,{s:D.s});break;
    case "quickMsg":closeModal();state.ui.msgStudent=D.s;go("messages");break;
    case "quickRep":closeModal();state.ui.repStudent=D.s;go("reports");break;
    case "attFor":state.ui.classId=D.c;state.ui.attDate=TODAY();go("attendance");break;
    case "attDay":{let d=D.d==="0"?lastSchoolDay(todayD()):addDays(parse(state.ui.attDate),Number(D.d));while(isWeekend(d))d=addDays(d,Number(D.d)||-1);state.ui.attDate=iso(d);save();render();break}
    case "attPick":state.ui.attDate=D.k;rerender();break;
    case "mark":{const k=state.ui.attDate;state.attendance[k]=state.attendance[k]||{};if(state.attendance[k][D.s]===D.m)delete state.attendance[k][D.s];else state.attendance[k][D.s]=D.m;rerender();break}
    case "allPresent":{const k=state.ui.attDate;state.attendance[k]=state.attendance[k]||{};roster(state.ui.classId).forEach(s=>{if(!state.attendance[k][s.id])state.attendance[k][s.id]="P"});rerender();toast("Everyone else marked present");break}
    case "exportAtt":csvFile(`attendance-${fileSafe(cls(state.ui.classId)?.name)}`,attCsv([state.ui.classId]));break;
    case "exportAttAll":csvFile("attendance-all-classes",attCsv(state.classes.map(c=>c.id)));break;
    case "exportGrades":csvFile(`grades-${fileSafe(cls(state.ui.classId)?.name)}`,gradesCsv([state.ui.classId]));break;
    case "exportGradesAll":csvFile("grades-all-classes",gradesCsv(state.classes.map(c=>c.id)));break;
    case "exportRoster":csvFile("student-roster",csv([["Student ID","First name","Last name","Class","Birthday","Guardian","Phone","Email","Support needs"],...allSorted().map(s=>[s.sid||"",s.first,s.last,cls(s.classId)?.name,s.birthday,s.guardian,s.phone,s.email,s.support])]));break;
    case "addAssess":assessForm();break;
    case "editAssess":assessForm(find("assessments",D.id));break;
    case "seatPick":seatSel=seatSel===D.s?null:D.s;rerender();break;
    case "seatDesk":{const cid=state.ui.classId;const s=getSeating(cid);const occ=s.seats[D.i];const i=Number(D.i);
      if(seatSel){placeStudent(cid,seatSel,i);seatSel=null}else if(occ)seatSel=occ;rerender();break}
    case "seatSize":{const cid=state.ui.classId;const s=getSeating(cid);const oldCols=s.cols;s[D.k]=clamp(s[D.k]+Number(D.d),1,10);
      const pos=Object.entries(s.seats).map(([k,v])=>({r:Math.floor(k/oldCols),c:k%oldCols,v}));s.seats={};const spill=[];
      pos.forEach(p=>{if(p.r<s.rows&&p.c<s.cols)s.seats[p.r*s.cols+p.c]=p.v;else spill.push(p.v)});
      for(let k=0;k<s.rows*s.cols&&spill.length;k++){if(!s.seats[k])s.seats[k]=spill.shift()}
      if(spill.length)toast(`${plural(spill.length,"student")} moved to the waiting list`);rerender();break}
    case "seatShuffle":{const cid=state.ui.classId;const s=getSeating(cid);const r=roster(cid).map(x=>x.id).sort(()=>Math.random()-.5);s.seats={};r.slice(0,s.rows*s.cols).forEach((id,i)=>s.seats[i]=id);seatSel=null;rerender();toast("Seats shuffled");break}
    case "seatFill":{const cid=state.ui.classId;const s=getSeating(cid);const seated=new Set(Object.values(s.seats));const w=roster(cid).filter(x=>!seated.has(x.id));let i=0;
      for(let k=0;k<s.rows*s.cols&&i<w.length;k++){if(!s.seats[k])s.seats[k]=w[i++].id}seatSel=null;rerender();toast(i?`${plural(i,"student")} seated`:"No empty desks or no one waiting");break}
    case "seatClear":{if(!el.classList.contains("armed")){el.classList.add("armed");el.textContent="Tap again to clear";return}getSeating(state.ui.classId).seats={};seatSel=null;rerender();toast("Seating chart cleared");break}
    case "pts":{state.points[D.s]=Math.max(0,(state.points[D.s]||0)+Number(D.d));save();const y=scrollY;render();scrollTo(0,y);const t=$("#pt-"+D.s);if(t&&D.d>0)t.classList.add("bump");
      const r=roster(state.ui.classId);const jar=state.jars[state.ui.classId];if(D.d>0&&jar&&sum(r.map(s=>state.points[s.id]||0))===jar.goal)toast(`Goal reached: ${jar.reward}! 🎉`);break}
    case "ptsReset":{if(!el.classList.contains("armed")){el.classList.add("armed");el.textContent="Tap again to reset";return}roster(state.ui.classId).forEach(s=>state.points[s.id]=0);rerender();toast("Points reset");break}
    case "jarEdit":{const cid=state.ui.classId;const j=state.jars[cid]||(state.jars[cid]={goal:100,reward:"Class party"});openForm({title:"Class reward",values:j,fields:[{key:"reward",label:"Reward",required:true,wide:true,placeholder:"e.g. Pajama day"},{key:"goal",label:"Points needed",type:"number",min:1,required:true}],onSave:v=>{j.reward=v.reward;j.goal=Math.max(1,Number(v.goal)||1);toast("Reward saved")}});break}
    case "addBeh":behForm();break;
    case "editBeh":behForm(find("behavior",D.id));break;
    case "addIv":ivForm();break;
    case "editIv":ivForm(find("interventions",D.id));break;
    case "addRead":readForm();break;
    case "editRead":readForm(find("reading",D.id));break;
    case "copyReport":copyText(reportText(stu(state.ui.repStudent)),"Report copied");break;
    case "copyMsg":copyText(`Subject: ${$("#msgSubj").value}\n\n${$("#msgBody").value}`,"Message copied");break;
    case "logMsg":contactForm(null,{s:state.ui.msgStudent,summary:`Sent: ${$("#msgSubj").value}`});break;
    case "addContact":contactForm();break;
    case "editContact":contactForm(find("contacts",D.id));break;
    case "toggleFollow":{const c=find("contacts",D.id);c.followDone=!c.followDone;rerender();break}
    case "addSupply":supplyForm();break;
    case "editSupply":supplyForm(find("supplies",D.id));break;
    case "qty":{const x=find("supplies",D.id);x.qty=Math.max(0,(Number(x.qty)||0)+Number(D.d));rerender();break}
    case "copyRestock":{const low=state.supplies.filter(x=>supStatus(x)[0]!=="OK");copyText(low.length?"Shopping list\n"+low.map(x=>`• ${x.name}: need ${Math.max(1,x.min-x.qty)} ${x.unit||""}`.trim()).join("\n"):"Nothing to restock.","Shopping list copied");break}
    case "addBreak":breakForm();break;
    case "editBreak":breakForm(state.year.breaks.find(b=>b.id===D.id));break;
    case "tkSet":tk.secs=tk.left=Number(D.m)*60;stopTimer();render();break;
    case "tkGo":if(tk.run)stopTimer();else{if(tk.left===0)tk.left=tk.secs;tk.run=true;tk.timer=setInterval(tick,1000)}render();break;
    case "tkReset":stopTimer();tk.left=tk.secs;render();break;
    case "tkPick":{const r=roster(state.ui.classId).map(fullName);if(!tk.pool.length||tk.poolClass!==state.ui.classId){tk.pool=[...r];tk.poolClass=state.ui.classId}
      const i=Math.floor(Math.random()*tk.pool.length);tk.picked=tk.pool.splice(i,1)[0];render();break}
    case "tkGroups":{tk.groupSize=Number($("#gsize").value);const r=roster(state.ui.classId).map(fullName).sort(()=>Math.random()-.5);const n=Math.max(1,Math.round(r.length/tk.groupSize));tk.groups=Array.from({length:n},()=>[]);r.forEach((x,i)=>tk.groups[i%n].push(x));render();break}
    case "tkBrain":{let x;do{x=BRAIN[Math.floor(Math.random()*BRAIN.length)]}while(x===tk.brain);tk.brain=x;render();break}
    case "tkSub":{tk.subDate=$("#subDate").value||tk.subDate;printPreview(`Sub plan · ${fmtD(tk.subDate)}`,docSubPlan(tk.subDate),false,subPlanText(tk.subDate));break}
    case "copyOut":copyText($("#outText").textContent,"Copied");break;
    case "copyBackup":{const txt=backupText();markBackup();
      const fallback=()=>{$("#restoreBox").hidden=false;$("#restoreText").value=txt;$("#restoreText").select();toast("Select all and copy the text")};
      try{navigator.clipboard.writeText(txt).then(()=>toast("Backup copied"),fallback)}catch(err){fallback()}break}
    case "showRestore":$("#restoreBox").hidden=false;$("#restoreText").value="";$("#restoreText").focus();break;
    case "restore":{try{const d=JSON.parse($("#restoreText").value);if(!d.classes||!d.students)throw 0;const ui=state.ui;state={...d,v:2,ui};ensure();save();render();toast("Backup restored")}catch(err){toast("That text is not a Classbook backup")}break}
    case "resetSample":case "clearAll":{if(!el.classList.contains("armed")){$$(".btn.armed").forEach(b=>b.classList.remove("armed"));el.classList.add("armed");el.textContent="Tap again to confirm";return}
      const theme=state.ui.theme,pal=state.ui.palette;const fresh=seed();
      if(a==="resetSample")state=fresh;
      else{state={...fresh,profile:{...state.profile},classes:[],students:[],assessments:[],scores:{},attendance:{},schedule:[],lessons:[],tasks:[],events:[],homework:[],units:[],curriculum:{},goals:[],notes:[],seating:{},behavior:[],interventions:[],reading:[],contacts:[],supplies:[],points:{},jars:{},comments:{}};state.ui.classId=""}
      state.ui.theme=theme;state.ui.palette=pal;state.ui.welcomed=true;state.ui.page="settings";save();render();toast(a==="resetSample"?"Sample data loaded":"Started empty");break}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modalRoot").innerHTML){closeModal();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();searchSheet()}
});
document.addEventListener("change",e=>{
  const b=e.target.closest("[data-bind]");if(b){state.ui[b.dataset.bind]=b.value;if(b.dataset.bind==="classId"){tk.picked=null;tk.groups=null;seatSel=null}save();render();return}
  const t=e.target;
  if(t.id==="gsize")tk.groupSize=Number(t.value);
  if(t.id==="scalePreset"){if(SCALES[t.value]){state.settings.scale=SCALES[t.value].bands.map(b=>({...b}));state.settings.scaleKey=t.value;state.settings.supportBelow=SCALES[t.value].support;save();render();toast("Grade scale updated")}return}
  if(t.dataset.band!=null&&t.dataset.f){const b=scale();const x=b[Number(t.dataset.band)];if(!x)return;
    if(t.dataset.f==="min"){const v=clamp(Math.round(Number(t.value)||0),1,100);if(b.some((y,i)=>i!==Number(t.dataset.band)&&y.min===v)){toast("Two grades can't start at the same percent");render();return}x.min=v}
    else if(t.dataset.f==="code"){x.code=t.value.trim().slice(0,3)||"?"}else x.name=t.value.trim();
    b.sort((p,q)=>q.min-p.min);b[b.length-1].min=0;state.settings.scale=b;state.settings.scaleKey="custom";save();render();return}
  if(t.id==="supportBelow"){state.settings.supportBelow=clamp(Number(t.value)||0,0,100);save();render();toast("Saved");return}
  if(t.id==="restoreFile"&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.classes||!d.students)throw 0;const ui=state.ui;state={...d,v:2,ui};ensure();save();render();toast("Backup restored")}catch(err){toast("That file is not a Classbook backup")}};fr.readAsText(t.files[0]);return}
  if(t.dataset.hwcheck){const h=find("homework",t.dataset.hwcheck);h.done=h.done||{};if(t.checked)h.done[t.dataset.s]=true;else delete h.done[t.dataset.s];save();const n=$("#hwCount");if(n)n.textContent=`${Object.keys(h.done).length}/${roster(h.classId).length} turned in`;render();return}
  if(t.dataset.pageToggle){const p=t.dataset.pageToggle;state.ui.hidden=state.ui.hidden.filter(x=>x!==p);if(!t.checked)state.ui.hidden.push(p);save();renderNav();toast(t.checked?`${PAGES[p]} shown`:`${PAGES[p]} hidden`);return}
  if(t.dataset.weight){state.settings.weights[t.dataset.weight]=clamp(Number(t.value)||0,0,100);save();render();return}
  if(t.id==="w_on"){state.settings.weighted=t.checked;save();render();toast(t.checked?"Weighted grades on":"Weighted grades off");return}
  if(t.id==="y_start"||t.id==="y_end"){if(t.value)state.year[t.id==="y_start"?"start":"end"]=t.value;save();toast("School year saved");return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){state.ui.q=t.value;save();const pos=t.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos);return}
  if(t.id==="gsearch"){$("#gresults").innerHTML=searchResults(t.value);return}
  if(t.id==="repComment"){state.comments[state.ui.repStudent]=t.value;save();return}
  const sc=t.dataset.score;if(sc){const s=stu(t.dataset.s);const a=find("assessments",sc);let v=t.value;
    if(v===""){delete state.scores[sc][s.id]}else{v=clamp(Number(v),0,a.max);state.scores[sc][s.id]=v}
    t.classList.toggle("miss",v===""&&a.date<=TODAY());save();updateGrades(s,a)}
});
document.addEventListener("blur",e=>{const sc=e.target.dataset&&e.target.dataset.score;if(sc){const v=state.scores[sc]?.[e.target.dataset.s];e.target.value=v??""}},true);
document.addEventListener("submit",e=>{if(e.target.id==="profileForm"){e.preventDefault();const nm=$("#p_mode").value;const modeChanged=nm!==state.profile.mode;state.profile={...state.profile,name:$("#p_name").value.trim()||"Teacher",school:$("#p_school").value.trim(),year:$("#p_year").value.trim()};if(modeChanged)applyMode(nm);state.ui.theme=$("#p_theme").value;save();render();toast("Profile saved")}});
/* drag & drop for seating */
let dragId=null;
document.addEventListener("dragstart",e=>{const d=e.target.closest("[data-drag]");if(!d)return;dragId=d.dataset.drag;try{e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move"}catch(err){}});
document.addEventListener("dragover",e=>{const z=e.target.closest("[data-drop]");if(!z||!dragId)return;e.preventDefault();$$(".over").forEach(x=>x!==z&&x.classList.remove("over"));z.classList.add("over")});
document.addEventListener("dragleave",e=>{const z=e.target.closest("[data-drop]");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=e.target.closest("[data-drop]");if(!z||!dragId)return;e.preventDefault();const cid=state.ui.classId;
  if(z.dataset.drop==="wait")unseat(cid,dragId);else placeStudent(cid,dragId,Number(z.dataset.drop));dragId=null;seatSel=null;save();const y=scrollY;render();scrollTo(0,y)});
document.addEventListener("dragend",()=>{dragId=null;$$(".over").forEach(x=>x.classList.remove("over"))});

function updateGrades(s,a){
  const avg=studentAvg(s);const cell=$(`[data-avg="${s.id}"]`);if(cell)cell.innerHTML=`<div class="actions" style="justify-content:center;flex-wrap:nowrap"><span>${pct(avg)}</span>${gradeChip(avg)}</div>`;
  const col=$(`[data-colavg="${a.id}"]`);if(col)col.textContent=colAvg(a);
  const r=roster(state.ui.classId);const avgs=r.map(studentAvg).filter(x=>x!=null);
  $("#gAvg").textContent=pct(avgs.length?sum(avgs)/avgs.length:null);$("#gLow").textContent=avgs.filter(x=>x<supportBelow()).length;$("#gMiss").textContent=sum(r.map(missingCount));
}
function stopTimer(){tk.run=false;clearInterval(tk.timer)}
function tick(){tk.left=Math.max(0,tk.left-1);if(tk.left===0){stopTimer();toast("Time's up")}
  const t=$("#tkTime");if(t){t.textContent=mmss(tk.left);t.classList.toggle("end",tk.left===0);t.classList.toggle("run",tk.run)}
  if(tk.left===0&&state.ui.page==="toolkit")render()}

try{const qp=new URLSearchParams(location.search).get("page");if(qp&&PAGEFN[qp]){state.ui.page=qp;state.ui.welcomed=true;save();try{history.replaceState(null,"",location.pathname)}catch(e){}}}catch(e){}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;renderNav();if(state.ui.page==="settings")render()});
window.addEventListener("appinstalled",()=>{installEvt=null;renderNav();toast("The Classbook is installed")});
if(!EMBED&&!DEMO&&"serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
if(!EMBED&&!DEMO&&navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>{if(!p)return navigator.storage.persist()}).catch(()=>{})}
render();
if(DEMO){const bn=document.getElementById("demoBar");if(bn){bn.hidden=false;bn.querySelector("a").href=BUY_URL}}
if(!state.ui.welcomed)welcomeSheet();
})();

</script>
</body>
</html>
