:root{
  --bg:#F6F2F8; --bg-grad:linear-gradient(160deg,#FBEFF4 0%,#F4F1FA 45%,#EEF5FB 100%);
  --surface:#FFFFFF; --surface-2:#FAF8FC; --line:#ECE5F1; --line-2:#DDD4E6;
  --ink:#24213B; --ink-2:#5F5A7A; --ink-3:#9C97B5; --focus:#7B61D1;
  --pink:#F8CFDE; --pink-ink:#B23F6B; --pink-soft:#FDEFF4; --pink-mid:#F2A7C2;
  --mint:#C6EEDD; --mint-ink:#1B7D63; --mint-soft:#EAF8F1; --mint-mid:#8FD9BC;
  --sun:#FCE4A0; --sun-ink:#946400; --sun-soft:#FEF6DC; --sun-mid:#F6CD5E;
  --sky:#CDE0FA; --sky-ink:#2D63AE; --sky-soft:#EDF4FD; --sky-mid:#98BFF0;
  --lilac:#E1D5F7; --lilac-ink:#6848B8; --lilac-soft:#F3EEFC; --lilac-mid:#BFA8EE;
  --peach:#FCD9C6; --peach-ink:#B0521F; --peach-soft:#FEF0E8; --peach-mid:#F5AE88;
  --danger:#D2475F; --ok:#1B7D63;
  --r-lg:22px; --r:16px; --r-sm:11px; --r-xs:8px;
  --shadow:0 1px 2px rgba(60,40,90,.04),0 6px 22px -8px rgba(80,50,120,.12);
  --shadow-lg:0 20px 60px -15px rgba(50,30,90,.35);
  --sidebar:248px;
  --f-head:"Bricolage","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15141F; --bg-grad:linear-gradient(160deg,#1C1626 0%,#15141F 50%,#121822 100%);
  --surface:#1F1D2C; --surface-2:#252336; --line:#2F2C42; --line-2:#3C3853;
  --ink:#F1EEF9; --ink-2:#B9B4D0; --ink-3:#7F7A98; --focus:#B7A2F2;
  --pink:#4A2837; --pink-ink:#F5A9C6; --pink-soft:#2A1E27; --pink-mid:#C76D92;
  --mint:#1D4337; --mint-ink:#86DDBB; --mint-soft:#1A2A26; --mint-mid:#4DA588;
  --sun:#4A3A12; --sun-ink:#F4CD6A; --sun-soft:#2A2519; --sun-mid:#C49A2E;
  --sky:#1F3553; --sky-ink:#9EC4F5; --sky-soft:#1A2231; --sky-mid:#5D8BC9;
  --lilac:#35295A; --lilac-ink:#C6B2F5; --lilac-soft:#221E33; --lilac-mid:#8C72D6;
  --peach:#4D2E1F; --peach-ink:#F7B996; --peach-soft:#2A211D; --peach-mid:#C77C54;
  --danger:#F07A8E; --ok:#86DDBB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-body);color:var(--ink);background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;letter-spacing:-.01em;line-height:1.15}
a{color:inherit}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}.ico.lg{width:24px;height:24px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
::selection{background:var(--lilac)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app shell ---------- */
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--sidebar);padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(14px);border-right:1px solid var(--line);z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-head);font-size:19px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1}
.brand small{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nav-group{margin:10px 0 2px;padding:0 10px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.nav-group i{width:8px;height:8px;border-radius:50%;display:inline-block}
.nav-a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;font-weight:700;color:var(--ink-2);transition:background .15s,color .15s;width:100%;text-align:left}
.nav-a:hover{background:var(--surface-2);color:var(--ink)}
.nav-a.on{background:var(--c-soft,var(--lilac-soft));color:var(--c-ink,var(--lilac-ink))}
.nav-a.on .ico{stroke:var(--c-ink)}
.nav-a .count{margin-left:auto;font-size:11px;font-weight:800;background:var(--c,var(--lilac));color:var(--c-ink,var(--lilac-ink));padding:1px 8px;border-radius:20px}
.side-foot{margin-top:auto;padding-top:14px;display:flex;gap:6px;border-top:1px solid var(--line)}
.main{flex:1;margin-left:var(--sidebar);min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:30px;font-weight:800}
.top .sub{color:var(--ink-2);font-weight:600;margin-top:3px}
.top .grow{flex:1}
.mob-top{display:none}
.tabbar{display:none}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:12px;font-weight:800;font-size:14px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);transition:transform .08s,background .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.pri:hover{opacity:.92}
.btn.soft{background:var(--lilac-soft);border-color:transparent;color:var(--lilac-ink)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.icon{width:40px;padding:0}
.btn.icon.sm{width:32px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;height:42px;padding:0 13px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);outline:none;transition:border .15s,box-shadow .15s;font-weight:600}
textarea.inp{height:auto;min-height:80px;padding:10px 13px;resize:vertical}
.inp:focus{border-color:var(--focus);box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 18%,transparent)}
.inp.sm{height:34px;border-radius:10px;padding:0 10px;font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,20,80,.12)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;background:var(--c,var(--lilac-soft));color:var(--c-ink,var(--lilac-ink));white-space:nowrap}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:800;border:1.5px solid var(--line-2);color:var(--ink-2);background:var(--surface)}
.chip-btn.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* checkbox */
.ck{--c:var(--lilac-ink);appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);background:var(--surface);flex:none;cursor:pointer;display:grid;place-items:center;transition:all .15s;margin:0}
.ck:checked{background:var(--c);border-color:var(--c)}
.ck:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck.round{border-radius:50%}
.ck.big{width:26px;height:26px;border-radius:9px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h3{font-size:15px;font-weight:800}
.card-h .grow{flex:1}
.card-h .link{font-size:12px;font-weight:800;color:var(--ink-3)}
.card-h .link:hover{color:var(--ink)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.xs{font-size:12px}
.b{font-weight:800}
.num{font-family:var(--f-head);font-weight:800;letter-spacing:-.02em}
.empty{padding:22px 12px;text-align:center;color:var(--ink-3);font-weight:600;font-size:14px}
.empty .ico{width:30px;height:30px;margin:0 auto 6px;display:block;opacity:.6}

/* section pill header (the pastel signature) */
.pill{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--c);color:var(--c-ink);font-family:var(--f-head);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.pill .ico{width:18px;height:18px}
.t-pink{--c:var(--pink);--c-ink:var(--pink-ink);--c-soft:var(--pink-soft);--c-mid:var(--pink-mid)}
.t-mint{--c:var(--mint);--c-ink:var(--mint-ink);--c-soft:var(--mint-soft);--c-mid:var(--mint-mid)}
.t-sun{--c:var(--sun);--c-ink:var(--sun-ink);--c-soft:var(--sun-soft);--c-mid:var(--sun-mid)}
.t-sky{--c:var(--sky);--c-ink:var(--sky-ink);--c-soft:var(--sky-soft);--c-mid:var(--sky-mid)}
.t-lilac{--c:var(--lilac);--c-ink:var(--lilac-ink);--c-soft:var(--lilac-soft);--c-mid:var(--lilac-mid)}
.t-peach{--c:var(--peach);--c-ink:var(--peach-ink);--c-soft:var(--peach-soft);--c-mid:var(--peach-mid)}

/* progress */
.bar{height:9px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--c-mid,var(--lilac-mid));transition:width .4s}
.bar.thick{height:14px}

/* list rows */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;font-weight:600;color:var(--ink-3);font-size:12px}
.li.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:2px}
.li .amt{font-weight:800;font-variant-numeric:tabular-nums}
.li .acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.li:hover .acts,.li:focus-within .acts{opacity:1}
@media (hover:none){.li .acts{opacity:1}}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c-mid,var(--lilac-mid))}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.kpi .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:var(--c-ink);flex:none}
.kpi .v{font-family:var(--f-head);font-size:22px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.kpi .l{font-size:12px;font-weight:700;color:var(--ink-3)}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(260px,1.05fr) repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.today-card{background:linear-gradient(165deg,var(--lilac-soft),var(--surface) 60%)}
.date-big{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.date-big .d{font-family:var(--f-head);font-size:46px;font-weight:800;line-height:.9;letter-spacing:-.03em}
.date-big .m{font-weight:800;color:var(--ink-2);line-height:1.2}
.top3 .li{border-bottom:0;padding:8px 10px;margin-bottom:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px}
.top3 .n{font-family:var(--f-head);font-weight:800;color:var(--lilac-ink);width:16px}
.slot-empty{border:1.5px dashed var(--line-2)!important;background:transparent!important;color:var(--ink-3);font-weight:700;justify-content:center;cursor:pointer}
.sched .li{align-items:flex-start}
.sched .time{font-size:12px;font-weight:800;color:var(--ink-2);width:46px;padding-top:2px;font-variant-numeric:tabular-nums}
.sched .ev{flex:1;padding:6px 10px;border-radius:10px;background:var(--c-soft);border-left:3px solid var(--c-mid);font-weight:700;font-size:14px}
.big-money{font-family:var(--f-head);font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.water{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.glass{aspect-ratio:3/4;border-radius:7px 7px 10px 10px;border:2px solid var(--sky-mid);position:relative;overflow:hidden;background:var(--surface)}
.glass.full{background:linear-gradient(to top,var(--sky-mid) 72%,var(--sky) 72%)}
.glass:hover{transform:translateY(-2px)}
.meal-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.meal-row .k{width:74px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--sun-ink)}
.meal-row .v{flex:1;font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit-pill{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px;width:100%;text-align:left}
.habit-pill.on{background:var(--c-soft);border-color:var(--c-mid)}
.habit-pill .streak{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--peach-ink)}
.stack{display:flex;flex-direction:column;gap:8px}
.ring-wrap{display:flex;align-items:center;gap:14px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.legend span{display:flex;align-items:center;gap:7px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
svg text{font-family:var(--f-body)}
.chart-bars{display:flex;align-items:flex-end;gap:7px;height:110px;padding-top:6px}
.chart-bars .cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.chart-bars .cb i{width:100%;max-width:26px;border-radius:7px 7px 4px 4px;background:var(--c-mid);min-height:3px;transition:height .4s}
.chart-bars .cb.today i{background:var(--c-ink)}
.chart-bars .cb span{font-size:11px;font-weight:800;color:var(--ink-3)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:88px 1fr auto;gap:9px;align-items:center;font-size:13px;font-weight:700}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .val{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12px;font-weight:800}

/* quick add FAB + sheet */
.fab{position:fixed;right:26px;bottom:26px;width:58px;height:58px;border-radius:20px;background:var(--ink);color:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow-lg);z-index:40;transition:transform .15s}
.fab:hover{transform:scale(1.05) rotate(90deg)}
.fab .ico{width:26px;height:26px;stroke-width:2.5}
.scrim{position:fixed;inset:0;background:rgba(30,20,50,.38);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.sheet{background:var(--surface);border-radius:26px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:22px;animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
.sheet.wide{max-width:720px}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet-h h2{font-size:21px;font-weight:800;flex:1}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.sheet .form{display:flex;flex-direction:column;gap:12px}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:18px;background:var(--c-soft);border:1.5px solid transparent;font-weight:800;font-size:13px;color:var(--ink)}
.qa:hover{border-color:var(--c-mid)}
.qa .ic{width:46px;height:46px;border-radius:15px;background:var(--c);color:var(--c-ink);display:grid;place-items:center}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:14px;font-weight:800;font-size:14px;z-index:100;box-shadow:var(--shadow-lg);animation:pop .2s;display:flex;gap:12px;align-items:center}
.toast button{color:var(--sun-mid);font-weight:800}

/* confetti burst */
.burst{position:fixed;pointer-events:none;z-index:120}
.burst i{position:absolute;width:8px;height:8px;border-radius:2px;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* demo ribbon */
.demo-bar{position:sticky;top:0;z-index:25;margin:-26px -30px 18px;padding:10px 30px;background:var(--ink);color:var(--surface);display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px}
.demo-bar .grow{flex:1}
.demo-bar a{background:var(--sun-mid);color:#2a1e00;padding:6px 14px;border-radius:10px;font-weight:800;text-decoration:none}

/* ---------- responsive ---------- */
@media (max-width:1380px){.dash{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  :root{--sidebar:0px}
  .side{transform:translateX(-105%);transition:transform .25s;width:280px;box-shadow:var(--shadow-lg);background:var(--surface)}
  .side.open{transform:none}
  .main{padding:0 16px 110px}
  .mob-top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;margin:0 -16px 14px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px)}
  .mob-top .brand{padding:0}
  .mob-top .brand svg{width:28px;height:28px}
  .mob-top .brand b{font-size:17px}
  .top h1{font-size:25px}
  .top .hide-m{display:none}
  .dash{grid-template-columns:1fr}
  .kpis{gap:10px;margin-bottom:14px}
  .kpi{padding:11px 12px;gap:10px}
  .kpi .ic{width:36px;height:36px;border-radius:11px}
  .kpi .v{font-size:18px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:10px;height:66px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);z-index:40;padding:0 4px;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800;color:var(--ink-3)}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on .ico{background:var(--lilac);color:var(--lilac-ink);border-radius:10px;padding:3px;width:30px;height:26px}
  .tabbar .plus .ico{background:var(--ink);color:var(--surface);border-radius:14px;width:44px;height:44px;padding:10px;stroke-width:2.6}
  .fab{display:none}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:26px 26px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  .grid3{grid-template-columns:1fr 1fr}
  .demo-bar{margin:0 -16px 12px;padding:9px 16px;font-size:13px;top:0}
  .card{padding:15px;border-radius:20px}
}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.qa-grid{grid-template-columns:repeat(3,1fr)}.qa{padding:12px 4px;font-size:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.tabbar,.fab,.mob-top{display:none}.main{margin:0}}

/* ---------- view chrome ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:9px 14px;font-weight:800;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--c-mid,var(--lilac-mid))}
.sec{margin-bottom:18px}
.sec-h{display:flex;align-items:center;gap:9px;margin:0 2px 9px}
.sec-h h2{font-size:17px;font-weight:800}
.sec-h .grow{flex:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.cols-2-1{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat .l{font-size:12px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:var(--f-head);font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:0 8px 8px;white-space:nowrap}
table.tbl td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
table.tbl td.r,table.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr:hover td{background:var(--surface-2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-dow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center;padding-bottom:2px}
.cal-day{min-height:104px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;text-align:left;transition:border .15s}
.cal-day:hover{border-color:var(--lilac-mid)}
.cal-day.out{opacity:.45}
.cal-day.today{border:2px solid var(--lilac-ink);background:var(--lilac-soft)}
.cal-day .n{font-family:var(--f-head);font-weight:800;font-size:14px}
.cal-day .n span{float:right;font-size:10px;color:var(--ink-3);font-weight:800}
.cal-ev{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--c-soft);color:var(--c-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--c-mid)}
.cal-task{font-size:11px;font-weight:700;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:4px;align-items:center}
.cal-task.done{text-decoration:line-through;color:var(--ink-3)}
.week-grid{display:grid;grid-template-columns:56px repeat(7,minmax(104px,1fr));min-width:760px}
.week-grid .wh{position:sticky;top:0;background:var(--bg);z-index:2;padding:6px 4px;text-align:center;font-weight:800;font-size:12px;border-bottom:1px solid var(--line)}
.week-grid .wh b{display:block;font-family:var(--f-head);font-size:17px}
.week-grid .wh.today{color:var(--lilac-ink)}
.week-grid .hr{font-size:11px;font-weight:800;color:var(--ink-3);text-align:right;padding:2px 8px 0 0;height:54px;border-top:1px solid var(--line)}
.week-col{position:relative;border-left:1px solid var(--line)}
.week-col .slot{height:54px;border-top:1px solid var(--line)}
.week-col .slot:hover{background:var(--surface-2)}
.week-ev{position:absolute;left:3px;right:3px;border-radius:9px;padding:4px 7px;background:var(--c-soft);border-left:3px solid var(--c-mid);color:var(--c-ink);font-size:12px;font-weight:800;overflow:hidden;text-align:left}
.week-all{padding:4px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-height:34px;border-bottom:1px solid var(--line)}

/* habit grid */
.hgrid{display:grid;gap:4px;align-items:center}
.hcell{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--line);background:var(--surface)}
.hcell.on{background:var(--c-mid);border-color:var(--c-mid)}
.hcell.future{opacity:.35}
.hcell.td{outline:2px solid var(--ink);outline-offset:1px}
.hname{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}

/* meal grid */
.meal-grid{display:grid;grid-template-columns:86px repeat(7,minmax(120px,1fr));gap:6px;min-width:820px}
.meal-grid .mh{font-size:12px;font-weight:800;text-align:center;padding:4px 0;color:var(--ink-2)}
.meal-grid .mh.today{color:var(--lilac-ink)}
.meal-grid .mk{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--c-ink);display:flex;align-items:center}
.meal-cell{min-height:56px;border-radius:12px;border:1.5px dashed var(--line-2);padding:7px;font-size:12px;font-weight:700;text-align:left;background:var(--surface)}
.meal-cell.has{border-style:solid;background:var(--c-soft);border-color:transparent;color:var(--c-ink)}
.meal-cell:hover{border-color:var(--c-mid)}

/* goals */
.goal-card{border-left:5px solid var(--c-mid)}
.step{display:flex;align-items:center;gap:9px;padding:6px 0;font-weight:700;font-size:14px}
.step.done span{text-decoration:line-through;color:var(--ink-3)}
.step .grow{flex:1}

@media (max-width:900px){
  .cols,.cols3,.cols-2-1{grid-template-columns:1fr}
  .cal-day{min-height:70px;padding:5px;border-radius:10px}
  .cal-grid{gap:5px}
  .cal-day .n{font-size:12px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat .v{font-size:19px}
}
.week-grid .hr{grid-column:1}
.cal-grid{grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-day,.cal-day>*{min-width:0;max-width:100%}
.cols>*,.cols3>*,.cols-2-1>*,.dash>*,.stats>*{min-width:0}
.chart-bars .cb{min-width:0}
.chart-bars .cb span{overflow:hidden;max-width:100%}
@media (max-width:900px){.chart-bars{gap:3px}}
</style>

<script>/* ---- core.js ---- */

/* ---------- tiny utils ---------- */

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');

const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const byId = (arr, id) => arr.find(x => x.id === id);

/* ---------- dates (local, ISO yyyy-mm-dd) ---------- */
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };

const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthKey = s => s.slice(0, 7);
const dim = (y, m) => new Date(y, m, 0).getDate(); // m = 1..12
const dow = s => parse(s).getDay();
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const weekStartOf = s => { const ws = S.settings.weekStart; const d = dow(s); return addDays(s, -((d - ws + 7) % 7)); };
const weekDays = s => { const a = weekStartOf(s); return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(a, i)); };
const dowOrder = () => [0, 1, 2, 3, 4, 5, 6].map(i => (i + S.settings.weekStart) % 7);
const fmtD = (s, o = { month: 'short', day: 'numeric' }) => s ? parse(s).toLocaleDateString('en-US', o) : '';
const monthLabel = mk => { const [y, m] = mk.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const relDay = s => { const t = today(); const d = diffDays(t, s); if (d === 0) return 'Today'; if (d === 1) return 'Tomorrow'; if (d === -1) return 'Yesterday'; if (d > 1 && d < 7) return DOWL[dow(s)]; return fmtD(s); };
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); if (S.settings.clock === '24') return `${pad(h)}:${pad(m)}`; const ap = h >= 12 ? 'pm' : 'am'; const hh = h % 12 || 12; return m ? `${hh}:${pad(m)}${ap}` : `${hh}${ap}`; };

/* ---------- money & units ---------- */
const CURRENCIES = ['USD', 'EUR', 'GBP', 'CAD', 'AUD', 'NZD', 'CHF', 'SEK', 'NOK', 'DKK', 'PLN', 'MAD', 'AED', 'SAR', 'ZAR', 'INR', 'JPY', 'MXN', 'BRL'];
let _nf = null, _nfK = '';
function money(n, dec) {
  const c = S.settings.currency || 'USD';
  const k = c + (dec === 0 ? '0' : '2');
  if (_nfK !== k) { try { _nf = new Intl.NumberFormat('en-US', { style: 'currency', currency: c, minimumFractionDigits: dec === 0 ? 0 : 2, maximumFractionDigits: dec === 0 ? 0 : 2 }); } catch (e) { _nf = { format: v => c + ' ' + v.toFixed(2) }; } _nfK = k; }
  return _nf.format(n || 0);
}
const money0 = n => money(Math.round(n), 0);
const KG_LB = 2.20462;
const wUnit = () => S.settings.units === 'imperial' ? 'lb' : 'kg';
const wShow = kg => S.settings.units === 'imperial' ? +(kg * KG_LB).toFixed(1) : +(+kg).toFixed(1);
const wStore = v => S.settings.units === 'imperial' ? num(v) / KG_LB : num(v);

/* ---------- tones ---------- */
const TONES = ['pink', 'mint', 'sun', 'sky', 'lilac', 'peach'];
const tone = t => 't-' + (TONES.includes(t) ? t : 'lilac');

/* ---------- icons ---------- */
const IC = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h14V9"/><path d="M10 21v-6h4v6"/>',

  repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  target: '<circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.5"/>',
  wallet: '<rect x="2.5" y="5.5" width="19" height="15" rx="3.5"/><path d="M2.5 10h19"/><path d="M16 15h2"/>',
  coins: '<circle cx="8.5" cy="8.5" r="6"/><path d="M18.1 10.4a6 6 0 1 1-7.7 7.7"/><path d="M7.5 6.5h1.2v4"/>',
  utensils: '<path d="M3 2v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3Zm0 0v7"/>',
  cart: '<circle cx="8" cy="20.5" r="1.3"/><circle cx="18" cy="20.5" r="1.3"/><path d="M2 2.5h2.5l2.6 12.2a2 2 0 0 0 2 1.6h9.2a2 2 0 0 0 2-1.6L22 7H5.3"/>',
  dumbbell: '<path d="M6.5 6.5 17.5 17.5"/><path d="m21 21-1-1M3 3l1 1"/><path d="m18 22 4-4M2 6l4-4M3 10l7-7M14 21l7-7"/>',
  drop: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5S5 13 5 15a7 7 0 0 0 7 7z"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',

  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',

  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
  card: '<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/>',
  heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  star: '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>',
  bolt: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  play: '<path d="M7 4v16l13-8z"/>',
  pause: '<path d="M7 4h3v16H7zM14 4h3v16h-3z"/>',

};
const ico = (n, c = '') => `<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;
const LOGO = `<svg viewBox="0 0 40 40" aria-hidden="true"><g transform="translate(20 20)">${['#F2A7C2', '#F6CD5E', '#8FD9BC', '#98BFF0', '#BFA8EE', '#F5AE88'].map((c, i) => `<ellipse rx="6.4" ry="10.5" cy="-9" fill="${c}" transform="rotate(${i * 60})"/>`).join('')}<circle r="5.6" fill="#24213B"/><circle r="2.2" fill="#FCE4A0"/></g></svg>`;

/* ---------- state ---------- */
function blank() {
  return {
    v: 1, created: today(),
    settings: {
      name: '', currency: 'USD', weekStart: 1, units: 'metric', clock: '12', theme: 'auto', waterGoal: 8, onboarded: false,
      cats: [
        { id: 'home', name: 'Home', t: 'peach' }, { id: 'work', name: 'Work', t: 'sky' }, { id: 'health', name: 'Health', t: 'mint' },
        { id: 'personal', name: 'Personal', t: 'lilac' }, { id: 'errands', name: 'Errands', t: 'sun' }, { id: 'family', name: 'Family', t: 'pink' },
      ],
      expCats: [
        { id: 'groceries', name: 'Groceries', t: 'mint' }, { id: 'dining', name: 'Eating out', t: 'peach' }, { id: 'transport', name: 'Transport', t: 'sky' },
        { id: 'shopping', name: 'Shopping', t: 'pink' }, { id: 'fun', name: 'Fun', t: 'lilac' }, { id: 'health', name: 'Health & care', t: 'sun' }, { id: 'other', name: 'Other', t: 'lilac' },
      ],
    },
    tasks: [], routines: [], routineDone: {}, events: [], top3: {}, inbox: [],
    goals: [], habits: [], habitLog: {},
    income: [], extraIncome: [], bills: [], billPaid: {}, expenses: [], limits: {},
    debts: [], debtPays: [], debtPlan: { strategy: 'snowball', extra: 0 }, savings: [],
    recipes: [], mealPlan: {}, grocery: { items: [], checked: {} },
    workouts: [], people: [], weights: [], water: {},
  };
}
let S;
function merge(base, d) { // shallow-deep merge so new keys appear after updates
  for (const k in base) {
    if (!(k in d)) d[k] = base[k];
    else if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k]) && d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && k === 'settings') merge(base[k], d[k]);
  }
  return d;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return merge(blank(), JSON.parse(raw)); } catch (e) { console.warn(e); }
  return null;
}
let _saveT = 0;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save — storage is full or blocked'); }
  clearTimeout(_saveT); _saveT = setTimeout(idbBackup, 1200);
}
/* IndexedDB auto-backup (survives if localStorage gets cleared) */
function idb() { return new Promise((res, rej) => { try { const r = indexedDB.open('everyday', 1); r.onupgradeneeded = () => r.result.createObjectStore('b'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
async function idbBackup() { try { const db = await idb(); db.transaction('b', 'readwrite').objectStore('b').put(JSON.stringify(S), KEY); } catch (e) { } }
async function idbRestore() { try { const db = await idb(); return await new Promise(res => { const q = db.transaction('b').objectStore('b').get(KEY); q.onsuccess = () => res(q.result ? merge(blank(), JSON.parse(q.result)) : null); q.onerror = () => res(null); }); } catch (e) { return null; } }

/* ---------- lookups ---------- */
const cat = id => byId(S.settings.cats, id) || { id: 'none', name: 'No area', t: 'lilac' };
const ecat = id => byId(S.settings.expCats, id) || { id: 'other', name: 'Other', t: 'lilac' };

/* routines */
function routineOn(r, d) {
  if (r.paused) return false;
  if (r.start && d < r.start) return false;
  if (r.end && d > r.end) return false;
  switch (r.freq) {
    case 'daily': return true;
    case 'weekdays': { const w = dow(d); return w > 0 && w < 6; }
    case 'weekly': return (r.days || []).includes(dow(d));
    case 'monthly': { const dt = parse(d); const last = dim(dt.getFullYear(), dt.getMonth() + 1); return dt.getDate() === Math.min(r.dom || 1, last); }
    case 'interval': { const n = Math.max(1, r.every || 1); const k = diffDays(r.start || S.created, d); return k >= 0 && k % n === 0; }
    case 'yearly': return r.date && d.slice(5) === r.date.slice(5);
  }
  return false;
}
const routinesOn = d => S.routines.filter(r => routineOn(r, d)).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
const rDone = (r, d) => !!S.routineDone[r.id + '|' + d];
function freqLabel(r) {
  switch (r.freq) {
    case 'daily': return 'Every day';
    case 'weekdays': return 'Weekdays';
    case 'weekly': return (r.days || []).length === 7 ? 'Every day' : 'Weekly · ' + dowOrder().filter(i => (r.days || []).includes(i)).map(i => DOW[i]).join(', ');
    case 'monthly': return `Monthly · day ${r.dom}`;
    case 'interval': return `Every ${r.every} days`;
    case 'yearly': return `Yearly · ${fmtD(r.date)}`;
  }
  return '';
}
/* tasks */
const openTasks = () => S.tasks.filter(t => t.status !== 'done');
const tasksDue = d => S.tasks.filter(t => t.due === d);
const overdue = () => { const t = today(); return S.tasks.filter(x => x.status !== 'done' && x.due && x.due < t); };
const PRI = { high: { n: 'High', t: 'pink' }, med: { n: 'Medium', t: 'sun' }, low: { n: 'Low', t: 'mint' } };
const STATUS = { todo: 'To do', doing: 'In progress', done: 'Done' };

/* habits */
const hDone = (h, d) => !!S.habitLog[h.id + '|' + d];
function streak(h) { let d = today(), n = 0; if (!hDone(h, d)) d = addDays(d, -1); while (hDone(h, d)) { n++; d = addDays(d, -1); } return n; }

/* goals */
const goalPct = g => { const s = g.steps || []; if (!s.length) return g.done ? 100 : 0; return Math.round(s.filter(x => x.done).length / s.length * 100); };

/* finance */
const incomeTotal = mk => sum(S.income, x => x.amount) + sum(S.extraIncome.filter(x => monthKey(x.date) === mk), x => x.amount);
function billsFor(mk) { return S.bills.filter(b => !b.start || monthKey(b.start) <= mk).map(b => { const [y, m] = mk.split('-').map(Number); const day = Math.min(b.day || 1, dim(y, m)); return { ...b, date: `${mk}-${pad(day)}`, paid: !!S.billPaid[b.id + '|' + mk] }; }).sort((a, b) => a.date.localeCompare(b.date)); }
const expensesIn = mk => S.expenses.filter(e => monthKey(e.date) === mk);
function monthMoney(mk) {
  const inc = incomeTotal(mk), bills = sum(billsFor(mk), b => b.amount), spent = sum(expensesIn(mk), e => e.amount);
  const debtPay = sum(S.debtPays.filter(p => monthKey(p.date) === mk), p => p.amount);
  const saved = sum(S.savings.flatMap(s => (s.deposits || []).filter(d => monthKey(d.date) === mk)), d => d.amount);
  return { inc, bills, spent, debtPay, saved, left: inc - bills - spent - debtPay - saved };
}
const debtBal = d => Math.max(0, d.balance - sum(S.debtPays.filter(p => p.debtId === d.id), p => p.amount));
const saved = s => sum(s.deposits || [], d => d.amount);
function payoffPlan(strategy = S.debtPlan.strategy, extra = S.debtPlan.extra) {
  let ds = S.debts.map(d => ({ id: d.id, name: d.name, bal: debtBal(d), apr: +d.apr || 0, min: +d.min || 0 })).filter(d => d.bal > 0.005);
  const order = ds.slice().sort(strategy === 'avalanche' ? (a, b) => b.apr - a.apr || a.bal - b.bal : (a, b) => a.bal - b.bal || b.apr - a.apr).map(d => d.id);
  const done = {}; let month = 0, interest = 0; const totals = [sum(ds, d => d.bal)];
  const budget = sum(ds, d => d.min) + (+extra || 0);
  while (ds.some(d => d.bal > 0.005) && month < 600) {
    month++;
    ds.forEach(d => { if (d.bal > 0) { const i = d.bal * d.apr / 1200; d.bal += i; interest += i; } });
    let pool = budget;
    ds.forEach(d => { if (d.bal > 0) { const p = Math.min(d.min, d.bal); d.bal -= p; pool -= p; } });
    for (const id of order) { const d = ds.find(x => x.id === id); if (d.bal > 0 && pool > 0) { const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; } }
    ds.forEach(d => { if (d.bal <= 0.005 && !done[d.id]) { d.bal = 0; done[d.id] = month; } });
    totals.push(sum(ds, d => d.bal));
    if (month > 1 && totals[month] >= totals[month - 1] - 0.01 && pool <= 0) { return { months: Infinity, interest, done, order, totals, stuck: true }; }
  }
  return { months: month, interest, done, order, totals, stuck: month >= 600 };
}

/* ---------- charts (SVG) ---------- */
function donut(segs, { size = 120, w = 16, label = '', sub = '' } = {}) {
  const r = (size - w) / 2, c = 2 * Math.PI * r, tot = sum(segs, s => s.v) || 1; let off = 0;
  const arcs = segs.filter(s => s.v > 0).map(s => { const len = s.v / tot * c; const el = `<circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="${s.c}" stroke-width="${w}" stroke-dasharray="${Math.max(0, len - 2)} ${c}" stroke-dashoffset="${-off}" stroke-linecap="round" transform="rotate(-90 ${size / 2} ${size / 2})"/>`; off += len; return el; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"><circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="var(--surface-2)" stroke-width="${w}"/>${arcs}<text x="50%" y="${sub ? '47%' : '53%'}" text-anchor="middle" font-size="${size / 5.2}" font-weight="800" fill="var(--ink)" style="font-family:var(--f-head)">${label}</text>${sub ? `<text x="50%" y="63%" text-anchor="middle" font-size="${size / 11}" font-weight="700" fill="var(--ink-3)">${sub}</text>` : ''}</svg>`;
}
function ring(pct, { size = 64, w = 8, col = 'var(--c-mid)', label } = {}) {
  const r = (size - w) / 2, c = 2 * Math.PI * r, p = clamp(pct, 0, 100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="var(--surface-2)" stroke-width="${w}"/><circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${p / 100 * c} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/><text x="50%" y="55%" text-anchor="middle" font-size="${size / 4.4}" font-weight="800" fill="var(--ink)">${label ?? Math.round(p) + '%'}</text></svg>`;
}
function spark(vals, { w = 240, h = 70, col = 'var(--c-ink)', fill = 'var(--c-soft)', dots = true } = {}) {
  if (vals.length < 2) return `<div class="empty small">Add 2+ entries to see a trend</div>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1, px = 8;
  const pts = vals.map((v, i) => [px + i * (w - 2 * px) / (vals.length - 1), px + (1 - (v - mn) / rg) * (h - 2 * px)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible"><path d="${d} L${pts.at(-1)[0]} ${h} L${pts[0][0]} ${h}Z" fill="${fill}"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${dots ? `<circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>` : ''}</svg>`;
}
const vbars = (data, { h = 110, fmt = v => v } = {}) => { const mx = Math.max(1, ...data.map(d => d.v)); return `<div class="chart-bars" style="height:${h}px">${data.map(d => `<div class="cb ${d.on ? 'today' : ''}" title="${esc(d.l)}: ${fmt(d.v)}"><i style="height:${Math.max(3, d.v / mx * (h - 24))}px"></i><span>${esc(d.l)}</span></div>`).join('')}</div>`; };
const hbars = rows => { const mx = Math.max(1, ...rows.map(r => Math.max(r.v, r.max || 0))); return `<div class="hbars">${rows.map(r => `<div class="hbar ${tone(r.t)}"><span class="nm">${esc(r.l)}</span><div class="bar"><i style="width:${clamp(r.v / (r.max || mx) * 100, 0, 100)}%;${r.max && r.v > r.max ? 'background:var(--danger)' : ''}"></i></div><span class="val">${r.txt ?? r.v}</span></div>`).join('')}</div>`; };

  [84.2, 83.9, 83.1, 82.8, 82.9, 82.2].forEach((v, i, a) => D.weights.push({ id: id('w'), pid: D.people[1].id, date: d(-(a.length - 1 - i) * 9), kg: v }));
  const wo = [[-6, 'Walk', 35, 'sun'], [-5, 'Yoga', 45, 'lilac'], [-3, 'Run', 25, 'pink'], [-2, 'Strength', 40, 'sky'], [-1, 'Walk', 30, 'sun'], [0, 'Run', 22, 'pink'], [-8, 'Yoga', 45, 'lilac'], [-9, 'Run', 20, 'pink'], [-11, 'Swim', 30, 'sky'], [-13, 'Strength', 35, 'sky']];
  D.workouts = wo.map(([k, type, minutes]) => ({ id: id('wo'), date: d(k), type, minutes, pid: D.people[0].id, notes: '' }));
  for (let k = -20; k <= 0; k++) D.water[d(k)] = k === 0 ? 5 : 4 + ((k * 5 + 40) % 5);

}

/* ---------- Focus timer (ADHD-friendly) ---------- */
const TM = { total: 25 * 60, left: 25 * 60, run: false, t: 0, label: '' };
A.openTimer = () => { closeSheet(); timerSheet(); };
function timerSheet() {
  const m = Math.floor(TM.left / 60), s = TM.left % 60, pct = 100 - TM.left / TM.total * 100;
  sheet(sheetHead('Focus timer') + `<div style="display:flex;flex-direction:column;align-items:center;gap:14px" class="t-lilac">
    <div id="tm-ring">${ring(pct, { size: 190, w: 14, label: `${pad(m)}:${pad(s)}` })}</div>
    <input class="inp" id="tm-label" placeholder="What are you focusing on?" value="${esc(TM.label)}" style="text-align:center;max-width:320px">
    <div class="chips" style="justify-content:center">${[5, 10, 15, 25, 45].map(n => `<button class="chip-btn ${TM.total === n * 60 ? 'on' : ''}" data-a="tmSet" data-v="${n}">${n} min</button>`).join('')}</div>
    <div class="row"><button class="btn" data-a="tmReset">Reset</button><button class="btn pri" data-a="tmToggle" style="min-width:130px">${ico(TM.run ? 'pause' : 'play', 'sm')} ${TM.run ? 'Pause' : 'Start'}</button></div>
    <p class="xs muted" style="margin:0;font-weight:700;text-align:center">Short sprints beat long stares. Take a 5-minute break after each one.</p></div>`,
    { onMount: el => { $('#tm-label', el).oninput = e => TM.label = e.target.value; } });
}
function tmTick() {
  if (!TM.run) return; TM.left = Math.max(0, TM.total - Math.round((Date.now() - TM.t) / 1000));
  const r = $('#tm-ring'); if (r) { const m = Math.floor(TM.left / 60), s = TM.left % 60; r.innerHTML = ring(100 - TM.left / TM.total * 100, { size: 190, w: 14, label: `${pad(m)}:${pad(s)}` }); }
  const badge = $('#tm-badge'); if (badge) badge.textContent = `${pad(Math.floor(TM.left / 60))}:${pad(TM.left % 60)}`;
  if (TM.left <= 0) { TM.run = false; TM.left = TM.total; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { } beep(); toast('Time’s up — nice focus! Take a break ☕'); celebrate(); render(); if ($('#tm-ring')) timerSheet(); return; }
  setTimeout(tmTick, 500);
}
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 660 + t * 400; g.gain.setValueAtTime(.12, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .22); o.connect(g).connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + .25); }); } catch (e) { } }
A.tmSet = el => { TM.total = TM.left = +el.dataset.v * 60; TM.run = false; timerSheet(); render(); };
A.tmToggle = () => { if (TM.run) { TM.run = false; TM.total = TM.left; } else { TM.run = true; TM.t = Date.now() - (TM.total - TM.left) * 1000; TM.total = TM.total; tmTick(); } timerSheet(); render(); };
A.tmReset = () => { TM.run = false; TM.left = TM.total; timerSheet(); render(); };
const timerBadge = () => TM.run ? `<button class="btn soft" data-a="openTimer" title="Focus timer running">${ico('timer', 'sm')}<span id="tm-badge">${pad(Math.floor(TM.left / 60))}:${pad(TM.left % 60)}</span></button>` : `<button class="btn hide-m" data-a="openTimer">${ico('timer', 'sm')} Focus</button>`;

/* ---------- onboarding ---------- */
function onboarding() {
  sheet(`<div style="text-align:center;margin-bottom:8px"><div style="width:64px;margin:0 auto 8px">${LOGO}</div><h2 style="font-size:26px">Welcome to The Everyday</h2><p class="muted" style="margin:6px 0 0;font-weight:600">Your whole life, one calm place. Let’s set up the basics — it takes 20 seconds.</p></div>
  <form class="form" data-f="onboard" style="margin-top:14px">
    ${fld('Your first name', `<input class="inp" name="name" placeholder="e.g. Sam" autofocus>`)}
    <div class="grid3">${fld('Currency', `<select class="inp" name="currency">${CURRENCIES.map(c => opt(c, c, guessCurrency())).join('')}</select>`)}
    ${fld('Week starts', `<select class="inp" name="weekStart">${opt(1, 'Monday', 1)}${opt(0, 'Sunday', 1)}</select>`)}
    ${fld('Units', `<select class="inp" name="units">${opt('metric', 'kg / metric', guessUnits())}${opt('imperial', 'lb / imperial', guessUnits())}</select>`)}</div>
    <div class="grid2" style="margin-top:6px"><button class="btn" name="mode" value="sample" type="submit">${ico('spark', 'sm')} Explore with sample data</button><button class="btn pri" name="mode" value="fresh" type="submit">Start fresh ${ico('arrow', 'sm')}</button></div>
    <p class="xs muted" style="text-align:center;margin:0;font-weight:700">${ico('lock', 'sm')} Everything stays private on this device. No account, no cloud.</p>
  </form>`, { onClose: () => { if (!S.settings.onboarded) { S.settings.onboarded = true; save(); } } });
}
function guessCurrency() { try { const l = navigator.language || ''; if (/-(GB)$/.test(l)) return 'GBP'; if (/-(CA)$/.test(l)) return 'CAD'; if (/-(AU)$/.test(l)) return 'AUD'; if (/-(CH)$/.test(l)) return 'CHF'; if (/-(MA)$/.test(l)) return 'MAD'; if (/^(de|fr|es|it|nl|pt|fi|el)|-(DE|FR|ES|IT|NL|AT|BE|IE|PT|FI)$/.test(l)) return 'EUR'; } catch (e) { } return 'USD'; }
function guessUnits() { return /-(US|LR|MM)$/.test(navigator.language || '') ? 'imperial' : 'metric'; }
F.onboard = (d, form, sub) => {
  const set = { name: d.name, currency: d.currency, weekStart: +d.weekStart, units: d.units };
  S.settings.weekStart = +d.weekStart;
  if (sub === 'sample') { S = sampleData(d.name || 'Sam'); }
  Object.assign(S.settings, set, { onboarded: true });
  closeSheet(); commit(sub === 'sample' ? 'Sample data loaded — clear it anytime in Settings' : `Welcome${d.name ? ', ' + d.name : ''}! 🌼`);
};

/* ---------- event wiring ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el, e); });
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-f]'); if (!f) return; e.preventDefault();
  const sub = e.submitter?.value; F[f.dataset.f] && F[f.dataset.f](formData(f), f, sub);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); A.closeNav(); }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if (!typing && !$('.scrim') && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); A.quickAdd(); }
    if (e.key === 't') { e.preventDefault(); go('dashboard'); }
  }
});
window.addEventListener('hashchange', () => { const v = location.hash.replace('#/', ''); if (v && v !== cur && VIEWS[v]) { cur = v; render(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { applyTheme(); render(); });
// re-render at midnight so "today" rolls over
let _day = today(); setInterval(() => { if (today() !== _day) { _day = today(); render(); } }, 60000);

/* ---------- boot ---------- */
async function boot() {
  S = load();
  if (!S) S = await idbRestore();
  if (!S) { S = blank(); if (DEMO) { S = sampleData('Sam'); } }
  applyTheme();
  const v = location.hash.replace('#/', ''); cur = VIEWS[v] ? v : 'dashboard';
  render();
  if (!S.settings.onboarded && !DEMO) onboarding();
  save();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
}

/* ============ Budget ============ */
UI.budget = { mk: null };
const bMonth = () => UI.budget.mk || monthKey(today());

VR.budget = () => {

  let h = head('Budget', `${monthLabel(mk)} · ${paidN}/${bills.length} bills paid`, `

    <div class="stat t-lilac"><div class="l">Debt + savings</div><div class="v">${money0(mm.debtPay + mm.saved)}</div></div>
    <div class="stat" style="background:var(--ink);color:var(--surface)"><div class="l" style="color:var(--surface);opacity:.7">Left to spend</div><div class="v">${money(mm.left)}</div></div></div>`;
  h += `<div class="cols-2-1">

      <div class="card sec"><div class="card-h"><h3>Expenses this month</h3><span class="grow"></span><span class="xs muted b">${exps.length} entries</span></div>
        ${exps.length ? `<div class="scroll-x"><table class="tbl"><thead><tr><th>Date</th><th>What</th><th>Category</th><th class="r">Amount</th><th></th></tr></thead><tbody>
          ${exps.map(e => `<tr><td class="muted b xs">${fmtD(e.date)}</td><td class="b">${esc(e.name)}</td><td><span class="chip dot ${tone(ecat(e.cat).t)}" style="--c:var(--c-soft)">${esc(ecat(e.cat).name)}</span></td><td class="r b">${money(e.amount)}</td>

      <div class="card sec"><div class="card-h"><h3>Bills</h3><span class="grow"></span><button class="btn sm soft" data-a="addBill">${ico('plus', 'sm')} Bill</button></div>
        <div class="list">${bills.length ? bills.map(b => `<div class="li"><input type="checkbox" class="ck round" style="--c:var(--mint-ink)" data-c="toggleBill" data-id="${b.id}" data-m="${mk}" ${b.paid ? 'checked' : ''} aria-label="Paid">

          <span class="amt">${money(b.amount)}</span><span class="acts"><button class="btn icon sm ghost" data-a="delBill" data-id="${b.id}" aria-label="Delete">${ico('trash', 'sm')}</button></span></div>`).join('') : `<div class="empty small">No bills yet — add rent, phone, subscriptions…</div>`}</div>
        ${bills.length ? `<div class="row" style="justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><span class="b">Total</span><span class="b">${money(sum(bills, b => b.amount))}</span></div>` : ''}</div>
      <div class="card sec"><div class="card-h"><h3>Income</h3><span class="grow"></span><button class="btn sm soft" data-a="addIncome">${ico('plus', 'sm')} Income</button></div>
        <div class="list">${S.income.map(i => `<div class="li"><span class="dot t-mint"></span><button class="t" data-a="editIncome" data-id="${i.id}" style="text-align:left">${esc(i.name)}<small>every month</small></button><span class="amt">${money(i.amount)}</span>
          <span class="acts"><button class="btn icon sm ghost" data-a="delIncome" data-id="${i.id}" aria-label="Delete">${ico('trash', 'sm')}</button></span></div>`).join('')}
          ${S.extraIncome.filter(x => monthKey(x.date) === mk).map(i => `<div class="li"><span class="dot t-sun"></span><span class="t">${esc(i.name)}<small>one-off · ${fmtD(i.date)}</small></span><span class="amt">${money(i.amount)}</span>
          <span class="acts"><button class="btn icon sm ghost" data-a="delExtraIncome" data-id="${i.id}" aria-label="Delete">${ico('trash', 'sm')}</button></span></div>`).join('')}
          ${!S.income.length && !S.extraIncome.length ? `<div class="empty small">Add your paycheck to see what’s left to spend.</div>` : ''}</div></div>
    </div>
    <div>
      <div class="card sec t-mint"><div class="card-h"><h3>Where it went</h3></div>
        ${byCat.length ? `<div class="ring-wrap" style="margin-bottom:14px">${donut(byCat.filter(x => x.v > 0).map(x => ({ v: x.v, c: `var(--${x.c.t}-mid)` })), { size: 120, w: 16, label: money0(mm.spent), sub: 'spent' })}
        <div class="legend" style="flex:1">${byCat.filter(x => x.v > 0).slice(0, 6).map(x => `<span><i class="dot" style="background:var(--${x.c.t}-mid)"></i>${esc(x.c.name)}<b>${money0(x.v)}</b></span>`).join('')}</div></div>` : ''}
        <div class="card-h"><h3>Category limits</h3><span class="grow"></span><span class="xs muted b">tap to set</span></div>
        <div class="hbars">${S.settings.expCats.map(c => { const v = sum(exps.filter(e => e.cat === c.id), e => e.amount), lim = S.limits[c.id] || 0; return `<div class="hbar ${tone(c.t)}"><span class="nm">${esc(c.name)}</span><div class="bar"><i style="width:${lim ? clamp(v / lim * 100, 0, 100) : 0}%;${lim && v > lim ? 'background:var(--danger)' : ''}"></i></div>

      <div class="card sec"><div class="card-h"><h3>Daily spending</h3></div>${vbars(daily, { h: 110, fmt: money0 })}</div>

        <p class="small" style="margin:0;font-weight:600">${mm.left >= 0 ? `You have <b>${money(mm.left)}</b> left for the rest of ${MONTHS[+mk.slice(5) - 1]}${daysLeftMsg(mk)}` : `You’re <b style="color:var(--danger)">${money(-mm.left)}</b> over. Check the biggest category above and adjust one limit — that’s enough for today.`}</p></div>

};
function daysLeftMsg(mk) {
  if (mk !== monthKey(today())) return '.';
  const [y, m] = mk.split('-').map(Number), n = dim(y, m), left = n - parse(today()).getDate() + 1;
  const mm = monthMoney(mk);
  return ` — about <b>${money0(mm.left / left)}</b> a day for the ${left} day${left === 1 ? '' : 's'} left.`;
}
A.bMonth = el => { const v = +el.dataset.v; UI.budget.mk = v === 0 ? monthKey(today()) : addMonths(bMonth(), v); render(); };
A.setLimit = el => {
  const c = ecat(el.dataset.id);
  sheet(sheetHead(`${c.name} limit`) + `<form class="form" data-f="limit" data-id="${c.id}">${fld(`Monthly limit for ${c.name}`, `<input class="inp" name="v" inputmode="decimal" value="${S.limits[c.id] || ''}" placeholder="0 = no limit" autofocus>`)}
    <div class="sheet-f"><button type="button" class="btn" data-a="closeSheet">Cancel</button><button class="btn pri">Save</button></div></form>`);
};
F.limit = (d, form) => { const v = num(d.v); if (v > 0) S.limits[form.dataset.id] = v; else delete S.limits[form.dataset.id]; closeSheet(); commit('Limit saved'); };

/* bills */
A.addBill = () => billForm();
A.editBill = el => billForm(byId(S.bills, el.dataset.id));
function billForm(b) {
  const x = b || { name: '', amount: '', day: 1, cat: 'other', auto: false };
  sheet(sheetHead(b ? 'Edit bill' : 'New bill') + `<form class="form" data-f="bill" data-id="${b ? b.id : ''}">
    ${fld('Bill name', `<input class="inp" name="name" value="${esc(x.name)}" placeholder="e.g. Rent" required autofocus>`)}

    ${fld('Category', `<select class="inp" name="cat">${S.settings.expCats.map(c => opt(c.id, c.name, x.cat)).join('')}</select>`)}</div>

    <div class="sheet-f">${b ? `<button type="button" class="btn danger ghost" data-a="delBill" data-id="${b.id}" style="margin-right:auto">${ico('trash', 'sm')} Delete</button>` : ''}<button type="button" class="btn" data-a="closeSheet">Cancel</button><button class="btn pri">Save</button></div></form>`);

F.bill = (d, form) => {
  const o = { name: d.name, amount: num(d.amount), day: clamp(Math.round(num(d.day)) || 1, 1, 31), cat: d.cat, auto: !!d.auto };
  if (!o.name || !o.amount) return toast('Add a name and amount');
  const id = form.dataset.id; if (id) Object.assign(byId(S.bills, id), o); else S.bills.push({ id: uid(), start: monthKey(today()) + '-01', ...o });

};
A.delBill = el => { closeSheet(); withUndo('Bill deleted', () => { S.bills = S.bills.filter(b => b.id !== el.dataset.id); }); };

/* income */
A.addIncome = () => incomeForm();
A.editIncome = el => incomeForm(byId(S.income, el.dataset.id));
function incomeForm(i) {
  const x = i || { name: '', amount: '' };
  sheet(sheetHead(i ? 'Edit income' : 'Add income') + `<form class="form" data-f="income" data-id="${i ? i.id : ''}">
    ${fld('Where from', `<input class="inp" name="name" value="${esc(x.name)}" placeholder="e.g. Paycheck" required autofocus>`)}

F.income = (d, form) => {
  const amount = num(d.amount); if (!d.name || !amount) return toast('Add a name and amount');
  const id = form.dataset.id;
  if (id) Object.assign(byId(S.income, id), { name: d.name, amount });
  else if (d.kind === 'once') S.extraIncome.push({ id: uid(), name: d.name, amount, date: bMonth() + '-' + pad(Math.min(parse(today()).getDate(), 28)) });
  else S.income.push({ id: uid(), name: d.name, amount });
  closeSheet(); commit('Income saved');
};
A.delIncome = el => withUndo('Income removed', () => { S.income = S.income.filter(i => i.id !== el.dataset.id); });
A.delExtraIncome = el => withUndo('Income removed', () => { S.extraIncome = S.extraIncome.filter(i => i.id !== el.dataset.id); });

/* ---- views/calendar.js ---- */
/* ============ Calendar (month + week time-blocking) ============ */
UI.cal = { mode: 'month', cur: null };
const calCur = () => UI.cal.cur || today();

VR.calendar = () => {
  const c = calCur(), mode = UI.cal.mode;
  const label = mode === 'month' ? monthLabel(monthKey(c)) : (() => { const w = weekDays(c); return `${fmtD(w[0])} – ${fmtD(w[6], { month: 'short', day: 'numeric', year: 'numeric' })}`; })();
  let h = head('Calendar', label, `
    <div class="seg"><button class="${mode === 'month' ? 'on' : ''}" data-a="calMode" data-v="month">Month</button><button class="${mode === 'week' ? 'on' : ''}" data-a="calMode" data-v="week">Week</button></div>
    <div class="row" style="gap:4px"><button class="btn icon" data-a="calNav" data-v="-1" aria-label="Previous">${ico('left')}</button><button class="btn" data-a="calNav" data-v="0">Today</button><button class="btn icon" data-a="calNav" data-v="1" aria-label="Next">${ico('right')}</button></div>
    <button class="btn pri" data-a="addEvent" data-date="${c}">${ico('plus', 'sm')} Event</button>`);
  return h + (mode === 'month' ? monthView(c) : weekView(c));
};
function dayStuff(d) {
  return {
    evs: S.events.filter(e => e.date === d).sort((a, b) => (a.start || '').localeCompare(b.start || '')),
    tasks: S.tasks.filter(t => t.due === d),
    rts: routinesOn(d),
  };
}
function monthView(c) {
  const mk = monthKey(c), [y, m] = mk.split('-').map(Number), n = dim(y, m), t = today();
  const first = `${mk}-01`, lead = (dow(first) - S.settings.weekStart + 7) % 7;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(addDays(first, i - lead));
  for (let i = 0; i < n; i++) cells.push(addDays(first, i));
  while (cells.length % 7) cells.push(addDays(cells.at(-1), 1));
  return `<div class="card"><div class="cal-grid" style="margin-bottom:8px">${dowOrder().map(i => `<div class="cal-dow">${DOW[i]}</div>`).join('')}</div>
    <div class="cal-grid">${cells.map(d => {
      const { evs, tasks, rts } = dayStuff(d), out = monthKey(d) !== mk;
      const more = evs.length + tasks.length - 3;
      return `<button class="cal-day ${out ? 'out' : ''} ${d === t ? 'today' : ''}" data-a="calDay" data-d="${d}">
        <span class="n">${parse(d).getDate()}</span>
        ${evs.slice(0, 2).map(e => `<span class="cal-ev ${tone(e.t)}">${e.start ? fmtTime(e.start) + ' ' : ''}${esc(e.title)}</span>`).join('')}
        ${tasks.slice(0, Math.max(0, 3 - Math.min(2, evs.length))).map(x => `<span class="cal-task ${x.status === 'done' ? 'done' : ''}"><i class="dot ${tone(cat(x.cat).t)}" style="width:6px;height:6px"></i>${esc(x.title)}</span>`).join('')}
        ${more > 0 ? `<span class="xs muted b">+${more} more</span>` : ''}</button>`;
    }).join('')}</div></div>`;
}
function weekView(c) {
  const wd = weekDays(c), t = today(), H0 = 6, H1 = 23, px = 54;
  const pos = e => { const s = (+e.start.slice(0, 2)) + (+e.start.slice(3) / 60), en = e.end ? (+e.end.slice(0, 2)) + (+e.end.slice(3) / 60) : s + 1; return { top: (s - H0) * px, h: Math.max(26, (en - s) * px - 4) }; };
  return `<div class="card scroll-x"><div class="week-grid">
    <div class="wh"></div>${wd.map(d => `<div class="wh ${d === t ? 'today' : ''}">${DOW[dow(d)]}<b>${parse(d).getDate()}</b></div>`).join('')}
    <div class="hr" style="height:auto;border:0">all day</div>
    ${wd.map(d => `<div class="week-all">${dayStuff(d).tasks.slice(0, 3).map(x => `<button class="cal-task ${x.status === 'done' ? 'done' : ''}" data-a="editTask" data-id="${x.id}"><i class="dot ${tone(cat(x.cat).t)}" style="width:6px;height:6px"></i>${esc(x.title)}</button>`).join('')}</div>`).join('')}
    ${Array.from({ length: H1 - H0 + 1 }, (_, i) => `<div class="hr">${fmtTime(pad(H0 + i) + ':00')}</div>` + (i === 0 ? wd.map((d, ci) => `<div class="week-col" style="grid-row:3 / span ${H1 - H0 + 1};grid-column:${ci + 2}">
        ${Array.from({ length: H1 - H0 + 1 }, (_, j) => `<button class="slot" data-a="addEvent" data-date="${d}" data-start="${pad(H0 + j)}:00" aria-label="Add event"></button>`).join('')}
        ${S.events.filter(e => e.date === d && e.start).map(e => { const p = pos(e); return `<button class="week-ev ${tone(e.t)}" style="top:${p.top}px;height:${p.h}px" data-a="editEvent" data-id="${e.id}">${esc(e.title)}<div class="xs" style="font-weight:700;opacity:.8">${fmtTime(e.start)}</div></button>`; }).join('')}
      </div>`).join('') : '')).join('')}
  </div></div>`;
}
A.calMode = el => { UI.cal.mode = el.dataset.v; render(); };
A.calNav = el => { const v = +el.dataset.v; UI.cal.cur = v === 0 ? today() : (UI.cal.mode === 'month' ? addMonths(monthKey(calCur()), v) + '-01' : addDays(calCur(), v * 7)); render(); };
A.calDay = el => daySheet(el.dataset.d);
function daySheet(d) {
  const { evs, tasks, rts } = dayStuff(d);
  sheet(sheetHead(`${DOWL[dow(d)]}, ${fmtD(d, { month: 'long', day: 'numeric' })}`) + `
    <div class="row wrap" style="margin:-8px 0 14px"><button class="btn sm" data-a="addEvent" data-date="${d}">${ico('plus', 'sm')} Event</button><button class="btn sm" data-a="addTask" data-due="${d}">${ico('plus', 'sm')} Task</button></div>

/* ============ Dashboard ============ */
function greet() { const h = new Date().getHours(); return h < 5 ? 'Still up' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }

function todayItems() {
  const t = today();
  const od = overdue().map(x => ({ k: 'task', x, od: true }));
  const due = tasksDue(t).map(x => ({ k: 'task', x }));
  const rs = routinesOn(t).map(x => ({ k: 'routine', x }));
  const done = i => i.k === 'task' ? i.x.status === 'done' : rDone(i.x, t);
  return [...od, ...due, ...rs].sort((a, b) => done(a) - done(b) || (b.od ? 1 : 0) - (a.od ? 1 : 0) || ((a.x.time || '99') > (b.x.time || '99') ? 1 : -1));
}
function itemRow(i, d = today()) {
  if (i.k === 'task') {
    const t = i.x, c = cat(t.cat);
    return `<div class="li ${t.status === 'done' ? 'done' : ''} ${tone(c.t)}"><input type="checkbox" class="ck round" style="--c:var(--c-ink)" data-c="toggleTask" data-id="${t.id}" ${t.status === 'done' ? 'checked' : ''} aria-label="Done: ${esc(t.title)}">
      <button class="t" data-a="editTask" data-id="${t.id}" style="text-align:left">${esc(t.title)}<small>${i.od ? `<span style="color:var(--danger)">Overdue · ${relDay(t.due)}</span>` : esc(c.name)}${t.pri === 'high' ? ' · ❗' : ''}</small></button><span class="dot"></span></div>`;
  }
  const r = i.x, c = cat(r.cat), dn = rDone(r, d);
  return `<div class="li ${dn ? 'done' : ''} ${tone(c.t)}"><input type="checkbox" class="ck round" style="--c:var(--c-ink)" data-c="toggleRoutine" data-id="${r.id}" data-d="${d}" ${dn ? 'checked' : ''} aria-label="Done: ${esc(r.title)}">
    <span class="t">${esc(r.title)}<small>${ico('repeat', 'sm').replace('class="ico sm"', 'class="ico sm" style="width:12px;height:12px;vertical-align:-1px"')} ${r.time ? fmtTime(r.time) + ' · ' : ''}Routine</small></span><span class="dot"></span></div>`;
}

/* dashboard actions */
A.setWater = el => { const t = today(), v = +el.dataset.v; S.water[t] = (S.water[t] || 0) === v ? v - 1 : v; if (S.water[t] === S.settings.waterGoal) celebrate(el); commit(); };
A.toggleHabit = el => { const k = el.dataset.id + '|' + el.dataset.d; if (S.habitLog[k]) delete S.habitLog[k]; else { S.habitLog[k] = 1; celebrate(el); } commit(); };
C.toggleBill = el => { const k = el.dataset.id + '|' + el.dataset.m; if (el.checked) { S.billPaid[k] = true; celebrate(el); } else delete S.billPaid[k]; commit(el.checked ? 'Marked as paid' : ''); };
A.unTop3 = el => { const t = today(); S.top3[t] = (S.top3[t] || []).filter(i => i !== el.dataset.id); commit(); };
A.pickTop3 = () => {
  const t = today(), chosen = S.top3[t] || [];
  const list = openTasks().filter(x => !chosen.includes(x.id)).sort((a, b) => ((a.due || '9') > (b.due || '9') ? 1 : -1) || (a.pri === 'high' ? -1 : 1));
  sheet(sheetHead('Pick a focus task') + `<p class="small muted" style="margin:-6px 0 12px;font-weight:600">Choose what matters most today. Everything else can wait.</p>
    <form data-f="newTop3" class="row" style="margin-bottom:10px"><input class="inp" name="title" placeholder="Or type a new task…"><button class="btn pri">Add</button></form>
    <div class="list">${list.length ? list.slice(0, 30).map(x => `<button class="li ${tone(cat(x.cat).t)}" data-a="setTop3" data-id="${x.id}" style="width:100%;text-align:left"><span class="dot"></span><span class="t">${esc(x.title)}<small>${x.due ? relDay(x.due) : 'No date'} · ${esc(cat(x.cat).name)}</small></span>${x.pri === 'high' ? '<span class="chip t-pink">High</span>' : ''}</button>`).join('') : '<div class="empty">No open tasks — add one above.</div>'}</div>`);
};
A.setTop3 = el => { const t = today(); S.top3[t] = [...(S.top3[t] || []), el.dataset.id].slice(0, 3); closeSheet(); commit(); };
F.newTop3 = d => { if (!d.title) return; const id = uid(); S.tasks.unshift({ id, title: d.title, cat: S.settings.cats[0]?.id, pri: 'high', due: today(), status: 'todo', notes: '', created: today() }); const t = today(); S.top3[t] = [...(S.top3[t] || []), id].slice(0, 3); closeSheet(); commit(); };
F.brainInline = (d, f) => { if (!d.text) return; S.inbox.unshift({ id: uid(), text: d.text, at: today() }); commit(); setTimeout(() => $('[data-f=brainInline] input')?.focus(), 0); };
A.inboxDel = el => withUndo('Removed', () => { S.inbox = S.inbox.filter(n => n.id !== el.dataset.id); });
A.inboxToTask = el => { const n = byId(S.inbox, el.dataset.id); if (!n) return; withUndo('Moved to Tasks', () => { S.inbox = S.inbox.filter(x => x !== n); S.tasks.unshift({ id: uid(), title: n.text, cat: S.settings.cats[0]?.id, pri: 'med', due: null, status: 'todo', notes: '', created: today() }); }); };

A.autoPlan = () => {
  const wd = weekDays(mWeek());
  let n = 0;
  wd.forEach(d => { S.mealPlan[d] = S.mealPlan[d] || {}; MEALS.forEach(([k]) => { if (!S.mealPlan[d][k]) { const pool = S.recipes.filter(r => r.type === k); if (pool.length) { S.mealPlan[d][k] = { r: pool[(n + d.charCodeAt(9) + k.length) % pool.length].id }; n++; } } }); });
  commit(n ? `Filled ${n} meals — swap anything you like` : 'Add some meals first (My meals tab)');
};
A.clearWeek = () => confirmBox('Clear all meals planned for this week?', () => { weekDays(mWeek()).forEach(d => delete S.mealPlan[d]); commit('Week cleared'); }, 'Clear');
function weekIngredients(ws) {
  const map = new Map();
  weekDays(ws).forEach(d => Object.values(S.mealPlan[d] || {}).forEach(v => {
    if (!v || !v.r) return; const r = byId(S.recipes, v.r); if (!r) return;
    (r.ingredients || []).forEach(i => { const key = i.name.toLowerCase(); const cur = map.get(key); if (cur) { cur.n++; if (i.qty && !cur.qty.includes(i.qty)) cur.qty += ', ' + i.qty; } else map.set(key, { name: i.name, aisle: i.aisle || 'Other', qty: i.qty || '', n: 1 }); });
  }));
  return [...map.values()].sort((a, b) => AISLES.indexOf(a.aisle) - AISLES.indexOf(b.aisle) || a.name.localeCompare(b.name));
}
A.planToGrocery = () => {
  const items = weekIngredients(mWeek()); if (!items.length) return toast('Plan a few meals first');
  let added = 0;
  items.forEach(i => { if (!S.grocery.items.some(x => x.name.toLowerCase() === i.name.toLowerCase() && !x.done)) { S.grocery.items.push({ id: uid(), name: i.name, qty: i.n > 1 ? `${i.n}×` : i.qty, aisle: i.aisle, done: false }); added++; } });
  save(); go('grocery'); toast(added ? `${added} items added to your list` : 'Everything is already on the list');
};

    else { S.expenses.forEach(e => { if (e.cat === id) e.cat = fb; }); S.bills.forEach(b => { if (b.cat === id) b.cat = fb; }); delete S.limits[id]; }
