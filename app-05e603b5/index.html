/* ---- views/tasks.js ---- */
/* ============ Tasks + Routines ============ */
UI.tasks = { q: '', status: 'open', cat: 'all', sort: 'due' };

VR.tasks = () => {
  const f = UI.tasks, t = today();
  let list = S.tasks.filter(x => {
    if (f.status === 'open' && x.status === 'done') return false;
    if (f.status !== 'open' && f.status !== 'all' && x.status !== f.status) return false;
    if (f.cat !== 'all' && x.cat !== f.cat) return false;
    if (f.q && !(x.title + ' ' + (x.notes || '')).toLowerCase().includes(f.q.toLowerCase())) return false;
    return true;
  });
  const PO = { high: 0, med: 1, low: 2 };
  list.sort((a, b) => f.sort === 'pri' ? PO[a.pri] - PO[b.pri] || (a.due || '9').localeCompare(b.due || '9')
    : f.sort === 'az' ? a.title.localeCompare(b.title)
      : f.sort === 'new' ? (b.created || '').localeCompare(a.created || '')
        : (a.due || '9999').localeCompare(b.due || '9999') || PO[a.pri] - PO[b.pri]);
  const groups = [['Overdue', x => x.due && x.due < t && x.status !== 'done'], ['Today', x => x.due === t], ['Tomorrow', x => x.due === addDays(t, 1)],
  ['This week', x => x.due > addDays(t, 1) && x.due <= addDays(t, 7)], ['Later', x => x.due > addDays(t, 7)], ['No date', x => !x.due], ['Done', x => x.status === 'done']];
  const used = new Set();
  const sections = groups.map(([name, fn]) => {
    const items = list.filter(x => !used.has(x.id) && (name === 'Done' ? x.status === 'done' : x.status !== 'done' && fn(x)));
    items.forEach(x => used.add(x.id));
    if (!items.length) return '';
    return `<div class="sec"><div class="sec-h"><h2>${name}</h2><span class="chip ${name === 'Overdue' ? 't-pink' : ''}">${items.length}</span></div>
      <div class="card" style="padding:8px 14px"><div class="list">${items.map(x => taskRow(x)).join('')}</div></div></div>`;
  }).join('');
  const open = openTasks().length, od = overdue().length;
  let h = head('Tasks', `${open} open · ${od ? `<b style="color:var(--danger)">${od} overdue</b> · ` : ''}${S.tasks.filter(x => x.status === 'done').length} done`,
    `<button class="btn pri" data-a="addTask">${ico('plus', 'sm')} New task</button>`);
  h += `<div class="toolbar"><input class="inp" style="max-width:260px" placeholder="Search tasks…" value="${esc(f.q)}" data-c="taskSearch" aria-label="Search tasks">
    <div class="seg">${[['open', 'Open'], ['todo', 'To do'], ['doing', 'In progress'], ['done', 'Done'], ['all', 'All']].map(([k, l]) => `<button class="${f.status === k ? 'on' : ''}" data-a="taskFilter" data-k="status" data-v="${k}">${l}</button>`).join('')}</div>
    <select class="inp" style="max-width:150px" data-c="taskFilterSel" data-k="cat">${opt('all', 'All areas', f.cat)}${S.settings.cats.map(c => opt(c.id, c.name, f.cat)).join('')}</select>
    <select class="inp" style="max-width:160px" data-c="taskFilterSel" data-k="sort">${opt('due', 'Sort: due date', f.sort)}${opt('pri', 'Sort: priority', f.sort)}${opt('new', 'Sort: newest', f.sort)}${opt('az', 'Sort: A–Z', f.sort)}</select></div>`;
  if (S.inbox.length) h += `<div class="card t-lilac sec" style="background:var(--lilac-soft)"><div class="card-h">${ico('inbox', 'sm')}<h3>Brain dump — sort these when you're ready</h3><span class="grow"></span><span class="chip">${S.inbox.length}</span></div>
    <div class="list">${S.inbox.map(n => `<div class="li"><span class="t" style="white-space:normal;font-weight:600">${esc(n.text)}</span><span class="acts"><button class="btn sm" data-a="inboxToTask" data-id="${n.id}">Make a task</button><button class="btn icon sm ghost" data-a="inboxDel" data-id="${n.id}" aria-label="Remove">${ico('x', 'sm')}</button></span></div>`).join('')}</div></div>`;
  return h + (sections || `<div class="card empty">${ico('leaf')}Nothing here. ${f.q || f.cat !== 'all' ? 'Try another filter.' : 'Add your first task.'}</div>`);
};
function taskRow(x) {
  const c = cat(x.cat), p = PRI[x.pri] || PRI.med;
  return `<div class="li ${x.status === 'done' ? 'done' : ''} ${tone(c.t)}">
    <input type="checkbox" class="ck round" style="--c:var(--c-ink)" data-c="toggleTask" data-id="${x.id}" ${x.status === 'done' ? 'checked' : ''} aria-label="Done: ${esc(x.title)}">
    <button class="t" data-a="editTask" data-id="${x.id}" style="text-align:left">${esc(x.title)}<small>${esc(c.name)}${x.notes ? ' · ' + esc(x.notes.slice(0, 40)) : ''}</small></button>
    ${x.status === 'doing' ? '<span class="chip t-sun">In progress</span>' : ''}
    ${x.pri === 'high' && x.status !== 'done' ? `<span class="chip t-pink">${p.n}</span>` : ''}
    ${x.due ? `<span class="chip" style="--c:var(--surface-2);--c-ink:${x.due < today() && x.status !== 'done' ? 'var(--danger)' : 'var(--ink-2)'}">${relDay(x.due)}</span>` : ''}
    <span class="acts"><button class="btn icon sm ghost" data-a="editTask" data-id="${x.id}" aria-label="Edit">${ico('edit', 'sm')}</button><button class="btn icon sm ghost" data-a="delTask" data-id="${x.id}" aria-label="Delete">${ico('trash', 'sm')}</button></span></div>`;
}
C.taskSearch = el => { UI.tasks.q = el.value; render(); setTimeout(() => { const i = $('[data-c=taskSearch]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 0); };
A.taskFilter = el => { UI.tasks[el.dataset.k] = el.dataset.v; render(); };
C.taskFilterSel = el => { UI.tasks[el.dataset.k] = el.value; render(); };

/* ---------- Routines ---------- */
VR.routines = () => {
  const t = today(), next14 = Array.from({ length: 14 }, (_, i) => addDays(t, i));
  const rows = S.routines.map(r => {
    const last7 = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
    const hits = last7.filter(d => routineOn(r, d)), done = hits.filter(d => rDone(r, d)).length;
    const nxt = next14.find(d => routineOn(r, d));
    return `<div class="li ${tone(cat(r.cat).t)}" style="padding:12px 4px">
      <input type="checkbox" class="ck round" style="--c:var(--c-ink)" data-c="toggleRoutine" data-id="${r.id}" data-d="${t}" ${rDone(r, t) ? 'checked' : ''} ${routineOn(r, t) ? '' : 'disabled title="Not scheduled today"'} aria-label="Done today">
      <button class="t" data-a="editRoutine" data-id="${r.id}" style="text-align:left">${esc(r.title)}${r.paused ? ' <span class="chip">paused</span>' : ''}<small>${freqLabel(r)}${r.time ? ' · ' + fmtTime(r.time) : ''} · ${esc(cat(r.cat).name)}</small></button>
      <span class="row" style="gap:3px">${last7.map(d => `<i title="${fmtD(d)}" style="width:9px;height:9px;border-radius:50%;background:${routineOn(r, d) ? (rDone(r, d) ? 'var(--c-mid)' : 'var(--line-2)') : 'transparent'};border:1px solid var(--line)"></i>`).join('')}</span>
      <span class="chip" style="--c:var(--surface-2);--c-ink:var(--ink-2)">${nxt ? (nxt === t ? 'Today' : relDay(nxt)) : 'No date'}</span>
      <span class="acts"><button class="btn icon sm ghost" data-a="pauseRoutine" data-id="${r.id}" aria-label="Pause">${ico(r.paused ? 'play' : 'pause', 'sm')}</button><button class="btn icon sm ghost" data-a="delRoutine" data-id="${r.id}" aria-label="Delete">${ico('trash', 'sm')}</button></span></div>`;
  }).join('');
  const sched = S.routines.filter(r => !r.paused);
  let h = head('Routines', 'The things that repeat — set them once, let the app remember', `<button class="btn pri" data-a="addRoutine">${ico('plus', 'sm')} New routine</button>`);
  h += `<div class="card sec">${S.routines.length ? `<div class="list">${rows}</div>` : `<div class="empty">${ico('repeat')}No routines yet. Add the things you do again and again — meds, laundry, rent.</div>`}</div>`;
  if (sched.length) h += `<div class="sec"><div class="sec-h">${ico('calendar', 'sm')}<h2>Next 14 days</h2><span class="xs muted b">generated automatically</span></div>
    <div class="card scroll-x"><table class="tbl" style="min-width:680px"><thead><tr><th>Routine</th>${next14.map(d => `<th class="r" style="width:34px">${DOW[dow(d)][0]}<br><span class="muted">${parse(d).getDate()}</span></th>`).join('')}</tr></thead>
    <tbody>${sched.map(r => `<tr><td class="b">${esc(r.title)}</td>${next14.map(d => `<td class="r">${routineOn(r, d) ? (rDone(r, d) ? `<span style="color:var(--mint-ink)">✓</span>` : `<i class="dot ${tone(cat(r.cat).t)}" style="display:inline-block"></i>`) : '<span class="muted">·</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  return h;
};
A.addRoutine = () => routineForm();
A.editRoutine = el => routineForm(byId(S.routines, el.dataset.id));
function routineForm(r) {
  const x = r || { title: '', cat: S.settings.cats[0]?.id, freq: 'daily', days: [1], dom: 1, every: 7, time: '', start: today() };
  const dayBtns = dowOrder().map(i => `<button type="button" class="chip-btn ${(x.days || []).includes(i) ? 'on' : ''}" data-a="pickDay" data-v="${i}">${DOW[i]}</button>`).join('');
  sheet(sheetHead(r ? 'Edit routine' : 'New routine') + `<form class="form" data-f="routine" data-id="${r ? r.id : ''}">
    ${fld('What repeats?', `<input class="inp" name="title" value="${esc(x.title)}" placeholder="e.g. Take the trash out" required autofocus>`)}
    <div class="grid2">${fld('Area', `<select class="inp" name="cat">${S.settings.cats.map(c => opt(c.id, c.name, x.cat)).join('')}</select>`)}
    ${fld('How often', `<select class="inp" name="freq" data-c="freqChange">${[['daily', 'Every day'], ['weekdays', 'Weekdays (Mon–Fri)'], ['weekly', 'Certain days of the week'], ['monthly', 'Monthly, on a day'], ['interval', 'Every N days']].map(([k, l]) => opt(k, l, x.freq)).join('')}</select>`)}</div>
    <div id="freq-extra">${freqExtra(x, dayBtns)}</div>
    <div class="grid2">${fld('Time (optional)', `<input class="inp" type="time" name="time" value="${x.time || ''}">`)}${fld('Starting from', `<input class="inp" type="date" name="start" value="${x.start || today()}">`)}</div>
    <div class="sheet-f">${r ? `<button type="button" class="btn danger ghost" data-a="delRoutine" data-id="${r.id}" style="margin-right:auto">${ico('trash', 'sm')} Delete</button>` : ''}<button type="button" class="btn" data-a="closeSheet">Cancel</button><button class="btn pri">Save</button></div></form>`);
}
function freqExtra(x, dayBtns) {
  if (x.freq === 'weekly') return fld('Which days', `<div class="chips" id="daypick">${dayBtns}</div><input type="hidden" name="days" value="${(x.days || []).join(',')}">`);
  if (x.freq === 'monthly') return fld('Day of the month', `<input class="inp" name="dom" inputmode="numeric" value="${x.dom || 1}">`);
  if (x.freq === 'interval') return fld('Repeat every … days', `<input class="inp" name="every" inputmode="numeric" value="${x.every || 7}">`);
  return '';
}
C.freqChange = el => { const f = el.closest('form'), cur = formData(f); cur.days = (cur.days || '').split(',').filter(Boolean).map(Number); $('#freq-extra', f).innerHTML = freqExtra({ ...cur, freq: el.value }, dowOrder().map(i => `<button type="button" class="chip-btn ${cur.days.includes(i) ? 'on' : ''}" data-a="pickDay" data-v="${i}">${DOW[i]}</button>`).join('')); };
A.pickDay = el => { el.classList.toggle('on'); const w = el.closest('.field'); $('input[name=days]', w).value = $$('.chip-btn.on', w).map(b => b.dataset.v).join(','); };
F.routine = (d, form) => {
  if (!d.title) return;
  const o = { title: d.title, cat: d.cat, freq: d.freq, time: d.time || '', start: d.start || today(), dom: clamp(Math.round(num(d.dom)) || 1, 1, 31), every: Math.max(1, Math.round(num(d.every)) || 7), days: (d.days || '').split(',').filter(x => x !== '').map(Number) };
  if (o.freq === 'weekly' && !o.days.length) o.days = [dow(today())];
  const id = form.dataset.id; if (id) Object.assign(byId(S.routines, id), o); else S.routines.push({ id: uid(), paused: false, ...o });
  closeSheet(); commit(id ? 'Routine saved' : 'Routine added');
};
A.pauseRoutine = el => { const r = byId(S.routines, el.dataset.id); r.paused = !r.paused; commit(r.paused ? 'Paused' : 'Back on'); };
A.delRoutine = el => { closeSheet(); withUndo('Routine deleted', () => { S.routines = S.routines.filter(r => r.id !== el.dataset.id); Object.keys(S.routineDone).forEach(k => { if (k.startsWith(el.dataset.id + '|')) delete S.routineDone[k]; }); }); };

boot();
</script>
</body>
