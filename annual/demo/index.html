/* accepts 1234.5 · 1,234.50 · 1.234,50 · 12,50 · 1 234,5 */
const numIn = (v, isRate=false) => {
  let s = String(v ?? '').trim().replace(/[\s\u00a0\u202f']/g,'');
  const neg = /^[-−]/.test(s); s = s.replace(/[^0-9.,]/g,'');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if(lc > -1 && ld > -1){ const dec = lc > ld ? ',' : '.'; s = s.split(dec === ',' ? '.' : ',').join(''); if(dec === ',') s = s.replace(',', '.'); }
  else if(lc > -1){ const parts = s.split(','); s = (parts.length === 2 && (parts[1].length !== 3 || isRate)) ? parts.join('.') : parts.join(''); }
  else if(ld > -1){ const parts = s.split('.'); if(parts.length > 2 || (!isRate && parts.length === 2 && parts[1].length === 3)) s = parts.join(''); }
  const n = parseFloat(s); return isFinite(n) ? r2(neg ? -n : n) : 0;
};
const acctOptions = sel => S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
const memberOptions = sel => S.settings.members.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('');
function catOptions(type, sel){
  const gs = type === 'income' ? GROUPS.filter(g=>g.id==='income') : GROUPS.filter(g=>g.id!=='income');
  return gs.map(G=>`<optgroup label="${G.name}">${catsOf(G.id).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
}

/* ---------- transaction form ---------- */
function txForm(t, preset={}){
  const isNew = !t;
  const f = t ? {...t} : { type: preset.type || 'expense', amount:'', catId: preset.catId || '', accountId: S.accounts[0]?.id || '', toAccountId: S.accounts[1]?.id || '', date: preset.date || (ymOf(today())===ui.month ? today() : ui.month+'-01'), note:'', memberId: ui.member || S.settings.members[0].id };
  if(isNew){ const c0 = cat(f.catId); f.toAccountId = c0 && c0.intoAccountId !== undefined ? (c0.intoAccountId||'') : (S.accounts.find(a=>a.type==='savings')?.id || S.accounts[1]?.id || ''); }
  const body = () => {
    const order = f.type==='income' ? ['income'] : ['spending','bills','savings','debt'];
    const cats = order.flatMap(g=>catsOf(g));
    if(f.type !== 'transfer' && !cats.find(c=>c.id===f.catId)) f.catId = cats[0]?.id || '';
    const catGrid = f.type === 'transfer' ? '' : `<div class="field"><span class="flabel">Category</span>${
      order.map(g=>{ const cs = catsOf(g); if(!cs.length) return ''; return `<div class="small muted" style="margin:6px 0 5px">${groupOf(g).name}</div><div class="catgrid">${cs.map(c=>`<button type="button" class="${f.catId===c.id?'on':''}" data-cat="${c.id}">${catIcon(c,26)}<span class="t">${esc(c.name)}</span></button>`).join('')}</div>`; }).join('')
    }</div>`;
    return `<div class="seg">${[['expense','Expense'],['income','Income'],['transfer','Transfer']].map(([k,n])=>`<button type="button" class="${f.type===k?'on':''}" data-type="${k}">${n}</button>`).join('')}</div>
    <div class="amtin"><span class="cur">${esc(curSymbol())}</span><input id="fAmt" inputmode="decimal" placeholder="0.00" value="${f.amount===''?'':esc(f.amount)}" aria-label="Amount"></div>
    ${catGrid}
    ${f.type==='transfer'
      ? `<div class="frow"><div class="field"><label>From</label><select id="fAcc">${acctOptions(f.accountId)}</select></div><div class="field"><label>To</label><select id="fTo">${acctOptions(f.toAccountId)}</select></div></div>`
      : `<div class="field"><label>Account</label><select id="fAcc">${S.accounts.length?acctOptions(f.accountId):'<option value="">No account</option>'}</select></div>`}
    <div class="field ${intoVisible()?'':'hidden'}" id="fIntoW"><label>${intoLabel()}</label><select id="fInto"><option value="">— nowhere, just count it</option>${acctOptions(f.toAccountId)}</select></div>
    <div class="frow"><div class="field"><label>Date</label><input id="fDate" type="date" value="${f.date}"></div>
    ${multiMember()?`<div class="field"><label>Who</label><select id="fMem">${memberOptions(f.memberId)}</select></div>`:'<div></div>'}</div>
    <div class="field"><label>Note</label><input id="fNote" value="${esc(f.note)}" placeholder="${f.type==='transfer'?'e.g. Move to savings':'e.g. Trader Joe’s'}"></div>
    ${t && t.recId ? `<p class="small muted">Logged from a recurring item. Editing here changes only this one.</p>`:''}`;
  };
  const intoVisible = () => f.type==='expense' && ['savings','debt'].includes(cat(f.catId)?.group) && S.accounts.length > 1;
  const intoLabel = () => cat(f.catId)?.group==='debt' ? 'Pays down account' : 'Moves money into';
  const read = sh => { f.amount = $('#fAmt',sh).value; f.accountId = $('#fAcc',sh)?.value||''; if(f.type==='transfer') f.toAccountId = $('#fTo',sh)?.value||null; else if(intoVisible()) f.toAccountId = $('#fInto',sh)?.value||null; f.date = $('#fDate',sh).value || today(); f.note = $('#fNote',sh).value.trim(); if($('#fMem',sh)) f.memberId = $('#fMem',sh).value; };
  const mount = sh => {
    const b = $('#shB', sh);
    b.onclick = e => {
      const ty = e.target.closest('[data-type]'); const ct = e.target.closest('[data-cat]');
      if(ty){ read(sh); f.type = ty.dataset.type; if(f.type==='transfer' && (!f.toAccountId || f.toAccountId===f.accountId)) f.toAccountId = S.accounts.find(a=>a.id!==f.accountId)?.id || ''; b.innerHTML = body(); }
      if(ct){ f.catId = ct.dataset.cat; $$('[data-cat]', b).forEach(x=>x.classList.toggle('on', x===ct));
        const w = $('#fIntoW', b); if(w){ w.classList.toggle('hidden', !intoVisible()); w.querySelector('label').textContent = intoLabel(); const c0 = cat(f.catId); if(c0 && c0.intoAccountId !== undefined) $('#fInto', b).value = c0.intoAccountId || ''; } }
    };
    if(isNew) setTimeout(()=>$('#fAmt',sh)?.focus(), 280);
    $('#saveTx', sh).onclick = () => {
      read(sh); const amt = numIn(f.amount);
      if(!(amt > 0)){ toast('Enter an amount'); $('#fAmt',sh).focus(); return; }
      if(f.type==='transfer' && f.accountId === f.toAccountId){ toast('Pick two different accounts'); return; }
      const rec = {id: t?t.id:uid(), date:f.date, type:f.type, amount:amt, catId: f.type==='transfer'?null:f.catId, accountId:f.accountId, toAccountId: (f.type==='transfer' || intoVisible()) ? (f.toAccountId||null) : null, note:f.note, memberId:f.memberId||null, recId: t?.recId||null, recDate: t?.recDate||null};
      if(t){ Object.assign(S.tx.find(x=>x.id===t.id), rec); } else S.tx.push(rec);
      save(); closeSheet(); render(); toast(t ? 'Saved' : 'Added');
    };
    const del = $('#delTx', sh);
    if(del) del.onclick = () => { const i = S.tx.findIndex(x=>x.id===t.id); const old = S.tx[i]; S.tx.splice(i,1); if(old.recId) S.skipped[recKey(old.recId, old.recDate)] = true; save(); closeSheet(); render(); toast('Deleted', ()=>{ S.tx.push(old); if(old.recId) delete S.skipped[recKey(old.recId, old.recDate)]; save(); render(); }); };
  };
  openSheet(isNew ? 'New transaction' : 'Edit transaction', body(), `${isNew?'':`<button class="btn danger" id="delTx" style="flex:0 0 auto">${I.trash}</button>`}<button class="btn pri" id="saveTx">${isNew?'Add':'Save'}</button>`, mount);
}

/* ---------- recurring form ---------- */
function recForm(r, preset={}){
  const isNew = !r;
  const f = r ? {...r} : {name:'', type: preset.type || 'expense', amount:'', catId:'', accountId:S.accounts[0]?.id||'', freq: preset.type==='income'?'biweekly':'monthly', start: today(), end:'', auto:true, memberId: S.settings.members[0].id};
  const body = () => `<div class="seg">${[['expense','Bill / expense'],['income','Income']].map(([k,n])=>`<button type="button" class="${f.type===k?'on':''}" data-type="${k}">${n}</button>`).join('')}</div>
    <div class="field mt12"><label>Name</label><input id="rName" value="${esc(f.name)}" placeholder="${f.type==='income'?'e.g. Paycheck':'e.g. Rent, Netflix'}"></div>
    <div class="frow"><div class="field"><label>Amount</label><input id="rAmt" inputmode="decimal" value="${esc(f.amount)}" placeholder="0.00"></div>
    <div class="field"><label>How often</label><select id="rFreq">${FREQS.map(x=>`<option value="${x.id}" ${f.freq===x.id?'selected':''}>${x.name}</option>`).join('')}</select></div></div>
    <div class="field"><label>Category</label><select id="rCat">${catOptions(f.type, f.catId)}</select></div>
    <div class="frow"><div class="field"><label>${isNew?'Next date':'First date'}</label><input id="rStart" type="date" value="${f.start}"></div>
    <div class="field"><label>Ends (optional)</label><input id="rEnd" type="date" value="${f.end||''}"></div></div>
    <div class="frow"><div class="field"><label>Account</label><select id="rAcc">${acctOptions(f.accountId)}</select></div>
    ${multiMember()?`<div class="field"><label>Whose</label><select id="rMem">${memberOptions(f.memberId)}</select></div>`:'<div></div>'}</div>
    <div class="field ${f.type==='expense' && ['savings','debt'].includes(cat(f.catId)?.group) ? '' : 'hidden'}" id="rIntoW"><label>${cat(f.catId)?.group==='debt'?'Pays down account':'Moves money into'}</label><select id="rInto"><option value="">— nowhere, just count it</option>${acctOptions(f.toAccountId)}</select></div>
    <div class="toggle"><div><div class="tl">Auto-post</div><div class="ts">Log it automatically on its date</div></div><button type="button" class="sw-t ${f.auto?'on':''}" id="rAuto" aria-label="Auto-post"></button></div>
    ${!isNew?`<div class="toggle"><div><div class="tl">Paused</div><div class="ts">Hide from calendar and stop posting</div></div><button type="button" class="sw-t ${f.paused?'on':''}" id="rPause" aria-label="Paused"></button></div>`:''}`;
  const read = sh => { f.name = $('#rName',sh).value.trim(); f.amount = $('#rAmt',sh).value; f.freq = $('#rFreq',sh).value; f.catId = $('#rCat',sh).value; f.start = $('#rStart',sh).value; f.end = $('#rEnd',sh).value; f.accountId = $('#rAcc',sh).value; if($('#rMem',sh)) f.memberId = $('#rMem',sh).value; f.toAccountId = $('#rIntoW',sh).classList.contains('hidden') ? null : ($('#rInto',sh).value||null); };
  openSheet(isNew ? (f.type==='income'?'New income':'New bill') : 'Edit recurring', body(),
    `${isNew?'':`<button class="btn danger" id="delRec" style="flex:0 0 auto">${I.trash}</button>`}<button class="btn pri" id="saveRec">Save</button>`, sh=>{
    const b = $('#shB', sh);
    b.onclick = e => {
      const ty = e.target.closest('[data-type]');
      if(ty){ read(sh); f.type = ty.dataset.type; f.catId=''; b.innerHTML = body(); }
      if(e.target.id==='rAuto'){ f.auto = !f.auto; e.target.classList.toggle('on', f.auto); }
      if(e.target.id==='rPause'){ f.paused = !f.paused; e.target.classList.toggle('on', f.paused); }
    };
    b.addEventListener('change', e => { if(e.target.id==='rCat'){ const c0 = cat(e.target.value); const on = f.type==='expense' && ['savings','debt'].includes(c0?.group); $('#rIntoW',sh).classList.toggle('hidden', !on); if(on){ $('#rIntoW label',sh).textContent = c0.group==='debt'?'Pays down account':'Moves money into'; if(c0.intoAccountId!==undefined) $('#rInto',sh).value = c0.intoAccountId||''; } } });
    $('#saveRec', sh).onclick = () => {
      read(sh); const amt = numIn(f.amount);
      if(!f.name){ toast('Give it a name'); return; }
      if(!(amt>0)){ toast('Enter an amount'); return; }
      if(!f.start){ toast('Pick a date'); return; }
      const rec = {...f, amount:amt, end: f.end||null};
      if(!r && rec.start < today() && rec.freq !== 'once'){ const nx = occurrences(rec, today(), addDays(today(), 400))[0]; if(nx) rec.start = nx; }
      if(r){ Object.assign(S.recurring.find(x=>x.id===r.id), rec); } else { rec.id = uid(); S.recurring.push(rec); }
      if(rec.auto) autoPost();
      save(); closeSheet(); render(); toast('Saved');
    };
    const del = $('#delRec', sh);
    if(del) del.onclick = () => confirmSheet('Delete “'+r.name+'”?', 'Future dates disappear from your calendar. Transactions already logged stay in your history.', 'Delete', ()=>{ S.recurring = S.recurring.filter(x=>x.id!==r.id); save(); render(); toast('Deleted'); });
  });
}

      const ar = $('#cArch',sh); if(ar) ar.onclick = () => { f.archived = !f.archived; ar.classList.toggle('on', f.archived); };
      $('#saveCat',sh).onclick = () => {

/* ---------- plan (budget) for one month ---------- */
function planForm(catId){
  const c = cat(catId); const ym = ui.month;
  const cur = planned(catId, ym);
  const hist = [1,2,3].map(i=>monthStats(ymAdd(ym,-i)).byCat[catId]||0);
  const avg = sum(hist)/3;
  openSheet(c.name, `
    <p class="small muted">Plan for ${ymLabel(ym)} · default ${m0(c.budget)} · 3-month average ${m0(avg)}</p>
    <div class="amtin"><span class="cur">${esc(curSymbol())}</span><input id="pAmt" inputmode="decimal" value="${cur||''}" placeholder="0"></div>
    <div class="btns" style="justify-content:center">${avg>0?`<button class="btn sm ghost" data-fill="${r2(avg)}">Use average</button>`:''}${hist[0]>0?`<button class="btn sm ghost" data-fill="${r2(hist[0])}">Last month (${m0(hist[0])})</button>`:''}</div>`,
    `<button class="btn ghost" id="pOnce">Only ${MON[+ym.slice(5)-1]}</button><button class="btn pri" id="pAll">Every month</button>`, sh=>{
      $('#shB',sh).onclick = e => { const b = e.target.closest('[data-fill]'); if(b) $('#pAmt',sh).value = b.dataset.fill; };
      $('#pOnce',sh).onclick = () => { (S.budgets[ym] = S.budgets[ym]||{})[catId] = numIn($('#pAmt',sh).value); save(); closeSheet(); render(); toast('Plan updated for '+MONTHS[+ym.slice(5)-1]); };
      $('#pAll',sh).onclick = () => { c.budget = numIn($('#pAmt',sh).value); for(const k in S.budgets){ if(k >= ym) delete S.budgets[k][catId]; } save(); closeSheet(); render(); toast('Default plan updated'); };
      setTimeout(()=>$('#pAmt',sh).select(), 280);
    });
}

/* ---------- account form ---------- */
function acctForm(a){
  const isNew = !a;
  const f = a ? {...a} : {name:'', type:'checking', opening:''};
  const bal = a ? acctBalance(a.id) : 0;
  openSheet(isNew?'New account':'Edit account', `
    <div class="field"><label>Name</label><input id="aName" value="${esc(f.name)}" placeholder="e.g. Main checking"></div>
    <div class="field"><label>Type</label><select id="aType">${ACCT_TYPES.map(t=>`<option value="${t.id}" ${f.type===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div>
    <div class="field"><label>${isNew?'Current balance':'Current balance (adjusts the starting balance)'}</label><input id="aBal" inputmode="decimal" value="${isNew?'':bal}" placeholder="0.00"><span class="small muted">For a credit card, enter what you owe as a negative number.</span></div>
    ${!isNew?`<div class="list mt8">${S.tx.filter(t=>t.accountId===a.id||t.toAccountId===a.id).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,8).map(t=>txItem(t,true)).join('')}</div>`:''}`,
    `${!isNew?`<button class="btn danger" id="delAcct" style="flex:0 0 auto">${I.trash}</button>`:''}<button class="btn pri" id="saveAcct">Save</button>`, sh=>{
      $('#saveAcct',sh).onclick = () => {
        f.name = $('#aName',sh).value.trim(); f.type = $('#aType',sh).value; const nb = numIn($('#aBal',sh).value);
        if(!f.name){ toast('Give it a name'); return; }
        if(a){ const o = acct(a.id); o.name = f.name; o.type = f.type; o.opening = r2((+o.opening||0) + (nb - bal)); }
        else S.accounts.push({id:uid(), name:f.name, type:f.type, opening:nb});
        save(); closeSheet(); render(); toast('Saved');
      };
      const del = $('#delAcct',sh);
      if(del) del.onclick = () => {
        if(S.tx.some(t=>t.accountId===a.id||t.toAccountId===a.id)){ toast('This account has transactions'); return; }
        S.accounts = S.accounts.filter(x=>x.id!==a.id); save(); closeSheet(); render(); toast('Deleted');
      };
      $('#shB',sh).addEventListener('click', e=>{ const it = e.target.closest('[data-act="edit-tx"]'); if(it){ e.stopPropagation(); closeSheet(); setTimeout(()=>txForm(S.tx.find(t=>t.id===it.dataset.id)), 280); } });
    });
}

/* ---------- data ---------- */
function download(name, text, type){
  const blob = new Blob([text], {type}); const u = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 2000);
}
function exportCSV(){
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const rows = [['Date','Type','Category','Group','Account','To account','Amount','Note','Person']];
  [...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{ const c = cat(t.catId); rows.push([t.date, t.type, c?.name||'', c?groupOf(c.group).name:'', acct(t.accountId)?.name||'', acct(t.toAccountId)?.name||'', t.amount, t.note, member(t.memberId)?.name||'']); });
  download(`the-annual-transactions-${today()}.csv`, rows.map(r=>r.map(q).join(',')).join('\n'), 'text/csv');
}

/* ---------- global events ---------- */
function toggleOcc(rid, d){
  const r = S.recurring.find(x=>x.id===rid); if(!r) return;
  const tx = postedFor(rid, d);
  if(tx){
    S.tx = S.tx.filter(x=>x.id!==tx.id);
    if(r.auto && d <= today()) S.skipped[recKey(rid,d)] = true;
    save(); render(); toast('Marked unpaid', ()=>{ S.tx.push(tx); delete S.skipped[recKey(rid,d)]; save(); render(); });
  } else {
    delete S.skipped[recKey(rid,d)];
    const n = txFromRec(r, d); S.tx.push(n);
    save(); render(); toast(r.type==='income' ? 'Marked received' : 'Marked paid', ()=>{ S.tx = S.tx.filter(x=>x.id!==n.id); save(); render(); });
  }
}
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if(go && S.setup){ ui.view = go.dataset.go; if(ui.view==='wealth') ui.wtool=''; closeSheet(); render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch(a){
    case 'close-sheet': closeSheet(); break;
    case 'm-prev': ui.month = ymAdd(ui.month,-1); render(); break;
    case 'm-next': ui.month = ymAdd(ui.month,1); render(); break;
    case 'm-today': ui.month = ymOf(today()); ui.calSel = today(); render(); break;

/* ---------- 50/30/20 ---------- */
function splitStats(ym){
  const st = monthStats(ym, ui.member);
  const a = {needs:0, wants:0, savings:0};
  for(const t of st.txs){ if(t.type!=='expense') continue; const b = bucketOf(cat(t.catId)); if(b) a[b] += +t.amount||0; }
  const base = st.income > 0 ? st.income : st.p.income;
  const pct = {}; for(const k in a) pct[k] = base > 0 ? Math.round(a[k]/base*100) : 0;
  return {a, base, pct, actualIncome: st.income > 0};
}
function wSplit(){

    const w = target > 0 ? Math.min(100, act/target*100) : 0;
    const msg = target <= 0 ? '' : isSave ? (diff>=0 ? `${m0(diff)} above target` : `${m0(-diff)} short of target`) : (diff>0 ? `${m0(diff)} over target` : `${m0(-diff)} under target`);
    return `<div class="card"><h3><span class="sw" style="background:${B.color}"></span>${B.name}<span class="sp"></span><span class="pill ${target<=0?'':good?'good':'bad'}">${sp.pct[B.id]}% · target ${tgt[B.id]}%</span></h3>
      <div class="between"><b class="num" style="font-size:24px;font-family:var(--serif);font-weight:500">${money(act,{dec:0})}</b><span class="small muted num">target ${money(target,{dec:0})}</span></div>
      <div class="bar mt8 ${!isSave && diff>0 && target>0?'over':''}"><i style="width:${w}%;background:${B.color}"></i></div>

/* ---------- spending breakdown ---------- */
function spendRows(from, to, group){
  const byCat = {};
  for(const t of txIn(from, to, t=>t.type==='expense' && (!ui.member || t.memberId===ui.member))) byCat[t.catId] = (byCat[t.catId]||0) + (+t.amount||0);
  const rows = Object.entries(byCat).map(([id,v])=>({c:cat(id)||{id, name:'Uncategorized', group:'spending'}, v})).filter(r=>!group || r.c.group===group).sort((a,b)=>b.v-a.v);
  return {rows, total: sum(rows, r=>r.v)};
}
function wSpend(){

  }

  const prevBy = {}; prev.rows.forEach(r=>prevBy[r.c.id]=r.v);
  const max = cur.rows[0]?.v || 1;
  const d = prev.total > 0 ? (cur.total - prev.total)/prev.total*100 : null;
  const rows = cur.rows.map(r=>{

    return `<div class="prow"><div class="n">${catIcon(r.c,28)}<span class="t">${esc(r.c.name)}</span></div><div class="a num"><b>${money(r.v,{dec:0})}</b> · ${cur.total>0?Math.round(r.v/cur.total*100):0}%</div>

  <div class="kpis k3 mt12">
    <div class="kpi"><div class="l">Total</div><div class="v num">${m0(cur.total)}</div><div class="s">${cur.rows.length} categories</div></div>
    <div class="kpi"><div class="l">Biggest</div><div class="v" style="font-size:15px">${cur.rows[0]?esc(cur.rows[0].c.name):'—'}</div><div class="s num">${cur.rows[0]?m0(cur.rows[0].v):''}</div></div>
    <div class="kpi"><div class="l">vs ${esc(pLabel)}</div><div class="v num" style="${d>0?'color:var(--bad)':d<0?'color:var(--good)':''}">${d==null?'—':(d>0?'+':'')+Math.round(d)+'%'}</div><div class="s num">${m0(prev.total)} before</div></div>

/* ---------- sinking funds ---------- */
function fundNeed(f){
  const bal = fundBalance(f); const left = Math.max(0, (+f.target||0) - bal);
  if(!f.date || left <= 0) return {left, perMonth:0, months:null};
  const months = Math.max(1, monthsBetween(today(), f.date) + (pd(f.date).getDate() >= pd(today()).getDate() ? 0 : 0));
  return {left, perMonth: r2(left/months), months};
}
function wFunds(){
  const saved = sum(S.funds, f=>fundBalance(f)), target = sum(S.funds, f=>+f.target||0);
  const cards = S.funds.map(f=>{
    const c = cat(f.catId); const bal = fundBalance(f); const pct = f.target>0 ? Math.min(100, bal/f.target*100) : 0;
    const nd = fundNeed(f); const plan = c ? planned(c.id, ymOf(today())) : 0;
    const done = f.target>0 && bal >= f.target;
    const status = done ? `<span class="pill good">Goal reached</span>` : nd.perMonth>0 ? (plan >= nd.perMonth - 0.5 ? `<span class="pill good">On track</span>` : `<span class="pill warn">+${m0(nd.perMonth - plan)}/mo needed</span>`) : '';
    const col = catColor(c);
    return `<div class="card fund"><div class="between" style="align-items:flex-start"><div class="row" style="min-width:0">${ring(pct, col)}<div style="min-width:0"><div class="t" style="font-weight:650">${esc(f.name)}</div><div class="small muted">${f.date?'by '+dLabel(f.date,{month:'short',year:'numeric'}):'no deadline'}</div></div></div><button class="iconbtn" data-act="edit-fund" data-id="${f.id}" aria-label="Edit fund">${I.gear}</button></div>
      <div class="between mt12"><b class="num" style="font-family:var(--serif);font-size:26px;font-weight:500">${money(bal,{dec:0})}</b><span class="small muted num">of ${money(f.target,{dec:0})}</span></div>
      <div class="bar mt8"><i style="width:${pct}%;background:${col}"></i></div>
      <div class="between small mt8"><span class="muted">${nd.perMonth>0 ? `Save ${m0(nd.perMonth)}/month · plan ${m0(plan)}` : done ? 'Nicely done.' : `${m0(nd.left)} to go`}</span>${status}</div>
      <div class="btns mt12"><button class="btn sm pri" data-act="fund-add" data-id="${f.id}">${I.plus} Add money</button><button class="btn sm ghost" data-act="fund-use" data-id="${f.id}">Use money</button></div>
    </div>`;
  }).join('');
  return toolHead('Sinking <i>funds</i>', 'Save a little each month for the big things you know are coming.') + `
  <div class="kpis k3 mt12"><div class="kpi"><div class="l">Saved</div><div class="v num">${m0(saved)}</div></div><div class="kpi"><div class="l">Goal</div><div class="v num">${m0(target)}</div></div><div class="kpi"><div class="l">Progress</div><div class="v num">${target>0?Math.round(saved/target*100):0}%</div></div></div>
  <div class="btns mt12"><button class="btn sm pri" data-act="add-fund">${I.plus} New fund</button></div>
  <div class="grid g3">${cards || `<div class="card"><div class="empty"><b>No funds yet</b>Holiday gifts, car repairs, a trip, a new laptop… give each one its own jar.</div></div>`}</div>`;
}
function ring(pct, col, size=44){
  const r = 18, C = 2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 44 44" style="flex:none"><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="5"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 22 22)"/><text x="22" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="Inter,system-ui,sans-serif">${Math.round(pct)}%</text></svg>`;
}

/* ---------- debt payoff ---------- */
function wDebt(){
  const method = S.debtMethod || 'avalanche', extra = +S.debtExtra || 0;
  const debts = S.debts;
  const total = sum(debts, d=>debtBalance(d)), orig = sum(debts, d=>+d.original||+d.balance||0);
  const plan = debts.length ? payoffPlan(debts, extra, method) : null;
  const other = debts.length ? payoffPlan(debts, extra, method==='avalanche'?'snowball':'avalanche') : null;
  const minOnly = debts.length ? payoffPlan(debts, 0, method) : null;
  const otherName = method==='avalanche' ? 'snowball' : 'avalanche';
  const t0 = ymOf(today());
  let chart = '';
  if(plan && !plan.stuck && plan.months > 0){
    const n = plan.series.length; const step = n > 36 ? 6 : n > 18 ? 3 : 1; const labels = [], vals = [];
    for(let i=0;i<n;i+=step){ const ym = ymAdd(t0, i); labels.push(MON[+ym.slice(5)-1] + (step>1 || i===0 ? " '" + ym.slice(2,4) : '')); vals.push(plan.series[i]); }
    chart = `<div class="card"><h3>Balance over time</h3>${barsHTML(labels, [{name:'Total owed', color:'var(--g-debt)', values:vals}], {height:170})}</div>`;
  }
  const byId = {}; debts.forEach(d=>byId[d.id]=d);
  const order = plan ? Object.entries(plan.payoff).sort((a,b)=>a[1]-b[1]) : [];
  const list = debts.map(d=>{
    const bal = debtBalance(d), o = +d.original || +d.balance || 0; const pct = o>0 ? Math.min(100, (1-bal/o)*100) : 0;
    const pm = plan?.payoff[d.id];
    return `<div class="item click" data-act="edit-debt" data-id="${d.id}">${ring(pct,'var(--g-debt)',40)}<div class="mid"><div class="t">${esc(d.name)}</div><div class="s">${d.apr}% APR · min ${m0(d.min)}${pm?' · paid off '+ymLabel(ymAdd(t0,pm),true):bal<=0?' · paid off':''}</div></div><div class="amt num">${money(bal,{dec:0})}<small>of ${m0(o)}</small></div></div>`;
  }).join('');
  const results = plan ? (plan.stuck ? `<div class="card mt12" style="border-color:var(--bad)"><b>Your payments don't cover the interest.</b><p class="small muted mt8">Raise a minimum payment or add an extra monthly amount so the balance can go down.</p></div>` : `
    <div class="card hero mt12"><span class="orn"></span><h3>Debt-free</h3><div class="big">${ymLabel(ymAdd(t0, plan.months))}</div>
      <div class="sub">${plan.months} months · ${money(plan.interest,{dec:0})} interest · ${money(plan.budget,{dec:0})}/month</div>
      <div class="row mt12" style="flex-wrap:wrap;gap:6px 14px;font-size:13px">${other && !other.stuck ? `<span>${other.interest>plan.interest ? 'Saves '+money(other.interest-plan.interest,{dec:0})+' vs '+otherName : other.interest<plan.interest ? otherName[0].toUpperCase()+otherName.slice(1)+' would save '+money(plan.interest-other.interest,{dec:0}) : 'Same cost as '+otherName}</span>`:''}${extra>0 && minOnly && !minOnly.stuck ? `<span>Extra payment saves ${minOnly.months-plan.months} months and ${money(minOnly.interest-plan.interest,{dec:0})}</span>`:''}</div>
    </div>`) : '';
  return toolHead('Debt <i>payoff</i>', 'Pick a strategy, add what extra you can, and see your debt-free date.') + `
  ${debts.length ? `<div class="kpis k3 mt12"><div class="kpi"><div class="l">Owed</div><div class="v num">${m0(total)}</div></div><div class="kpi"><div class="l">Paid off</div><div class="v num">${m0(Math.max(0,orig-total))}</div></div><div class="kpi"><div class="l">Progress</div><div class="v num">${orig>0?Math.round((1-total/orig)*100):0}%</div></div></div>
  <div class="card mt12"><h3>Strategy</h3>
    <div class="seg">${[['avalanche','Avalanche'],['snowball','Snowball']].map(([k,n])=>`<button class="${method===k?'on':''}" data-act="debt-method" data-t="${k}">${n}</button>`).join('')}</div>
    <p class="small muted mt8">${method==='avalanche'?'Highest interest rate first. Costs the least overall.':'Smallest balance first. Quick wins keep you going.'}</p>
    <div class="field mt12" style="margin-bottom:0"><label>Extra each month, on top of minimums</label><input id="debtExtra" inputmode="decimal" value="${extra||''}" placeholder="0"></div>
  </div>
  ${results}
  <div class="grid g2">${chart}<div class="card"><h3>Your debts<span class="sp"></span><a data-act="add-debt">Add</a></h3><div class="list">${list}</div>
    ${order.length ? `<p class="small muted mt12">Order: ${order.map(([id],i)=>`${i+1}. ${esc(byId[id]?.name||'')}`).join(' → ')}</p>`:''}</div></div>`
  : `<div class="card mt12"><div class="empty"><b>No debts added</b>Add each loan or card with its balance, interest rate and minimum payment.<div class="mt12"><button class="btn pri" data-act="add-debt">${I.plus} Add a debt</button></div></div></div>`}`;
}

/* ---------- net worth ---------- */
function wNetWorth(){
  const nw = netWorthAt();
  const since = trackingSince(); let startYm = ymOf(since); const endYm = ymOf(today());
  if(monthsBetween(startYm+'-01', endYm+'-01') > 11) startYm = ymAdd(endYm, -11);
  const months = []; for(let m = startYm; m <= endYm; m = ymAdd(m,1)) months.push(m);
  const hist = months.map(m=> m===endYm ? nw : netWorthAt(monthRange(m)[1]));
  const first = hist[0];
  const chart = months.length > 1 ? `<div class="card"><h3>Month by month<span class="sp"></span><span class="num" style="letter-spacing:0;text-transform:none;font-size:13px;color:${nw.net-first.net>=0?'var(--good)':'var(--bad)'}">${money(nw.net-first.net,{sign:true,dec:0})} since ${MON[+months[0].slice(5)-1]}</span></h3>${barsHTML(months.map(m=>MON[+m.slice(5)-1]), [{name:'Assets', color:'var(--g-income)', values:hist.map(h=>h.assets)},{name:'Owed', color:'var(--g-spending)', values:hist.map(h=>h.liab)}], {height:180, cur:months.length-1})}</div>` : '';
  const linked = new Set(S.debts.map(d=>d.accountId).filter(Boolean));
  const accA = S.accounts.map(a=>({a, b:acctBalance(a.id)}));
  const aRows = accA.filter(x=>x.b>=0).map(x=>`<div class="item click" data-go="accounts"><span class="ico" style="background:var(--surface-2);color:var(--ink-2)">${I.wallet}</span><div class="mid"><div class="t">${esc(x.a.name)}</div><div class="s">Account</div></div><div class="amt num">${money(x.b,{dec:0})}</div></div>`).join('')
    + S.assets.filter(x=>x.kind!=='liability').map(x=>`<div class="item click" data-act="edit-asset" data-id="${x.id}"><span class="ico" style="background:color-mix(in srgb,var(--g-income) 15%,transparent);color:var(--g-income)">${I.scale}</span><div class="mid"><div class="t">${esc(x.name)}</div><div class="s">Asset · you update it</div></div><div class="amt num">${money(x.value,{dec:0})}</div></div>`).join('');
  const lRows = accA.filter(x=>x.b<0 && !linked.has(x.a.id)).map(x=>`<div class="item click" data-go="accounts"><span class="ico" style="background:var(--surface-2);color:var(--ink-2)">${I.wallet}</span><div class="mid"><div class="t">${esc(x.a.name)}</div><div class="s">Account</div></div><div class="amt num">${money(-x.b,{dec:0})}</div></div>`).join('')
    + S.debts.map(d=>`<div class="item click" data-act="wtool" data-t="debt"><span class="ico" style="background:color-mix(in srgb,var(--g-debt) 15%,transparent);color:var(--g-debt)">${I.mountain}</span><div class="mid"><div class="t">${esc(d.name)}</div><div class="s">From Debt payoff</div></div><div class="amt num">${money(debtBalance(d),{dec:0})}</div></div>`).join('')
    + S.assets.filter(x=>x.kind==='liability').map(x=>`<div class="item click" data-act="edit-asset" data-id="${x.id}"><span class="ico" style="background:color-mix(in srgb,var(--g-spending) 15%,transparent);color:var(--g-spending)">${I.scale}</span><div class="mid"><div class="t">${esc(x.name)}</div><div class="s">You update it</div></div><div class="amt num">${money(x.value,{dec:0})}</div></div>`).join('');
  return toolHead('Net <i>worth</i>', 'Everything you own minus everything you owe. Accounts and debts update on their own.') + `
  <div class="grid g-hero">
    <div class="card hero"><span class="orn"></span><h3>Net worth today</h3><div class="big num">${money(nw.net,{dec:0})}</div><div class="sub">${money(nw.assets,{dec:0})} owned · ${money(nw.liab,{dec:0})} owed</div>
      <div class="meter"><i style="width:${nw.assets+nw.liab>0?nw.assets/(nw.assets+nw.liab)*100:0}%"></i></div><div class="row"><span>Assets are ${nw.liab>0?(nw.assets/nw.liab).toFixed(1)+'× what you owe':'all yours'}</span></div></div>
    ${chart}
  </div>
  <div class="btns mt12"><button class="btn sm pri" data-act="add-asset" data-k="asset">${I.plus} Add asset</button><button class="btn sm ghost" data-act="add-asset" data-k="liability">${I.plus} Add something you owe</button></div>
  <div class="grid g2"><div class="card"><h3><span class="sw" style="background:var(--g-income)"></span>Assets<span class="sp"></span><span class="num" style="letter-spacing:0;text-transform:none;color:var(--ink);font-size:13px">${m0(nw.assets)}</span></h3><div class="list">${aRows||'<div class="empty">Home, car, retirement account…</div>'}</div></div>
  <div class="card"><h3><span class="sw" style="background:var(--g-spending)"></span>Owed<span class="sp"></span><span class="num" style="letter-spacing:0;text-transform:none;color:var(--ink);font-size:13px">${m0(nw.liab)}</span></h3><div class="list">${lRows||'<div class="empty">Nothing owed. Lovely.</div>'}</div></div></div>`;
}

/* ---------- investment forecast ---------- */
function investSeries(p){
  const r = (+p.rate||0)/100/12, yrs = Math.max(1, Math.min(50, Math.round(+p.years||1))), infl = p.real ? 0.025 : 0;
  let bal = +p.start||0, contrib = +p.start||0; const rows = [];
  for(let y=1; y<=yrs; y++){
    for(let m=0;m<12;m++){ bal = bal*(1+r) + (+p.monthly||0); contrib += (+p.monthly||0); }
    const k = infl ? Math.pow(1+infl, y) : 1;
    rows.push({y, bal: r2(bal/k), contrib: r2(contrib/k)});
  }
  const last = rows[rows.length-1];
  return {rows, final:last.bal, contrib:last.contrib, growth: r2(last.bal-last.contrib)};
}
function wInvest(){
  const p = S.invest; const s = investSeries(p);
  const labels = s.rows.map(r=>'Y'+r.y);
  const chart = barsHTML(labels, [{name:'You put in', color:'var(--g-bills)', values:s.rows.map(r=>r.contrib)},{name:'Growth', color:'var(--g-income)', values:s.rows.map(r=>Math.max(0,r.bal-r.contrib))}], {height:210, stack:true});
  const miles = s.rows.filter(r=>r.y%5===0 || r.y===s.rows.length).map(r=>`<tr><td>Year ${r.y}<small>${new Date().getFullYear()+r.y}</small></td><td class="num">${money(r.contrib,{dec:0})}</td><td class="num">${money(r.bal-r.contrib,{dec:0})}</td><td class="num"><b>${money(r.bal,{dec:0})}</b></td></tr>`).join('');
  const invAcc = sum(S.accounts.filter(a=>a.type==='investment'), a=>acctBalance(a.id));
  const inp = (k, label, suf, step) => `<div class="field"><label>${label}</label><div class="row"><input data-inv="${k}" inputmode="decimal" value="${p[k]}" style="flex:1">${suf?`<span class="muted small" style="white-space:nowrap">${suf}</span>`:''}</div></div>`;
  return toolHead('Investment <i>forecast</i>', 'What steady investing could grow into. A projection, not a promise: real returns go up and down.') + `
  <div class="grid g-hero">
    <div class="card hero"><span class="orn"></span><h3>In ${p.years} years${p.real?' · today\'s money':''}</h3><div class="big num">${money(s.final,{dec:0})}</div>
      <div class="sub">${money(s.contrib,{dec:0})} put in · ${money(s.growth,{dec:0})} growth</div>
      <div class="meter"><i style="width:${s.final>0?s.contrib/s.final*100:0}%"></i></div><div class="row"><span>${s.final>0?Math.round(s.growth/s.final*100):0}% of it is growth</span></div></div>
    <div class="card"><h3>Your numbers</h3>
      <div class="frow">${inp('start','Starting amount')}${inp('monthly','Each month')}</div>
      <div class="frow">${inp('rate','Yearly return','%')}${inp('years','Years','yrs')}</div>
      <div class="toggle" style="padding-top:0"><div><div class="tl">Today's money</div><div class="ts">Adjust for 2.5% yearly inflation</div></div><button class="sw-t ${p.real?'on':''}" data-act="inv-real" aria-label="Today's money"></button></div>
      ${invAcc>0?`<button class="btn sm ghost" data-act="inv-mine" data-v="${invAcc}">Start from my investment accounts (${m0(invAcc)})</button>`:''}
    </div>
  </div>
  <div class="grid g2"><div class="card"><h3>Growth by year</h3>${chart}</div>

/* ---------- no-spend challenge ---------- */
function noSpendStats(ym){
  const [a,b] = monthRange(ym); const t0 = today();
  let count = 0, best = 0, run = 0, spendDays = 0, spendSum = 0;
  for(let d = a; d <= b && d <= t0; d = addDays(d,1)){
    const v = isNoSpend(d);
    if(v === true){ count++; run++; best = Math.max(best, run); }
    else { run = 0; if(v === false){ spendDays++; spendSum += spentOn(d); } }
  }
  let streak = 0; let d = isNoSpend(t0) ? t0 : addDays(t0,-1);
  while(isNoSpend(d) === true && streak < 400){ streak++; d = addDays(d,-1); }
  const avg = spendDays ? spendSum/spendDays : 0;
  return {count, best, streak, kept: r2(avg*count), avg};
}
function wNoSpend(){

  }
  const pct = Math.min(100, st.count/goal*100);
  return toolHead('No-spend <i>challenge</i>', 'Days with no everyday spending. Bills and savings don\'t count against you.') + `
  <div class="grid g-hero">

/* ---------- drag to reorder (touch + mouse) ---------- */
function makeSortable(list, onDone){
  if(!list) return;
  list.querySelectorAll('.drag').forEach(h=>{
    h.addEventListener('pointerdown', e=>{
      e.preventDefault(); e.stopPropagation();
      const item = h.closest('[data-sort]'); if(!item) return;
      item.classList.add('dragging');
      const move = ev => {
        ev.preventDefault();
        const sibs = [...list.querySelectorAll('[data-sort]')].filter(x=>x!==item);
        const after = sibs.find(s=>{ const r = s.getBoundingClientRect(); return ev.clientY < r.top + r.height/2; });
        if(after){ if(item.nextElementSibling !== after) list.insertBefore(item, after); } else if(list.lastElementChild !== item) list.appendChild(item);
      };
      const up = () => {
        document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        item.classList.remove('dragging');
        onDone([...list.querySelectorAll('[data-sort]')].map(x=>x.dataset.sort));
      };
      document.addEventListener('pointermove', move, {passive:false}); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    });
    h.addEventListener('click', e=>e.stopPropagation());
  });
}

/* ============ Excel export (.xlsx with live formulas, no library) ============ */
const XL = (()=>{
  const crcT = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = crcT[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  const enc = new TextEncoder();
  function zip(files){ // [{name, data(string)}] → Uint8Array, STORE method
    const parts = [], central = []; let off = 0;
    const d = new Date(); const dt = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(), tm = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
    for(const f of files){
      const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,tm,true); h.setUint16(12,dt,true);
      h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,tm,true); c.setUint16(14,dt,true);
      c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s,x)=>s+x.length,0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
    const all = [...parts, ...central, new Uint8Array(e.buffer)]; const out = new Uint8Array(all.reduce((s,x)=>s+x.length,0)); let p = 0; for(const x of all){ out.set(x,p); p+=x.length; } return out;
  }
  const x = s => String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const col = n => { let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
  const serial = ds => { const [y,m,d] = ds.split('-').map(Number); return (Date.UTC(y,m-1,d||1) - Date.UTC(1899,11,30))/864e5; };
  // styles: 0 normal · 1 header · 2 date · 3 money · 4 bold money · 5 month header · 6 bold text · 7 percent · 8 title · 9 group row text · 10 group row money · 11 input money (tinted)

      r.forEach((c,ci)=>{

        const ref = col(ci)+(ri+1);

</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  function book(sheets){ // [{name, xml}]

function buildWorkbook(){
  const y = budgetYearOf(ymOf(today())); const months = yearMonths(y);
  const txs = [...S.tx].sort((a,b)=>a.date.localeCompare(b.date));
  const N = Math.max(2, txs.length + 1); // last data row on Transactions
  const R = c => `Transactions!$${c}$2:$${c}$${N}`;
  // --- Transactions
  const tRows = [[{v:'Date',s:1},{v:'Type',s:1},{v:'Category',s:1},{v:'Group',s:1},{v:'Account',s:1},{v:'To account',s:1},{v:'Amount',s:1},{v:'Note',s:1},{v:'Person',s:1}]];
  for(const t of txs){ const c = cat(t.catId); tRows.push([{v:XL.serial(t.date),s:2}, t.type, c?.name||'', c?groupOf(c.group).name:'', acct(t.accountId)?.name||'', acct(t.toAccountId)?.name||'', {v:+t.amount||0,s:3}, t.note||'', member(t.memberId)?.name||'']); }
  // --- Year summary with live SUMIFS
  const yRows = [];
  yRows.push([{v:`The Annual — ${yearLabel(y)}`, s:8}]);
  yRows.push(['Every number below is a formula over the Transactions sheet. Change or add a transaction and the totals update.']);
  const hdr = [{v:'Category',s:1},{v:'Group',s:1}, ...months.map(m=>({v:XL.serial(m+'-01'),s:5})), {v:'Total',s:1},{v:'Monthly avg',s:1}];
  yRows.push(hdr);
  const C0 = 2, CT = C0 + 12; // first month col index, total col index
  const groupTotalRows = {};
  for(const G of GROUPS){
    const cats = S.categories.filter(c=>c.group===G.id && (!c.archived || txs.some(t=>t.catId===c.id)));
    if(!cats.length) continue;
    const first = yRows.length + 2; // excel row of first category (after group header)
    const gRowIdx = yRows.length; yRows.push(null); // placeholder for group header
    cats.forEach(c=>{
      const r = yRows.length + 1;
      const row = [c.name, G.name];
      months.forEach((m,i)=>{ const hc = XL.col(C0+i)+'$3'; row.push({f:`SUMIFS(${R('G')},${R('C')},$A${r},${R('A')},">="&${hc},${R('A')},"<"&EDATE(${hc},1))`, s:3}); });
      row.push({f:`SUM(${XL.col(C0)}${r}:${XL.col(C0+11)}${r})`, s:4}, {f:`${XL.col(CT)}${r}/12`, s:3});
      yRows.push(row);
    });
    const last = yRows.length;
    const gr = gRowIdx + 1;
    const grow = [{v:G.name,s:9},{v:'',s:9}];
    for(let i=0;i<=12;i++){ const cl = XL.col(C0+i); grow.push({f:`SUM(${cl}${first}:${cl}${last})`, s:10}); }
    grow.push({f:`${XL.col(CT)}${gr}/12`, s:10});
    yRows[gRowIdx] = grow; groupTotalRows[G.id] = gr;
  }
  yRows.push(null);
  const nr = yRows.length + 1; const net = [{v:'Net cash flow',s:6},''];
  for(let i=0;i<=12;i++){ const cl = XL.col(C0+i); const inc = groupTotalRows.income ? `${cl}${groupTotalRows.income}` : '0'; const outs = OUT_GROUPS.filter(g=>groupTotalRows[g]).map(g=>`${cl}${groupTotalRows[g]}`); net.push({f:`${inc}${outs.length?'-'+outs.join('-'):''}`, s:4}); }
  net.push({f:`${XL.col(CT)}${nr}/12`, s:4}); yRows.push(net);
  const sr = yRows.length + 1;
  yRows.push([{v:'Savings rate',s:6},'', ...Array.from({length:13},(_,i)=>{ const cl = XL.col(C0+i); return groupTotalRows.income && groupTotalRows.savings ? {f:`IF(${cl}${groupTotalRows.income}=0,0,${cl}${groupTotalRows.savings}/${cl}${groupTotalRows.income})`, s:7} : ''; })]);
  // --- Budget (editable plan + live actuals for the month in B3)
  const bRows = [[{v:'Budget plan', s:8}], ['Change the month in B3 or any yellow plan cell — Actual and Left update by themselves.'], [{v:'Month',s:6},{v:XL.serial(ymOf(today())+'-01'),s:5}], [{v:'Category',s:1},{v:'Group',s:1},{v:'Plan',s:1},{v:'Actual',s:1},{v:'Left',s:1},{v:'Used',s:1}]];
  for(const G of GROUPS){
    for(const c of S.categories.filter(c=>c.group===G.id && !c.archived)){
      const r = bRows.length + 1;
      bRows.push([c.name, G.name, {v:planned(c.id, ymOf(today())), s:11}, {f:`SUMIFS(${R('G')},${R('C')},$A${r},${R('A')},">="&$B$3,${R('A')},"<"&EDATE($B$3,1))`, s:3}, {f:`C${r}-D${r}`, s:3}, {f:`IF(C${r}=0,0,D${r}/C${r})`, s:7}]);
    }
  }
  // --- Accounts with live balances
  const aRows = [[{v:'Account',s:1},{v:'Type',s:1},{v:'Starting balance',s:1},{v:'Balance',s:1}]];
  S.accounts.forEach((a,i)=>{ const r = i+2; aRows.push([a.name, (ACCT_TYPES.find(t=>t.id===a.type)||{}).name||'', {v:+a.opening||0, s:11}, {f:`C${r}+SUMIFS(${R('G')},${R('E')},$A${r},${R('B')},"income")-SUMIFS(${R('G')},${R('E')},$A${r},${R('B')},"expense")-SUMIFS(${R('G')},${R('E')},$A${r},${R('B')},"transfer")+SUMIFS(${R('G')},${R('F')},$A${r})`, s:4}]); });
  // --- Wealth snapshot
  const w = [[{v:'Wealth snapshot', s:8}], [`As of ${today()}`], [], [{v:'Sinking fund',s:1},{v:'Goal',s:1},{v:'Saved',s:1},{v:'Progress',s:1},{v:'Target date',s:1}]];
  S.funds.forEach(f=>{ const r = w.length+1; w.push([f.name, {v:+f.target||0,s:3}, {v:fundBalance(f),s:3}, {f:`IF(B${r}=0,0,C${r}/B${r})`, s:7}, f.date ? {v:XL.serial(f.date), s:2} : '']); });
  w.push([]); w.push([{v:'Debt',s:1},{v:'Balance',s:1},{v:'APR %',s:1},{v:'Minimum',s:1}]);
  S.debts.forEach(d=>w.push([d.name, {v:debtBalance(d),s:3}, +d.apr||0, {v:+d.min||0,s:3}]));
  w.push([]); w.push([{v:'Asset / owed',s:1},{v:'Type',s:1},{v:'Value',s:1}]);
  S.assets.forEach(a=>w.push([a.name, a.kind==='liability'?'Owed':'Asset', {v:+a.value||0,s:3}]));
  const nw = netWorthAt(); w.push([]); w.push([{v:'Net worth',s:6}, {v:nw.net, s:4}]);
  return XL.book([
    {name:`Year ${y}`, xml:XL.sheet(yRows, {cols:[24,14,...Array(12).fill(12),14,14], freeze:3})},
    {name:'Budget', xml:XL.sheet(bRows, {cols:[24,14,13,13,13,9], freeze:4})},
    {name:'Transactions', xml:XL.sheet(tRows, {cols:[12,10,20,12,18,18,12,28,12], filter:`A1:I${N}`})},
    {name:'Accounts', xml:XL.sheet(aRows, {cols:[24,14,16,16]})},
    {name:'Wealth', xml:XL.sheet(w, {cols:[24,14,14,12,14], freeze:0})},
  ]);
}
function exportXLSX(){
  try {
    const data = buildWorkbook();
    const blob = new Blob([data], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = `the-annual-${today()}.xlsx`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 3000);
    toast('Excel file downloaded');
  } catch(e){ console.error(e); toast('Could not create the Excel file'); }
}

function guessCurrency(){
  try { const loc = navigator.language || 'en-US'; const reg = (loc.split('-')[1]||'').toUpperCase();
    const map = {US:'USD',CA:'CAD',GB:'GBP',AU:'AUD',NZ:'NZD',CH:'CHF',SE:'SEK',NO:'NOK',DK:'DKK',PL:'PLN',CZ:'CZK',JP:'JPY',IN:'INR',ZA:'ZAR',MX:'MXN',BR:'BRL',SG:'SGD',HK:'HKD',AE:'AED',SA:'SAR',MA:'MAD',TR:'TRY',PH:'PHP',NG:'NGN',DE:'EUR',FR:'EUR',ES:'EUR',IT:'EUR',NL:'EUR',BE:'EUR',AT:'EUR',IE:'EUR',PT:'EUR',FI:'EUR',GR:'EUR'};
    return map[reg] || 'USD'; } catch(e){ return 'USD'; }
}

function wzMonthly(){

    foot = back + `<button class="btn pri" data-wz="finish">Finish</button>`;
  }
  app.innerHTML = `<div class="wiz">${steps}<div class="body">${body}</div><div class="foot">${foot}</div></div><div class="toast" id="toast"></div>`;
}
function wzRead(){
  $$('[data-w]').forEach(i=>{ wz[i.dataset.w] = i.dataset.w==='startMonth' ? +i.value : i.value; });
  $$('[data-inc]').forEach(i=>{ wz.incomes[+i.dataset.inc][i.dataset.k] = i.value; });
  $$('[data-acc]').forEach(i=>{ wz.accounts[+i.dataset.acc][i.dataset.k] = i.value; });
  $$('[data-bill]').forEach(i=>{ wz.bills[+i.dataset.bill][i.dataset.k] = i.value; });
  $$('[data-plan]').forEach(i=>{ wz.plan[i.dataset.plan] = i.value; });
}
/* first due date AFTER today: the balance entered in setup already reflects today */
function nextDay(day){
  const t = pd(today()); let y = t.getFullYear(), m = t.getMonth()+1;
  if(Math.min(day, dim(y,m)) <= t.getDate()){ m++; if(m>12){m=1;y++;} }
  return `${y}-${pad(m)}-${pad(Math.min(day, dim(y,m)))}`;
}
function wzFinish(){
  S = blank();
  S.settings.name = wz.name.trim(); S.settings.currency = wz.currency; S.settings.startMonth = +wz.startMonth; S.settings.accent = wz.accent || 'forest'; if(wz.accent) S.settings.accentSet = true;
  S.settings.members = [{id:'m1', name: wz.name.trim() || 'Me'}];
  seedCats();
  const byName = n => S.categories.find(c=>c.name===n);
  // accounts
  wz.accounts.filter(a=>a.name.trim()).forEach(a=>S.accounts.push({id:uid(), name:a.name.trim(), type:a.type, opening:numIn(a.balance)}));
  if(!S.accounts.length) S.accounts.push({id:uid(), name:'Checking', type:'checking', opening:0});
  const main = S.accounts[0].id;
  S.settings.created = today();
  const savAcc = S.accounts.find(a=>a.type==='savings');
  S.categories.filter(c=>c.group==='savings').forEach(c=>c.intoAccountId = savAcc?.id || null);
  // income
  wz.incomes.filter(r=>numIn(r.amount)>0).forEach((r,i)=>{
    const c = byName(i===0 ? 'Salary' : 'Side income');
    c.budget = r2(c.budget + perMonth(numIn(r.amount), r.freq));
    const rr = {id:uid(), name:r.name.trim()||'Paycheck', type:'income', amount:numIn(r.amount), catId:c.id, accountId:main, freq:r.freq, start:r.date||today(), end:null, auto:true, memberId:'m1'};
    if(rr.start <= today()){ const nx = occurrences(rr, addDays(today(),1), addDays(today(),400))[0]; if(nx) rr.start = nx; }
    S.recurring.push(rr);
  });
  // bills
  wz.bills.filter(b=>numIn(b.amount)>0 && b.name.trim()).forEach(b=>{
    let c = byName(b.catName);
    if(!c){ const n = b.name.toLowerCase();
      c = byName(/rent|mortgage/.test(n)?'Rent / Mortgage':/electric|water|gas|power|util/.test(n)?'Utilities':/phone|internet|wifi|mobile/.test(n)?'Phone & Internet':/insur/.test(n)?'Insurance':/car|auto loan/.test(n)?'Car loan':/card|visa|master/.test(n)?'Credit card':/loan|debt/.test(n)?'Car loan':/sav/.test(n)?'Emergency fund':'Subscriptions'); }
    c.budget = r2(c.budget + numIn(b.amount));
    S.recurring.push({id:uid(), name:b.name.trim(), type:'expense', amount:numIn(b.amount), catId:c.id, accountId:main, toAccountId: c.intoAccountId||null, freq:'monthly', start:nextDay(+b.day), end:null, auto:true, memberId:'m1'});
  });
  for(const [n,v] of Object.entries(wz.plan)){ const c = byName(n); if(c) c.budget = r2(c.budget + numIn(v)); }
  S.setup = true; saveNow(); wz = null;
  ui.view = 'home'; ui.month = ymOf(today());
  $('#app').innerHTML = ''; autoPost(); render(); window.scrollTo(0,0);
  setTimeout(()=>toast('Welcome to your Annual'), 300);
}
document.addEventListener('click', e => {
  const sw = e.target.closest('[data-act="wz-accent"]'); if(sw && wz){ wzRead(); wz.accent = sw.dataset.k; renderWizard(); return; }
  const b = e.target.closest('[data-wz]'); if(!b) return;
  wzRead(); const a = b.dataset.wz, i = +b.dataset.i;
  if(a==='next'){ if(wz.step===2 && !wz.incomes.some(r=>numIn(r.amount)>0) && !wz.skipIncome){ wz.skipIncome = true; toast('No income added. Tap Continue again to add it later.'); return; } wz.step++; }
  if(a==='back') wz.step = Math.max(0, wz.step-1);
  if(a==='add-inc') wz.incomes.push({name:'Income '+(wz.incomes.length+1), amount:'', freq:'monthly', date:today()});
  if(a==='del-inc') wz.incomes.splice(i,1);
  if(a==='add-acc') wz.accounts.push({name:'', type:'checking', balance:''});
  if(a==='del-acc') wz.accounts.splice(i,1);
  if(a==='add-bill') wz.bills.push({name:'', catName:'', day:1, amount:''});
  if(a==='del-bill') wz.bills.splice(i,1);
  if(a==='sample'){ buildSample(); return; }
  if(a==='finish'){ wzFinish(); return; }
  renderWizard(); window.scrollTo(0,0);
});
document.addEventListener('input', e => {
  if(!wz || !e.target.closest('.wiz')) return;
  if(e.target.matches('[data-inc],[data-bill]')){ wzRead(); const m = wzMonthly(); if($('#wzInc')) $('#wzInc').textContent = money(m.inc); if($('#wzBills')) $('#wzBills').textContent = money(m.bills); }
  if(e.target.matches('[data-plan]')){ wzRead(); const m = wzMonthly(); const el = $('#ltp b'); if(el){ el.textContent = money(m.left); el.style.color = m.left<0?'var(--bad)':'var(--good)'; } }
});
document.addEventListener('change', e => { if(wz && e.target.matches('[data-w="currency"]')){ wzRead(); renderWizard(); } if(wz && e.target.matches('select[data-inc]')){ wzRead(); const el = $('#wzInc'); if(el) el.textContent = money(wzMonthly().inc); } });

/* ---------- sample data ---------- */
function buildSample(){
  let seed = 20260301; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const between = (a,b) => r2(a + rnd()*(b-a));
  const cur = S.settings.currency;
  S = blank();
  S.settings = Object.assign(S.settings, {name:'Alex', currency: cur || 'USD', startMonth:1, sample:true, members:[{id:'m1',name:'Alex'},{id:'m2',name:'Sam'}]});
  seedCats();
  const C = n => S.categories.find(c=>c.name===n).id;
  const budgets = {'Salary':4658,'Side income':3200,'Rent / Mortgage':1850,'Utilities':150,'Phone & Internet':145,'Insurance':142,'Subscriptions':67,'Groceries':680,'Dining out':320,'Transport':320,'Shopping':260,'Health':80,'Fun':120,'Personal care':60,'Gifts':50,'Emergency fund':400,'Vacation':200,'Credit card':0,'Car loan':310};
  S.categories.forEach(c=>c.budget = budgets[c.name]||0);
  S.categories.find(c=>c.name==='Side income').name = 'Sam’s salary';
  const chk = uid(), sav = uid(), card = uid();
  S.accounts = [{id:chk,name:'Joint checking',type:'checking',opening:3120},{id:sav,name:'High-yield savings',type:'savings',opening:5400},{id:card,name:'Visa card',type:'credit',opening:-1280}];
  S.categories.push({id:uid(), name:'Student loan', group:'debt', budget:140, ci:nextCi(), emoji:'🎓'});
  S.categories.push({id:uid(), name:'Car repairs', group:'savings', budget:75, ci:nextCi(), intoAccountId:sav, emoji:'🔧'});
  S.categories.push({id:uid(), name:'Holiday gifts', group:'savings', budget:60, ci:nextCi(), intoAccountId:sav, emoji:'🎄'});
  S.categories.forEach(c=>{ if(c.name==='Emergency fund'||c.name==='Vacation') c.intoAccountId = sav; });
  const t0 = today(); const start = ymAdd(ymOf(t0), -8) + '-01';
  // first Friday on/after start
  let fri = pd(start); while(fri.getDay()!==5) fri.setDate(fri.getDate()+1);
  const R = (name,type,amount,cat,freq,day,acc=chk,mem='m1',extra={}) => S.recurring.push({id:uid(), name, type, amount, catId:C(cat), accountId:acc, freq, start: typeof day==='string'?day:`${start.slice(0,8)}${pad(day)}`, end:null, auto:true, memberId:mem, ...extra});
  R('Alex — paycheck','income',2150,'Salary','biweekly',dstr(fri));
  R('Sam — salary','income',3200,'Sam’s salary','monthly',25,chk,'m2');
  R('Rent','expense',1850,'Rent / Mortgage','monthly',1);
  R('Electricity','expense',96,'Utilities','monthly',12);
  R('Water & trash','expense',54,'Utilities','monthly',19);
  R('Internet','expense',65,'Phone & Internet','monthly',18);
  R('Phone plan','expense',80,'Phone & Internet','monthly',22,chk,'m2');
  R('Car insurance','expense',142,'Insurance','monthly',5);
  R('Netflix','expense',15.49,'Subscriptions','monthly',9,card);
  R('Spotify','expense',11.99,'Subscriptions','monthly',14,card,'m2');
  R('Gym','expense',39,'Subscriptions','monthly',3,card);
  R('Emergency fund','expense',400,'Emergency fund','monthly',26,chk,'m1',{toAccountId:sav});
  R('Vacation fund','expense',200,'Vacation','monthly',27,chk,'m2',{toAccountId:sav});
  R('Car repairs fund','expense',75,'Car repairs','monthly',27,chk,'m1',{toAccountId:sav});
  R('Holiday gifts fund','expense',60,'Holiday gifts','monthly',27,chk,'m2',{toAccountId:sav});
  R('Student loan','expense',140,'Student loan','monthly',10,chk,'m2');
  R('Car loan','expense',310,'Car loan','monthly',20);
  autoPost();
  // everyday spending
  const spend = [['Groceries',[ 'Trader Joe’s','Costco','Whole Foods','Farmers market','Safeway'],6,45,140],['Dining out',['Thai Basil','Pizza night','Coffee','Sushi Go','Brunch'],9,12,62],['Transport',['Gas','Parking','Train pass','Uber'],5,18,62],['Shopping',['Target','Amazon','Zara','Home goods'],5,22,110],['Health',['Pharmacy','Dentist copay'],1,15,60],['Fun',['Cinema','Concert','Bowling','Books'],4,14,60],['Personal care',['Haircut','Skincare'],1,18,48],['Gifts',['Birthday gift','Flowers'],0.6,20,70]];
  let d = start;
  while(d <= t0){
    for(const [cn, notes, perMo, lo, hi] of spend){
      if(rnd() < perMo/30){
        S.tx.push({id:uid(), date:d, type:'expense', amount:between(lo,hi), catId:C(cn), accountId: rnd()<.35?card:chk, toAccountId:null, note:notes[Math.floor(rnd()*notes.length)], memberId: rnd()<.55?'m1':'m2', recId:null, recDate:null});
      }
    }
    d = addDays(d, 1);
  }
  // monthly: move money to savings + pay off the card in full
  for(let m = ymOf(start); m <= ymOf(t0); m = ymAdd(m,1)){
    const sv = m+'-28'; if(sv <= t0) S.tx.push({id:uid(), date:sv, type:'transfer', amount:1100, catId:null, accountId:chk, toAccountId:sav, note:'Move to savings', memberId:'m1', recId:null, recDate:null});
    const [ma,mb] = monthRange(m); const cardSpend = r2(sum(S.tx.filter(t=>t.accountId===card && t.type==='expense' && t.date>=ma && t.date<=mb), t=>t.amount));
    const pdte = ymAdd(m,1)+'-16'; if(pdte <= t0 && cardSpend>0) S.tx.push({id:uid(), date:pdte, type:'transfer', amount:cardSpend, catId:null, accountId:chk, toAccountId:card, note:'Visa card payoff', memberId:'m1', recId:null, recDate:null});
  }
  S.tx.push({id:uid(), date: addDays(start, 40), type:'income', amount:180, catId:C('Salary'), accountId:chk, toAccountId:null, note:'Tax refund', memberId:'m1', recId:null, recDate:null});
  // phase 2: funds, debts, assets
  const cid = n => S.categories.find(c=>c.name===n)?.id;
  const yr = +t0.slice(0,4);
  S.funds = [
    {id:uid(), name:'Emergency fund', target:12000, date:null, start:2600, catId:cid('Emergency fund')},
    {id:uid(), name:'Summer trip', target:3000, date:`${yr+1}-06-30`, start:450, catId:cid('Vacation')},
    {id:uid(), name:'Car repairs', target:1200, date:null, start:180, catId:cid('Car repairs')},
    {id:uid(), name:'Holiday gifts', target:800, date:`${yr}-12-10`, start:120, catId:cid('Holiday gifts')},
  ];
  S.fundMoves = [{id:uid(), fundId:S.funds[2].id, date:addDays(start, 95), amount:260, note:'New brake pads'}];
  S.debts = [
    {id:uid(), name:'Car loan', balance:14200, original:14200, apr:6.9, min:310, asOf:start, catId:cid('Car loan'), accountId:null},
    {id:uid(), name:'Student loan', balance:9800, original:9800, apr:4.5, min:140, asOf:start, catId:cid('Student loan'), accountId:null},
    {id:uid(), name:'Store card', balance:1450, original:1450, apr:24.9, min:45, asOf:t0, catId:cid('Credit card'), accountId:null},
  ];
  Object.assign(S.categories.find(c=>c.name==='Credit card'), {name:'Store card', budget:45});
  S.debtMethod = 'avalanche'; S.debtExtra = 150;
  S.assets = [{id:uid(), name:'Car', kind:'asset', value:15800},{id:uid(), name:'401(k)', kind:'asset', value:24300}];
  S.invest = {start:24300, monthly:450, rate:7, years:25, real:false};
  S.settings.created = start;
  S.setup = true; saveNow(); wz = null;
  ui.view = 'home'; ui.month = ymOf(today()); ui.member = '';
  $('#app').innerHTML = ''; render();
  if(window.__SHOWCASE){ S.settings.hideInstall = true; saveNow(); ui.month = ymAdd(ymOf(today()),-1); ui.calSel = ui.month+'-15'; render(); return; }
  setTimeout(()=>toast(window.__DEMO ? 'Demo with sample data — tap around freely' : 'Sample loaded — clear it anytime in Settings'), 300);
}

/* ---------- boot ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if(S.setup && ui.view==='home') render(); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && S && S.setup){ if(autoPost()) render(); } });
load();
if(window.__DEMO && !S.setup) buildSample();
else { if(S.setup) autoPost(); render(); }
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !window.__NO_SW){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
