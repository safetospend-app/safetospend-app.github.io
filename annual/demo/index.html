<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Annual — Demo</title>
<meta name="description" content="Your whole money year in one calm app: budget, bills, paychecks and the full-year picture.">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Annual">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE6; --surface:#FCFAF5; --surface-2:#F0EADF; --line:#E3DACB; --line-2:#D5CAB7;
  --ink:#1D2621; --ink-2:#56605A; --muted:#8B8F87;
  --primary:#244C3D; --primary-ink:#FCFAF5; --primary-soft:#DCE7DF;
  --accent:#B4574C; --accent-soft:#F4E0DB; --gold:#A57F33; --gold-soft:#F2E7CD;
  --good:#1F7A50; --bad:#B4413A; --warn:#A56B10;
  --g-income:#1F8A5C; --g-bills:#3B74B8; --g-spending:#D0625A; --g-savings:#1F9C95; --g-debt:#7A5BC4;
  --c1:#1F8A5C; --c2:#3B74B8; --c3:#D0625A; --c4:#1F9C95; --c5:#7A5BC4; --c6:#D69A1A; --c7:#B0478F; --c8:#A5611C; --c-other:#A09A8E;
  --shadow:0 1px 2px rgba(29,38,33,.04),0 8px 24px -12px rgba(29,38,33,.12);
  --r:18px; --r-sm:12px;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1A201C; --surface-2:#222924; --line:#2C342F; --line-2:#3A443E;
    --ink:#EFEBE2; --ink-2:#B8BCB3; --muted:#848A83;
    --primary:#8CC4A6; --primary-ink:#0F1512; --primary-soft:#23372D;
    --accent:#E08476; --accent-soft:#3A2522; --gold:#D6AE5C; --gold-soft:#342B19;
    --good:#5CC08E; --bad:#EE7A70; --warn:#E0A94A;
    --g-income:#2A9D69; --g-bills:#5B8FD1; --g-spending:#DB6A5F; --g-savings:#1FA49C; --g-debt:#9A80E0;
    --c1:#2A9D69; --c2:#5B8FD1; --c3:#DB6A5F; --c4:#1FA49C; --c5:#9A80E0; --c6:#BE861C; --c7:#D063AE; --c8:#B47A45; --c-other:#6E726B;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1A201C; --surface-2:#222924; --line:#2C342F; --line-2:#3A443E;
  --ink:#EFEBE2; --ink-2:#B8BCB3; --muted:#848A83;
  --primary:#8CC4A6; --primary-ink:#0F1512; --primary-soft:#23372D;
  --accent:#E08476; --accent-soft:#3A2522; --gold:#D6AE5C; --gold-soft:#342B19;
  --good:#5CC08E; --bad:#EE7A70; --warn:#E0A94A;
  --g-income:#2A9D69; --g-bills:#5B8FD1; --g-spending:#DB6A5F; --g-savings:#1FA49C; --g-debt:#9A80E0;
  --c1:#2A9D69; --c2:#5B8FD1; --c3:#DB6A5F; --c4:#1FA49C; --c5:#9A80E0; --c6:#BE861C; --c7:#D063AE; --c8:#B47A45; --c-other:#6E726B;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;width:100%;outline:none;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.num,.tab{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-optical-sizing:auto}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto;width:100%}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand .wm{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand .wm i{font-weight:400;color:var(--primary)}
.brand .yr{font-size:12px;color:var(--muted);letter-spacing:.08em}
.topbar .sp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
.monthpick{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthpick button{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.monthpick button:hover{background:var(--surface-2)}
.monthpick .lbl{font-weight:600;font-size:14px;min-width:92px;text-align:center;padding:0 4px;white-space:nowrap}
.pagehead{padding:14px 0 6px}
.pagehead h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.015em;line-height:1.1}
.pagehead h1 i{color:var(--primary)}
.pagehead p{color:var(--ink-2);font-size:14px;margin-top:4px}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;border-radius:12px;font-weight:500}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--primary)}
.bnav .fab{align-self:center;justify-self:center;width:52px;height:52px;border-radius:18px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;box-shadow:0 8px 20px -8px var(--primary);margin-top:-18px}
.bnav .fab svg{width:26px;height:26px}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;width:232px;flex:none;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{padding:0 10px 18px}
  .side .brand .wm{font-size:26px}
  .side button.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);font-weight:500;text-align:left}
  .side button.nav svg{width:19px;height:19px}
  .side button.nav:hover{background:var(--surface-2)}
  .side button.nav.on{background:var(--primary-soft);color:var(--primary)}
  .side .sep{height:1px;background:var(--line);margin:10px 8px}
  .side .add{margin-top:8px;background:var(--primary);color:var(--primary-ink);border-radius:12px;padding:12px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
  .side .add svg{width:18px;height:18px}
  .bnav{display:none}
  .topbar .brand{display:none}
  .main{padding:0 28px 48px}
  .topbar{margin:0 -28px;padding:14px 28px}
}

/* ---------- cards & grid ---------- */
.grid{display:grid;gap:12px;margin-top:12px}
.g4{grid-template-columns:1fr 1fr}
@media (min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g-hero{grid-template-columns:1.25fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h3{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .sp{flex:1}
.card h3 .num{white-space:nowrap}
.card h3 a,.linkbtn{font-size:13px;letter-spacing:0;text-transform:none;color:var(--primary);font-weight:600;cursor:pointer}
.hero{background:var(--primary);color:var(--primary-ink);border:0;position:relative;overflow:hidden}
.hero h3{color:color-mix(in srgb,var(--primary-ink) 75%,transparent)}
.hero .big{font-family:var(--serif);font-size:46px;line-height:1;font-weight:500;letter-spacing:-.02em;margin:4px 0 8px}
.hero .sub{font-size:14px;opacity:.85}
.hero .meter{height:8px;border-radius:99px;background:color-mix(in srgb,var(--primary-ink) 18%,transparent);margin:16px 0 8px;overflow:hidden;display:flex;gap:2px}
.hero .meter i{display:block;height:100%;border-radius:99px;background:var(--primary-ink)}
.hero .meter i.b{opacity:.55}
.hero .row{display:flex;justify-content:space-between;font-size:13px;opacity:.9}
.hero .orn{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;border:1px solid color-mix(in srgb,var(--primary-ink) 16%,transparent)}
.hero .orn::after{content:"";position:absolute;inset:22px;border-radius:50%;border:1px solid color-mix(in srgb,var(--primary-ink) 12%,transparent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;font-weight:500}
.kpi .v{font-size:20px;font-weight:650;margin-top:4px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:1px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}

/* progress rows */
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.prow:first-of-type{border-top:0;padding-top:2px}
.prow .n{display:flex;align-items:center;gap:8px;font-weight:550;min-width:0}
.prow .n span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .a{font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.prow .a b{color:var(--ink);font-weight:600}
.bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar.over i{background:var(--bad)!important}
.prow .rem{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.prow .rem .o{color:var(--bad);font-weight:600}
.prow.click{cursor:pointer}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item.click{cursor:pointer;border-radius:10px}
.item.click:hover{background:var(--surface-2)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px}
.ico svg{width:18px;height:18px}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:650;white-space:nowrap;text-align:right}
.item .amt small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.pos{color:var(--good)}
.neg{color:var(--ink)}
.dayhead{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:14px 2px 4px;display:flex;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--primary-soft);color:var(--good)}
.pill.bad{background:var(--accent-soft);color:var(--bad)}
.pill.warn{background:var(--gold-soft);color:var(--warn)}
.chk{width:30px;height:30px;border-radius:10px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent}
.chk svg{width:16px;height:16px}
.chk.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink-2);font-family:var(--serif);font-size:18px;font-weight:500;margin-bottom:4px}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--line-2);font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .dot{box-shadow:0 0 0 2px var(--bg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;min-height:46px;background:var(--surface-2);color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line-2)}
.btn.danger{background:var(--accent-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:8px 12px;font-size:13.5px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amtin{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 16px}
.amtin .cur{font-family:var(--serif);font-size:28px;color:var(--muted)}
.amtin input{font-family:var(--serif);font-size:48px;font-weight:500;border:0;background:transparent;text-align:left;width:7ch;field-sizing:content;min-width:2.6ch;max-width:260px;padding:0;min-height:0;box-shadow:none!important;letter-spacing:-.02em}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.toggle .tl{font-weight:550}.toggle .ts{font-size:12.5px;color:var(--muted)}
.sw-t{width:46px;height:28px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:.2s}
.sw-t::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw-t.on{background:var(--primary)}
.sw-t.on::after{left:21px}

/* sheet */
.scrim{display:none;position:fixed;inset:0;background:rgba(10,14,12,.42);z-index:60;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;display:none;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:8px auto 0}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:8px 16px 10px}
.sheet .sh h2{font-family:var(--serif);font-weight:500;font-size:22px;flex:1}
.sheet .sb{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;background:var(--bg)}
.sheet .sf .btn{flex:1}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;border-radius:22px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.2s}
  .sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
}

/* toast */
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:550;font-size:14px;z-index:80;opacity:0;transition:.25s;pointer-events:none;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--primary-soft);font-weight:700}


/* charts */
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{position:relative;width:150px;height:150px;flex:none;margin:0 auto}
.donut svg{width:100%;height:100%;overflow:visible}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut .c b{font-family:var(--serif);font-size:22px;font-weight:500;display:block;line-height:1.1}
.donut .c span{font-size:11.5px;color:var(--muted)}
.donut path{cursor:pointer;transition:opacity .15s}
.donut.hov path:not(.h){opacity:.35}
.legend{flex:1;min-width:170px;display:flex;flex-direction:column;gap:7px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:default}
.legend .li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.legend .li .vv{font-weight:600;white-space:nowrap}
.legend .li .pc{color:var(--muted);font-size:12px;width:36px;text-align:right}
.bars{position:relative}
.bars svg{width:100%;display:block;overflow:visible}
.bars .gl{stroke:var(--line);stroke-width:1}
.bars text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.bars rect.m{cursor:pointer}
.bars .hit{fill:transparent;cursor:pointer}
.bars .hl{fill:var(--surface-2)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;border-radius:10px;padding:8px 10px;z-index:5;white-space:nowrap;opacity:0;transition:opacity .12s;transform:translate(-50%,0);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip.show{opacity:1}
.tip b{display:block;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:6px}
.tip .r span{flex:1}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
.lg span{display:inline-flex;align-items:center;gap:6px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.05em}
.cal .d{min-height:62px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:5px 3px 4px 5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0;text-align:left}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal .d.sel{background:var(--primary-soft)}
.cal .d .dn{font-size:12.5px;font-weight:600}
.cal .d .ds{display:flex;gap:3px;flex-wrap:wrap}
.cal .d .dv{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;line-height:1.25;letter-spacing:-.02em}
@media (min-width:700px){.cal .d{min-height:92px;padding:7px}.cal .d .dv{font-size:11.5px}}

/* year table */
.tblwrap{overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:thin}
table.yt{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.yt th,table.yt td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.yt th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.yt td:first-child,table.yt th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.yt tr.gh td{font-weight:700;background:var(--surface-2);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
table.yt tr.gh td:first-child{background:var(--surface-2)}
table.yt tr.tot td{font-weight:700;border-top:2px solid var(--line-2)}
table.yt td.cur{background:var(--primary-soft)}
table.yt td.z{color:var(--muted)}

/* wizard */
.wiz{min-height:100vh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom))}
.wiz .steps{display:flex;gap:5px;margin-bottom:26px}
.wiz .steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.wiz .steps i.on{background:var(--primary)}
.wiz h1{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:-.02em;line-height:1.08;margin-bottom:8px}
.wiz h1 i{color:var(--primary)}
.wiz .lead{color:var(--ink-2);margin-bottom:22px}
.wiz .body{flex:1}
.wiz .foot{display:flex;gap:10px;margin-top:22px}
.wiz .foot .btn{flex:1}
.wrow{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;align-items:center;margin-bottom:8px}
.wrow.r4{grid-template-columns:1fr 100px 74px 36px}
.wrow input,.wrow select{min-height:42px;padding:9px 10px}
.xbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.xbtn:hover{background:var(--surface-2);color:var(--bad)}
.xbtn svg{width:16px;height:16px}
.splash{text-align:center;padding-top:8vh}
.splash .mark{width:84px;height:84px;margin:0 auto 22px;border-radius:24px;background:var(--primary);display:grid;place-items:center;color:var(--primary-ink);font-family:var(--serif);font-size:40px;font-style:italic}
.splash h1{font-size:44px}
.feat{display:grid;gap:10px;text-align:left;margin:26px 0}
.feat div{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.feat div b{color:var(--ink);display:block;font-size:14.5px}
.feat svg{width:20px;height:20px;color:var(--primary);flex:none;margin-top:2px}

/* misc */
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search input{padding-left:38px}
.pp{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--surface)}
.pp .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pp .ph b{font-family:var(--serif);font-weight:500;font-size:18px}
.pp .lines{margin-top:8px;font-size:13.5px}
.pp .lines div{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-2)}
.pp .lines div.tt{border-top:1px dashed var(--line-2);margin-top:4px;padding-top:8px;color:var(--ink);font-weight:650}
.menu-list .item .ico{background:var(--surface-2);color:var(--ink-2)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.catgrid button{border:1px solid var(--line-2);border-radius:12px;padding:9px 6px;font-size:12.5px;font-weight:550;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface);min-width:0}
.catgrid button span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.catgrid button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.acctcard{border-radius:16px;padding:14px;color:#fff;position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.acctcard .an{font-size:13px;opacity:.9;font-weight:550}
.acctcard .ab{font-family:var(--serif);font-size:26px;font-weight:500}
.acctcard .at{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.acctcard::after{content:"";position:absolute;right:-24px;bottom:-40px;width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.install{display:flex;gap:10px;align-items:center;background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:12px}
.install b{display:block}
.install .mid{flex:1}
.install>svg{width:24px;height:24px;flex:none;color:var(--gold)}
.kpis.k3{grid-template-columns:repeat(3,1fr);gap:8px}
.kpis.k3 .kpi{padding:10px}
.kpis.k3 .kpi .v{font-size:16px}
.kpis.k3 .kpi .s{font-size:11px}
@media (min-width:700px){.kpis.k3 .kpi .v{font-size:20px}.kpis.k3 .kpi{padding:12px 13px}.kpis.k3 .kpi .s{font-size:12px}}

/* ---------- wealth ---------- */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (min-width:700px){.tools{grid-template-columns:repeat(4,1fr)}}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0;transition:transform .15s,border-color .15s}
.tool:hover{border-color:var(--line-2);transform:translateY(-1px)}
.tool .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);margin-bottom:8px}
.tool .ti svg{width:19px;height:19px}
.tool .tn{font-weight:650;font-size:14px}
.tool .tv{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .tc{font-size:12px;color:var(--muted);line-height:1.3}
.hbar{display:flex;gap:2px;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.hbar i{display:block;height:100%}
.nscal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.nscal .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.nsd{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);max-width:48px;width:100%;justify-self:center}
.nsd.yes{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.nsd.no{background:var(--surface-2);color:var(--muted);border-color:transparent}
.nsd.fut{opacity:.45;cursor:default}
.nsd.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
.fund .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tools .tool:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:700px){.tools .tool:last-child:nth-child(odd){grid-column:auto}.tools .tool:last-child:nth-child(4n+3){grid-column:span 2}}
table.yt.fit{min-width:0;width:100%}
table.yt.fit th,table.yt.fit td{padding:8px 6px}
table.yt.fit td small{display:block;color:var(--muted);font-size:11px}

@media (max-width:380px){.seg button{padding:8px 6px;font-size:13px}}

/* ---------- customization ---------- */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:500px){.swatches{grid-template-columns:repeat(7,1fr)}}
.swatch{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-2)}
.swatch span{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.swatch em{font-style:normal}
.swatch.on{border-color:var(--ink);color:var(--ink)}
.drag{width:26px;height:34px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;flex:none;margin-left:-4px}
.drag svg{width:16px;height:16px}
.dragging{background:var(--surface-2);border-radius:12px;box-shadow:var(--shadow);position:relative;z-index:2}
.homegrid .span2{grid-column:1/-1}
.ico.emo{line-height:1}
.gname{display:inline-flex;align-items:center;gap:5px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.gname svg{width:13px;height:13px;opacity:.6}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.emogrid button{height:38px;border-radius:10px;background:var(--surface-2);font-size:19px}
.emogrid button.small{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.colorrow{display:flex;gap:8px;flex-wrap:wrap}
.cdot{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--line-2)}
.cdot.on{box-shadow:0 0 0 2.5px var(--ink)}
.card.click{cursor:pointer}

.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 30%}

.demobar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -16px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--ink);color:var(--bg);font-size:13px;flex-wrap:wrap}
.demobar a{color:var(--bg);font-weight:700;text-decoration:none;background:var(--primary);color:var(--primary-ink);padding:6px 12px;border-radius:99px;white-space:nowrap}
.demobar + .topbar{padding-top:10px}
@media (min-width:900px){.demobar{margin:0 -28px;padding:8px 28px}}

/* ============ "Spreadsheet" style ============ */
@font-face{font-family:"TA Display";font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/dmsans.woff2) format("woff2")}
@font-face{font-family:"TA Body";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/inter.woff2) format("woff2")}
@font-face{font-family:"TA Mono";font-style:normal;font-weight:400 500;font-display:swap;src:url(fonts/mono.woff2) format("woff2")}

html.look-sheet{
  --bg:#F7F3EE; --surface:#FBFAF7; --surface-2:#F1ECE4; --line:#E8E2D9; --line-2:#DBD3C5;
  --ink:#1F1D1B; --ink-2:#2B2825; --muted:#7A736B;
  --primary:#1F1D1B; --primary-ink:#F7F3EE; --primary-soft:rgba(157,168,157,.20);
  --accent:#C68A6E; --accent-soft:rgba(198,138,110,.22); --gold:#B8A99A; --gold-soft:rgba(184,169,154,.25);
  --good:#4D6048; --bad:#8D4D33; --warn:#6E604F;
  --g-income:#8C9A8C; --g-bills:#B8A99A; --g-spending:#C68A6E; --g-savings:#86A0A4; --g-debt:#9C8AA2;
  --c1:#8C9A8C; --c2:#B8A99A; --c3:#C68A6E; --c4:#86A0A4; --c5:#9C8AA2; --c6:#C9A961; --c7:#B4808E; --c8:#8F7A66; --c-other:#CFC6BA;
  --taupe:#B8A99A; --sage:#9DA89D; --terra:#C68A6E; --hl:#C68A6E; --hl2:#9DA89D; --hl3:#B8A99A; --hl-soft:rgba(157,168,157,.18); --tint:#F4EFE8; --fn:#6B8A6B;
  --shadow:none; --r:14px; --r-sm:10px;
  --serif:"TA Display","DM Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --sans:"TA Body","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"TA Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root.look-sheet:not([data-theme="light"]){
    --bg:#1A1816; --surface:#221F1C; --surface-2:#2B2723; --line:#36312C; --line-2:#443E38;
    --ink:#F2EDE6; --ink-2:#DDD5CB; --muted:#9E958B;
    --primary:#F2EDE6; --primary-ink:#1A1816; --primary-soft:rgba(157,168,157,.18);
    --accent-soft:rgba(198,138,110,.20); --gold-soft:rgba(184,169,154,.18);
    --good:#A9BCA5; --bad:#E2A68A; --warn:#CDBBA6; --tint:#26221F; --fn:#9DB89D; --c-other:#5A534C; --g-income:#9AA89A; --g-bills:#C2B4A5; --g-spending:#D0977B; --g-savings:#93ADB1; --g-debt:#AA98B0; --c1:#9AA89A; --c2:#C2B4A5; --c3:#D0977B; --c4:#93ADB1; --c5:#AA98B0; --c6:#CDB06C; --c7:#BE8C9A; --c8:#A08B76;
  }
}
:root.look-sheet[data-theme="dark"]{
  --bg:#1A1816; --surface:#221F1C; --surface-2:#2B2723; --line:#36312C; --line-2:#443E38;
  --ink:#F2EDE6; --ink-2:#DDD5CB; --muted:#9E958B;
  --primary:#F2EDE6; --primary-ink:#1A1816; --primary-soft:rgba(157,168,157,.18);
  --accent-soft:rgba(198,138,110,.20); --gold-soft:rgba(184,169,154,.18);
  --good:#A9BCA5; --bad:#E2A68A; --warn:#CDBBA6; --tint:#26221F; --fn:#9DB89D; --c-other:#5A534C; --g-income:#9AA89A; --g-bills:#C2B4A5; --g-spending:#D0977B; --g-savings:#93ADB1; --g-debt:#AA98B0; --c1:#9AA89A; --c2:#C2B4A5; --c3:#D0977B; --c4:#93ADB1; --c5:#AA98B0; --c6:#CDB06C; --c7:#BE8C9A; --c8:#A08B76;
}
.look-sheet body{font-size:14px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.sheetbar,.sheetnav{display:none}

/* ---------- title + menu bar ---------- */
.look-sheet .side,.look-sheet .bnav{display:none!important}
.look-sheet .main{max-width:none;padding:0 0 calc(84px + env(safe-area-inset-bottom))!important}
.look-sheet #view{max-width:1180px;margin:0 auto;padding:0 16px}
.look-sheet .topbar{margin:0!important;padding:calc(8px + env(safe-area-inset-top)) 12px 4px!important;background:var(--surface);border-bottom:1px solid var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;display:block;position:sticky;top:0}
.look-sheet .demobar{margin:0!important}
.tb1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'ic ti rt' 'mn mn mn';align-items:center;column-gap:10px;row-gap:2px;min-width:0}
.tb1 .docicon{grid-area:ic}.tb1 .doctitle{grid-area:ti}.tb1 .tbright{grid-area:rt}.tb1 .menus{grid-area:mn}
@media (min-width:760px){.tb1{grid-template-areas:'ic ti rt' 'ic mn rt';row-gap:0}.tb1 .docicon{width:30px;height:30px;font-size:12px}}
@media (max-width:420px){.doctitle .tag,.doctitle .star{display:none}.tb1:has(.monthpick) .doctitle .yr{display:none}}
.docicon{width:26px;height:26px;border-radius:6px;flex:none;background:linear-gradient(140deg,var(--hl2) 0%,var(--hl) 100%);display:grid;place-items:center;color:#fff;font:600 11px/1 var(--serif);letter-spacing:.04em}
.docmeta{display:flex;flex-direction:column;min-width:0;line-height:1.15;flex:1}
.doctitle{font:500 15px/1.2 var(--serif);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doctitle .star{color:var(--taupe);margin-left:5px}
.doctitle .tag{display:inline-block;margin-left:7px;vertical-align:2px;font:500 9.5px/1 var(--sans);padding:3px 7px;border-radius:99px;background:var(--bg);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.menus{display:flex;gap:1px;margin:0 0 0 -7px;overflow-x:auto;scrollbar-width:none}
@media (max-width:759px){.menus{margin-left:29px}}
.menus::-webkit-scrollbar{display:none}
.menus button{padding:4px 7px;border-radius:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.menus button:hover,.menus button:active{background:var(--bg)}
.tbright{display:flex;align-items:center;gap:10px;flex:none}
.saved{font-size:11px;color:var(--muted);display:none;align-items:center;gap:5px;white-space:nowrap}
.saved::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sage)}
.avs{display:none;margin-left:4px}
.avs i{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);margin-left:-7px;display:grid;place-items:center;font:600 10px/1 var(--serif);color:#fff;font-style:normal}
.xport{display:none;background:var(--ink);color:var(--bg);border-radius:99px;padding:7px 14px;font:500 12.5px/1 var(--serif);letter-spacing:.01em;white-space:nowrap}
.look-sheet .monthpick{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.look-sheet .monthpick button{width:28px;height:28px;border-radius:6px}
.look-sheet .monthpick .lbl{min-width:76px;font:500 13px/1 var(--serif);width:auto;height:28px;display:grid;place-items:center}
@media (min-width:760px){
  .look-sheet .topbar{padding:8px 16px 6px!important}
  .saved,.avs{display:flex}
  .xport{display:inline-block}
  .menus{overflow:visible}
  .menus button{font-size:12px}
}

/* ---------- formula bar ---------- */
.look-sheet .sheetbar{display:flex;align-items:stretch;height:30px;background:var(--surface);border-bottom:1px solid var(--line);font:400 12px/1 var(--mono)}
.sheetbar .nm{width:58px;flex:none;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-right:1px solid var(--line);font-weight:500;color:var(--ink)}
.sheetbar .nm::after{content:"";width:5px;height:5px;border-right:1.2px solid var(--muted);border-bottom:1.2px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.sheetbar .fx{width:34px;flex:none;display:grid;place-items:center;color:var(--muted);font-style:italic;border-right:1px solid var(--line)}
.sheetbar .fc{flex:1;min-width:0;padding:0 12px;display:flex;align-items:center;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.sheetbar .fc span.v{overflow:hidden;text-overflow:ellipsis}
.sheetbar .fn{color:var(--fn)}
.sheetbar .str{color:var(--terra)}
@media (min-width:760px){.sheetbar .nm{width:92px}.sheetbar .fx{width:36px}}

/* ---------- sheet tabs + status bar ---------- */
.look-sheet .sheetnav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.stabs{display:flex;align-items:stretch;height:44px}
.stabs .ctl{display:flex;align-items:center;gap:2px;padding:0 6px 0 8px;border-right:1px solid var(--line);flex:none}
.stabs .ctl button{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.stabs .ctl button svg{width:18px;height:18px}
.stabs .ctl button.add{background:var(--ink);color:var(--bg);border-radius:8px}
.stabs .ctl button.add svg{width:18px;height:18px}
.stabs .tl{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;-webkit-overflow-scrolling:touch}
.stabs .tl::-webkit-scrollbar{display:none}
.stab{padding:0 14px;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line);white-space:nowrap;border-top:2px solid transparent;flex:none}
.stab .em{font-size:14px}
.stab.on{background:var(--bg);color:var(--ink);font-weight:500;border-top-color:var(--hl2)}
.sstatus{display:flex;align-items:center;gap:14px;height:24px;padding:0 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.sstatus .r{margin-left:auto;display:flex;gap:14px}
.sstatus .sum b{font-weight:500;color:var(--ink-2)}
@media (max-width:420px){.sstatus .hide-s{display:none}}

/* ---------- page heading ---------- */
.look-sheet .pagehead{display:flex;flex-direction:column;padding:22px 0 8px}

<body>
<div id="app"></div>
<script>
window.__DEMO=true;window.__NO_SW=true;window.__BUY_URL="https://thepetalo.etsy.com";
/* ============ The Annual — core ============ */
const KEY = window.__DEMO ? 'theannual.demo' : 'theannual.v1';
const GROUPS = [
  {id:'income',   name:'Income',   color:'var(--g-income)'},
  {id:'bills',    name:'Bills',    color:'var(--g-bills)'},
  {id:'spending', name:'Spending', color:'var(--g-spending)'},
  {id:'savings',  name:'Savings',  color:'var(--g-savings)'},
  {id:'debt',     name:'Debt',     color:'var(--g-debt)'},
];
const OUT_GROUPS = ['bills','spending','savings','debt'];
const FREQS = [
  {id:'weekly',name:'Weekly'},{id:'biweekly',name:'Every 2 weeks'},{id:'semimonthly',name:'Twice a month'},
  {id:'monthly',name:'Monthly'},{id:'quarterly',name:'Every 3 months'},{id:'yearly',name:'Yearly'},{id:'once',name:'One time'}
];
const ACCT_TYPES = [
  {id:'checking',name:'Checking'},{id:'savings',name:'Savings'},{id:'cash',name:'Cash'},{id:'credit',name:'Credit card'},{id:'investment',name:'Investment'}
];
const CURRENCIES_TOP = ['USD','EUR','GBP','CAD','AUD','NZD','CHF','SEK','NOK','DKK','PLN','CZK','JPY','INR','ZAR','MXN','BRL','SGD','HKD','AED','SAR','MAD','TRY','PHP','NGN'];
const CURRENCIES = (()=>{ let all = []; try { all = Intl.supportedValuesOf('currency'); } catch(e){} return [...CURRENCIES_TOP, ...all.filter(c=>!CURRENCIES_TOP.includes(c))]; })();
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m=>m.slice(0,3));
const PAL = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)'];

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); };
const ymOf = s => s.slice(0,7);
const ymAdd = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const dim = (y, m) => new Date(y, m, 0).getDate(); // m 1-12
const ymLabel = (ym, short) => { const [y,m] = ym.split('-').map(Number); return (short?MON:MONTHS)[m-1] + ' ' + y; };
const dLabel = (s, opt={weekday:'short', day:'numeric', month:'short'}) => pd(s).toLocaleDateString('en-US', opt);
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return dstr(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((+n||0)*100)/100;
const sum = (arr, f=x=>x) => arr.reduce((a,x)=>a+(+f(x)||0),0);

/* ---------- state ---------- */
let S = null;
function blank(){
  return {
    v:1, setup:false,
    settings:{ name:'', currency:'USD', startMonth:1, theme:'auto', members:[{id:'m1',name:'Me'}], sample:false },
    accounts:[], categories:[], budgets:{}, recurring:[], tx:[], skipped:{},
    funds:[], fundMoves:[], debts:[], assets:[], nospend:{}, nsGoal:10,
    split:{needs:50, wants:30, savings:20}, invest:{start:10000, monthly:400, rate:7, years:25}
  };
}
function load(){
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : blank(); }
  catch(e){ S = blank(); }
  const b = blank();
  S = Object.assign(b, S); S.settings = Object.assign(b.settings, S.settings||{});
  if(!S.settings.members || !S.settings.members.length) S.settings.members = [{id:'m1',name:S.settings.name||'Me'}];
}
let _saveT = null;
function save(){ clearTimeout(_saveT); _saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save — storage is full or blocked'); } }, 120); }
function saveNow(){ clearTimeout(_saveT); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- money ---------- */
const _fmt = {};
function money(n, {sign=false, dec=null, compact=false}={}){
  const cur = S.settings.currency || 'USD';
  const v = +n || 0;
  const key = cur + (dec??'a') + compact;
  if(!_fmt[key]){
    try {
      _fmt[key] = new Intl.NumberFormat('en-US', compact
        ? {style:'currency', currency:cur, notation:'compact', maximumFractionDigits:1}
        : (dec == null ? {style:'currency', currency:cur} : {style:'currency', currency:cur, minimumFractionDigits: dec, maximumFractionDigits: dec}));
    } catch(e){ _fmt[key] = {format:x=>cur+' '+x.toFixed(2)}; }
  }
  let s = _fmt[key].format(Math.abs(v));
  if(v < 0) s = '−' + s; else if(sign && v > 0) s = '+' + s;
  return s;
}
const m0 = n => { const v = +n||0; return Math.abs(v) >= 1000 || Number.isInteger(v) ? money(v,{dec:0}) : money(v); };
function curSymbol(){
  try { return new Intl.NumberFormat('en-US',{style:'currency',currency:S.settings.currency}).formatToParts(0).find(p=>p.type==='currency').value; } catch(e){ return '$'; }
}

/* ---------- lookups ---------- */
const cat = id => S.categories.find(c=>c.id===id);
const acct = id => S.accounts.find(a=>a.id===id);
const member = id => S.settings.members.find(m=>m.id===id);
const catsOf = g => S.categories.filter(c=>c.group===g && !c.archived);
const catColor = c => c ? ((c.group==='income' && c.ci == null) ? 'var(--g-income)' : PAL[(c.ci ?? 0) % 8]) : 'var(--c-other)';
const groupOf = id => GROUPS.find(g=>g.id===id);
const multiMember = () => S.settings.members.length > 1;
function nextCi(){ const used = S.categories.filter(c=>c.group!=='income').map(c=>c.ci); for(let i=0;i<8;i++) if(!used.includes(i)) return i; return S.categories.length % 8; }

/* ---------- recurrence ---------- */
function occurrences(r, from, to){
  const out = [];
  if(!r.start) return out;
  const end = r.end && r.end < to ? r.end : to;
  if(r.start > end) return out;
  const s = pd(r.start);
  const sd = s.getDate();
  const push = d => { if(d >= from && d <= end && d >= r.start) out.push(d); };
  if(r.freq === 'once'){ push(r.start); return out; }
  if(r.freq === 'weekly' || r.freq === 'biweekly'){
    const step = r.freq === 'weekly' ? 7 : 14;
    let d = pd(r.start);
    const f = pd(from);
    if(d < f){ const diff = Math.floor((f - d)/864e5); d.setDate(d.getDate() + Math.floor(diff/step)*step); }
    let guard = 0;
    while(dstr(d) <= end && guard++ < 600){ push(dstr(d)); d.setDate(d.getDate()+step); }
    return out;
  }
  const stepM = {monthly:1, semimonthly:1, quarterly:3, yearly:12}[r.freq] || 1;
  let y = s.getFullYear(), m = s.getMonth()+1;
  const fy = +from.slice(0,4), fm = +from.slice(5,7);
  // fast-forward
  let gap = (fy - y)*12 + (fm - m);
  if(gap > 0){ const jumps = Math.floor(gap/stepM); m += jumps*stepM; while(m>12){m-=12;y++;} }
  let guard = 0;
  while(guard++ < 400){
    const ymS = `${y}-${pad(m)}`;
    if(ymS + '-01' > end) break;
    const last = dim(y, m);
    const days = r.freq === 'semimonthly' ? [sd, sd <= 15 ? sd + 15 : sd - 15].sort((a,b)=>a-b) : [sd];
    for(const dd of days) push(`${ymS}-${pad(Math.min(dd, last))}`);
    m += stepM; while(m>12){ m-=12; y++; }
  }
  return out.sort();
}
function perMonth(amount, freq){
  return r2(amount * ({weekly:52/12, biweekly:26/12, semimonthly:2, monthly:1, quarterly:1/3, yearly:1/12, once:0}[freq] ?? 1));
}
const recKey = (id, d) => id + '|' + d;
function postedFor(rid, d){ return S.tx.find(t => t.recId === rid && t.recDate === d); }
function autoPost(){
  const t = today(); let n = 0;
  for(const r of S.recurring){
    if(!r.auto || r.paused) continue;
    const from = r.lastPosted && r.lastPosted > r.start ? r.lastPosted : r.start;
    for(const d of occurrences(r, from, t)){
      if(S.skipped[recKey(r.id,d)] || postedFor(r.id, d)) continue;
      S.tx.push(txFromRec(r, d)); n++;
    }
    r.lastPosted = t;
  }
  if(n) save();
  return n;
}
function txFromRec(r, d){
  return {id:uid(), date:d, type:r.type, amount:r2(r.amount), catId:r.catId, accountId:r.accountId, toAccountId:r.toAccountId||null, note:r.name, memberId:r.memberId||null, recId:r.id, recDate:d};
}
/* occurrences of every recurring item in a date range, with status */
function schedule(from, to){
  const t = today(); const out = [];
  for(const r of S.recurring){
    if(r.paused) continue;
    for(const d of occurrences(r, from, to)){
      const tx = postedFor(r.id, d);
      const skipped = !!S.skipped[recKey(r.id,d)];
      let status = tx ? 'paid' : skipped ? 'skipped' : d < t ? 'overdue' : d === t ? 'today' : 'upcoming';
      out.push({r, date:d, tx, status, amount: tx ? tx.amount : r.amount});
    }
  }
  return out.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : (a.r.type==='income'?-1:1));
}

/* ---------- calculations ---------- */
function txIn(from, to, filt){ return S.tx.filter(t => t.date >= from && t.date <= to && (!filt || filt(t))); }
const monthRange = ym => { const [y,m] = ym.split('-').map(Number); return [ym+'-01', `${ym}-${pad(dim(y,m))}`]; };
function planned(catId, ym){
  const o = S.budgets[ym]; if(o && o[catId] != null) return +o[catId];
  const c = cat(catId); return c ? +c.budget||0 : 0;
}
function monthStats(ym, memberId){
  const [a,b] = monthRange(ym);
  const txs = txIn(a, b, t => t.type !== 'transfer' && (!memberId || t.memberId === memberId));
  const byCat = {};
  for(const t of txs){ byCat[t.catId] = (byCat[t.catId]||0) + (+t.amount||0); }
  const g = {}; const p = {};
  for(const G of GROUPS){ g[G.id] = 0; p[G.id] = 0; }
  for(const c of S.categories){
    if(c.archived && !byCat[c.id]) continue;
    g[c.group] += byCat[c.id]||0;
    if(!c.archived) p[c.group] += planned(c.id, ym);
  }
  // uncategorized
  for(const t of txs){ if(!cat(t.catId)){ g[t.type==='income'?'income':'spending'] += +t.amount||0; } }
  const out = OUT_GROUPS.reduce((s,k)=>s+g[k],0);
  const pOut = OUT_GROUPS.reduce((s,k)=>s+p[k],0);
  // upcoming (unpaid) scheduled items this month
  const sch = schedule(a, b).filter(o => o.status !== 'paid' && o.status !== 'skipped');
  const upIncome = sum(sch.filter(o=>o.r.type==='income'), o=>o.amount);
  const upOut = sum(sch.filter(o=>o.r.type==='expense'), o=>o.amount);
  return { txs, byCat, g, p, income:g.income, out, pOut, left:g.income - out, upIncome, upOut, projected: g.income + upIncome - out - upOut, saved: g.savings };
}
function acctBalance(id, upto = today()){
  const a = acct(id); if(!a) return 0;
  let bal = +a.opening || 0;
  for(const t of S.tx){
    if(t.date > upto) continue;
    const v = +t.amount||0;
    if(t.type === 'transfer'){ if(t.accountId===id) bal -= v; if(t.toAccountId===id) bal += v; }
    else {
      if(t.accountId === id) bal += (t.type === 'income' ? v : -v);
      if(t.type === 'expense' && t.toAccountId === id) bal += v;
    }
  }
  // credit cards shown as negative balance owed
  return r2(bal);
}
function yearMonths(startYear){
  const sm = +S.settings.startMonth || 1;
  const first = `${startYear}-${pad(sm)}`;
  return Array.from({length:12}, (_,i)=> ymAdd(first, i));
}
function budgetYearOf(ym){
  const sm = +S.settings.startMonth || 1; const [y,m] = ym.split('-').map(Number);
  return m >= sm ? y : y - 1;
}
function yearLabel(y){
  const sm = +S.settings.startMonth || 1;
  return sm === 1 ? String(y) : `${MON[sm-1]} ${y} – ${MON[(sm+10)%12]} ${y+1}`;
}

/* ---------- 50/30/20 buckets ---------- */
const NEED_DEFAULT = ['Groceries','Transport','Health','Childcare','Medical'];
function bucketOf(c){
  if(!c) return 'wants';
  if(c.group === 'bills') return 'needs';
  if(c.group === 'savings' || c.group === 'debt') return 'savings';
  if(c.group === 'spending') return c.kind || (NEED_DEFAULT.includes(c.name) ? 'needs' : 'wants');
  return null;
}

/* ---------- sinking funds ---------- */
function fundBalance(f, upto = '9999-12-31'){
  const inn = sum(S.tx.filter(t=>t.type==='expense' && t.catId===f.catId && t.date<=upto), t=>t.amount);
  const out = sum(S.fundMoves.filter(m=>m.fundId===f.id && m.date<=upto), m=>m.amount);
  return r2((+f.start||0) + inn - out);
}
function monthsBetween(fromStr, toStr){ const a = pd(fromStr), b = pd(toStr); return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()); }

/* ---------- debts ---------- */
function debtBalance(d, upto = today()){
  const paid = sum(S.tx.filter(t=>t.type==='expense' && t.catId===d.catId && t.date>=(d.asOf||'0000') && t.date<=upto), t=>t.amount);
  return r2(Math.max(0, (+d.balance||0) - paid));
}
/* month-by-month payoff simulation. method: 'avalanche' | 'snowball' */
function payoffPlan(debts, extra, method){
  let ds = debts.map(d=>({id:d.id, name:d.name, bal:debtBalance(d), apr:+d.apr||0, min:+d.min||0})).filter(d=>d.bal>0);
  const order = () => ds.filter(d=>d.bal>0.005).sort((a,b)=> method==='snowball' ? a.bal-b.bal : (b.apr-a.apr || a.bal-b.bal));
  const series = [sum(ds,d=>d.bal)]; const payoff = {}; let interest = 0, m = 0, stuck = false;
  const budget = sum(ds,d=>d.min) + (+extra||0);
  while(ds.some(d=>d.bal>0.005) && m < 600){
    m++;
    for(const d of ds){ if(d.bal>0){ const i = d.bal*d.apr/1200; d.bal += i; interest += i; } }
    let pool = budget;
    for(const d of ds){ if(d.bal>0){ const p = Math.min(d.bal, d.min); d.bal -= p; pool -= p; } }
    for(const d of order()){ if(pool<=0) break; const p = Math.min(d.bal, pool); d.bal -= p; pool -= p; }
    for(const d of ds){ if(d.bal<=0.005 && !payoff[d.id]){ d.bal = 0; payoff[d.id] = m; } }
    series.push(r2(sum(ds,d=>d.bal)));
    if(m === 24 && series[24] >= series[0]) { stuck = true; break; }
  }
  return {months: stuck ? Infinity : m, interest: r2(interest), payoff, series, stuck, budget};
}

/* ---------- net worth ---------- */
function netWorthAt(upto = today()){
  let assets = 0, liab = 0;
  const linked = new Set(S.debts.map(d=>d.accountId).filter(Boolean));
  for(const a of S.accounts){ const b = acctBalance(a.id, upto); if(b >= 0) assets += b; else if(!linked.has(a.id)) liab += -b; }
  for(const d of S.debts){ liab += debtBalance(d, upto); }
  for(const x of S.assets){ if(x.kind === 'liability') liab += +x.value||0; else assets += +x.value||0; }
  return {assets:r2(assets), liab:r2(liab), net:r2(assets-liab)};
}

/* ---------- no-spend ---------- */
function spentOn(d){ return sum(S.tx.filter(t=>t.date===d && t.type==='expense' && cat(t.catId)?.group==='spending'), t=>t.amount); }
function trackingSince(){
  if(S.settings.created) return S.settings.created;
  let m = today(); for(const t of S.tx) if(t.date < m) m = t.date; return m;
}
function isNoSpend(d){
  if(d > today()) return null;
  if(S.nospend[d] != null) return S.nospend[d];
  if(d < trackingSince()) return null;
  if(S.nospend[d] != null) return S.nospend[d];
  return spentOn(d) === 0;
}

/* ============ charts (plain SVG) ============ */
function donutHTML(segs, center, id){
  const total = sum(segs, s=>s.value);
  const R = 70, r = 50, cx = 75, cy = 75;
  let paths = '';
  if(total <= 0){
    paths = `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--surface-2)" stroke-width="${R-r}"/>`;
  } else {
    let a0 = -Math.PI/2;
    const live = segs.filter(s=>s.value>0);
    const gap = live.length > 1 ? 0.028 : 0;
    live.forEach((s,i)=>{
      const frac = s.value/total; const a1 = a0 + frac*Math.PI*2;
      const s0 = a0 + gap/2, s1 = Math.max(s0+0.001, a1 - gap/2);
      const large = (s1 - s0) > Math.PI ? 1 : 0;
      const p = (rad, ang) => `${(cx + rad*Math.cos(ang)).toFixed(2)} ${(cy + rad*Math.sin(ang)).toFixed(2)}`;
      const d = frac >= 0.9999
        ? `M ${p(R,-Math.PI/2)} A ${R} ${R} 0 1 1 ${p(R,Math.PI*1.5-0.0001)} L ${p(r,Math.PI*1.5-0.0001)} A ${r} ${r} 0 1 0 ${p(r,-Math.PI/2)} Z`
        : `M ${p(R,s0)} A ${R} ${R} 0 ${large} 1 ${p(R,s1)} L ${p(r,s1)} A ${r} ${r} 0 ${large} 0 ${p(r,s0)} Z`;
      paths += `<path d="${d}" fill="${s.color}" data-i="${segs.indexOf(s)}"><title>${esc(s.label)}: ${money(s.value)} (${Math.round(frac*100)}%)</title></path>`;
      a0 = a1;
    });
  }
  const legend = segs.map((s,i)=>`<div class="li" data-i="${i}"><span class="sw" style="background:${s.color}"></span><span class="nm">${esc(s.label)}</span><span class="vv num">${m0(s.value)}</span><span class="pc num">${total>0?Math.round(s.value/total*100):0}%</span></div>`).join('');
  return `<div class="donutwrap" data-donut="${id||''}"><div class="donut"><svg viewBox="0 0 150 150" role="img" aria-label="Distribution chart">${paths}</svg><div class="c">${center}</div></div><div class="legend">${legend}</div></div>`;
}

/* grouped bars: labels[], series [{name,color,values[]}] — measured at mount so text never stretches */
function barsHTML(labels, series, {height=190, cur=-1, stack=false}={}){
  const lg = series.length > 1 ? `<div class="lg">${series.map(s=>`<span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')}</div>` : '';
  const data = encodeURIComponent(JSON.stringify({labels, series, height, cur, stack}));
  return `${lg}<div class="bars" data-bars="${data}" style="height:${height}px"></div>`;
}
function niceMax(v){ const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v/e; const n = [1,1.2,1.5,2,2.5,3,4,5,6,8,10].find(s=>f<=s); return n*e; }
function barsSVG(d, W){
  const {labels, series, height:H, cur, stack} = d;
  const padL = 46, padB = 22, padT = 8;
  const max = Math.max(1, ...(stack ? labels.map((_,i)=>sum(series, s=>s.values[i]||0)) : series.flatMap(s=>s.values)));
  const nice = niceMax(max);
  const cw = (W - padL) / labels.length;
  const bw = stack ? Math.max(4, Math.min(28, cw - 8)) : Math.max(3, Math.min(18, (cw - 8) / series.length - 2));
  const y = v => padT + (H - padT - padB) * (1 - v/nice);
  let g = '', bars = '', hits = '';
  for(let i=0;i<=4;i++){ const v = nice*i/4; g += `<line class="gl" x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL-8}" y="${y(v)+4}" text-anchor="end">${esc(money(v,{compact:true}))}</text>`; }
  const maxLen = Math.max(...labels.map(l=>String(l).length));
  const every = Math.max(1, Math.ceil((maxLen*6.4 + 8) / cw));
  labels.forEach((lb,i)=>{
    const x0 = padL + cw*i;
    const gw = stack ? bw : series.length*(bw+2) - 2;
    const sx = x0 + (cw - gw)/2;
    if(i===cur) g += `<rect class="hl" x="${x0+1}" y="${padT}" width="${cw-2}" height="${H-padT-padB}" rx="8"/>`;
    if(stack){
      let base = 0; const live = series.map((s,k)=>({s,k,v:s.values[i]||0})).filter(o=>o.v>0);
      live.forEach((o,j)=>{
        const y0 = y(base), y1 = y(base + o.v); base += o.v;
        const top = j === live.length-1; const h = y0 - y1 - (j>0 ? 2 : 0);
        if(h <= 0.5) return;
        const yb = y0 - (j>0 ? 2 : 0), rr = top ? Math.min(4, h, bw/2) : 0;
        bars += `<path fill="${o.s.color}" d="M${sx},${yb} V${y1+rr} Q${sx},${y1} ${sx+rr},${y1} H${sx+bw-rr} Q${sx+bw},${y1} ${sx+bw},${y1+rr} V${yb} Z"/>`;
      });
    } else series.forEach((s,k)=>{
      const v = s.values[i]||0; const h = Math.max(0, y(0) - y(v));
      if(h > 0.5){
        const x = sx + k*(bw+2), top = y(v), rr = Math.min(4, h, bw/2);
        bars += `<path fill="${s.color}" d="M${x},${y(0)} V${top+rr} Q${x},${top} ${x+rr},${top} H${x+bw-rr} Q${x+bw},${top} ${x+bw},${top+rr} V${y(0)} Z"/>`;
      }
    });
    if(i % every === 0 || (i===cur && cur % every !== 0 && (cur % every) >= every/2)) g += `<text x="${x0+cw/2}" y="${H-6}" text-anchor="middle" ${i===cur?'style="fill:var(--ink);font-weight:600"':''}>${esc(lb)}</text>`;
    hits += `<rect class="hit" x="${x0}" y="0" width="${cw}" height="${H}" data-i="${i}"/>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}${bars}${hits}</svg><div class="tip"></div>`;
}
function wireBars(root){
  root.querySelectorAll('.bars').forEach(b=>{
    const data = JSON.parse(decodeURIComponent(b.dataset.bars));
    const draw = () => {
      const W = Math.max(260, b.clientWidth);
      if(b._w === W) return; b._w = W;
      b.innerHTML = barsSVG(data, W);
      const tip = b.querySelector('.tip'), svg = b.querySelector('svg');
      const show = el => {
        const i = +el.dataset.i;
        tip.innerHTML = `<b>${esc(data.labels[i])}</b>` + data.series.map(s=>`<div class="r"><span class="sw" style="background:${s.color}"></span><span>${esc(s.name)}</span>&nbsp;<strong>${money(s.values[i]||0)}</strong></div>`).join('') + (data.stack && data.series.length>1 ? `<div class="r"><span></span><span>Total</span>&nbsp;<strong>${money(sum(data.series, s=>s.values[i]||0))}</strong></div>` : '');
        const x = +el.getAttribute('x') + (+el.getAttribute('width'))/2;
        tip.style.left = Math.max(90, Math.min(W-90, x)) + 'px'; tip.style.top = '4px'; tip.classList.add('show');
      };
      b.querySelectorAll('.hit').forEach(h=>{ h.addEventListener('mouseenter', ()=>show(h)); h.addEventListener('click', ()=>show(h)); });
      svg.addEventListener('mouseleave', ()=>tip.classList.remove('show'));
    };
    draw();
    if(!b._ro && window.ResizeObserver){ b._ro = new ResizeObserver(draw); b._ro.observe(b); }
  });
}

function txItem(t, showDate){

    const to = acct(t.toAccountId);
    title = t.note || 'Transfer'; sub = `${a?esc(a.name):'—'} → ${to?esc(to.name):'—'}`;
    amt = money(t.amount); cls = 'muted';

  } else {

    if(a) parts.push(esc(a.name) + (t.type==='expense' && acct(t.toAccountId) ? ' → ' + esc(acct(t.toAccountId).name) : ''));

function mBudget(ym){
  const st = monthStats(ym, ui.member);
  const pIn = st.p.income, pOut = st.pOut;
  const unplanned = pIn - pOut;
  const summary = `<div class="kpis k3 mt12">
    <div class="kpi"><div class="l"><span class="dot" style="background:var(--g-income)"></span>Income</div><div class="v num">${m0(st.income)}</div><div class="s num">planned ${m0(pIn)}</div></div>
    <div class="kpi"><div class="l"><span class="dot" style="background:var(--ink-2)"></span>Out</div><div class="v num">${m0(st.out)}</div><div class="s num">planned ${m0(pOut)}</div></div>
    <div class="kpi"><div class="l"><span class="dot" style="background:${unplanned<0?'var(--bad)':'var(--gold)'}"></span>${unplanned<0?'Over-planned':'Left to plan'}</div><div class="v num">${m0(Math.abs(unplanned))}</div><div class="s">${pIn===0&&pOut===0?'no plan yet':unplanned===0?'every dollar has a job':'of planned income'}</div></div>

    const a = st.g[G.id], p = st.p[G.id];
    const rows = cats.map(c=>{
      const act = st.byCat[c.id]||0, pl = planned(c.id, ym);
      const inc = G.id === 'income';
      const over = !inc && pl > 0 && act > pl; const w = pl>0 ? Math.min(100, act/pl*100) : (act>0?100:0);
      const ov = S.budgets[ym] && S.budgets[ym][c.id] != null;
      const remTxt = pl > 0 ? (inc ? (act >= pl ? 'received' : m0(pl-act)+' to come') : over ? m0(act-pl)+' over' : m0(pl-act)+' left') : (act>0?'unplanned':'—');
      return `<div class="prow click" data-act="edit-plan" data-id="${c.id}"><div class="n">${catIcon(c,28)}<span class="t">${esc(c.name)}</span>${ov?'<span class="pill" title="Custom plan for this month">this month</span>':''}</div><div class="a num"><b>${m0(act)}</b> / ${m0(pl)}</div><div class="bar ${over?'over':''}"><i style="width:${w}%;background:${catColor(c)}"></i></div><div class="rem"><span></span><span class="${over?'o':''}">${remTxt}</span></div></div>`;
    }).join('');

  <div class="btns mt12"><button class="btn sm ghost" data-act="copy-plan">Copy last month's plan</button><button class="btn sm ghost" data-act="reset-plan">Use default plan</button><button class="btn sm ghost" data-go="categories">${I.tag} Categories</button></div>
  <div class="grid g2">${groups}</div>`;
}
function payPeriods(ym){
  const [a,b] = monthRange(ym);
  const incRecs = S.recurring.filter(r=>r.type==='income' && !r.paused && (!ui.member || r.memberId===ui.member || !r.memberId));
  const pays = [];
  for(const r of incRecs) for(const d of occurrences(r, addDays(a,-62), b)) pays.push({r, date:d});
  pays.sort((x,y)=>x.date.localeCompare(y.date));
  const before = pays.filter(p=>p.date < a); const lastBefore = before.length ? before[before.length-1].date : null;
  return pays.filter(p=>p.date >= a || p.date === lastBefore);
}
function mPaychecks(ym){
  const [a,b] = monthRange(ym);
  const pays = payPeriods(ym);
  if(!pays.length) return `<div class="card mt12"><div class="empty"><b>No paychecks yet</b>Add your income as a recurring item and The Annual will split the month into pay periods — so you know exactly which bills each paycheck covers.<div class="mt12"><button class="btn pri" data-act="add-rec" data-type="income">${I.pay} Add a paycheck</button></div></div></div>`;
  const dates = [...new Set(pays.map(p=>p.date))];
  const sch = schedule(dates[0] < a ? dates[0] : a, b);
  const inMonth = pays.filter(p=>p.date>=a).length;
  const blocks = dates.map((d,i)=>{
    const start = i === 0 && d > a ? a : d;
    const end = i < dates.length-1 ? addDays(dates[i+1], -1) : b;
    const ps = pays.filter(p=>p.date===d);
    const carried = d < a;
    const inAmt = sum(ps, p=> (postedFor(p.r.id, p.date)||{}).amount ?? p.r.amount);
    const bills = sch.filter(o=>o.r.type==='expense' && o.date >= start && o.date <= end && o.status!=='skipped');
    const billAmt = sum(bills, o=>o.amount);
    const other = sum(txIn(start, end, t=>t.type==='expense' && !t.recId && (!ui.member || t.memberId===ui.member)), t=>t.amount);
    const left = inAmt - billAmt - other;
    return `<div class="pp" ${carried?'style="background:var(--surface-2)"':''}>
      <div class="ph"><b>${dLabel(d,{month:'short',day:'numeric'})} · ${esc(ps.map(p=>p.r.name).join(' + '))}</b><span class="small muted">${carried?'from last month · ':''}${dLabel(start,{month:'short',day:'numeric'})} – ${dLabel(end,{month:'short',day:'numeric'})}</span></div>
      <div class="lines">
        <div><span>Paycheck</span><span class="num pos">+${money(inAmt)}</span></div>
        <div><span>Bills in this period (${bills.length})</span><span class="num">−${money(billAmt)}</span></div>
        <div><span>Other spending</span><span class="num">−${money(other)}</span></div>
        <div class="tt"><span>Left from this paycheck</span><span class="num ${left<0?'':'pos'}" style="${left<0?'color:var(--bad)':''}">${money(left)}</span></div>
      </div>
      ${bills.length ? `<div class="list mt8">${bills.map(o=>schedItem(o)).join('')}</div>` : ''}
    </div>`;
  }).join('');
  const note = pays[0].date > a ? `<p class="small muted mt12">Bills before your first paycheck this month are counted in the first period.</p>` : `<p class="small muted mt12">Each paycheck covers the bills due until the next one arrives.</p>`;
  return `<div class="card mt12"><h3>${inMonth} paycheck${inMonth===1?'':'s'} in ${MONTHS[+ym.slice(5)-1]}</h3>${blocks}${note}</div>`;
}
function mTx(ym){
  const [a,b] = monthRange(ym);
  const q = ui.q.trim().toLowerCase();
  const list = txIn(a, b, t=>(!ui.member || t.memberId===ui.member) && (!ui.catF || t.catId===ui.catF) && (!q || (t.note||'').toLowerCase().includes(q) || (cat(t.catId)?.name||'').toLowerCase().includes(q) || String(t.amount).includes(q)))
    .sort((x,y)=> y.date.localeCompare(x.date) || (y.id>x.id?1:-1));
  const byDay = {};
  list.forEach(t=>{ (byDay[t.date] = byDay[t.date] || []).push(t); });
  const days = Object.keys(byDay).sort().reverse();
  const body = days.map(d=>{
    const net = sum(byDay[d].filter(t=>t.type!=='transfer'), t=> t.type==='income' ? t.amount : -t.amount);
    return `<div class="dayhead"><span>${dLabel(d,{weekday:'long',month:'short',day:'numeric'})}</span><span class="num">${money(net,{sign:true})}</span></div><div class="card flat" style="padding:4px 12px">${byDay[d].map(t=>txItem(t)).join('')}</div>`;
  }).join('') || `<div class="card mt12"><div class="empty"><b>No transactions</b>${q||ui.catF?'Try clearing the filters.':'Tap + to add one.'}</div></div>`;
  const tIn = sum(list.filter(t=>t.type==='income'), t=>t.amount), tOut = sum(list.filter(t=>t.type==='expense'), t=>t.amount);
  return `<div class="grid g2" style="margin-top:12px">

  </div>
  <div class="between small muted mt12"><span>${list.length} transaction${list.length===1?'':'s'}</span><span class="num">In ${money(tIn)} · Out ${money(tOut)}</span></div>
  ${body}`;
}

/* ---------- CALENDAR ---------- */
function vCalendar(embedded){
  const ym = ui.month; const [y, m] = ym.split('-').map(Number);
  const [a, b] = monthRange(ym);
  const first = pd(a); const lead = (first.getDay() + 6) % 7; // Monday first
  const start = addDays(a, -lead);
  const cells = Math.ceil((lead + dim(y,m))/7)*7;
  const end = addDays(start, cells-1);
  const sch = schedule(start, end);
  const txs = txIn(start, end, t=>t.type!=='transfer' && (!ui.member || t.memberId===ui.member));
  const t0 = today();
  const k = n => n >= 1000 ? (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'k' : String(Math.round(n));
  if(!ui.calSel || ymOf(ui.calSel) !== ym) ui.calSel = ymOf(t0) === ym ? t0 : a;
  let html = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<cells;i++){
    const d = addDays(start, i);
    const inc = sum(txs.filter(t=>t.date===d && t.type==='income'), t=>t.amount);
    const out = sum(txs.filter(t=>t.date===d && t.type==='expense'), t=>t.amount);
    const due = sch.filter(o=>o.date===d && o.r.type==='expense' && o.status!=='paid' && o.status!=='skipped');
    const inDue = sch.filter(o=>o.date===d && o.r.type==='income' && o.status!=='paid' && o.status!=='skipped');
    html += `<button class="d ${ymOf(d)!==ym?'out':''} ${d===t0?'today':''} ${d===ui.calSel?'sel':''}" data-act="cal-day" data-d="${d}">
      <span class="dn">${+d.slice(8)}</span>
      ${inc?`<span class="dv num" style="color:var(--good)">+${k(inc)}</span>`:''}
      ${inDue.length?`<span class="dv num" style="color:var(--good);opacity:.7">+${k(sum(inDue,o=>o.amount))}</span>`:''}
      ${out?`<span class="dv num" style="color:var(--ink-2)">${k(out)}</span>`:''}
      ${due.length?`<span class="ds">${due.slice(0,4).map(o=>`<span class="dot" style="background:${o.status==='overdue'?'var(--bad)':'var(--g-bills)'}" title="${esc(o.r.name)}"></span>`).join('')}</span>`:''}
    </button>`;
  }
  const d = ui.calSel;
  const dSch = sch.filter(o=>o.date===d);
  const dTx = txs.filter(t=>t.date===d && !t.recId).concat(txIn(d,d,t=>t.type==='transfer'));
  const monthDue = sch.filter(o=>o.date>=a && o.date<=b && o.r.type==='expense');
  const paidN = monthDue.filter(o=>o.status==='paid').length;
  const summary = `${paidN} of ${monthDue.length} bills paid · ${money(sum(monthDue.filter(o=>o.status!=='paid'&&o.status!=='skipped'),o=>o.amount))} still due`;
  return `${embedded ? `<p class="small muted mt12">${summary}</p>` : `<div class="pagehead"><h1>${MONTHS[m-1]} <i>calendar</i></h1><p>${summary}</p></div>${memberChips()}`}
  <div class="grid g-hero">
    <div class="card" style="padding:10px"><div class="cal">${html}</div>
      <div class="lg mt12" style="margin-bottom:0"><span><span class="dot" style="background:var(--g-bills)"></span>Bill due</span><span><span class="dot" style="background:var(--bad)"></span>Overdue</span><span style="color:var(--good)">+ income</span><span>gray = spent</span></div>
    </div>
    <div class="card"><h3>${dLabel(d,{weekday:'long',month:'long',day:'numeric'})}<span class="sp"></span><a data-act="add-tx" data-date="${d}">Add</a></h3>
      <div class="list">${dSch.map(o=>schedItem(o)).join('')}${dTx.map(t=>txItem(t)).join('')}</div>
      ${!dSch.length && !dTx.length ? `<div class="empty">Nothing on this day.</div>` : ''}
    </div>
  </div>`;
}

function vYear(){

let _toastT;
function toast(msg, undo){
