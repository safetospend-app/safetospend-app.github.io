/* ---------- GANTT ---------- */
VIEWS.gantt = function (n) {
  validProject('gantt');
  const u = ui('gantt'); const T = todayISO(); const ws = S.settings.weekStart;
  const pid = u.project || '';
  const dw = u.zoom === 'compact' ? 12 : u.zoom === 'wide' ? 32 : 22;
  let tasks = S.tasks.filter(t => (!pid || t.projectId === pid) && t.start && t.due && (!u.incomplete || !isClosed(t)) && (!u.assignee || t.assignee === u.assignee));
  const p = pid ? proj(pid) : null;
  const stat = s => pct(tasks.filter(t => t.status === s).length, tasks.length);
  const avg = tasks.length ? Math.round(tasks.reduce((a, t) => a + (+t.progress || 0), 0) / tasks.length) : 0;
  const chips = [['Completed', 'var(--p-green)', 'var(--pd-green)'], ['Delayed', 'var(--p-pink)', 'var(--pd-pink)'], ['On Hold', 'var(--p-yellow)', 'var(--pd-yellow)'], ['Pending', 'var(--p-lav)', 'var(--pd-lav)'], ['Not Started', 'var(--p-blue)', 'var(--pd-blue)'], ['In Progress', 'var(--p-green)', 'var(--pd-green)']];
  const top = `<div class="panel" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;gap:16px">
    <div style="flex:1;min-width:240px"><div class="ptitle left" style="margin-bottom:6px">Overall progress ${p ? '· ' + esc(p.name) : ''}</div><div class="prog" style="max-width:520px"><div class="pb" style="height:12px;background:var(--p-lav)"><i style="width:${avg}%;background:#9d8ee8"></i></div><span style="font-size:14px">${avg}%</span></div>
    ${p ? `<div class="small muted" style="margin-top:6px">Lead: <b>${esc(p.lead || '—')}</b> · ${fmtDate(p.start)} → <b style="color:var(--deadline)">${fmtDate(p.end)}</b> · ${p.client ? esc(p.client) : ''}</div>` : ''}</div>
    <div class="chips">${chips.map(([s, bg, fg]) => `<div class="chip-stat" style="background:${bg};color:${fg}"><div class="k">${s}</div><div class="v">${stat(s)}%</div></div>`).join('')}</div>
  </div></div>`;
  const controls = `<div class="toolbar">${fProject('gantt', 'All projects')}${fMember('gantt')}${fIncomplete('gantt')}
    <div class="seg" role="group" aria-label="Zoom">${[['compact', 'Compact'], ['', 'Normal'], ['wide', 'Wide']].map(([k, l]) => `<button class="${(u.zoom || '') === k ? 'on' : ''}" data-act="zoom" data-k="${k}">${l}</button>`).join('')}</div>
    <button class="btn sm" data-act="g-today">Today</button><span class="spacer"></span><button class="btn sm pri" data-act="new-task" ${pid ? `data-project="${pid}"` : ''}>${icon('plus', 13)} Task</button></div>`;
  if (!tasks.length) return header(n) + top + controls + `<div class="panel empty"><div class="big">No tasks with dates to chart</div><p>Add tasks with a start and due date — they appear here automatically.</p><button class="btn pri" data-act="new-task">${icon('plus', 15)} Add task</button></div>`;

  // range
  let minD = tasks.reduce((a, t) => t.start < a ? t.start : a, T), maxD = tasks.reduce((a, t) => t.due > a ? t.due : a, T);
  if (p) { if (p.start && p.start < minD) minD = p.start; if (p.end && p.end > maxD) maxD = p.end; }
  let start = weekStartOf(addDays(minD, -2), ws);
  let days = diffDays(start, addDays(maxD, 8)); days = Math.ceil(days / 7) * 7; if (days > 735) { days = 735; }
  const end = addDays(start, days - 1);
  const W = days * dw;
  // headers
  let r1 = '', r2 = '', r3 = '';
  for (let w = 0; w < days / 7; w++) { const d0 = addDays(start, w * 7); r1 += `<th class="wk" colspan="7"><span style="font-style:normal;font-family:var(--sans);font-size:8.5px;letter-spacing:.14em;font-weight:700">WEEK ${w + 1}</span>&nbsp; ${MONTHS[parse(d0).getMonth()]}</th>`; }
  const deadline = p && p.end;
  for (let i = 0; i < days; i++) { const d = addDays(start, i); const wd = dow(d); const cls = `day ${wd === 0 || wd === 6 ? 'we' : ''} ${d === T ? 'tod' : ''} ${d === deadline ? 'dl' : ''}`; r2 += `<th class="${cls}">${dw >= 18 ? 'SMTWTFS'[wd] : ''}</th>`; r3 += `<th class="${cls}" title="${fmtDate(d)}">${dw >= 18 || parse(d).getDate() % 2 ? parse(d).getDate() : ''}</th>`; }
  // weekend background
  const weBg = (() => { const stops = []; for (let i = 0; i < 7; i++) { const wd = (ws + i) % 7; const c = wd === 0 || wd === 6 ? 'var(--panel2)' : 'transparent'; stops.push(`${c} ${i * dw}px ${(i + 1) * dw}px`); } return `repeating-linear-gradient(90deg,${stops.join(',')}),repeating-linear-gradient(90deg,transparent 0 ${dw - 1}px,var(--line) ${dw - 1}px ${dw}px)`; })();
  const todayX = T >= start && T <= end ? diffDays(start, T) * dw : -1;
  const dlX = deadline && deadline >= start && deadline <= end ? diffDays(start, deadline) * dw : -1;
  const lines = `${todayX >= 0 ? `<div style="position:absolute;top:0;bottom:0;left:${todayX}px;width:${dw}px;background:var(--today);opacity:.85"></div>` : ''}${dlX >= 0 ? `<div style="position:absolute;top:0;bottom:0;left:${dlX}px;width:${dw}px;background:var(--deadline);opacity:.85"></div>` : ''}`;
  // group rows
  const groups = [];
  const CAP = 300; let shown = 0, hidden = 0;
  const projList = pid ? [p] : S.projects;
  projList.forEach(pr => {
    const pts = tasks.filter(t => t.projectId === pr.id); if (!pts.length) return;
    const phases = [...new Set(pts.map(t => t.phase || 'No phase'))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    groups.push({ type: 'proj', pr, pts });
    phases.forEach(ph => { let list = pts.filter(t => (t.phase || 'No phase') === ph).sort(by(t => t.start)); const room = Math.max(0, CAP - shown); if (list.length > room) { hidden += list.length - room; list = list.slice(0, room); } shown += list.length; if (list.length) groups.push({ type: 'phase', ph, list }); });
  });
  const WD = [230, 74, 88, 62, 62, 46]; const L = WD.map((_, i) => WD.slice(0, i).reduce((a, b) => a + b, 0)); // sticky offsets
  const info = (c, i, extra = '') => `class="info fx gx${i}" style="left:${L[i]}px;max-width:${WD[i]}px;width:${WD[i]}px;overflow:hidden;text-overflow:ellipsis;${extra}"`;
  let body = '';
  groups.forEach(g => {
    if (g.type === 'proj' && !pid) { const s = projStats(g.pr.id); body += `<tr class="phase"><td ${info('', 0)}><span class="code">${esc(g.pr.code)}</span> ${esc(g.pr.name)}</td><td ${info('', 1)}></td><td ${info('', 2)}>${s.progress}%</td><td ${info('', 3)}>${fmtDate(g.pr.start, 'short')}</td><td ${info('', 4, 'color:var(--deadline)')}>${fmtDate(g.pr.end, 'short')}</td><td ${info('', 5)}></td><td style="padding:0" colspan="${days}"><div style="position:relative;width:${W}px;height:26px">${g.pr.end >= start && g.pr.end <= end ? `<div style="position:absolute;top:0;bottom:0;left:${diffDays(start, g.pr.end) * dw}px;width:${dw}px;background:var(--deadline);opacity:.6"></div>` : ''}</div></td></tr>`; }
    if (g.type === 'phase') {
      body += `<tr class="phase"><td ${info('', 0)}>${esc(g.ph)}</td><td ${info('', 1)}></td><td ${info('', 2)}></td><td ${info('', 3)}></td><td ${info('', 4)}></td><td ${info('', 5)}></td><td style="padding:0" colspan="${days}"><div style="width:${W}px;height:26px"></div></td></tr>`;
      g.list.forEach(t => {
        const s0 = t.start < start ? start : t.start, e0 = t.due > end ? end : t.due;
        const x = diffDays(start, s0) * dw, w = Math.max(dw, (diffDays(s0, e0) + 1) * dw);
        const c = (COLORS[t.color] || COLORS.blue).bg;
        body += `<tr data-act="edit-task" data-id="${t.id}" style="cursor:pointer" class="${isDone(t) ? 'done' : ''}">
          <td ${info('', 0)}><span class="info-name" title="${esc(t.name)}" style="${isDone(t) ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(t.name)}</span></td>
          <td ${info('', 1)}>${esc(t.assignee || '')}</td>
          <td ${info('', 2)}><div class="prog" style="min-width:70px"><div class="pb"><i style="width:${t.progress}%"></i></div><span>${t.progress}%</span></div></td>
          <td ${info('', 3)}>${fmtDate(t.start, 'short')}</td>
          <td ${info('', 4, isOverdue(t) ? 'color:var(--bad);font-weight:700' : '')}>${fmtDate(t.due, 'short')}</td>
          <td ${info('', 5, 'text-align:center')}>${diffDays(t.start, t.due) + 1}</td>
          <td style="padding:0" colspan="${days}"><div style="position:relative;width:${W}px;height:26px;background:${weBg}">${lines}<div class="bar" title="${esc(t.name)} · ${fmtDate(t.start)} → ${fmtDate(t.due)} · ${t.progress}%" style="position:absolute;top:5px;left:${x}px;width:${w - 2}px;background:${c}"><i style="width:${t.progress}%"></i></div></div></td></tr>`;
      });
    }
  });
  const heads = ['Task', 'Owner', 'Progress', 'Start', 'End', 'Days'];
  const hdr = (row, cls) => heads.map((h, i) => row === 1 ? `<th rowspan="3" class="fx gx${i}" style="left:${L[i]}px;text-align:${i ? 'center' : 'left'};padding:0 8px;min-width:${WD[i]}px;width:${WD[i]}px;max-width:${WD[i]}px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border-right:1px solid var(--line2)">${h}</th>` : '').join('');
  return header(n) + top + controls + `
  <div class="gantt" id="ganttBox" data-keep-scroll="gantt"><table class="gt"><thead>
    <tr class="r1">${hdr(1)}${r1}</tr><tr class="r2">${r2}</tr><tr class="r3">${r3}</tr>
  </thead><tbody>${body}</tbody></table></div>
  ${hidden ? `<div class="help" style="margin-top:8px">${icon('info', 13)} Showing the first ${CAP} tasks — ${hidden} more. Pick a project or assignee above to see the rest.</div>` : ''}
  <div class="legend" style="justify-content:flex-start;margin-top:10px"><span><i class="dot" style="background:var(--today)"></i>Today</span>${p ? '<span><i class="dot" style="background:var(--deadline)"></i>Project deadline</span>' : '<span><i class="dot" style="background:var(--deadline)"></i>Project deadlines</span>'}<span>Bar colors are set per task · darker fill = progress</span></div>`;
};
VIEWS.gantt.after = function () {

/* ---------- KANBAN ---------- */
function kanbanList() {
  const u = ui('kanban');
  let l = S.tasks.filter(t => (!u.project || t.projectId === u.project) && (!u.status || t.status === u.status) && (!u.priority || t.priority === u.priority) && (!u.assignee || t.assignee === u.assignee) && (!u.incomplete || !isClosed(t)) &&
    (u.pmin == null || u.pmin === '' || +t.progress >= +u.pmin) && (u.pmax == null || u.pmax === '' || +t.progress <= +u.pmax) &&
    (!u.sfrom || (t.start && t.start >= u.sfrom)) && (!u.sto || (t.start && t.start <= u.sto)) && (!u.dfrom || (t.due && t.due >= u.dfrom)) && (!u.dto || (t.due && t.due <= u.dto)));
  const keys = { due: t => t.due || '9999', priority: t => PRIORITIES.indexOf(t.priority), progress: t => +t.progress, name: t => t.name.toLowerCase(), start: t => t.start || '9999', assignee: t => t.assignee || 'zzz' };
  l.sort(by(keys[u.sortBy || 'due'] || keys.due, u.order === 'desc' ? -1 : 1));
  return l;
}
VIEWS.kanban = function (n) {

    ${fld('Project name', `<select class="inp sm" data-f="project" aria-label="Project">${projOpts(u.project || '', 'All')}</select>`)}
    <div class="row" style="gap:8px;flex-wrap:nowrap">${fld('Status', `<select class="inp sm" data-f="status" aria-label="Status">${opts(STATUSES, u.status || '', 'All')}</select>`)}${fld('Priority', `<select class="inp sm" data-f="priority" aria-label="Priority">${opts(PRIORITIES, u.priority || '', 'All')}</select>`)}</div>
    ${fld('Assigned to', `<select class="inp sm" data-f="assignee" aria-label="Assigned to">${opts(allMembers(), u.assignee || '', 'All')}</select>`)}
    ${fld('Progress', `<div class="row" style="gap:6px;flex-wrap:nowrap"><span class="tiny muted">From</span><input class="inp sm" type="number" min="0" max="100" data-f="pmin" value="${esc(u.pmin ?? '')}" placeholder="0%"><span class="tiny muted">To</span><input class="inp sm" type="number" min="0" max="100" data-f="pmax" value="${esc(u.pmax ?? '')}" placeholder="100%"></div>`)}
    ${fld('Start date', `<div style="display:grid;gap:5px"><input class="inp sm" type="date" data-f="sfrom" value="${esc(u.sfrom || '')}" aria-label="Start from"><input class="inp sm" type="date" data-f="sto" value="${esc(u.sto || '')}" aria-label="Start to"></div>`)}
    ${fld('Due date', `<div style="display:grid;gap:5px"><input class="inp sm" type="date" data-f="dfrom" value="${esc(u.dfrom || '')}" aria-label="Due from"><input class="inp sm" type="date" data-f="dto" value="${esc(u.dto || '')}" aria-label="Due to"></div>`)}

/* drag & drop (mouse + touch, via pointer events) */
const DRAG = { el: null, id: null, sx: 0, sy: 0, active: false, ghost: null, timer: null, over: null, type: '' };
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.kcard'); if (!c || e.button > 0) return;
  Object.assign(DRAG, { el: c, id: c.dataset.card, sx: e.clientX, sy: e.clientY, active: false, type: e.pointerType });
  if (e.pointerType === 'touch') DRAG.timer = setTimeout(() => startDrag(DRAG.sx, DRAG.sy), 320);
});
function startDrag(x, y) {
  if (!DRAG.el) return; DRAG.active = true;
  const r = DRAG.el.getBoundingClientRect();
  const g = DRAG.el.cloneNode(true); g.classList.add('kghost'); g.style.width = r.width + 'px'; g.style.left = (x - (DRAG.sx - r.left)) + 'px'; g.style.top = (y - (DRAG.sy - r.top)) + 'px';
  DRAG.offX = DRAG.sx - r.left; DRAG.offY = DRAG.sy - r.top;
  document.body.appendChild(g); DRAG.ghost = g; DRAG.el.classList.add('dragging');
  if (navigator.vibrate && DRAG.type === 'touch') try { navigator.vibrate(15); } catch (_) { }
}
document.addEventListener('pointermove', e => {
  if (!DRAG.el) return;
  const dx = e.clientX - DRAG.sx, dy = e.clientY - DRAG.sy;
  if (!DRAG.active) {
    if (DRAG.type === 'touch') { if (Math.hypot(dx, dy) > 10) { clearTimeout(DRAG.timer); DRAG.el = null; } return; }
    if (Math.hypot(dx, dy) > 6) startDrag(e.clientX, e.clientY); else return;
  }
  DRAG.ghost.style.left = (e.clientX - DRAG.offX) + 'px'; DRAG.ghost.style.top = (e.clientY - DRAG.offY) + 'px';
  DRAG.ghost.style.display = 'none'; const under = document.elementFromPoint(e.clientX, e.clientY); DRAG.ghost.style.display = '';
  const col = under && under.closest('.kb-col');
  if (DRAG.over && DRAG.over !== col) DRAG.over.classList.remove('over');
  if (col) col.classList.add('over'); DRAG.over = col;
  // auto-scroll board horizontally near edges
  const kb = $('#kb'); if (kb) { const r = kb.getBoundingClientRect(); if (e.clientX > r.right - 40) kb.scrollLeft += 12; else if (e.clientX < r.left + 40) kb.scrollLeft -= 12; }
});
document.addEventListener('touchmove', e => { if (DRAG.active) e.preventDefault(); }, { passive: false });
function endDrag(e, cancel) {
  clearTimeout(DRAG.timer);
  if (!DRAG.el) return;
  const wasActive = DRAG.active, id = DRAG.id;
  let col = DRAG.over;
  if (wasActive && e && e.type === 'pointerup' && e.clientX != null) { if (DRAG.ghost) DRAG.ghost.style.display = 'none'; const u = document.elementFromPoint(e.clientX, e.clientY); const c = u && u.closest('.kb-col'); if (c) col = c; }
  if (DRAG.ghost) DRAG.ghost.remove(); if (DRAG.el) DRAG.el.classList.remove('dragging'); $$('.kb-col.over').forEach(c => c.classList.remove('over'));
  Object.assign(DRAG, { el: null, active: false, ghost: null, over: null });
  if (cancel) return;
  if (!wasActive) { if (e && e.type === 'pointerup') openTaskModal(id); return; }
  if (col) {
    const t = S.tasks.find(x => x.id === id); const st = stage(col.dataset.stage);
    if (t && st && t.stage !== st.id) {
      const prev = t.stage; t.stage = st.id;
      if (st.done && t.status !== 'Completed') setTaskStatus(t, 'Completed');
      else if (!st.done && t.status === 'Completed') { t.status = 'In Progress'; delete t.doneAt; if (t.progress === 100) t.progress = 90; }
      else if (st.id === 'progress' && (t.status === 'Not Started' || t.status === 'Pending')) t.status = 'In Progress';
      else if (st.id === 'hold') t.status = 'On Hold';
      save(); render(); toast(`Moved to ${st.name}`, () => { t.stage = prev; save(); render(); });
    }
  }
}
document.addEventListener('pointerup', e => endDrag(e));

        <div class="row" style="gap:6px;margin-top:6px;flex-wrap:nowrap"><button class="btn sm" data-act="mm" data-d="-1" aria-label="Previous month">${icon('left', 13)}</button><button class="btn sm" data-act="mm" data-d="0" style="flex:1;justify-content:center">Today</button><button class="btn sm" data-act="mm" data-d="1" aria-label="Next month">${icon('right', 13)}</button></div></div></div>
      <label class="check small panel" style="padding:9px 12px"><input type="checkbox" data-f="incomplete" ${u.incomplete ? 'checked' : ''}> Show incomplete tasks only</label>
      <div class="filter-box"><div class="fb-h">Filter by project</div><div class="fb-b"><select class="inp sm" data-f="project" aria-label="Project">${projOpts(u.project || '', 'All')}</select></div></div>
      <div class="filter-box"><div class="fb-h">Filter by assignee</div><div class="fb-b"><select class="inp sm" data-f="assignee" aria-label="Assignee">${opts(allMembers(), u.assignee || '', 'All')}</select></div></div>
      <div class="filter-box"><div class="fb-h">Filter by status</div><div class="fb-b"><select class="inp sm" data-f="status" aria-label="Status">${opts(STATUSES, u.status || '', 'All')}</select></div></div>
      <div class="panel" style="text-align:center"><div class="ptitle">${MONTHS[md.getMonth()]}</div>${ring(pct(dn, inMonth.length), '#a9b8f0', 96, 12)}<div class="tiny muted" style="margin-top:6px">${dn} of ${inMonth.length} tasks done</div></div>
    </div></details>
    <div class="mcal"><div class="mhead"><h2>${MONTHS[md.getMonth()]} ${md.getFullYear()}</h2><div class="legend" style="margin:0"><span><i class="mi-ic" style="background:var(--ok)">✓</i>Done</span><span><i class="mi-ic" style="background:var(--bad)">✕</i>Overdue</span><span><i class="dot" style="background:var(--today)"></i>Today</span></div></div>
      <div class="mgrid">${[0, 1, 2, 3, 4, 5, 6].map(i => `<div class="dow">${window.innerWidth <= 640 ? DOWS[(i + ws) % 7].slice(0, 3) : DOWS[(i + ws) % 7]}</div>`).join('')}${cells}</div></div>
  </div>
  <p class="help" style="margin-top:10px">Click a day to add a task on that date · click a task to open it. Recurring tasks appear automatically.</p>`;
};
VIEWS.monthly.acts = {
  mm: el => { const u = ui('monthly'); const d = +el.dataset.d; u.month = d ? addMonths(u.month || monthStart(todayISO()), d) : monthStart(todayISO()); saveUI(); render(); },
  mday: el => {
    const d = el.dataset.date; const items = applyFilter(allItems(), ui('monthly')).filter(t => t.due === d);
    if (window.innerWidth <= 640 && items.length) return dayListModal(d, items);
    openTaskModal(null, { due: d, start: d, projectId: ui('monthly').project || undefined });
  },
};
VIEWS.monthly.change = e => {
  const el = e.target.closest('[data-act-sel]'); if (!el) return;
  const u = ui('monthly'); const cur = parse(u.month || monthStart(todayISO()));
  if (el.dataset.actSel === 'mmonth') u.month = `${cur.getFullYear()}-${pad(+el.value + 1)}-01`; else u.month = `${el.value}-${pad(cur.getMonth() + 1)}-01`;
  saveUI(); render();
};
function dayListModal(d, items) {
  const ov = modal({
    title: fmtDate(d, 'long'), cls: 'sm', body: `<div>${items.map(t => `<div class="witem ${isDone(t) ? 'done' : ''}" data-open="${esc(t.id)}" style="padding:10px 4px"><span class="pc">${esc(projCode(t.projectId))}</span><span class="wn">${esc(t.name)}</span>${statusHTML(t.status)}</div>`).join('')}</div>`,
    foot: `<span class="spacer"></span><button class="btn pri" data-add>${icon('plus', 14)} Add task</button>`
  });
  ov.addEventListener('click', e => { const it = e.target.closest('[data-open]'); if (it) { closeModal(ov); openItem(it.dataset.open); } });
  ov.querySelector('[data-add]').onclick = () => { closeModal(ov); openTaskModal(null, { due: d, start: d }); };
}

/* ---------- SETUP ---------- */
VIEWS.setup = function (n) {
  const st = S.settings;
  const listEditor = (key, title, help) => `<div class="panel"><div class="ptitle left">${title}</div><p class="help" style="margin-top:-4px">${help}</p>
    <div class="list-edit">${st[key].map((v, i) => `<div class="li"><input class="inp sm" value="${esc(v)}" data-list="${key}" data-i="${i}" aria-label="${title} ${i + 1}"><button class="btn icon ghost sm" data-act="list-del" data-list="${key}" data-i="${i}" aria-label="Remove">${icon('x', 14)}</button></div>`).join('')}
    <form class="li" data-list-add="${key}"><input class="inp sm" name="v" placeholder="Add…" aria-label="Add to ${title}"><button class="btn sm" type="submit">${icon('plus', 13)}</button></form></div></div>`;
  const stages = `<div class="panel"><div class="ptitle left">Kanban stages <span class="muted" style="letter-spacing:0;text-transform:none;font-weight:500">(${st.stages.length}/10)</span></div><p class="help" style="margin-top:-4px">Rename, recolor and reorder your workflow. Cards moved to the <b>“done”</b> stage are marked Completed.</p>
    <div class="list-edit">${st.stages.map((s, i) => `<div class="li"><span class="dot" style="background:${(COLORS[s.color] || COLORS.gray).bg};width:14px;height:14px;cursor:pointer" data-act="stage-color" data-i="${i}" title="Change color"></span><input class="inp sm" value="${esc(s.name)}" data-stage-name="${i}" aria-label="Stage name"><button class="btn icon ghost sm ${s.done ? '' : 'muted'}" data-act="stage-done" data-i="${i}" title="${s.done ? 'This is the done stage' : 'Make this the done stage'}" style="${s.done ? 'color:var(--ok)' : ''}">${icon('check', 14)}</button><button class="btn icon ghost sm" data-act="stage-move" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${icon('up', 14)}</button><button class="btn icon ghost sm" data-act="stage-move" data-i="${i}" data-d="1" ${i === st.stages.length - 1 ? 'disabled' : ''} aria-label="Move down">${icon('down', 14)}</button><button class="btn icon ghost sm" data-act="stage-del" data-i="${i}" ${st.stages.length <= 2 ? 'disabled' : ''} aria-label="Delete stage">${icon('x', 14)}</button></div>`).join('')}
    ${st.stages.length < 10 ? `<form class="li" data-stage-add><input class="inp sm" name="v" placeholder="New stage…" aria-label="New stage"><button class="btn sm" type="submit">${icon('plus', 13)}</button></form>` : ''}</div></div>`;
  const used = (() => { try { return Math.round((localStorage.getItem(STORE_KEY) || '').length / 1024); } catch (e) { return 0; } })();
  return header(n) + `<div class="setup-grid">
    <div class="panel"><div class="ptitle left">General</div>
      <div class="grid" style="gap:12px">
        <label class="fld">Week starts on<select class="inp" data-setting="weekStart">${opts([{ v: 1, l: 'Monday' }, { v: 0, l: 'Sunday' }, { v: 6, l: 'Saturday' }], st.weekStart)}</select></label>
        <label class="fld">Date format<select class="inp" data-setting="dateFmt">${opts([{ v: 'MDY', l: 'MM/DD/YYYY (12/31/2026)' }, { v: 'DMY', l: 'DD/MM/YYYY (31/12/2026)' }, { v: 'YMD', l: 'YYYY-MM-DD (2026-12-31)' }], st.dateFmt)}</select></label>
        <div class="fld">Appearance<div class="seg"><button class="${st.theme !== 'dark' ? 'on' : ''}" data-act="set-theme" data-v="light">${icon('sun', 13)} Light</button><button class="${st.theme === 'dark' ? 'on' : ''}" data-act="set-theme" data-v="dark">${icon('moon', 13)} Dark</button></div></div>
      </div></div>
    ${listEditor('members', 'Team members', 'People you assign tasks to. Renaming here updates every task.')}
    ${stages}
    ${listEditor('categories', 'Categories', 'Group tasks by type of work (charts use these).')}
    ${listEditor('phases', 'Phases', 'Gantt rows are grouped by phase.')}
    <div class="panel"><div class="ptitle left">Your data</div><p class="help" style="margin-top:-4px">Everything is saved privately on this device (${used} KB). Make a backup now and then — or to move to another device.</p>
      <div class="grid" style="gap:8px">
        ${DEMO ? '<p class="help">Backups are available in the full version.</p>' : `<button class="btn" data-act="backup">${icon('download', 15)} Download backup (.json)</button>
        <label class="btn" style="justify-content:flex-start">${icon('upload', 15)} Restore a backup<input type="file" accept=".json,application/json" data-restore hidden></label>`}
        <button class="btn" data-act="export-csv2">${icon('download', 15)} Export tasks to CSV (Excel / Sheets)</button>
        <button class="btn" data-act="print">${icon('print', 15)} Print this page</button>
        ${S.meta.sample ? `<button class="btn danger" data-act="clear-sample">${icon('trash', 15)} Remove sample data & start fresh</button>` : `<button class="btn" data-act="load-sample">${icon('copy', 15)} Load sample data</button>`}
        <button class="btn danger" data-act="wipe">${icon('trash', 15)} Erase everything</button>
      </div></div>
    <div class="panel"><div class="ptitle left">Install the app</div>
      <p class="help" style="margin-top:-4px">Add The Workflow to your home screen or desktop — it opens full-screen and works offline.</p>
      <div class="small" style="line-height:1.7"><b>iPhone / iPad (Safari):</b> Share ⬆︎ → <i>Add to Home Screen</i><br><b>Android (Chrome):</b> menu ⋮ → <i>Install app</i><br><b>Computer (Chrome / Edge):</b> install icon ⊕ in the address bar</div>
      ${window._installPrompt ? `<button class="btn pri" data-act="install" style="margin-top:10px">${icon('download', 15)} Install now</button>` : ''}
      <p class="help" style="margin-top:12px">Keyboard: press <b>N</b> anywhere to add a task · <b>Esc</b> closes windows.</p>
    </div>
  </div>`;
};
VIEWS.setup.acts = {
  'set-theme': el => { S.settings.theme = el.dataset.v; save(); applyTheme(); shell(); render(); },
  'list-del': async el => {
    const key = el.dataset.list, i = +el.dataset.i, v = S.settings[key][i];
    if (key === 'members' && S.tasks.some(t => t.assignee === v) && !await confirmBox(`Remove <b>${esc(v)}</b> from the team list? Their tasks keep the name.`, 'Remove')) return;
    S.settings[key].splice(i, 1); save(); render();
  },
  'stage-color': el => { const s = S.settings.stages[+el.dataset.i]; const i = STAGE_COLORS.indexOf(s.color); s.color = STAGE_COLORS[(i + 1) % STAGE_COLORS.length]; save(); render(); },
  'stage-done': el => { S.settings.stages.forEach((s, i) => { s.done = i === +el.dataset.i ? !s.done : false; }); save(); render(); },
  'stage-move': el => { const a = S.settings.stages, i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save(); render(); },
  'stage-del': async el => {
    const a = S.settings.stages, i = +el.dataset.i, s = a[i]; const cnt = S.tasks.filter(t => t.stage === s.id).length;
    const to = a[i === 0 ? 1 : 0];
    if (!await confirmBox(`Delete stage <b>${esc(s.name)}</b>?${cnt ? ` Its ${plural(cnt, 'card')} will move to <b>${esc(to.name)}</b>.` : ''}`)) return;
    S.tasks.forEach(t => { if (t.stage === s.id) t.stage = to.id; }); a.splice(i, 1); save(); render();
  },
  backup: () => { download(`the-workflow-backup-${todayISO()}.json`, JSON.stringify(Object.assign({ app: 'the-workflow' }, S), null, 1)); toast('Backup downloaded'); },
  'export-csv2': () => exportCSV(),
  print: () => window.print(),
  install: async () => { const p = window._installPrompt; if (!p) return; p.prompt(); try { await p.userChoice; } catch (e) { } window._installPrompt = null; render(); },
  'clear-sample': async () => {
    if (!await confirmBox('Remove all sample projects, tasks and recurring tasks? Your settings stay.', 'Remove sample data')) return;
    snapshot(); S.projects = []; S.tasks = []; S.recurring = []; S.occ = {}; S.settings.members = []; S.settings.weekNotes = {}; S.meta.sample = false;
    Object.keys(UI).forEach(k => delete UI[k]); saveUI(); touchOcc(); save(true); render(); toast('Sample data removed — add your first project!', restoreSnap);
  },
  'load-sample': async () => {
    if ((S.tasks.length || S.projects.length) && !await confirmBox('Replace your current data with the sample data? Download a backup first if you want to keep it.', 'Replace with sample')) return;
    snapshot(); const keep = S.settings.theme; S = sampleData(); S.settings.theme = keep; touchOcc(); save(true); render(); toast('Sample data loaded', restoreSnap);
  },
  wipe: async () => {
    if (!await confirmBox('Erase <b>all</b> projects, tasks, recurring tasks and settings on this device? This can’t be undone unless you have a backup.', 'Erase everything')) return;
    snapshot(); S = defaults(); Object.keys(UI).forEach(k => delete UI[k]); saveUI(); touchOcc(); save(true); applyTheme(); shell(); go('projects'); toast('All data erased', () => { restoreSnap(); applyTheme(); shell(); render(); });
  },
};
VIEWS.setup.change = async e => {
  const t = e.target;
  if (t.dataset.setting) { const k = t.dataset.setting; S.settings[k] = k === 'weekStart' ? +t.value : t.value; save(); render(); toast('Saved'); return; }
  if (t.dataset.list) {
    const key = t.dataset.list, i = +t.dataset.i, old = S.settings[key][i], v = t.value.trim();
    if (!v) { t.value = old; return; }
    if (v === old) return;
    S.settings[key][i] = v;
    const field = { members: 'assignee', categories: 'category', phases: 'phase' }[key];
    let changed = 0;
    S.tasks.forEach(x => { if (x[field] === old) { x[field] = v; changed++; } });
    S.recurring.forEach(x => { if (x[field] === old) { x[field] = v; changed++; } });
    if (key === 'members') { S.projects.forEach(p => { if (p.lead === old) p.lead = v; }); Object.values(S.occ).forEach(o => { if (o.assignee === old) o.assignee = v; }); touchOcc(); }
    save(); render(); toast(changed ? `Renamed — ${plural(changed, 'task')} updated` : 'Saved'); return;
  }
  if (t.dataset.stageName != null) { const s = S.settings.stages[+t.dataset.stageName]; const v = t.value.trim(); if (v) { s.name = v; save(); toast('Stage renamed'); } else t.value = s.name; return; }
  if (t.matches('[data-restore]')) {
    const f = t.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || !Array.isArray(data.tasks) || !Array.isArray(data.projects)) throw new Error('bad');
      if (!await confirmBox(`Restore this backup? It has <b>${plural(data.projects.length, 'project')}</b> and <b>${plural(data.tasks.length, 'task')}</b> and will replace what’s on this device.`, 'Restore', false)) { t.value = ''; return; }
      snapshot(); delete data.app; S = migrate(data); touchOcc(); save(true); applyTheme(); shell(); go('dashboard'); toast('Backup restored', restoreSnap);
    } catch (err) { toast('That file isn’t a valid The Workflow backup'); }
    t.value = '';
  }
};
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const v = (f.querySelector('[name=v]') || {}).value; const val = (v || '').trim(); if (!val) return;
  if (f.dataset.listAdd) { const key = f.dataset.listAdd; if (S.settings[key].some(x => x.toLowerCase() === val.toLowerCase())) { toast('Already in the list'); return; } S.settings[key].push(val); save(); render(); setTimeout(() => { const i = $(`[data-list-add="${key}"] input`); if (i) i.focus(); }, 0); }
  if (f.dataset.stageAdd != null) { if (S.settings.stages.length >= 10) return; S.settings.stages.push({ id: uid(), name: val, color: STAGE_COLORS[S.settings.stages.length % STAGE_COLORS.length] }); save(); render(); }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._installPrompt = e; });
VIEWS.weekly.after = function () {
  const wk = $('.week'); const t = wk && wk.querySelector('.wday.tod');
  if (wk && t && window.innerWidth <= 640 && !wk.dataset.done && wk.scrollLeft === 0) { wk.scrollLeft = t.offsetLeft - wk.offsetLeft; }
  if (wk) wk.dataset.done = '1';
};

init();

</script>
