[data-theme=salbei]{--ink:#2F4A3F;--desk:#DCE5DC;--deskdot:#CBD7CC;--acc:#5E8C74}
[data-theme=rose]{--ink:#5A2E3A;--desk:#F0DFDC;--deskdot:#E5CFCB;--acc:#C96B7C}
[data-theme=ozean]{--ink:#18405A;--desk:#D8E5EC;--deskdot:#C6D7E1;--acc:#3D8DB5}
[data-theme=sand]{--ink:#3E3328;--desk:#EDE3CF;--deskdot:#E0D3B8;--acc:#B9873C}
[data-theme=lila]{--ink:#3B2F5C;--desk:#E3DEEE;--deskdot:#D3CCE3;--acc:#7F6AB8}
html[data-dark=on]{
  --ink:#ECE6DA;--ink2:#C3BDB0;--mute:#8F96A6;--line:#343A4A;--line2:#2B3040;
  --paper:#1D2130;--card:#252A3A;--desk:#12141C;--deskdot:#1B1E29;--soft:#262B3B;
  --sh:0 10px 30px -10px rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--desk);
  background-image:radial-gradient(var(--deskdot) 1px,transparent 1.3px);background-size:22px 22px;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb,var(--acc) 30%,transparent)}

/* ---------- book shell ---------- */
.book{position:relative;max-width:1320px;margin:0 auto;padding:54px 58px 28px 22px;min-height:100vh}
.toptabs{position:absolute;left:40px;right:80px;top:10px;display:flex;gap:4px;align-items:flex-end;height:46px;z-index:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.toptabs::-webkit-scrollbar{display:none}
.tt{flex:none}
.tt{height:36px;padding:0 15px 6px;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:7px;
  font-weight:600;font-size:13.5px;color:#fff;background:var(--c);opacity:.82;white-space:nowrap;
  box-shadow:inset 0 -6px 8px -6px rgba(0,0,0,.18);transition:height .15s,opacity .15s}
.tt:hover{opacity:1}
.tt.on{height:44px;opacity:1;box-shadow:none}
.tt .ic{font-size:14px;line-height:1}
.tt.gear{margin-left:auto;background:var(--card);color:var(--ink2);border:1px solid var(--line);border-bottom:0}
.page{position:relative;background:var(--paper);border-radius:6px 18px 18px 18px;box-shadow:var(--sh);
  min-height:calc(100vh - 82px);padding:26px 30px 34px;z-index:2}
.page:before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:6px 0 0 18px;
  background:linear-gradient(90deg,rgba(0,0,0,.06),transparent)}
.sidetabs{position:absolute;right:16px;top:70px;height:min(760px,calc(100vh - 96px));min-height:420px;width:44px;display:flex;flex-direction:column;gap:3px;z-index:1}
.st{flex:1;border-radius:0 11px 11px 0;background:color-mix(in srgb,var(--c) 32%,var(--paper));color:color-mix(in srgb,var(--c) 70%,var(--ink));
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding-left:6px;
  writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.5px;transition:all .15s;min-height:30px}
.st:hover{background:color-mix(in srgb,var(--c) 55%,var(--paper))}
.st.on{background:var(--c);color:#fff;margin-right:-6px}
.st.yrt{--c:var(--ink);writing-mode:horizontal-tb;transform:none;padding:0;font-size:10.5px;letter-spacing:0;flex:0 0 40px}
.st.yrt.on{color:var(--paper)}
html[data-dark=on] .st{color:var(--ink)}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:20px;border-bottom:1.5px solid var(--ink)}
.ph h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-.5px}
.ph h1 em{font-style:italic;font-weight:400}
.ph .sub{color:var(--mute);font-size:13.5px;margin-top:5px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{font-size:12.5px;color:var(--mute);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--ink2);font-weight:600}
.crumb a:hover{text-decoration:underline}

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:var(--card);border:1px solid var(--line);color:var(--ink);white-space:nowrap;transition:transform .08s,background .15s}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.ai{background:linear-gradient(135deg,#10A37F,#1A7F64);color:#fff;border:0}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.ico{width:34px;height:34px;padding:0;justify-content:center}
.iconbtn{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);font-size:15px}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.lab{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--mute);margin:0 0 8px}
.h2{font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:10px}
.muted{color:var(--mute)}
.small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;
  background:color-mix(in srgb,var(--c,var(--acc)) 18%,var(--card));color:color-mix(in srgb,var(--c,var(--acc)) 75%,var(--ink))}
html[data-dark=on] .chip{color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:18px;margin-bottom:4px}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--ink2)}

/* inputs */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--mute)}
.in,.f input,.f select,.f textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
.in:focus,.f input:focus,.f select:focus,.f textarea:focus,.cellin:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
textarea{resize:vertical;min-height:70px}
.lined{background:var(--card) repeating-linear-gradient(transparent 0 27px,var(--line2) 27px 28px);line-height:28px;padding:0 12px;border:1px solid var(--line);border-radius:10px;width:100%;outline:none;resize:vertical;background-attachment:local}
.bare{background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:5px 2px;outline:none;width:100%}
.bare:focus{border-bottom-color:var(--acc)}
.chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.8px solid #B9B2A4;border-radius:6px;flex:none;cursor:pointer;display:inline-grid;place-content:center;background:var(--card)}
.chk:checked{background:var(--good);border-color:var(--good)}
.chk:checked:after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cl{display:flex;flex-direction:column}
.ci{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2)}
.ci input[type=text]{flex:1;background:transparent;border:0;outline:none;padding:3px 0}
.ci.done input[type=text]{text-decoration:line-through;color:var(--mute)}
.ci .iconbtn{opacity:0}
.ci:hover .iconbtn,.ci:focus-within .iconbtn{opacity:1}
@media (hover:none){.ci .iconbtn{opacity:.6}}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:5px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ---------- today ---------- */
.hero{display:flex;gap:18px;align-items:center;margin-bottom:6px}
.today-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px}
.lesson-row{display:grid;grid-template-columns:40px 64px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line2);border-radius:8px;cursor:pointer}
.lesson-row:hover{background:var(--soft)}
.lesson-row .n{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--c,var(--mute))}
.lesson-row .tm{font-size:12px;color:var(--mute)}
.lesson-row .tp{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-row.free{opacity:.45}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1}
.ev{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.ev .d{min-width:46px;text-align:center;border-radius:9px;background:var(--soft);padding:3px 0;font-size:11px;font-weight:700;color:var(--mute);line-height:1.2}
.ev .d b{display:block;font-family:var(--serif);font-size:17px;color:var(--ink)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--warn) 18%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--card));margin-bottom:16px}

/* ---------- year ---------- */
.yr{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px}
.ygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mm{background:var(--card);border-radius:12px;padding:10px 11px 9px;border-top:4px solid var(--c);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mmh{font-family:var(--serif);font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;cursor:pointer}
.mmh span{color:var(--mute);font-weight:400;font-size:12px;font-family:var(--sans)}
.mmg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:11.5px;text-align:center}
.mmg .h{color:var(--mute);font-size:9.5px;font-weight:700;padding-bottom:2px}
.mmg button{padding:3px 0;border-radius:6px;position:relative;font-variant-numeric:tabular-nums}
.mmg button:hover{outline:1.5px solid var(--c)}
.mmg .we{color:var(--mute)}
.mmg .fe{background:color-mix(in srgb,var(--c) 28%,var(--card))}
.mmg .ft{background:var(--bad);color:#fff;font-weight:700}
.mmg .td{outline:2px solid var(--ink);font-weight:700}
.mmg .has:after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
.mmg .ft.has:after{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.fl{list-style:none;font-size:13px}
.fl li{padding:6px 0;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:8px}
.fl li b{font-weight:600}
.fl li span{color:var(--mute);font-size:12px;text-align:right}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}

/* ---------- month ---------- */
.mon{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 30px;gap:5px}
.mh{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:1px;padding:0 4px}
.mc{background:var(--card);border-radius:11px;padding:6px 7px;border:1px solid var(--line);min-height:104px;display:flex;flex-direction:column;gap:2px;cursor:pointer;overflow:hidden;position:relative}
.mc:hover{border-color:var(--c)}
.mc .dn{font-family:var(--serif);font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.mc .stk{font-size:15px}
.mc.we{background:var(--soft)}
.mc.out{opacity:.38}
.mc.fe{background:color-mix(in srgb,var(--c) 16%,var(--card));border-color:color-mix(in srgb,var(--c) 35%,var(--card))}
.mc.td{box-shadow:inset 0 0 0 2px var(--ink)}
.mc .hl{font-size:10.5px;font-weight:700;color:color-mix(in srgb,var(--c) 70%,var(--ink));line-height:1.2}
.mc .hl.ft{color:var(--bad)}
.mc .e{font-size:11px;line-height:1.25;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c2,var(--acc)) 16%,var(--card));border-left:3px solid var(--c2,var(--acc));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .more{font-size:10.5px;color:var(--mute);font-weight:600}
.kw{font-size:10px;color:var(--mute);display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--soft);border-radius:9px;writing-mode:vertical-rl;cursor:pointer}
.kw:hover{background:var(--line)}

/* ---------- week ---------- */
.wk{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px}
.wgrid{display:grid;gap:5px}
.wh{border-radius:11px;padding:7px 10px;background:var(--c);color:#fff;cursor:pointer;line-height:1.25}
.wh b{display:block;font-size:13.5px}
.wh span{font-size:11.5px;opacity:.9}
.wh.td{box-shadow:0 0 0 2.5px var(--ink)}
.wp{display:flex;flex-direction:column;justify-content:center;font-size:10.5px;color:var(--mute);line-height:1.2}
.wp b{font-family:var(--serif);font-size:16px;color:var(--ink)}
.ws{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:62px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;text-align:left}
.ws:hover{border-color:var(--c,var(--acc))}
.ws.has{border-left:4px solid var(--c)}
.ws .cn{font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;gap:4px}
.ws .sj{font-size:11.5px;color:var(--mute)}
.ws .tp{font-size:12px;color:var(--ink);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ws .flags{position:absolute;right:6px;bottom:4px;font-size:10px;display:flex;gap:3px}
.ws.cx{opacity:.5}.ws.cx .tp,.ws.cx .cn{text-decoration:line-through}
.ws.empty-slot{background:transparent;border-style:dashed;align-items:center;justify-content:center;color:var(--line)}
.ws.empty-slot:hover{color:var(--mute)}
.hol{border-radius:10px;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c) 18%,var(--card)) 0 8px,color-mix(in srgb,var(--c) 8%,var(--card)) 8px 16px);
  display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:13px;color:color-mix(in srgb,var(--c) 70%,var(--ink));letter-spacing:1px}
.brk{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);text-align:center;opacity:.6;line-height:12px}
.side-block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}

/* ---------- day ---------- */
.day{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
.stickers{display:flex;flex-wrap:wrap;gap:4px}
.stickers button{font-size:22px;width:40px;height:40px;border-radius:10px}
.stickers button:hover{background:var(--soft)}
.stickers button.on{background:color-mix(in srgb,var(--acc) 22%,var(--card));box-shadow:inset 0 0 0 2px var(--acc)}

/* ---------- lesson ---------- */
.les-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,2fr);gap:10px;margin-bottom:18px}
.les{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:22px}
.vt{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vt th{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;text-align:left;padding:8px 8px;background:color-mix(in srgb,var(--c) 20%,var(--card));color:var(--ink2)}
.vt td{border-top:1px solid var(--line);vertical-align:top}
.vt td+td,.vt th+th{border-left:1px solid var(--line)}
.vt textarea,.vt input{width:100%;border:0;background:transparent;outline:none;padding:7px 8px;min-height:44px;resize:vertical;font-size:13.5px}
.vt td:last-child{width:34px;text-align:center}
.status{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- timetable ---------- */
.tt-grid{display:grid;gap:5px}
.tt-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:58px;padding:6px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:center}
.tt-cell:hover{border-color:var(--acc)}
.tt-cell.has{background:color-mix(in srgb,var(--c) 22%,var(--card));border-color:color-mix(in srgb,var(--c) 45%,var(--card))}
.tt-cell b{font-size:13px}
.tt-cell span{font-size:11.5px;color:var(--ink2)}
.tt-time{display:flex;flex-direction:column;justify-content:center;font-size:11px;color:var(--mute)}
.tt-time b{font-family:var(--serif);color:var(--ink);font-size:17px}

/* ---------- classes ---------- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.ccard{border-radius:16px;padding:16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;
  background:color-mix(in srgb,var(--c) 20%,var(--card));border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--card));transition:transform .12s}
.ccard:hover{transform:translateY(-2px)}
.ccard b{font-family:var(--serif);font-size:30px;font-weight:600;color:color-mix(in srgb,var(--c) 85%,var(--ink));line-height:1}
.ccard .m{font-size:12.5px;color:var(--ink2)}
.ccard.add{background:transparent;border-style:dashed;border-color:var(--line);align-items:center;justify-content:center;color:var(--mute);font-weight:600}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:-6px 0 18px;border-bottom:1px solid var(--line)}
.subtabs button{padding:9px 13px;font-size:13.5px;font-weight:600;color:var(--mute);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--c,var(--acc))}
.stl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 16px}
.stu{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--line2)}
.stu:hover{background:var(--soft)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-content:center;font-weight:700;font-size:12.5px;flex:none;
  background:color-mix(in srgb,var(--c) 25%,var(--card));color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.stu .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.stu .no{font-size:11px;color:var(--mute);width:18px;text-align:right}

/* grades */
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:70vh}
.gt{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.gt th,.gt td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:0;white-space:nowrap}
.gt thead th{position:sticky;top:0;background:color-mix(in srgb,var(--c) 18%,var(--card));z-index:2;font-size:11px;padding:6px 8px;text-align:center;font-weight:700;cursor:pointer}
.gt thead th .cat{display:block;font-size:9.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}

/* Gesetzliche Feiertage – berechnet für jedes Jahr */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
function publicHolidays(y, st) {
  const E = easter(y), add = n => { const x = new Date(E); x.setDate(x.getDate() + n); return x; };
  const L = (...s) => s.includes(st);
  const list = [
    [new Date(y, 0, 1), 'h_newyear'],
    L('BW', 'BY', 'ST') && [new Date(y, 0, 6), 'h_epiphany'],
    L('BE', 'MV') && [new Date(y, 2, 8), 'h_womensday'],
    [add(-2), 'h_goodfriday'], [add(1), 'h_eastermonday'], [new Date(y, 4, 1), 'h_labour'],
    [add(39), 'h_ascension'], [add(50), 'h_whitmonday'],
    L('BW', 'BY', 'HE', 'NW', 'RP', 'SL') && [add(60), 'h_corpus'],
    L('SL', 'BY') && [new Date(y, 7, 15), 'h_assumption'],
    L('TH') && [new Date(y, 8, 20), 'h_childrensday'],
    [new Date(y, 9, 3), 'h_unity'],
    L('BB', 'HB', 'HH', 'MV', 'NI', 'SN', 'ST', 'SH', 'TH') && [new Date(y, 9, 31), 'h_reformation'],
    L('BW', 'BY', 'NW', 'RP', 'SL') && [new Date(y, 10, 1), 'h_allsaints'],
    L('SN') && [(() => { const d = new Date(y, 10, 22); d.setDate(d.getDate() - ((d.getDay() - 3 + 7) % 7)); return d; })(), 'h_penance'],
    [new Date(y, 11, 25), 'h_xmas1'], [new Date(y, 11, 26), 'h_xmas2']
  ];
  return list.filter(Boolean);
}

let HM = null, HMk = '';
function hmap() {

  if (HM && HMk === k) return HM;
  HM = new Map(); HMk = k;
  const put = (d, prop, name) => { const e = HM.get(d) || {}; if (!e[prop]) e[prop] = name; HM.set(d, e); };
  const range = (a, b, name, prop) => { if (!a) return; let d = P(a); const end = P(b || a); let n = 0; while (d <= end && n++ < 400) { put(iso(d), prop, name); d = addD(d, 1); } };
  const st = S.settings.region;
  if (FERIEN[st]) FERIEN[st].forEach(([k, a, b]) => range(a, b, t('fer_' + k), 'fe'));
  if (STATES[st]) for (let y = 2025; y <= 2029; y++) publicHolidays(y, st).forEach(([d, k]) => put(iso(d), 'ft', t(k)));
  S.customHolidays.forEach(h => range(h.from, h.to, h.name || t('holiday'), h.type === 'ft' ? 'ft' : 'fe'));
  return HM;
}

const offDay = di => { const h = hol(di); return h.fe || h.ft || null; };

function syMonths(sy) { const m0 = syStartMonth(); return Array.from({ length: 12 }, (_, i) => { const m = (m0 - 1 + i) % 12 + 1; return [m0 - 1 + i >= 12 ? sy + 1 : sy, m]; }); }

const GS = {
  de: { lab: '1–6', parse: v => { v = String(v ?? '').trim().replace(',', '.'); if (!v) return null; const m = v.match(/^([1-6])\s*([+-])?$/); if (m) { let n = +m[1]; if (m[2] === '+') n -= 0.33; if (m[2] === '-') n += 0.33; return Math.min(6, Math.max(0.67, n)); } if (/^\d(\.\d+)?$/.test(v)) { const x = +v; if (x >= 1 && x <= 6) return x; } return NaN; }, fmt: n => fmtNum(n, 2), fin: n => String(Math.min(6, Math.max(1, Math.round(n)))), score: n => (6 - n) / 5, bins: [1, 2, 3, 4, 5, 6], bin: n => Math.min(6, Math.max(1, Math.round(n))) },
  p15: { lab: '0–15 P.', parse: v => { v = String(v ?? '').trim().replace(',', '.'); if (!v) return null; const x = +v; return (/^\d+(\.\d+)?$/.test(v) && x <= 15) ? x : NaN; }, fmt: n => fmtNum(n, 1), fin: n => String(Math.round(n)), score: n => n / 15, bins: [0, 3, 6, 9, 12, 15], bin: n => [0, 3, 6, 9, 12, 15].reduce((a, b) => Math.abs(b - n) < Math.abs(a - n) ? b : a) },
  f20: { lab: '/20', parse: v => { v = String(v ?? '').trim().replace(',', '.'); if (!v) return null; const x = +v; return (/^\d+(\.\d+)?$/.test(v) && x <= 20) ? x : NaN; }, fmt: n => fmtNum(n, 2), fin: n => fmtNum(Math.round(n * 2) / 2, 1), score: n => n / 20, bins: [0, 5, 8, 10, 12, 14, 16, 20], bin: n => [0, 5, 8, 10, 12, 14, 16, 20].filter(b => b <= n).pop() },
  pct: { lab: '%', parse: v => { v = String(v ?? '').trim().replace(',', '.').replace('%', ''); if (!v) return null; const x = +v; return (/^\d+(\.\d+)?$/.test(v) && x <= 100) ? x : NaN; }, fmt: n => fmtNum(n, 0) + '%', fin: n => { const g = n >= 90 ? 'A' : n >= 80 ? 'B' : n >= 70 ? 'C' : n >= 60 ? 'D' : 'F'; return g; }, score: n => n / 100, bins: [50, 60, 70, 80, 90], bin: n => n >= 90 ? 90 : n >= 80 ? 80 : n >= 70 ? 70 : n >= 60 ? 60 : 50 }
};
function avgFor(c, h, sid) {
  const g = GS[c.gs] || GS.de, cats = { w: [0, 0], m: [0, 0], s: [0, 0] };
  c.grades[h].cols.forEach(col => { const v = g.parse((c.gv[col.id] || {})[sid]); if (v == null || isNaN(v)) return; const w = +col.weight || 1; const k = cats[col.cat] ? col.cat : 's'; cats[k][0] += v * w; cats[k][1] += w; });
  const r = {}; let tot = 0, tw = 0, n = 0, plain = 0;
  for (const k in cats) if (cats[k][1]) { r[k] = cats[k][0] / cats[k][1]; n++; plain += r[k]; const cw = +c.w[k] || 0; tot += r[k] * cw; tw += cw; }
  r.all = tw ? tot / tw : n ? plain / n : null;
  return r;
}
function colStats(c, col) {
  const g = GS[c.gs] || GS.de, vals = c.students.map(s => g.parse((c.gv[col.id] || {})[s.id])).filter(v => v != null && !isNaN(v));
  const bins = {}; g.bins.forEach(b => bins[b] = 0); vals.forEach(v => bins[g.bin(v)]++);
  return { n: vals.length, avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null, bins };
}

/* reminders + ics */
function ics(ev) {
  const dt = (ev.date || todayISO()).replace(/-/g, ''), tm = ev.time ? ev.time.replace(':', '') + '00' : '';
  const start = tm ? `DTSTART:${dt}T${tm}` : `DTSTART;VALUE=DATE:${dt}`;
  const endD = tm ? `DTEND:${dt}T${pad(Math.min(23, +ev.time.slice(0, 2) + 1))}${ev.time.slice(3, 5)}00` : `DTEND;VALUE=DATE:${iso(addD(P(ev.date || todayISO()), 1)).replace(/-/g, '')}`;
  const alarm = `BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${(ev.title || '').replace(/[,;\n]/g, ' ')}\r\nTRIGGER:${tm ? '-PT15M' : 'PT8H'}\r\nEND:VALARM`;
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Lehrerheft//DE\r\nBEGIN:VEVENT\r\nUID:${ev.id || uid()}@lehrerheft\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z\r\n${start}\r\n${endD}\r\nSUMMARY:${(ev.title || '').replace(/[,;\n]/g, ' ')}\r\nDESCRIPTION:${(ev.note || '').replace(/\n/g, '\\n').replace(/[,;]/g, ' ')}\r\n${alarm}\r\nEND:VEVENT\r\nEND:VCALENDAR`;
}
const notified = new Set();
function checkReminders() {
  const now = new Date(), di = iso(now), m = now.getHours() * 60 + now.getMinutes();
  S.events.forEach(e => {
    if (!e.remind || e.date !== di || notified.has(e.id)) return;
    const em = e.time ? mins(e.time) : 7 * 60 + 30;
    if (em - m <= 15 && em - m >= -1) {
      notified.add(e.id);
      const msg = (e.time ? e.time + ' · ' : '') + (e.title || t('untitled'));
      if ('Notification' in window && Notification.permission === 'granted') { try { new Notification('Lehrerheft', { body: msg }); } catch (er) { toast('⏰ ' + msg); } } else toast('⏰ ' + msg);
    }
  });
}

function vWeek(k) {

  rows.forEach((r, ri) => {

    const p = S.settings.periods[r.i];

  const sel = UI.seatSel;
  let seats = '';
  for (let r = 0; r < R; r++) for (let k = 0; k < C; k++) {
    const key = r + '-' + k, sid = st.map[key], s = sid && c.students.find(x => x.id === sid);
    seats += st.gaps[key] ? `<button class="seat gap" data-a="seat" data-k="${key}" data-c="${c.id}" aria-label="${t('gap')}"></button>`
      : `<button class="seat${s ? ' occ' : ''}${sel && sel.k === key ? ' sel' : ''}" data-a="seat" data-k="${key}" data-c="${c.id}">${s ? `<span>${esc(s.first || sname(s))}${s.last ? `<br><span class="small muted">${esc(s.last)}</span>` : ''}</span>` : ''}</button>`;
  }
  return `<div class="seatwrap" style="--c:${c.color}"><div><div class="board">${t('board')}</div><div class="seatscroll"><div class="seats" style="grid-template-columns:repeat(${C},minmax(0,1fr))">${seats}</div></div><div class="teacher">${t('teacherDesk')}</div></div>
<aside class="no-print"><div class="side-block"><div class="lab">${t('layout')}</div><div class="row"><label class="row small">${t('rows')} <input class="in" type="number" min="1" max="10" style="width:64px" ${b(st, 'rows')} value="${R}" data-rr="1"></label><label class="row small">${t('cols')} <input class="in" type="number" min="1" max="10" style="width:64px" ${b(st, 'cols')} value="${C}" data-rr="1"></label></div>
<div class="row" style="margin-top:10px"><button class="btn sm" data-a="seatRand" data-c="${c.id}">${ic('shuffle', 13)} ${t('random')}</button><button class="btn sm" data-a="seatClear" data-c="${c.id}">${t('clear')}</button><button class="btn sm${UI.gapMode ? ' pri' : ''}" data-a="gapMode">${t('gapMode')}</button></div></div>
<div class="side-block"><div class="lab">${t('unplaced')} (${pool.length})</div><div class="pool">${pool.map(s => `<button class="stc${sel && sel.s === s.id ? ' sel' : ''}" data-a="poolSel" data-s="${s.id}">${esc(sname(s))}</button>`).join('') || `<span class="small muted">${t('allPlaced')}</span>`}</div></div>
<p class="small muted">${t('seatHint')}</p></aside></div>`;
}
A.poolSel = el => { UI.seatSel = UI.seatSel && UI.seatSel.s === el.dataset.s && !UI.seatSel.k ? null : { s: el.dataset.s }; render(); };
A.gapMode = () => { UI.gapMode = !UI.gapMode; UI.seatSel = null; render(); };
A.seat = el => {
  const c = cls(el.dataset.c), st = c.seat, k = el.dataset.k, sel = UI.seatSel;
  if (UI.gapMode) { if (st.gaps[k]) delete st.gaps[k]; else { st.gaps[k] = true; delete st.map[k]; } save(); render(); return; }
  if (st.gaps[k]) return;
  if (sel) {
    if (sel.k === k) { UI.seatSel = null; render(); return; }
    const occ = st.map[k];
    if (sel.k) { if (occ) st.map[sel.k] = occ; else delete st.map[sel.k]; }
    st.map[k] = sel.s; UI.seatSel = null;
  } else if (st.map[k]) UI.seatSel = { s: st.map[k], k };
  save(); render();
};
A.seatRand = el => { const c = cls(el.dataset.c), st = c.seat; const free = []; for (let r = 0; r < st.rows; r++) for (let k = 0; k < st.cols; k++) if (!st.gaps[r + '-' + k]) free.push(r + '-' + k);
  const ids = c.students.map(s => s.id).sort(() => Math.random() - .5); st.map = {}; ids.slice(0, free.length).forEach((id, i) => st.map[free[i]] = id); save(); render(); };

let INK = null;
function mountInk(pid) {
  const cv = $('canvas[data-page]'); if (!cv) return;
  const sh = cv.parentElement, dpr = Math.min(2, window.devicePixelRatio || 1), W = sh.clientWidth, H = sh.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const hist = []; let drawing = false, last = null, saveTO;
  INK = { ctx, cv, hist, pid };
  IDB.get('p:' + pid).then(u => { if (u) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, W, H); im.src = u; } });
  const persist = () => { clearTimeout(saveTO); saveTO = setTimeout(() => IDB.set('p:' + pid, cv.toDataURL('image/png')), 400); };
  INK.persist = persist;
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height, e.pressure]; };
  cv.onpointerdown = e => {
    if (UI.nbMode !== 'pen') return; if (S.settings.penOnly && e.pointerType === 'touch') return;
    e.preventDefault(); drawing = true; cv.setPointerCapture(e.pointerId);
    hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 25) hist.shift();
    last = pt(e);
  };
  cv.onpointermove = e => {
    if (!drawing) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    ctx.globalCompositeOperation = UI.tool === 'eraser' ? 'destination-out' : UI.tool === 'hl' ? 'multiply' : 'source-over';
    ctx.globalAlpha = UI.tool === 'hl' ? 0.35 : 1;
    ctx.strokeStyle = UI.tool === 'hl' ? '#F5D547' : UI.pen;
    for (const ev of evs) { const p = pt(ev); const pr = ev.pointerType === 'pen' && p[2] ? 0.4 + p[2] * 1.2 : 1;
      ctx.lineWidth = UI.tool === 'eraser' ? 22 : UI.tool === 'hl' ? 16 : UI.size * pr;
      ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; }
    ctx.globalAlpha = 1;
  };
  const end = () => { if (!drawing) return; drawing = false; persist(); };
  cv.onpointerup = end; cv.onpointercancel = end; cv.onpointerleave = end;
}
A.inkUndo = () => { if (INK && INK.hist.length) { INK.ctx.putImageData(INK.hist.pop(), 0, 0); INK.persist(); } };
