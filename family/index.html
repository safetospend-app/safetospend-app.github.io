<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Family Wall</title>
<meta name="description" content="Family calendar, chore chart, rewards, meal planner, lists and photo frame for any tablet.">
<meta name="theme-color" content="#2F7CF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Wall">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --panel2:#F6F8FB; --ink:#1E2A3B; --ink2:#5B6B80; --ink3:#95A3B5;
  --line:#E2E8F0; --accent:#2F7CF6; --accent-soft:#E4EEFE; --star:#F5B400; --danger:#E5484D;
  --radius:18px; --shadow:0 2px 10px rgba(30,42,59,.06); --side:96px;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#0F1522; --panel:#18202F; --panel2:#1F2939; --ink:#EEF2F8; --ink2:#A6B3C5; --ink3:#6F7E93;
  --line:#2A3547; --accent:#5B9BFF; --accent-soft:#1F3252; --shadow:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px}
body{overflow:hidden;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--side) 1fr;height:100vh;height:100dvh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;overflow-y:auto}
#side .logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#2F7CF6,#7C5CF0);display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px;margin-bottom:10px}
.nav{width:80px;padding:9px 0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);font-size:12px;font-weight:700}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
#side .grow{flex:1}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}

/* ---------- header ---------- */
#head{display:flex;align-items:center;gap:22px;padding:14px 24px 10px;flex-wrap:wrap}
.clock{display:flex;align-items:baseline;gap:14px}
.clock .t{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1}
.clock .t small{font-size:18px;font-weight:800;margin-left:4px;color:var(--ink2)}
.clock .d{font-size:17px;font-weight:700;color:var(--ink2);line-height:1.2}
.clock .d b{display:block;color:var(--ink);font-size:19px}
.weather{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.weather .e{font-size:30px;line-height:1}
.weather .tp{font-size:22px;font-weight:900}
.weather .hl{font-size:13px;color:var(--ink2);font-weight:700}
.people{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.pchip{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--ink2);opacity:1;transition:opacity .2s}
.pchip.off{opacity:.35}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;flex:none;box-shadow:0 0 0 3px var(--panel)}
.av.s{width:32px;height:32px;font-size:15px;box-shadow:none}
.av.xs{width:24px;height:24px;font-size:12px;box-shadow:none}
.pchip .badge{position:absolute;top:-4px;right:-6px;background:var(--danger);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.pchip .badge.done{background:#22B573}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--panel);box-shadow:var(--shadow);color:var(--ink2)}
.iconbtn:hover{color:var(--accent)}

#view{flex:1;min-height:0;overflow:auto;padding:6px 24px 24px}

/* ---------- generic ---------- */
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.muted{color:var(--ink3);font-weight:600}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .title{font-size:24px;font-weight:900;margin:0 6px;min-width:0}
.toolbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);font-weight:800;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--panel);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-weight:800;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--accent);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 4px;border-radius:17px;background:var(--panel);box-shadow:var(--shadow);font-weight:800;font-size:14px}
.chip.off{opacity:.4}
.chip.plain{padding:0 12px}
.chip.on{background:var(--accent);color:#fff}
.empty{text-align:center;color:var(--ink3);font-weight:700;padding:24px 10px}
.empty .big{font-size:40px;display:block;margin-bottom:6px}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;gap:16px;align-items:start}
.home .col{display:flex;flex-direction:column;gap:16px;min-width:0}
.evrow{display:flex;gap:12px;padding:10px 12px;border-radius:12px;background:var(--panel2);margin-bottom:8px;align-items:center;cursor:pointer}
.evrow .bar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.evrow .tm{font-size:13px;font-weight:800;color:var(--ink2);width:112px;flex:none}
.evrow .tt{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evrow .dots{display:flex;gap:3px}
.upc .day{font-size:12px;font-weight:900;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin:10px 2px 6px}
.mini-meal{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.mini-meal:last-child{border:0}
.mini-meal .k{font-size:12px;font-weight:900;text-transform:uppercase;color:var(--ink3);letter-spacing:.5px}
.mini-meal .v{font-weight:800}

/* ---------- tasks / chore chart ---------- */
.chore-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;align-items:start}
.pcol{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pcol .ph{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff}
.pcol .ph .nm{font-weight:900;font-size:19px;line-height:1.1}
.pcol .ph .st{font-size:13px;font-weight:800;opacity:.95}
.pcol .ph .av{box-shadow:0 0 0 3px rgba(255,255,255,.5);background:rgba(255,255,255,.25)}
.ring{margin-left:auto;width:48px;height:48px;position:relative}
.ring svg{width:48px;height:48px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900}
.pcol .list{padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel2);cursor:pointer;transition:transform .12s}
.task:active{transform:scale(.98)}
.task .ck{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;transition:all .2s}
.task.done .ck{border-color:var(--pc);background:var(--pc)}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-weight:800;line-height:1.2}
.task.done .tx b{text-decoration:line-through;color:var(--ink3)}
.task .tx span{font-size:12px;color:var(--ink3);font-weight:700}
.task .sv{font-size:13px;font-weight:900;color:var(--star);white-space:nowrap}
.task .ed{color:var(--ink3);padding:4px}
.pri-high{box-shadow:inset 3px 0 0 var(--danger)}
.addtask{border:2px dashed var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:800;color:var(--ink3)}
.burst{position:fixed;pointer-events:none;z-index:99;font-size:22px;color:var(--star);animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:98;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- rewards ---------- */
.bal-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.bal{border-radius:var(--radius);padding:16px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.bal .n{font-size:30px;font-weight:900;line-height:1}
.bal .l{font-size:13px;font-weight:800;opacity:.95}
.bal .adj{margin-left:auto;display:flex;flex-direction:column;gap:4px}
.bal .adj button{width:30px;height:26px;border-radius:8px;background:rgba(255,255,255,.25);font-weight:900;color:#fff}
.rw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.rw{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.rw .em{font-size:40px;line-height:1}
.rw .tt{font-weight:900;font-size:17px}
.rw .cost{font-weight:900;color:var(--star)}
.rw .who{display:flex;gap:4px}
.rw .ed{position:absolute;top:10px;right:10px;color:var(--ink3)}
.hist{margin-top:18px}
.hist .r{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700}
.hist .r .amt{margin-left:auto;font-weight:900}

/* ---------- calendar ---------- */
.cal-month{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:36px;grid-auto-rows:minmax(104px,1fr);background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cal-month .wd{grid-row:auto;height:36px;display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.cal-month .wdrow{display:contents}
.mc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mc:nth-child(7n){border-right:0}
.mc.out{background:var(--panel2)}
.mc.out .dn{color:var(--ink3)}
.mc .dn{font-weight:900;font-size:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.mc.today .dn{background:var(--accent);color:#fff}
.pill{font-size:12px;font-weight:800;color:#fff;border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pill.soft{background:var(--panel2)!important;color:var(--ink);border-left:4px solid}
.more{font-size:12px;font-weight:800;color:var(--ink2);padding-left:4px}
.cal-cols{display:grid;gap:10px}
.dcol{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:420px;min-width:0}
.dcol .dh{padding:12px 10px 10px;text-align:center;border-bottom:1px solid var(--line);cursor:pointer}
.dcol .dh .w{font-size:12px;font-weight:900;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
.dcol .dh .n{font-size:24px;font-weight:900;width:40px;height:40px;margin:2px auto 0;display:grid;place-items:center;border-radius:50%}
.dcol.today .dh .n{background:var(--accent);color:#fff}
.dcol .body{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;cursor:pointer}
.evc{border-radius:10px;padding:8px 10px;cursor:pointer;border-left:5px solid;background:var(--panel2);min-width:0}
.evc b{display:block;font-size:14px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.evc span{font-size:12px;font-weight:800;color:var(--ink2)}
.evc .dots{display:flex;gap:3px;margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dayview{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dayview .alld{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);min-height:46px;align-items:center}
.dayview .alld .lbl{font-size:12px;font-weight:900;color:var(--ink3);width:62px;white-space:nowrap}
.tgrid{position:relative;height:calc(24 * 60px)}
.tgrid .hr{position:absolute;left:0;right:0;height:60px;border-top:1px solid var(--line);cursor:pointer}
.tgrid .hr span{position:absolute;left:10px;top:-9px;font-size:11px;font-weight:800;color:var(--ink3);background:var(--panel);padding:0 4px}
.tgrid .blk{position:absolute;border-radius:10px;padding:6px 10px;color:#fff;overflow:hidden;cursor:pointer;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tgrid .blk b{display:block;font-weight:900}
.tgrid .now{position:absolute;left:60px;right:0;height:2px;background:var(--danger);z-index:2}
.tgrid .now:before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.tscroll{max-height:calc(100dvh - 290px);overflow:auto}

/* ---------- meals ---------- */
.meal-grid{display:grid;grid-template-columns:110px repeat(7,minmax(120px,1fr));gap:8px;min-width:980px}
.meal-grid .h{font-weight:900;text-align:center;padding:8px 0;font-size:14px}
.meal-grid .h small{display:block;color:var(--ink3);font-size:12px}
.meal-grid .h.today{color:var(--accent)}
.meal-grid .slot{display:flex;align-items:center;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);gap:6px}
.mcell{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);min-height:74px;padding:10px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.mcell.empty{color:var(--ink3);font-size:22px;background:var(--panel2);box-shadow:none;border:2px dashed var(--line)}
.mcell.has{border-top:4px solid var(--mc)}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.recipe{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer}
.recipe .tt{font-weight:900;font-size:17px}
.recipe .tg{font-size:12px;font-weight:900;text-transform:uppercase;color:var(--ink3)}
.recipe ul{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-weight:700;font-size:14px}

/* ---------- lists ---------- */
.lists{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.lnav{display:flex;flex-direction:column;gap:6px}
.lnav button{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);font-weight:800;text-align:left}
.lnav button.on{background:var(--accent);color:#fff}
.lnav button .c{margin-left:auto;font-size:13px;opacity:.8}
.additem{display:flex;gap:8px;margin-bottom:12px}
.additem input{flex:1}
.item{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:800;font-size:17px}
.item .ck{width:28px;height:28px;border-radius:8px;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.item.done .ck{background:#22B573;border-color:#22B573}
.item.done .tx{text-decoration:line-through;color:var(--ink3)}
.item .tx{flex:1}
.item .x{color:var(--ink3);padding:4px}

/* ---------- photos ---------- */
.phi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.phi{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--panel2)}
.phi img{width:100%;height:100%;object-fit:cover;display:block}
.phi button{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}

/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700}
.row:last-child{border:0}
.row label{flex:1}
.row .hint{display:block;font-size:12px;color:var(--ink3);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.row select,.row input[type=number],.row input[type=time]{width:auto;min-width:110px}
.tog{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--accent)}
.tog.on:after{left:25px}
.prof{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:800}
.prof .nm{flex:1}
.city-res button{display:block;width:100%;text-align:left;padding:10px;border-radius:10px;font-weight:700}
.city-res button:hover{background:var(--panel2)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(15,21,34,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
.sheet{background:var(--panel);border-radius:22px;width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.sheet .sh{display:flex;align-items:center;padding:16px 18px 8px;gap:10px}
.sheet .sh h2{margin:0;font-size:21px;font-weight:900;flex:1}
.sheet .sb{padding:6px 18px 10px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet .sf{display:flex;gap:10px;padding:12px 18px 18px;border-top:1px solid var(--line)}
.sheet .sf .sp{flex:1}
.fld>label{display:block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--panel)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:40px;height:40px;border-radius:10px;font-size:22px;background:var(--panel2)}
.emojis button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.daypick{display:flex;gap:6px}
.daypick button{width:40px;height:40px;border-radius:50%;background:var(--panel2);font-weight:900;font-size:13px}
.daypick button.on{background:var(--accent);color:#fff}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--panel);padding:12px 20px;border-radius:14px;font-weight:800;z-index:80;transition:transform .25s;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- screensaver & sleep ---------- */
#saver{position:fixed;inset:0;background:#000;z-index:70;display:none;overflow:hidden;cursor:pointer}
#saver.open{display:block}
#saver .layer{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity 1.4s}
#saver .layer.show{opacity:1}
#saver.fit .layer{background-size:contain}
#saver.pan .layer.show{animation:kb 14s ease-in-out forwards}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.14) translate(-2%,-1.5%)}}
#saver .nophoto{position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#3B5BDB,#1B1F3B 60%,#0B0D1C);}
#saver .ov{position:absolute;left:0;right:0;bottom:0;padding:40px 44px 36px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));display:flex;align-items:flex-end;gap:30px}
#saver .ov .t{font-size:84px;font-weight:900;line-height:.9;letter-spacing:-2px}
#saver .ov .d{font-size:24px;font-weight:800;opacity:.9}
#saver .ov .nx{margin-left:auto;text-align:right;font-weight:800;font-size:18px;opacity:.95;max-width:40%}
#sleep{position:fixed;inset:0;background:#000;z-index:75;display:none;align-items:center;justify-content:center;flex-direction:column;color:#444;cursor:pointer}
#sleep.open{display:flex}
#sleep .t{font-size:96px;font-weight:900;color:#3a3a3a}
#sleep .d{font-size:18px;font-weight:800;color:#333}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .home{grid-template-columns:1fr 1fr}
  .home .col:last-child{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}
}
@media (max-width:780px){
  :root{--side:0px}
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #side{grid-row:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;overflow-y:hidden;gap:2px}
  #side .logo,#side .grow{display:none}
  .nav{width:auto;min-width:62px;padding:6px 8px;font-size:11px}
  #head{padding:12px 14px 6px;gap:12px}
  .clock .t{font-size:34px}
  .clock .d{font-size:14px}.clock .d b{font-size:16px}
  .people{margin-left:auto;gap:8px}
  #head>.iconbtn{display:none}
  .weather{padding:6px 10px}.weather .e{font-size:24px}.weather .tp{font-size:18px}
  .pchip span:last-child{font-size:11px}
  .av{width:36px;height:36px;font-size:16px}
  .evrow .tm{width:92px;font-size:12px}
  .mc .dn{font-size:12px;width:22px;height:22px}
  #view{padding:6px 14px 18px}
  .home,.home .col:last-child{grid-template-columns:1fr;display:flex;flex-direction:column}
  .lists{grid-template-columns:1fr}
  .lnav{flex-direction:row;overflow-x:auto}
  .lnav button{white-space:nowrap}
  .toolbar .title{font-size:19px;width:100%;order:-1;margin:0}
  .cal-month{grid-auto-rows:minmax(64px,1fr)}
  .mc .pill{font-size:0;height:6px;padding:0}
  .mc .more{display:none}
  .cal-cols{grid-template-columns:1fr!important}
  .dcol{min-height:0}
  .dcol .dh{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px}
  .dcol .dh .n{margin:0;width:32px;height:32px;font-size:17px}
  .dcol .body{min-height:40px}
  .set-grid{grid-template-columns:1fr}
  #saver .ov{flex-direction:column;align-items:flex-start;padding:24px}
  #saver .ov .t{font-size:56px}
  #saver .ov .nx{margin-left:0;text-align:left;max-width:100%}
}

details.help{background:var(--panel2);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;color:var(--ink2)}
details.help summary{cursor:pointer;font-weight:900;color:var(--accent)}
details.help p{margin:10px 0 0;line-height:1.45}
details.help b{color:var(--ink)}

</style>
</head>
<body>
<div id="app"><nav id="side"></nav><main id="main"><header id="head"></header><section id="view"></section></main></div>
<div id="modal"></div><div id="saver"></div><div id="sleep"></div><div id="toast"></div>
<script>
'use strict';
/* ============ utils ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYMD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayStr = () => ymd(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const toMin = t => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  if (S().time24) return `${pad(h)}:${pad(m)}`;
  const ap = h < 12 ? 'am' : 'pm'; const hh = h % 12 || 12;
  return m ? `${hh}:${pad(m)}${ap}` : `${hh}${ap}`;
}
const shortDate = d => `${DAYS[d.getDay()].slice(0, 3)}, ${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}`;

/* ============ icons ============ */
const IC = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  tasks: '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/>',
  star: '<path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/>',
  meals: '<path d="M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10M17 3c-2 0-3 2-3 5s1 4 3 4v9"/>',
  lists: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  photos: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  sleep: '<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  left: '<path d="M15 18l-6-6 6-6"/>',
  right: '<path d="M9 18l6-6-6-6"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  expand: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  play: '<path d="M7 4l13 8-13 8z"/>',
  cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h12L22 7H6"/>',
  moon: '<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
};
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24">${IC[n] || ''}</svg>`;

/* ============ state ============ */
const KEY = 'familywall.v1';
const COLORS = ['#FF6B5B', '#3D8BFD', '#22B573', '#F5A524', '#9B6BF2', '#EC5FA6', '#14B8C4', '#FF8A3D', '#6B7A8F'];
const EMOJIS = ['😀', '😎', '🦄', '🐻', '🐱', '🐶', '🦊', '🐼', '🐸', '🦁', '🐰', '🌸', '⚽', '🎨', '🎮', '🚀', '👑', '⭐', '🌈', '🍕'];
const SLOTS = [['breakfast', 'Breakfast', '🥞'], ['lunch', 'Lunch', '🥪'], ['dinner', 'Dinner', '🍝'], ['snack', 'Snack', '🍎']];
const FAMILY = { id: 'family', name: 'Family', color: '#6B7A8F', emoji: '🏠' };

function defaults() {
  return {
    v: 1, onboarded: false,
    settings: {
      familyName: 'Our Family', time24: false, weekStart: 0, units: 'F', lat: null, lon: null, city: '',
      idleMin: 5, photoMode: 'fill', photoSec: 10, calView: 'week', schedDays: 4, theme: 'light',
      keepAwake: false, sleep: { on: false, start: '22:00', end: '06:30' }
    },
    profiles: [], events: [], subs: [], tasks: [], log: [], rewards: [], meals: {}, recipes: seedRecipes(),
    lists: [{ id: uid(), name: 'Grocery', emoji: '🛒', grocery: true, items: [] }, { id: uid(), name: 'To-Do', emoji: '✅', items: [] }]
  };
}
function seedRecipes() {
  const r = (name, slot, ing) => ({ id: uid(), name, slot, ingredients: ing, notes: '' });
  return [
    r('Pancakes', 'breakfast', ['Flour', 'Eggs', 'Milk', 'Butter', 'Maple syrup']),
    r('Overnight oats', 'breakfast', ['Rolled oats', 'Milk', 'Yogurt', 'Berries', 'Honey']),
    r('Scrambled eggs & toast', 'breakfast', ['Eggs', 'Bread', 'Butter']),
    r('Turkey sandwiches', 'lunch', ['Bread', 'Sliced turkey', 'Cheese', 'Lettuce', 'Tomato']),
    r('Chicken wraps', 'lunch', ['Tortillas', 'Chicken breast', 'Lettuce', 'Cheese', 'Ranch']),
    r('Tomato soup & grilled cheese', 'lunch', ['Tomato soup', 'Bread', 'Cheddar', 'Butter']),
    r('Spaghetti bolognese', 'dinner', ['Spaghetti', 'Ground beef', 'Tomato sauce', 'Onion', 'Garlic', 'Parmesan']),
    r('Taco night', 'dinner', ['Taco shells', 'Ground beef', 'Taco seasoning', 'Lettuce', 'Cheese', 'Salsa', 'Sour cream']),
    r('Sheet-pan chicken & veggies', 'dinner', ['Chicken thighs', 'Potatoes', 'Carrots', 'Broccoli', 'Olive oil']),
    r('Homemade pizza', 'dinner', ['Pizza dough', 'Pizza sauce', 'Mozzarella', 'Pepperoni']),
    r('Salmon, rice & green beans', 'dinner', ['Salmon', 'Rice', 'Green beans', 'Lemon']),
    r('Apple slices & peanut butter', 'snack', ['Apples', 'Peanut butter']),
    r('Yogurt parfait', 'snack', ['Yogurt', 'Granola', 'Berries']),
  ];
}

let state;
function load() {
  try { const raw = localStorage.getItem(KEY); state = raw ? JSON.parse(raw) : defaults(); }
  catch (e) { state = defaults(); }
  const d = defaults();
  state.settings = Object.assign(d.settings, state.settings || {});
  state.settings.sleep = Object.assign(d.settings.sleep, state.settings.sleep || {});
  for (const k of ['profiles', 'events', 'subs', 'tasks', 'log', 'rewards', 'recipes', 'lists']) if (!Array.isArray(state[k])) state[k] = d[k];
  if (!state.meals || typeof state.meals !== 'object') state.meals = {};
}
let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Could not save — storage is full'); }
  }, 150);
}
const S = () => state.settings;
const prof = id => state.profiles.find(p => p.id === id) || (id === 'family' ? FAMILY : null);
const profColor = id => (prof(id) || FAMILY).color;

/* UI state (not saved) */
const ui = {
  view: 'home', calDate: todayStr(), filter: new Set(), taskDate: todayStr(),
  mealStart: todayStr(), mealTab: 'plan', listId: null, rwProfile: null
};

/* ============ avatars ============ */
function avatar(p, size = '') {
  p = p || FAMILY;
  const inner = p.emoji ? p.emoji : esc((p.name || '?')[0].toUpperCase());
  return `<span class="av ${size}" style="background:${p.color}">${inner}</span>`;
}

/* ============ toast / modal ============ */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
}
let modalCtx = null;
function openModal({ title, body, onSave, onDelete, saveLabel = 'Save', wide = false, noFooter = false, onOpen }) {
  const m = $('#modal');
  m.innerHTML = `<div class="sheet" style="${wide ? 'width:min(720px,100%)' : ''}">
    <div class="sh"><h2>${esc(title)}</h2><button class="iconbtn" data-act="modal-close">${ic('x')}</button></div>
    <div class="sb">${body}</div>
    ${noFooter ? '' : `<div class="sf">${onDelete ? `<button class="btn danger" data-act="modal-del">${ic('trash', 'sm')} Delete</button>` : ''}<span class="sp"></span>
      <button class="btn" data-act="modal-close">Cancel</button>${onSave ? `<button class="btn pri" data-act="modal-save">${esc(saveLabel)}</button>` : ''}</div>`}
  </div>`;
  m.classList.add('open');
  modalCtx = { onSave, onDelete };
  if (onOpen) onOpen(m);
  const f = m.querySelector('input[type=text]'); if (f && !('ontouchstart' in window)) setTimeout(() => f.focus(), 50);
}
function closeModal() { $('#modal').classList.remove('open'); $('#modal').innerHTML = ''; modalCtx = null; }
function confirmBox(msg, yes = 'Delete') {
  return new Promise(res => {
    openModal({ title: 'Are you sure?', body: `<p style="margin:0;font-weight:700">${esc(msg)}</p>`, saveLabel: yes, onSave: () => { res(true); return true; } });
    const prev = modalCtx; prev.onCancel = () => res(false);
  });
}
const fv = (sel) => { const el = $('#modal ' + sel); return el ? el.value.trim() : ''; };

/* pickers used inside modals */
function profilePicker(selected = [], multi = true, includeFamily = true) {
  const list = includeFamily ? [...state.profiles, FAMILY] : state.profiles;
  return `<div class="chips" data-picker="${multi ? 'multi' : 'single'}">${list.map(p =>
    `<button type="button" class="chip ${selected.includes(p.id) ? '' : 'off'}" data-pid="${p.id}">${avatar(p, 'xs')}${esc(p.name)}</button>`).join('')}</div>`;
}
function readPicker(sel = '[data-picker]') { return $$(`#modal ${sel} .chip:not(.off)`).map(b => b.dataset.pid); }
function colorPicker(sel) { return `<div class="swatches" data-swatch>${COLORS.map(c => `<button type="button" style="background:${c}" data-color="${c}" class="${c === sel ? 'on' : ''}"></button>`).join('')}</div>`; }
function emojiPicker(sel, list = EMOJIS) { return `<div class="emojis" data-emoji>${list.map(e => `<button type="button" data-e="${e}" class="${e === sel ? 'on' : ''}">${e}</button>`).join('')}</div>`; }
function dayPicker(sel = []) { return `<div class="daypick" data-days>${'SMTWTFS'.split('').map((l, i) => `<button type="button" data-d="${i}" class="${sel.includes(i) ? 'on' : ''}">${l}</button>`).join('')}</div>`; }

/* ============ recurrence ============ */
function occursOn(it, ds) {
  if (it.exdates && it.exdates.includes(ds)) return false;
  if (it.date === ds) return true;
  if (ds < it.date) return false;
  if (!it.repeat || it.repeat === 'none') return !!(it.endDate && ds <= it.endDate);
  if (it.until && ds > it.until) return false;
  const a = parseYMD(it.date), b = parseYMD(ds);
  switch (it.repeat) {
    case 'daily': return true;
    case 'weekdays': { const w = b.getDay(); return w > 0 && w < 6; }
    case 'weekly': return a.getDay() === b.getDay();
    case 'biweekly': return a.getDay() === b.getDay() && Math.round((b - a) / 864e5) % 14 === 0;
    case 'monthly': return a.getDate() === b.getDate();
    case 'yearly': return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
    case 'custom': return (it.days || []).includes(b.getDay());
    case 'rrule': return occursRule(it, a, b);
  }
  return false;
}
const REPEATS = [['none', 'Does not repeat'], ['daily', 'Every day'], ['weekdays', 'Weekdays (Mon–Fri)'], ['weekly', 'Every week'], ['biweekly', 'Every 2 weeks'], ['monthly', 'Every month'], ['yearly', 'Every year'], ['custom', 'Pick days…']];
const repeatLabel = r => (REPEATS.find(x => x[0] === r) || REPEATS[0])[1];

function eventsOn(ds, useFilter = true) {
  return state.events.filter(e => occursOn(e, ds) && passFilter(e, useFilter))
    .sort((a, b) => (b.allDay - a.allDay) || (toMin(a.start) - toMin(b.start)) || a.title.localeCompare(b.title));
}
function passFilter(e, useFilter) {
  if (!useFilter || !ui.filter.size) return true;
  const ps = (e.profiles && e.profiles.length) ? e.profiles : ['family'];
  return ps.some(p => !ui.filter.has(p));
}
const evColor = e => profColor((e.profiles && e.profiles[0]) || 'family');
const evTime = e => e.allDay ? 'All day' : fmtTime(e.start) + (e.end ? ' – ' + fmtTime(e.end) : '');
const evDots = e => (e.profiles || []).length > 1 ? `<div class="dots">${e.profiles.map(p => `<span class="dot" style="background:${profColor(p)}"></span>`).join('')}</div>` : '';

function tasksOn(ds, pid) { return state.tasks.filter(t => t.profile === pid && occursOn(t, ds)).sort((a, b) => (a.time || '99').localeCompare(b.time || '99') || (b.priority === 'high') - (a.priority === 'high')); }
const isDone = (t, ds) => !!(t.done && t.done[ds]);
const balance = pid => state.log.filter(l => l.pid === pid).reduce((s, l) => s + l.amt, 0);

/* ============ shell ============ */
const NAV = [['home', 'Today', 'home'], ['calendar', 'Calendar', 'calendar'], ['tasks', 'Chores', 'tasks'], ['rewards', 'Rewards', 'star'],
  ['meals', 'Meals', 'meals'], ['lists', 'Lists', 'lists'], ['photos', 'Photos', 'photos'], ['sleep', 'Sleep', 'sleep'], ['settings', 'Settings', 'settings']];

function renderSide() {
  $('#side').innerHTML = `<div class="logo">${esc((S().familyName || 'F')[0].toUpperCase())}</div>` +
    NAV.map(([id, label, icon], i) => (i === 7 ? '<div class="grow"></div>' : '') +
      `<button class="nav ${ui.view === id ? 'on' : ''}" data-act="nav" data-v="${id}">${ic(icon)}<span>${label}</span></button>`).join('');
}

function renderHead() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const t = S().time24 ? `${pad(h)}:${pad(m)}` : `${h % 12 || 12}:${pad(m)}<small>${h < 12 ? 'AM' : 'PM'}</small>`;
  const ds = todayStr();
  const w = weatherHTML();
  const people = state.profiles.map(p => {
    const ts = tasksOn(ds, p.id); const left = ts.filter(x => !isDone(x, ds)).length;
    const badge = ts.length ? `<span class="badge ${left ? '' : 'done'}">${left ? left : '✓'}</span>` : '';
    return `<button class="pchip ${ui.filter.has(p.id) ? 'off' : ''}" data-act="headprof" data-pid="${p.id}" title="${esc(p.name)}">${avatar(p)}${badge}<span>${esc(p.name)}</span></button>`;
  }).join('');
  $('#head').innerHTML = `
    <div class="clock"><div class="t" id="clk">${t}</div><div class="d"><b>${DAYS[now.getDay()]}</b>${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}</div></div>
    ${w}
    <div class="people">${people}</div>
    <button class="iconbtn" data-act="fullscreen" title="Full screen">${ic('expand')}</button>`;
}

function render() {
  document.documentElement.dataset.theme = S().theme;
  renderSide(); renderHead();
  const v = $('#view');
  const fn = { home: vHome, calendar: vCalendar, tasks: vTasks, rewards: vRewards, meals: vMeals, lists: vLists, photos: vPhotos, sleep: vSleep, settings: vSettings }[ui.view] || vHome;
  v.innerHTML = fn();
  if (ui.view === 'photos') fillPhotoGrid();
  if (ui.view === 'calendar' && S().calView === 'day') { const sc = $('.tscroll'); if (sc && !sc.dataset.did) { sc.scrollTop = 7 * 60 - 10; sc.dataset.did = 1; } }
}

/* ============ TODAY (home dashboard) ============ */
function vHome() {
  const ds = todayStr();
  const evs = eventsOn(ds);
  const today = evs.length ? evs.map(evRow).join('') : `<div class="empty"><span class="big">🌤️</span>Nothing on the calendar today</div>`;
  let upc = '', n = 0;
  for (let i = 1; i <= 14 && n < 6; i++) {
    const d = addDays(new Date(), i), e = eventsOn(ymd(d));
    if (!e.length) continue;
    upc += `<div class="day">${i === 1 ? 'Tomorrow' : shortDate(d)}</div>` + e.slice(0, 6 - n).map(evRow).join('');
    n += Math.min(e.length, 6 - n);
  }
  const chores = state.profiles.length ? state.profiles.map(p => {
    const ts = tasksOn(ds, p.id); if (!ts.length) return '';
    const done = ts.filter(t => isDone(t, ds)).length;

/* ============ CALENDAR ============ */
function vCalendar() {
  const s = S(), view = s.calView, d = parseYMD(ui.calDate);
  let title = '', body = '';
  if (view === 'month') { title = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; body = calMonth(d); }
  else if (view === 'week') {
    const st = addDays(d, -((d.getDay() - s.weekStart + 7) % 7)); const en = addDays(st, 6);
    title = rangeTitle(st, en); body = calCols(st, 7);
  } else if (view === 'schedule') {
    const en = addDays(d, s.schedDays - 1); title = rangeTitle(d, en); body = calCols(d, s.schedDays);
  } else { title = `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; body = calDay(d); }
  const filt = [...state.profiles, FAMILY].map(p => `<button class="chip ${ui.filter.has(p.id) ? 'off' : ''}" data-act="filter" data-pid="${p.id}">${avatar(p, 'xs')}${esc(p.name)}</button>`).join('');
  return `<div class="toolbar">
      <button class="iconbtn" data-act="cal-move" data-n="-1">${ic('left')}</button>
      <button class="btn" data-act="cal-today">Today</button>
      <button class="iconbtn" data-act="cal-move" data-n="1">${ic('right')}</button>
      <div class="title">${title}</div><span class="sp"></span>
      <div class="seg">${[['day', 'Day'], ['week', 'Week'], ['month', 'Month'], ['schedule', 'Schedule']].map(([k, l]) => `<button class="${view === k ? 'on' : ''}" data-act="cal-view" data-k="${k}">${l}</button>`).join('')}</div>
      <button class="btn pri" data-act="ev-new" data-ds="${ui.calDate}">${ic('plus', 'sm')} Event</button>
    </div>
    <div class="chips" style="margin-bottom:14px">${filt}</div>${body}`;
}
function rangeTitle(a, b) {
  if (a.getMonth() === b.getMonth()) return `${MONTHS[a.getMonth()].slice(0, 3)} ${a.getDate()} – ${b.getDate()}, ${b.getFullYear()}`;
  return `${MONTHS[a.getMonth()].slice(0, 3)} ${a.getDate()} – ${MONTHS[b.getMonth()].slice(0, 3)} ${b.getDate()}, ${b.getFullYear()}`;
}
function calMonth(d) {
  const ws = S().weekStart, first = new Date(d.getFullYear(), d.getMonth(), 1);
  const start = addDays(first, -((first.getDay() - ws + 7) % 7));
  const td = todayStr();
  let html = '<div class="cal-month">';
  for (let i = 0; i < 7; i++) html += `<div class="wd">${DAYS[(i + ws) % 7].slice(0, 3)}</div>`;
  for (let i = 0; i < 42; i++) {
    const day = addDays(start, i), ds = ymd(day), evs = eventsOn(ds);
    const out = day.getMonth() !== d.getMonth();
    html += `<div class="mc ${out ? 'out' : ''} ${ds === td ? 'today' : ''}" data-act="ev-new" data-ds="${ds}">
      <span class="dn" data-act="cal-goday" data-ds="${ds}">${day.getDate()}</span>
      ${evs.slice(0, 3).map(e => `<div class="pill" style="background:${evColor(e)}" data-act="ev-edit" data-id="${e.id}">${e.allDay ? '' : fmtTime(e.start) + ' '}${esc(e.title)}</div>`).join('')}
      ${evs.length > 3 ? `<span class="more" data-act="cal-goday" data-ds="${ds}">+${evs.length - 3} more</span>` : ''}</div>`;
  }
  return html + '</div>';
}
function calCols(start, n) {
  const td = todayStr();
  let html = `<div class="cal-cols" style="grid-template-columns:repeat(${n},minmax(0,1fr))">`;
  for (let i = 0; i < n; i++) {
    const day = addDays(start, i), ds = ymd(day), evs = eventsOn(ds);
    html += `<div class="dcol ${ds === td ? 'today' : ''}">
      <div class="dh" data-act="cal-goday" data-ds="${ds}"><div class="w">${DAYS[day.getDay()].slice(0, 3)}</div><div class="n">${day.getDate()}</div></div>
      <div class="body" data-act="ev-new" data-ds="${ds}">${evs.map(e => `<div class="evc" style="border-color:${evColor(e)}" data-act="ev-edit" data-id="${e.id}"><span>${evTime(e)}${e.src === 'sub' ? ' · 🔄' : ''}</span><b>${esc(e.title)}</b>${evDots(e)}</div>`).join('')}</div></div>`;
  }
  return html + '</div>';
}
function calDay(d) {
  const ds = ymd(d), evs = eventsOn(ds);
  const all = evs.filter(e => e.allDay), timed = evs.filter(e => !e.allDay).map(e => ({ e, s: toMin(e.start), en: Math.max(toMin(e.end || fromMin(toMin(e.start) + 60)), toMin(e.start) + 30) }));
  timed.sort((a, b) => a.s - b.s || b.en - a.en);
  let group = [], gEnd = -1;
  const flush = () => { const cols = []; group.forEach(x => { let i = cols.findIndex(c => c <= x.s); if (i < 0) { i = cols.length; cols.push(0); } cols[i] = x.en; x.col = i; }); group.forEach(x => x.n = cols.length); group = []; };
  timed.forEach(x => { if (group.length && x.s >= gEnd) { flush(); gEnd = -1; } group.push(x); gEnd = Math.max(gEnd, x.en); });
  flush();
  let hrs = '';
  for (let h = 0; h < 24; h++) hrs += `<div class="hr" style="top:${h * 60}px" data-act="ev-new" data-ds="${ds}" data-t="${pad(h)}:00">${h ? `<span>${fmtTime(pad(h) + ':00')}</span>` : ''}</div>`;
  const blocks = timed.map(x => {
    const w = `calc((100% - 70px) / ${x.n})`;
    return `<div class="blk" data-act="ev-edit" data-id="${x.e.id}" style="top:${x.s}px;height:${Math.max(x.en - x.s - 2, 26)}px;left:calc(66px + (100% - 70px) / ${x.n} * ${x.col});width:calc(${w} - 4px);background:${evColor(x.e)}"><b>${esc(x.e.title)}</b>${evTime(x.e)}</div>`;
  }).join('');
  const now = new Date(); const nowLine = ds === todayStr() ? `<div class="now" style="top:${now.getHours() * 60 + now.getMinutes()}px"></div>` : '';
  return `<div class="dayview"><div class="alld"><span class="lbl">ALL DAY</span>${all.map(e => `<div class="pill" style="background:${evColor(e)}" data-act="ev-edit" data-id="${e.id}">${esc(e.title)}</div>`).join('') || '<span class="muted">—</span>'}</div>
    <div class="tscroll"><div class="tgrid">${hrs}${blocks}${nowLine}</div></div></div>`;
}

function toggleTask(id, ds, el) {

    delete t.done[ds];
    state.log = state.log.filter(l => !(l.taskId === t.id && l.ds === ds));
  } else {
    t.done[ds] = true;
    if (t.stars) state.log.push({ id: uid(), pid: t.profile, amt: t.stars, ds, taskId: t.id, note: t.title, at: Date.now() });
    if (el) starBurst(el);
    const all = tasksOn(ds, t.profile); if (all.length && all.every(x => isDone(x, ds))) { confetti(profColor(t.profile)); toast(`🎉 ${prof(t.profile).name} finished everything!`); }
  }
  save(); render();
}
function starBurst(el) {
  const r = el.getBoundingClientRect(), x = r.left + 26, y = r.top + r.height / 2;
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('span'); s.className = 'burst'; s.textContent = '★';
    const a = (i / 8) * Math.PI * 2; s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--dx', Math.cos(a) * 60 + 'px'); s.style.setProperty('--dy', Math.sin(a) * 60 + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 950);
  }
}
function confetti(color) {
  const cs = [color, '#F5B400', '#3D8BFD', '#FF6B5B', '#22B573', '#9B6BF2'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('span'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cs[i % cs.length];
    c.style.animationDelay = Math.random() * .6 + 's'; c.style.animationDuration = 1.6 + Math.random() * 1.2 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3200);
  }
}

const ICS_PROXY = 'https://familywall-relay.ayoub-hliyel.workers.dev';
const SYNC_EVERY = 15 * 60 * 1000;
const NO_CORS_HOSTS = /(google\.com|icloud\.com|outlook\.|office365\.com|live\.com|yahoo\.com)$/i;
let syncing = false;

function normalizeUrl(u) {
  u = (u || '').trim().replace(/^webcals?:\/\//i, 'https://');
  try { const x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:' ? x.toString() : ''; } catch (e) { return ''; }
}
async function fetchICS(url) {
  const host = new URL(url).hostname;
  if (!NO_CORS_HOSTS.test(host)) {
    try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) { const t = await r.text(); if (t.includes('BEGIN:VCALENDAR')) return t; } } catch (e) { }
  }
  if (!ICS_PROXY || ICS_PROXY.startsWith('__')) throw new Error('setup');
  let r;
  try { r = await fetch(ICS_PROXY + '?url=' + encodeURIComponent(url), { cache: 'no-store' }); }
  catch (e) { throw new Error(navigator.onLine === false ? 'offline' : 'network'); }
  if (!r.ok) throw new Error(r.status === 404 || r.status === 403 || r.status === 401 ? 'badlink' : r.status === 415 ? 'notcal' : 'server');
  const t = await r.text(); if (!t.includes('BEGIN:VCALENDAR')) throw new Error('notcal');
  return t;
}
const SYNC_ERR = {
  setup: 'Live sync is not set up yet', offline: 'Offline — will retry', network: 'Could not connect — will retry',
  badlink: "That link didn't work. Copy the secret/private iCal address again.", notcal: "That link isn't a calendar feed (.ics)", server: 'Calendar server busy — will retry'
};
async function syncSub(sub) {
  try {
    const txt = await fetchICS(sub.url);
    const evs = parseICS(txt, sub.profile || '', 'sub', sub.id);
    state.events = state.events.filter(e => e.subId !== sub.id).concat(evs);
    Object.assign(sub, { lastSync: Date.now(), count: evs.length, error: '' });
    return true;
  } catch (e) {
    sub.error = SYNC_ERR[e.message] || SYNC_ERR.network; sub.lastTry = Date.now();
    return false;
  }
}
async function syncAll(force) {
  if (syncing || !state.subs.length) return;
  syncing = true;
  let changed = false;
  for (const s of state.subs) if (force || !s.lastSync || Date.now() - s.lastSync > SYNC_EVERY - 30000) { await syncSub(s); changed = true; }
  syncing = false;
  if (changed) { save(); if (!$('#modal').classList.contains('open')) render(); }
}
function ago(t) {
  if (!t) return 'never'; const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
}

}

/* ============ PHOTOS (IndexedDB) ============ */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('familywall-photos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('photos', mode); const s = t.objectStore('photos'); const out = fn(s); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); },
  all() { return this.tx('readonly', s => s.getAll()); },
  put(o) { return this.tx('readwrite', s => s.put(o)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  clear() { return this.tx('readwrite', s => s.clear()); }
};
let photoCache = null; // [{id, url}]
async function getPhotos() {
  if (photoCache) return photoCache;
  try { const all = await IDB.all(); all.sort((a, b) => a.added - b.added); photoCache = all.map(p => ({ id: p.id, url: URL.createObjectURL(p.blob) })); }
  catch (e) { photoCache = []; }
  return photoCache;
}
function resetPhotoCache() { if (photoCache) photoCache.forEach(p => URL.revokeObjectURL(p.url)); photoCache = null; }
function resizeImage(file, max = 1920) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', .86);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('load')); };
    img.src = u;
  });
}
async function addPhotos(files) {
  let n = 0; toast('Adding photos…');
  for (const f of files) { try { const blob = await resizeImage(f); await IDB.put({ id: uid(), blob, added: Date.now() + n }); n++; } catch (e) { } }
  resetPhotoCache(); render(); toast(`📷 Added ${n} photo${n === 1 ? '' : 's'}`);
}

      <div class="row"><label>Seconds per photo</label><select data-set="photoSec">${[5, 10, 15, 30, 60].map(n => `<option ${s.photoSec == n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>

/* ============ SCREENSAVER ============ */
let saverT = null, saverIdx = 0, lastTouch = Date.now();
async function startSaver() {
  const el = $('#saver'); if (el.classList.contains('open')) return;
  const ps = await getPhotos();
  el.className = 'open ' + S().photoMode;
  el.innerHTML = (ps.length ? '<div class="layer"></div><div class="layer"></div>' : '<div class="nophoto"></div>') + '<div class="ov" id="saver-ov"></div>';
  saverIdx = 0; saverOverlay();
  if (ps.length) {
    const step = () => {
      const ls = el.querySelectorAll('.layer'); if (!ls.length) return;
      const cur = ls[saverIdx % 2], other = ls[(saverIdx + 1) % 2];
      cur.style.backgroundImage = `url("${ps[saverIdx % ps.length].url}")`;
      cur.classList.remove('show'); void cur.offsetWidth; cur.classList.add('show'); other.classList.remove('show');
      saverIdx++;
    };
    step(); saverT = setInterval(() => { step(); saverOverlay(); }, Math.max(3, S().photoSec) * 1000);
  } else saverT = setInterval(saverOverlay, 15000);
}
function saverOverlay() {
  const ov = $('#saver-ov'); if (!ov) return;
  const now = new Date(), h = now.getHours();
  const t = S().time24 ? `${pad(h)}:${pad(now.getMinutes())}` : `${h % 12 || 12}:${pad(now.getMinutes())}`;
  const nowMin = h * 60 + now.getMinutes();
  const next = eventsOn(todayStr(), false).find(e => !e.allDay && toMin(e.start) >= nowMin);
  const w = weatherData();
  ov.innerHTML = `<div><div class="t">${t}</div><div class="d">${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}${w ? ` · ${w.emoji} ${w.temp}°` : ''}</div></div>
    ${next ? `<div class="nx">Next: ${esc(next.title)}<br><span style="opacity:.8">${fmtTime(next.start)}</span></div>` : ''}`;
}
function stopSaver() { clearInterval(saverT); saverT = null; const el = $('#saver'); el.className = ''; el.innerHTML = ''; lastTouch = Date.now(); }

/* ============ SLEEP ============ */
let wokeUntil = 0;
function inSleepWindow() {
  const s = S().sleep; if (!s.on) return false;
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes(), a = toMin(s.start), b = toMin(s.end);
  return a < b ? (m >= a && m < b) : (m >= a || m < b);
}

  const el = $('#sleep'); if (!el.classList.contains('open')) return;

  el.innerHTML = `<div class="t">${S().time24 ? pad(h) : (h % 12 || 12)}:${pad(n.getMinutes())}</div><div class="d">Tap to wake</div>`;
}

async function applyWakeLock() {
  try {
    if (S().keepAwake && 'wakeLock' in navigator && document.visibilityState === 'visible') { if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }

  } catch (e) { wakeLock = null; }
}

/* ============ WEATHER (Open-Meteo, no key) ============ */
const WKEY = 'familywall.weather';
function wEmoji(c) { if (c === 0) return '☀️'; if (c <= 2) return '🌤️'; if (c === 3) return '☁️'; if (c <= 48) return '🌫️'; if (c <= 57) return '🌦️'; if (c <= 67) return '🌧️'; if (c <= 77) return '🌨️'; if (c <= 82) return '🌧️'; if (c <= 86) return '🌨️'; return '⛈️'; }
function weatherData() {
  try { const w = JSON.parse(localStorage.getItem(WKEY)); if (!w || w.lat !== S().lat || w.units !== S().units) return null; return w; } catch (e) { return null; }
}
function weatherHTML() {
  if (S().lat == null) return `<button class="weather" data-act="nav" data-v="settings"><span class="e">🌤️</span><span class="hl">Set your city<br>for weather</span></button>`;
  const w = weatherData(); if (!w) return `<div class="weather"><span class="e">⏳</span></div>`;
  return `<div class="weather"><span class="e">${w.emoji}</span><div><div class="tp">${w.temp}°</div><div class="hl">H ${w.hi}° · L ${w.lo}°</div></div></div>`;
}
async function loadWeather(force) {
  const s = S(); if (s.lat == null) return;
  const w = weatherData(); if (!force && w && Date.now() - w.t < 30 * 60 * 1000) return;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1${s.units === 'F' ? '&temperature_unit=fahrenheit' : ''}`;
    const r = await fetch(u); const j = await r.json();
    const d = { t: Date.now(), lat: s.lat, units: s.units, temp: Math.round(j.current.temperature_2m), emoji: wEmoji(j.current.weather_code), hi: Math.round(j.daily.temperature_2m_max[0]), lo: Math.round(j.daily.temperature_2m_min[0]) };
    localStorage.setItem(WKEY, JSON.stringify(d)); renderHead();
  } catch (e) { /* offline — keep old */ }
}
async function citySearch(q) {
  const box = $('#city-res'); if (!box) return;
  if (q.length < 2) { box.innerHTML = ''; return; }
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
    const j = await r.json();
    box.innerHTML = (j.results || []).map(c => `<button data-act="city-pick" data-lat="${c.latitude}" data-lon="${c.longitude}" data-name="${esc(c.name + (c.admin1 ? ', ' + c.admin1 : '') + ', ' + (c.country_code || ''))}">${esc(c.name)}<span class="muted"> · ${esc([c.admin1, c.country].filter(Boolean).join(', '))}</span></button>`).join('') || '<div class="muted">No city found</div>';
  } catch (e) { box.innerHTML = '<div class="muted">You seem to be offline</div>'; }
}

    body: `<div class="fld"><label>Name</label><input type="text" id="p-name" value="${esc(p.name)}" placeholder="Emma"></div>
      <div class="fld"><label>Color</label>${colorPicker(p.color)}</div>
      <div class="fld"><label>Avatar (optional)</label>${emojiPicker(p.emoji)}</div>`,
    onSave: () => {
      const name = fv('#p-name'); if (!name) { toast('Add a name'); return false; }
      p.name = name; p.color = ($('#modal [data-swatch] .on') || {}).dataset?.color || p.color;
      p.emoji = ($('#modal [data-emoji] .on') || {}).dataset?.e || '';
      if (isNew) { p.id = uid(); state.profiles.push(p); }
      save(); render(); return true;
    },
    onDelete: isNew ? null : () => {
      state.profiles = state.profiles.filter(x => x !== p);
      state.tasks = state.tasks.filter(t => t.profile !== p.id);
      state.log = state.log.filter(l => l.pid !== p.id);
      state.events.forEach(e => { if (e.profiles) e.profiles = e.profiles.filter(x => x !== p.id); });
      state.rewards.forEach(r => { if (r.profiles) r.profiles = r.profiles.filter(x => x !== p.id); });
      save(); render(); return true;
    }
  });
}

/* ============ onboarding ============ */
function onboarding() {
  openModal({
    title: 'Welcome to The Family Wall 👋', noFooter: true,
    body: `<p style="margin:0;font-weight:700;color:var(--ink2)">Your family calendar, chore chart, meal planner, lists and photo frame — on any tablet. Everything stays on this device.</p>
      <div class="fld"><label>Family name</label><input type="text" id="ob-fam" placeholder="The Parkers" value=""></div>
      <div class="fld"><label>Who's in the family? (comma separated)</label><input type="text" id="ob-names" placeholder="Mom, Dad, Emma, Leo"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" data-act="ob-start">Let's go</button><button class="btn" data-act="ob-sample">Explore with a sample family</button></div>`
  });
}
function finishOnboarding(sample) {
  if (sample) seedSample();
  else {
    const fam = fv('#ob-fam'); if (fam) S().familyName = fam;
    const names = fv('#ob-names').split(',').map(s => s.trim()).filter(Boolean).slice(0, 9);
    names.forEach((n, i) => state.profiles.push({ id: uid(), name: n, color: COLORS[i % COLORS.length], emoji: '' }));
  }
  state.onboarded = true; save(); closeModal(); render();
}
function seedSample() {
  S().familyName = 'The Parkers';
  const P = [['Mom', '#FF6B5B', ''], ['Dad', '#3D8BFD', ''], ['Emma', '#9B6BF2', '🦄'], ['Leo', '#22B573', '🚀']].map(([name, color, emoji]) => ({ id: uid(), name, color, emoji }));
  state.profiles = P; const [mom, dad, emma, leo] = P.map(p => p.id);
  const T = todayStr(), D = n => ymd(addDays(new Date(), n)); const wd = new Date().getDay();
  const ev = (title, date, start, end, profiles, repeat = 'none', extra = {}) => state.events.push({ id: uid(), title, date: repeat === 'none' ? date : ymd(addDays(parseYMD(date), -28)), allDay: !start, start: start || '', end: end || '', profiles, repeat, days: [], notes: '', ...extra });
  ev('School', T, '08:00', '15:00', [emma, leo], 'weekdays');
  ev('Soccer practice', T, '16:30', '17:30', [leo], 'weekly');
  ev('Piano lesson', D(1), '17:00', '17:45', [emma], 'weekly');
  ev('Team meeting', D(1), '10:00', '11:00', [dad], 'weekly');
  ev('Yoga', T, '07:00', '08:00', [mom], 'custom', { days: [(wd) % 7, (wd + 2) % 7, (wd + 4) % 7] });
  ev('Family movie night', D(2), '19:00', '21:00', [], 'weekly');
  ev('Dentist — Emma', D(3), '14:30', '15:30', [mom, emma]);
  ev("Grandma's birthday 🎂", D(5), '', '', []);
  ev('Farmers market', D(4), '09:00', '11:00', [dad, leo]);
  ev('Book club', D(6), '19:30', '21:00', [mom]);
  const tk = (title, profile, stars, repeat = 'daily', extra = {}) => state.tasks.push({ id: uid(), title, profile, date: D(-7), repeat, days: [], stars, priority: 'normal', time: '', done: {}, ...extra });
  tk('Make your bed', emma, 1); tk('Brush teeth', emma, 1); tk('Homework', emma, 3, 'weekdays', { priority: 'high' }); tk('Practice piano', emma, 2);
  tk('Make your bed', leo, 1); tk('Feed the dog', leo, 2); tk('Tidy room', leo, 2); tk('Read 20 minutes', leo, 2);
  tk('Take out trash', dad, 1, 'weekly'); tk('Empty dishwasher', dad, 1);
  tk('Water plants', mom, 1, 'custom', { days: [1, 4] }); tk('Plan meals', mom, 1, 'weekly');
  state.tasks.filter(t => [emma, leo].includes(t.profile)).slice(0, 3).forEach(t => { if (occursOn(t, T)) { t.done[T] = true; state.log.push({ id: uid(), pid: t.profile, amt: t.stars, ds: T, taskId: t.id, note: t.title }); } });
  state.log.push({ id: uid(), pid: emma, amt: 18, ds: D(-1), note: 'Last week' }, { id: uid(), pid: leo, amt: 12, ds: D(-1), note: 'Last week' });
  state.rewards = [{ id: uid(), title: 'Pick the movie', emoji: '🎬', cost: 10, profiles: [] }, { id: uid(), title: 'Ice cream trip', emoji: '🍦', cost: 20, profiles: [emma, leo] },
    { id: uid(), title: '30 min extra screen time', emoji: '🎮', cost: 15, profiles: [emma, leo] }, { id: uid(), title: 'Stay up 30 min later', emoji: '🌙', cost: 25, profiles: [] }];
  const rid = n => (state.recipes.find(r => r.name === n) || {}).id;
  const plan = [['Pancakes', 'Turkey sandwiches', 'Taco night'], ['Overnight oats', 'Chicken wraps', 'Spaghetti bolognese'], ['Scrambled eggs & toast', 'Tomato soup & grilled cheese', 'Sheet-pan chicken & veggies'], ['Overnight oats', 'Turkey sandwiches', 'Homemade pizza'], ['Pancakes', 'Chicken wraps', 'Salmon, rice & green beans']];
  plan.forEach((m, i) => { state.meals[D(i)] = { breakfast: { name: m[0], recipeId: rid(m[0]) }, lunch: { name: m[1], recipeId: rid(m[1]) }, dinner: { name: m[2], recipeId: rid(m[2]) } }; });
  state.meals[T].snack = { name: 'Apple slices & peanut butter', recipeId: rid('Apple slices & peanut butter') };
  const g = state.lists.find(l => l.grocery); if (g) g.items = ['Milk', 'Bananas', 'Eggs', 'Bread', 'Coffee', 'Paper towels'].map(text => ({ id: uid(), text, done: false }));
  const td = state.lists.find(l => !l.grocery); if (td) td.items = ['Sign field trip form', 'Call the plumber', 'Return library books'].map(text => ({ id: uid(), text, done: false }));
  state.lists.push({ id: uid(), name: 'Weekend packing', emoji: '🎒', items: ['Swimsuits', 'Sunscreen', 'Snacks'].map(text => ({ id: uid(), text, done: false })) });
}

/* ============ actions ============ */
function goView(v) { ui.view = v; render(); $('#view').scrollTop = 0; }
const ACT = {
  'nav': d => goView(d.v),
  'headprof': d => { ui.filter.has(d.pid) ? ui.filter.delete(d.pid) : ui.filter.add(d.pid); render(); toast(ui.filter.has(d.pid) ? `Hiding ${prof(d.pid).name}` : `Showing ${prof(d.pid).name}`); },
  'filter': d => { ui.filter.has(d.pid) ? ui.filter.delete(d.pid) : ui.filter.add(d.pid); render(); },
  'fullscreen': () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) { } },
  'modal-close': () => { const c = modalCtx; closeModal(); if (c && c.onCancel) c.onCancel(); },
  'modal-save': async () => { if (!modalCtx || !modalCtx.onSave) return; const ok = await modalCtx.onSave(); if (ok !== false && $('#modal').classList.contains('open') && modalCtx && !modalCtx.keep) closeModal(); },
  'modal-del': (d, el) => {
    if (!el.dataset.sure) { el.dataset.sure = 1; el.innerHTML = 'Tap again to delete'; setTimeout(() => { if (el.isConnected) { delete el.dataset.sure; el.innerHTML = `${ic('trash', 'sm')} Delete`; } }, 3000); return; }
    if (modalCtx && modalCtx.onDelete) { modalCtx.onDelete(); closeModal(); }
  },
  'ev-new': d => { if (ui.view === 'calendar' || ui.view === 'home') eventModal(null, d.ds, d.t); },
  'ev-edit': d => { const e = state.events.find(x => x.id === d.id); if (e) eventModal(e); },
  'cal-move': d => {
    const n = +d.n, v = S().calView, c = parseYMD(ui.calDate);
    if (v === 'month') { const x = new Date(c.getFullYear(), c.getMonth() + n, 1); ui.calDate = ymd(x); }
    else ui.calDate = ymd(addDays(c, n * (v === 'week' ? 7 : v === 'schedule' ? S().schedDays : 1)));
    render();
  },
  'cal-today': () => { ui.calDate = todayStr(); render(); },
  'cal-view': d => { S().calView = d.k; save(); render(); },
  'cal-goday': d => { ui.calDate = d.ds; S().calView = 'day'; ui.view = 'calendar'; save(); render(); },
  'task-tog': (d, el) => toggleTask(d.id, d.ds, el),
  'task-edit': d => { const t = state.tasks.find(x => x.id === d.id); if (t) taskModal(t); },
  'task-new': d => { if (!state.profiles.length) return profileModal(); taskModal(null, d.pid); },
  'task-move': d => { ui.taskDate = ymd(addDays(parseYMD(ui.taskDate), +d.n)); render(); },
  'task-today': () => { ui.taskDate = todayStr(); render(); },
  'star-adj': d => { const n = +d.n; if (n < 0 && balance(d.pid) <= 0) return; state.log.push({ id: uid(), pid: d.pid, amt: n, ds: todayStr(), note: n > 0 ? 'Bonus star' : 'Star removed' }); save(); render(); },
  'rw-new': () => rewardModal(),
  'rw-edit': d => rewardModal(state.rewards.find(x => x.id === d.id)),
  'rw-redeem': d => redeem(d.id),
  'rw-do': d => {
    const r = state.rewards.find(x => x.id === d.id), p = prof(d.pid); if (!r || !p || balance(p.id) < r.cost) return;
    state.log.push({ id: uid(), pid: p.id, amt: -r.cost, ds: todayStr(), note: `${r.emoji || '🎁'} ${r.title}` });
    save(); closeModal(); render(); confetti(p.color); toast(`🎉 ${p.name} redeemed ${r.title}!`);
  },
  'meal-tab': d => { ui.mealTab = d.k; render(); },
  'meal-cell': d => mealModal(d.ds, d.slot),
  'meal-move': d => { ui.mealStart = ymd(addDays(parseYMD(ui.mealStart), +d.n)); render(); },
  'meal-today': () => { ui.mealStart = todayStr(); render(); },
  'meal-grocery': () => mealsToGrocery(),
  'rec-new': () => recipeModal(),
  'rec-edit': d => recipeModal(state.recipes.find(x => x.id === d.id)),
  'list-open': d => { ui.listId = d.lid; if (ui.view !== 'lists') ui.view = 'lists'; render(); },
  'list-new': () => listModal(),
  'list-edit': d => listModal(state.lists.find(x => x.id === d.lid)),
  'list-clear': d => { const L = state.lists.find(x => x.id === d.lid); if (L) { L.items = L.items.filter(i => !i.done); save(); render(); } },
  'item-tog': d => { const L = state.lists.find(x => x.id === d.lid); const i = L && L.items.find(x => x.id === d.iid); if (i) { i.done = !i.done; save(); render(); } },
  'item-del': d => { const L = state.lists.find(x => x.id === d.lid); if (L) { L.items = L.items.filter(x => x.id !== d.iid); save(); render(); } },
  'saver-start': () => startSaver(),
  'ph-del': async d => { await IDB.del(d.id); resetPhotoCache(); render(); },
  'sleep-now': () => sleepNow(),
  'sleep-tog': () => { S().sleep.on = !S().sleep.on; save(); render(); },
  'awake-tog': () => { S().keepAwake = !S().keepAwake; save(); applyWakeLock(); render(); },
  'set': d => { S()[d.k] = d.num !== undefined ? +d.val : d.val; save(); render(); if (d.k === 'units') loadWeather(true); },
  'set-bool': d => { S()[d.k] = !S()[d.k]; save(); render(); },
  'prof-new': () => profileModal(),
  'prof-edit': d => profileModal(state.profiles.find(x => x.id === d.pid)),
  'city-pick': d => { Object.assign(S(), { lat: +(+d.lat).toFixed(3), lon: +(+d.lon).toFixed(3), city: d.name }); save(); render(); loadWeather(true); toast('📍 ' + d.name); },
  'ics-clear': async () => { if (await confirmBox('Remove all imported calendar events?', 'Remove')) { state.events = state.events.filter(e => e.src !== 'ics'); save(); render(); } },
  'backup': () => {
    const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `family-wall-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup downloaded (photos not included)');
  },
  'reset': async () => {
    if (!(await confirmBox('This erases everything in the app on this device, including photos.', 'Erase everything'))) return;
    try { localStorage.removeItem(KEY); localStorage.removeItem(WKEY); await IDB.clear(); } catch (e) { }
    location.reload();
  },
  'sub-new': () => { if (state.subs.length >= 20) return toast('Up to 20 live calendars'); subModal(); },
  'sub-edit': d => subModal(state.subs.find(x => x.id === d.id)),
  'sub-sync': async (d, el) => { el.disabled = true; el.textContent = 'Syncing…'; await syncAll(true); const bad = state.subs.filter(s => s.error); toast(bad.length ? '⚠️ ' + bad[0].name + ': ' + bad[0].error : '✅ Calendars up to date'); render(); },
  'ob-start': () => finishOnboarding(false),
  'ob-sample': () => finishOnboarding(true),
};

document.addEventListener('click', e => {
  const m = $('#modal');
  if (e.target === m) { ACT['modal-close'](); return; }
  // pickers inside modals
  const pk = e.target.closest('[data-picker] .chip');
  if (pk) { const box = pk.parentElement; if (box.dataset.picker === 'single') box.querySelectorAll('.chip').forEach(c => c.classList.add('off')); pk.classList.toggle('off', box.dataset.picker === 'single' ? false : !pk.classList.contains('off')); return; }
  const sw = e.target.closest('[data-swatch] button'); if (sw) { sw.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on')); sw.classList.add('on'); return; }
  const em = e.target.closest('[data-emoji] button'); if (em) { const was = em.classList.contains('on'); em.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on')); if (!was) em.classList.add('on'); return; }
  const dp = e.target.closest('[data-days] button'); if (dp) { dp.classList.toggle('on'); return; }
  const tg = e.target.closest('[data-toggle]'); if (tg) { tg.classList.toggle('on'); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { e.preventDefault(); e.stopPropagation(); ACT[a.dataset.act](a.dataset, a); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.set) { const k = t.dataset.set; S()[k] = t.dataset.num !== undefined || typeof S()[k] === 'number' ? +t.value : t.value; save(); if (k === 'familyName') renderSide(); else render(); return; }
  if (t.dataset.sleep) { S().sleep[t.dataset.sleep] = t.value || S().sleep[t.dataset.sleep]; save(); return; }
  if (t.id === 'ph-in' && t.files.length) { await addPhotos([...t.files]); return; }
  if (t.id === 'ics-in' && t.files[0]) {
    try { const txt = await t.files[0].text(); const evs = parseICS(txt, $('#ics-who').value); state.events.push(...evs); save(); render(); toast(evs.length ? `📅 Imported ${evs.length} event${evs.length > 1 ? 's' : ''}` : 'No upcoming events found in that file'); }
    catch (err) { toast('Could not read that file'); }
    return;
  }
  if (t.id === 'restore-in' && t.files[0]) {
    try {
      const j = JSON.parse(await t.files[0].text()); if (!j || !Array.isArray(j.profiles)) throw 0;
      localStorage.setItem(KEY, JSON.stringify(j)); load(); render(); toast('✅ Backup restored');
    } catch (err) { toast('That is not a Family Wall backup file'); }
  }
});
let cityT;
document.addEventListener('input', e => { if (e.target.id === 'city-q') { clearTimeout(cityT); const q = e.target.value.trim(); cityT = setTimeout(() => citySearch(q), 350); } });
document.addEventListener('submit', e => {
  const f = e.target; if (f.dataset.form !== 'additem') return; e.preventDefault();
  const inp = f.querySelector('input'), L = state.lists.find(x => x.id === f.dataset.lid); const txt = inp.value.trim();
  if (!L || !txt) return;
  txt.split(/\s*,\s*/).filter(Boolean).forEach(text => L.items.push({ id: uid(), text, done: false }));
  save(); render(); const ni = $('#new-item'); if (ni) ni.focus();
});
document.addEventListener('keydown', e => {
  lastTouch = Date.now();
  if (e.key === 'Escape') { if ($('#saver').classList.contains('open')) stopSaver(); else if ($('#modal').classList.contains('open')) ACT['modal-close'](); }
  if (e.key === 'Enter' && $('#modal').classList.contains('open') && e.target.tagName === 'INPUT' && e.target.type === 'text' && modalCtx && modalCtx.onSave) { e.preventDefault(); ACT['modal-save'](); }
});
document.addEventListener('pointerdown', () => { lastTouch = Date.now(); }, true);

/* ============ clock / timers ============ */
let lastMin = -1, lastDay = todayStr(), sleepAuto = false;
function tick() {
  const n = new Date();
  if (n.getMinutes() !== lastMin) {
    lastMin = n.getMinutes();
    if (todayStr() !== lastDay) {
      const was = lastDay; lastDay = todayStr();
      if (ui.taskDate === was) ui.taskDate = lastDay;
      if (ui.calDate === was) ui.calDate = lastDay;
      if (ui.mealStart === was) ui.mealStart = lastDay;
      if (!$('#modal').classList.contains('open')) render();
    } else renderHead();
    tickSleep(); saverOverlay();
  }
  // sleep schedule
  const sl = $('#sleep').classList.contains('open');
  if (inSleepWindow() && Date.now() > wokeUntil && !sl) { sleepNow(); sleepAuto = true; }
  else if (sl && sleepAuto && !inSleepWindow()) { wake(); sleepAuto = false; }
  // idle screensaver
  const idle = S().idleMin;
  if (idle > 0 && !sl && !$('#saver').classList.contains('open') && !$('#modal').classList.contains('open') && Date.now() - lastTouch > idle * 60000) startSaver();
}

/* ============ init ============ */
function init() {
  load();
  $('#saver').addEventListener('click', e => { e.stopPropagation(); stopSaver(); });
  $('#sleep').addEventListener('click', e => { e.stopPropagation(); wake(); sleepAuto = false; });
  render();
  if (!state.onboarded) onboarding();
  setInterval(tick, 5000); tick();
  loadWeather(); setInterval(() => loadWeather(), 30 * 60 * 1000);
  syncAll(); setInterval(() => syncAll(), 60 * 1000);
  window.addEventListener('online', () => syncAll());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncAll(); loadWeather(); } });
  applyWakeLock(); document.addEventListener('visibilitychange', applyWakeLock);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
}
init();
